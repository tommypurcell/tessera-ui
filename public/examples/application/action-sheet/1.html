<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-end justify-center bg-gray-900/40 p-3">
    <div role="dialog" aria-label="Photo actions" class="flex w-full max-w-sm flex-col gap-2">
      <div class="overflow-hidden rounded-2xl bg-white/95 backdrop-blur">
        <button type="button" class="block w-full px-4 py-3.5 text-center text-base font-medium text-gray-900 hover:bg-gray-100">
          Save to Photos
        </button>
        <div class="h-px bg-gray-200"></div>
        <button type="button" class="block w-full px-4 py-3.5 text-center text-base font-medium text-gray-900 hover:bg-gray-100">
          Copy
        </button>
        <div class="h-px bg-gray-200"></div>
        <button type="button" class="block w-full px-4 py-3.5 text-center text-base font-medium text-gray-900 hover:bg-gray-100">
          Share…
        </button>
        <div class="h-px bg-gray-200"></div>
        <button type="button" class="block w-full px-4 py-3.5 text-center text-base font-medium text-red-600 hover:bg-gray-100">
          Delete
        </button>
      </div>

      <button
        type="button"
        class="w-full rounded-2xl bg-white/95 px-4 py-3.5 text-center text-base font-semibold text-gray-900 backdrop-blur hover:bg-gray-100"
      >
        Cancel
      </button>
    </div>
  </body>
</html>
