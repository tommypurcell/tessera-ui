<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs flex-col items-center gap-4 p-6">
    <svg class="size-40 -rotate-90" viewBox="0 0 160 160" role="img" aria-label="Move 420 of 500 calories, Exercise 28 of 30 minutes, Stand 9 of 12 hours">
      <circle cx="80" cy="80" r="70" fill="none" stroke="currentColor" stroke-width="14" class="text-red-100" />
      <circle
        cx="80"
        cy="80"
        r="70"
        fill="none"
        stroke="currentColor"
        stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="439.8"
        stroke-dashoffset="70.4"
        class="text-red-500"
      />

      <circle cx="80" cy="80" r="52" fill="none" stroke="currentColor" stroke-width="14" class="text-green-100" />
      <circle
        cx="80"
        cy="80"
        r="52"
        fill="none"
        stroke="currentColor"
        stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="326.7"
        stroke-dashoffset="21.8"
        class="text-green-500"
      />

      <circle cx="80" cy="80" r="34" fill="none" stroke="currentColor" stroke-width="14" class="text-blue-100" />
      <circle
        cx="80"
        cy="80"
        r="34"
        fill="none"
        stroke="currentColor"
        stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="213.6"
        stroke-dashoffset="53.4"
        class="text-blue-500"
      />
    </svg>

    <div class="flex w-full flex-col gap-2">
      <div class="flex items-center justify-between text-sm">
        <span class="flex items-center gap-2 text-gray-700">
          <span class="size-2.5 rounded-full bg-red-500"></span>
          Move
        </span>
        <span class="tabular-nums text-gray-500">420/500 cal</span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="flex items-center gap-2 text-gray-700">
          <span class="size-2.5 rounded-full bg-green-500"></span>
          Exercise
        </span>
        <span class="tabular-nums text-gray-500">28/30 min</span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="flex items-center gap-2 text-gray-700">
          <span class="size-2.5 rounded-full bg-blue-500"></span>
          Stand
        </span>
        <span class="tabular-nums text-gray-500">9/12 hr</span>
      </div>
    </div>
  </body>
</html>
