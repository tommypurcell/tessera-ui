<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs flex-col gap-4 p-6">
    <div class="flex items-center gap-4 rounded-lg border border-gray-100 bg-white px-4 py-3">
      <svg class="size-14 shrink-0 -rotate-90" viewBox="0 0 56 56" role="img" aria-label="Move 100%, Exercise 93%, Stand 75% of daily goals">
        <circle cx="28" cy="28" r="22" fill="none" stroke="currentColor" stroke-width="5" class="text-red-100" />
        <circle
          cx="28"
          cy="28"
          r="22"
          fill="none"
          stroke="currentColor"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="138.2"
          stroke-dashoffset="0"
          class="text-red-500"
        />

        <circle cx="28" cy="28" r="16" fill="none" stroke="currentColor" stroke-width="5" class="text-green-100" />
        <circle
          cx="28"
          cy="28"
          r="16"
          fill="none"
          stroke="currentColor"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="100.5"
          stroke-dashoffset="6.7"
          class="text-green-500"
        />

        <circle cx="28" cy="28" r="10" fill="none" stroke="currentColor" stroke-width="5" class="text-blue-100" />
        <circle
          cx="28"
          cy="28"
          r="10"
          fill="none"
          stroke="currentColor"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="62.8"
          stroke-dashoffset="15.7"
          class="text-blue-500"
        />
      </svg>

      <div class="min-w-0">
        <p class="text-sm font-semibold text-gray-900">Today's activity</p>
        <p class="text-xs text-gray-500">2 of 3 rings closed</p>
      </div>
    </div>
  </body>
</html>
