<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-4 p-6">
    <div class="flex gap-3 rounded-lg border border-amber-200 bg-amber-50 p-4" role="alert">
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        class="mt-0.5 size-5 shrink-0 text-amber-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.74-3L13.74 4a2 2 0 00-3.48 0L3.33 16a2 2 0 001.74 3z" />
      </svg>

      <div class="flex flex-col gap-2">
        <p class="text-sm font-semibold text-amber-900">Storage almost full</p>
        <p class="text-sm text-amber-700">
          You've used 92% of your available storage. Upgrade your plan or remove unused files to avoid interruptions.
        </p>
        <div class="mt-1 flex gap-3">
          <button class="rounded-md bg-amber-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-amber-700">
            Upgrade plan
          </button>
          <button class="rounded-md px-3 py-1.5 text-sm font-medium text-amber-800 hover:bg-amber-100">
            Manage files
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
