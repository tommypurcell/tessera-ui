<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-4 p-6">
    <div class="flex gap-3 rounded-md border border-l-4 border-gray-200 border-l-indigo-500 bg-white p-4" role="status">
      <div class="flex flex-col gap-1">
        <p class="text-sm font-semibold text-gray-900">Scheduled maintenance</p>
        <p class="text-sm text-gray-600">
          Our services will be briefly unavailable on Sunday, June 22 from 2:00–4:00 AM UTC.
        </p>
      </div>
    </div>

    <div class="flex gap-3 rounded-md border border-l-4 border-gray-200 border-l-red-500 bg-white p-4" role="alert">
      <div class="flex flex-col gap-1">
        <p class="text-sm font-semibold text-gray-900">Connection lost</p>
        <p class="text-sm text-gray-600">
          We couldn't reach the server. Check your network and try again.
        </p>
      </div>
    </div>
  </body>
</html>
