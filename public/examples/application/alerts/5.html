<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-4 p-6">
    <div class="flex items-start gap-3 rounded-lg border border-blue-200 bg-blue-50 p-4" role="status">
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        class="mt-0.5 size-5 shrink-0 text-blue-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>

      <div class="flex flex-1 flex-col gap-1">
        <p class="text-sm font-semibold text-blue-900">New workspace features</p>
        <p class="text-sm text-blue-700">
          You can now invite teammates and assign roles directly from the dashboard.
        </p>
      </div>

      <button
        type="button"
        aria-label="Dismiss"
        class="-m-1 rounded-md p-1 text-blue-400 hover:bg-blue-100 hover:text-blue-600"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          class="size-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </body>
</html>
