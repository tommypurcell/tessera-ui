<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-start gap-3">
        <img src="https://i.pravatar.cc/64?img=12" alt="" class="size-9 shrink-0 rounded-full" />

        <div class="min-w-0 flex-1">
          <p class="text-sm text-gray-900">
            <span class="font-semibold">Priya Shah</span> requested access to
            <span class="font-semibold">Production database</span>
          </p>
          <p class="mt-0.5 text-xs text-gray-500">Requested 2 hours ago &middot; Expires in 3 days</p>
        </div>

        <span class="shrink-0 rounded-full bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-700">
          Pending
        </span>
      </div>

      <p class="mt-3 rounded-md bg-gray-50 p-2.5 text-sm text-gray-600">
        "Need read access to debug the reporting job that's been failing since last night's
        deploy."
      </p>

      <div class="mt-4 flex justify-end gap-2">
        <button type="button" class="rounded-md border border-gray-300 bg-white px-3.5 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">
          Reject
        </button>
        <button type="button" class="rounded-md bg-emerald-600 px-3.5 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700">
          Approve
        </button>
      </div>
    </div>
  </body>
</html>
