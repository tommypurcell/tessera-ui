<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-start justify-center bg-gray-50 p-6">
    <div class="relative inline-block">
      <button
        type="button"
        aria-haspopup="listbox"
        aria-expanded="true"
        class="inline-flex items-center gap-2 rounded-full border border-gray-300 bg-white py-1 pl-1 pr-3 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
      >
        <span class="flex -space-x-1.5">
          <img src="https://i.pravatar.cc/48?img=12" alt="" class="size-5 rounded-full object-cover ring-2 ring-white" />
          <img src="https://i.pravatar.cc/48?img=32" alt="" class="size-5 rounded-full object-cover ring-2 ring-white" />
        </span>
        2 assignees
      </button>

      <div class="absolute left-0 top-full z-10 mt-2 w-64 rounded-lg border border-gray-200 bg-white shadow-lg shadow-gray-900/5">
        <ul role="listbox" aria-multiselectable="true" aria-label="Assignees" class="max-h-52 overflow-y-auto p-1">
          <li role="option" aria-selected="true" class="flex items-center gap-2.5 rounded-md px-2 py-1.5 hover:bg-gray-50">
            <span class="flex size-4 shrink-0 items-center justify-center rounded border border-gray-900 bg-gray-900">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" class="size-2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </span>
            <img src="https://i.pravatar.cc/48?img=12" alt="" class="size-6 rounded-full object-cover" />
            <span class="min-w-0 flex-1 truncate text-sm text-gray-900">Priya Shah</span>
          </li>
          <li role="option" aria-selected="true" class="flex items-center gap-2.5 rounded-md px-2 py-1.5 hover:bg-gray-50">
            <span class="flex size-4 shrink-0 items-center justify-center rounded border border-gray-900 bg-gray-900">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" class="size-2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </span>
            <img src="https://i.pravatar.cc/48?img=32" alt="" class="size-6 rounded-full object-cover" />
            <span class="min-w-0 flex-1 truncate text-sm text-gray-900">Ethan Kim</span>
          </li>
          <li role="option" aria-selected="false" class="flex items-center gap-2.5 rounded-md px-2 py-1.5 hover:bg-gray-50">
            <span class="size-4 shrink-0 rounded border border-gray-300"></span>
            <img src="https://i.pravatar.cc/48?img=5" alt="" class="size-6 rounded-full object-cover" />
            <span class="min-w-0 flex-1 truncate text-sm text-gray-700">Sofia Rossi</span>
          </li>
          <li role="option" aria-selected="false" class="flex items-center gap-2.5 rounded-md px-2 py-1.5 hover:bg-gray-50">
            <span class="size-4 shrink-0 rounded border border-gray-300"></span>
            <img src="https://i.pravatar.cc/48?img=8" alt="" class="size-6 rounded-full object-cover" />
            <span class="min-w-0 flex-1 truncate text-sm text-gray-700">Yuki Tanaka</span>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
