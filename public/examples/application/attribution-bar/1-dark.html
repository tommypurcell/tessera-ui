<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-40 items-center justify-center p-6">
    <div class="w-80">
      <p class="mb-2 text-sm font-medium text-gray-200">Conversion attribution by channel</p>

      <div class="flex h-3 overflow-hidden rounded-full" role="img" aria-label="Paid search 42%, Organic search 27%, Referral 18%, Direct 13%">
        <span aria-hidden="true" class="h-full bg-blue-300" style="width: 42%"></span>
        <span aria-hidden="true" class="h-full bg-violet-400" style="width: 27%"></span>
        <span aria-hidden="true" class="h-full bg-amber-400" style="width: 18%"></span>
        <span aria-hidden="true" class="h-full bg-gray-600" style="width: 13%"></span>
      </div>

      <ul role="list" class="mt-3 flex flex-col gap-1.5">
        <li class="flex items-center justify-between text-sm">
          <span class="flex items-center gap-2 text-gray-300">
            <span aria-hidden="true" class="size-2.5 rounded-full bg-blue-300"></span>
            Paid search
          </span>
          <span class="font-medium text-white">42%</span>
        </li>
        <li class="flex items-center justify-between text-sm">
          <span class="flex items-center gap-2 text-gray-300">
            <span aria-hidden="true" class="size-2.5 rounded-full bg-violet-400"></span>
            Organic search
          </span>
          <span class="font-medium text-white">27%</span>
        </li>
        <li class="flex items-center justify-between text-sm">
          <span class="flex items-center gap-2 text-gray-300">
            <span aria-hidden="true" class="size-2.5 rounded-full bg-amber-400"></span>
            Referral
          </span>
          <span class="font-medium text-white">18%</span>
        </li>
        <li class="flex items-center justify-between text-sm">
          <span class="flex items-center gap-2 text-gray-300">
            <span aria-hidden="true" class="size-2.5 rounded-full bg-gray-600"></span>
            Direct
          </span>
          <span class="font-medium text-white">13%</span>
        </li>
      </ul>
    </div>
  </body>
</html>
