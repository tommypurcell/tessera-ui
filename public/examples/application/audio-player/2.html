<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-3">
        <img
          src="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=96&h=96&fit=crop"
          alt=""
          class="size-12 shrink-0 rounded-md object-cover"
        />
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-gray-900">The Slow Build</p>
          <p class="truncate text-xs text-gray-500">Design systems at scale</p>
        </div>
        <span class="shrink-0 rounded-md border border-gray-300 px-2 py-1 text-xs font-medium text-gray-600">1.5x</span>
      </div>

      <div class="mt-3">
        <div class="relative h-1.5 w-full rounded-full bg-gray-200">
          <div class="h-full w-2/5 rounded-full bg-gray-900"></div>
          <div class="absolute top-1/2 left-2/5 size-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-gray-900 shadow"></div>
        </div>
        <div class="mt-1 flex justify-between text-[11px] text-gray-400">
          <span>8:12</span>
          <span>-12:30</span>
        </div>
      </div>

      <div class="mt-3 flex items-center justify-center gap-5">
        <button type="button" aria-label="Back 15 seconds" class="text-gray-500 hover:text-gray-900">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
          </svg>
        </button>
        <button
          type="button"
          aria-label="Play"
          class="inline-flex size-11 items-center justify-center rounded-full bg-gray-900 text-white hover:bg-gray-700"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z" />
          </svg>
        </button>
        <button type="button" aria-label="Forward 15 seconds" class="text-gray-500 hover:text-gray-900">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l6-6m0 0-6-6m6 6H9a6 6 0 0 0 0 12h3" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
