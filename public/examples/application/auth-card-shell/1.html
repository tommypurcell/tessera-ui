<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm items-center justify-center bg-gray-50 p-6">
    <div class="w-full rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
      <div class="flex flex-col items-center text-center">
        <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white">T</span>
        <h1 class="mt-4 text-lg font-semibold text-gray-900">Sign in to your account</h1>
        <p class="mt-1 text-sm text-gray-500">Welcome back — enter your details below.</p>
      </div>

      <form class="mt-6 flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="auth-email" class="text-sm font-medium text-gray-700">Email address</label>
          <input
            id="auth-email"
            type="email"
            value="jordan@acme.com"
            class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-gray-500 focus:outline-none"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <label for="auth-password" class="text-sm font-medium text-gray-700">Password</label>
            <a href="#" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">Forgot password?</a>
          </div>
          <input
            id="auth-password"
            type="password"
            value="••••••••••"
            class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-gray-500 focus:outline-none"
          />
        </div>

        <button type="submit" class="mt-1 rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-500">
          Sign in
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-500">
        Don&rsquo;t have an account?
        <a href="#" class="font-medium text-indigo-600 hover:text-indigo-700">Sign up</a>
      </p>
    </div>
  </body>
</html>
