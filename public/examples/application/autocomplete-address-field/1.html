<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-start justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm">
      <label for="addr-input" class="mb-1.5 block text-sm font-medium text-gray-700">Street address</label>
      <div class="relative">
        <div class="relative">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
          <input
            type="text"
            id="addr-input"
            value="128 Market"
            role="combobox"
            aria-expanded="true"
            aria-controls="addr-listbox"
            aria-autocomplete="list"
            class="h-10 w-full rounded-md border border-gray-900 bg-white py-2 pl-9 pr-3 text-sm text-gray-900 shadow-sm ring-1 ring-gray-900 focus:outline-none"
          />
        </div>

        <ul id="addr-listbox" role="listbox" class="absolute left-0 top-full z-10 mt-1.5 w-full overflow-hidden rounded-lg border border-gray-200 bg-white py-1 shadow-lg shadow-gray-900/10">
          <li role="option" aria-selected="true" class="cursor-pointer bg-gray-50 px-3 py-2">
            <p class="text-sm font-medium text-gray-900">128 Market St</p>
            <p class="text-xs text-gray-500">San Francisco, CA 94105</p>
          </li>
          <li role="option" aria-selected="false" class="cursor-pointer px-3 py-2 hover:bg-gray-50">
            <p class="text-sm font-medium text-gray-900">128 Market Ave</p>
            <p class="text-xs text-gray-500">Portland, OR 97201</p>
          </li>
          <li role="option" aria-selected="false" class="cursor-pointer px-3 py-2 hover:bg-gray-50">
            <p class="text-sm font-medium text-gray-900">1280 Market St</p>
            <p class="text-xs text-gray-500">San Francisco, CA 94102</p>
          </li>
          <li role="option" aria-selected="false" class="cursor-pointer px-3 py-2 hover:bg-gray-50">
            <p class="text-sm font-medium text-gray-900">128 Market Blvd</p>
            <p class="text-xs text-gray-500">Austin, TX 78701</p>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
