<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-sm space-y-3">
      <div>
        <label for="addr2-street-dark" class="mb-1.5 flex items-center gap-1.5 text-sm font-medium text-gray-300">
          Street address
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5 text-emerald-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75 6 14.25l7.5-7.5" />
          </svg>
        </label>
        <input type="text" id="addr2-street-dark" value="128 Market St" class="h-10 w-full rounded-md border border-gray-700 bg-gray-800 px-3 text-sm text-white shadow-sm focus:border-gray-100 focus:bg-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-100" />
      </div>

      <div>
        <label for="addr2-unit-dark" class="mb-1.5 block text-sm font-medium text-gray-300">Apt / suite <span class="font-normal text-gray-500">(optional)</span></label>
        <input type="text" id="addr2-unit-dark" placeholder="Apt 4B" class="h-10 w-full rounded-md border border-gray-700 bg-gray-900 px-3 text-sm text-white shadow-sm placeholder:text-gray-500 focus:border-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-100" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="addr2-city-dark" class="mb-1.5 block text-sm font-medium text-gray-300">City</label>
          <input type="text" id="addr2-city-dark" value="San Francisco" class="h-10 w-full rounded-md border border-gray-700 bg-gray-800 px-3 text-sm text-white shadow-sm focus:border-gray-100 focus:bg-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-100" />
        </div>
        <div>
          <label for="addr2-state-dark" class="mb-1.5 block text-sm font-medium text-gray-300">State</label>
          <input type="text" id="addr2-state-dark" value="CA" class="h-10 w-full rounded-md border border-gray-700 bg-gray-800 px-3 text-sm text-white shadow-sm focus:border-gray-100 focus:bg-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-100" />
        </div>
      </div>

      <div class="w-1/2 pr-1.5">
        <label for="addr2-zip-dark" class="mb-1.5 block text-sm font-medium text-gray-300">ZIP code</label>
        <input type="text" id="addr2-zip-dark" value="94105" class="h-10 w-full rounded-md border border-gray-700 bg-gray-800 px-3 text-sm text-white shadow-sm focus:border-gray-100 focus:bg-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-100" />
      </div>

      <p class="flex items-center gap-1.5 text-xs text-gray-400">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5 text-emerald-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75 6 14.25l7.5-7.5" />
        </svg>
        Filled from address lookup — edit any field if needed.
      </p>
    </div>
  </body>
</html>
