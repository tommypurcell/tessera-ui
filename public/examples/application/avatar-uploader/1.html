<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="flex flex-col items-center gap-3">
      <label for="avatar-upload" class="group relative block size-24 cursor-pointer overflow-hidden rounded-full ring-1 ring-inset ring-gray-200">
        <img
          src="https://i.pravatar.cc/160?img=12"
          alt="Current profile photo"
          class="size-full object-cover"
        />

        <span class="absolute inset-0 flex items-center justify-center bg-black/0 opacity-0 transition group-hover:bg-black/40 group-hover:opacity-100">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-white">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
          </svg>
        </span>

        <input id="avatar-upload" type="file" accept="image/*" class="sr-only" />
      </label>

      <div class="flex items-center gap-3 text-xs font-medium">
        <button type="button" class="text-blue-600 hover:text-blue-700">Replace photo</button>
        <span class="text-gray-300">&middot;</span>
        <button type="button" class="text-gray-500 hover:text-gray-700">Remove</button>
      </div>

      <p class="text-center text-xs text-gray-400">JPG, PNG or GIF. Max 5MB.</p>
    </div>
  </body>
</html>
