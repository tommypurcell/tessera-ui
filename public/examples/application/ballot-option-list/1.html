<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-5">
      <h2 class="text-sm font-semibold text-gray-900">City Council, District 4</h2>
      <p class="mt-0.5 text-xs text-gray-400">Vote for one</p>

      <fieldset role="radiogroup" aria-label="City Council, District 4 candidates" class="mt-3 space-y-2">
        <div class="rounded-lg border border-gray-200">
          <label class="flex items-center gap-3 px-3.5 py-3">
            <input type="radio" name="ballot-1" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            <span class="flex-1 text-sm font-medium text-gray-900">Marcus Webb</span>
            <button type="button" aria-expanded="false" aria-controls="candidate-info-1" class="text-xs font-medium text-blue-700 hover:text-blue-800">More info</button>
          </label>
        </div>

        <div class="rounded-lg border border-gray-900">
          <label class="flex items-center gap-3 px-3.5 py-3">
            <input type="radio" name="ballot-1" checked class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            <span class="flex-1 text-sm font-medium text-gray-900">Elena Ruiz</span>
            <button type="button" aria-expanded="true" aria-controls="candidate-info-2" class="text-xs font-medium text-blue-700 hover:text-blue-800">Hide info</button>
          </label>
          <div id="candidate-info-2" class="border-t border-gray-100 px-3.5 py-3 pl-11 text-xs text-gray-500">
            15 years as a small-business owner in District 4. Priorities: affordable housing, transit expansion, and small-business tax relief.
          </div>
        </div>

        <div class="rounded-lg border border-gray-200">
          <label class="flex items-center gap-3 px-3.5 py-3">
            <input type="radio" name="ballot-1" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            <span class="flex-1 text-sm font-medium text-gray-900">Sam Osei</span>
            <button type="button" aria-expanded="false" aria-controls="candidate-info-3" class="text-xs font-medium text-blue-700 hover:text-blue-800">More info</button>
          </label>
        </div>
      </fieldset>
    </div>
  </body>
</html>
