<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-950 p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-white">Body metrics</h3>
        <span class="text-xs text-gray-500">Updated today</span>
      </div>

      <div class="mt-4 grid grid-cols-3 divide-x divide-gray-800">
        <div class="px-2 text-center first:pl-0">
          <p class="text-xs text-gray-500">Weight</p>
          <p class="mt-1 text-lg font-semibold text-white">172.4 lb</p>
          <p class="mt-0.5 inline-flex items-center gap-0.5 text-xs font-medium text-emerald-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
            </svg>
            2.1 lb
          </p>
        </div>

        <div class="px-2 text-center">
          <p class="text-xs text-gray-500">BMI</p>
          <p class="mt-1 text-lg font-semibold text-white">23.8</p>
          <p class="mt-0.5 inline-flex items-center gap-0.5 text-xs font-medium text-emerald-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
            </svg>
            0.3
          </p>
        </div>

        <div class="px-2 text-center">
          <p class="text-xs text-gray-500">Body fat</p>
          <p class="mt-1 text-lg font-semibold text-white">18.2%</p>
          <p class="mt-0.5 inline-flex items-center gap-0.5 text-xs font-medium text-red-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
            </svg>
            1.1%
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
