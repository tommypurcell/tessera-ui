<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
      <div class="flex items-center gap-2 text-emerald-600">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 12.75 2.25 2.25 4.5-4.5m4.5 2.25a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <span class="text-sm font-semibold">Booking confirmed</span>
      </div>

      <h3 class="mt-3 text-base font-semibold text-gray-900">30-minute product demo</h3>

      <dl class="mt-3 flex flex-col gap-2 text-sm">
        <div class="flex items-center gap-2 text-gray-600">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 shrink-0 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
          </svg>
          <dt class="sr-only">Date</dt>
          <dd>Wednesday, August 12</dd>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 shrink-0 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          <dt class="sr-only">Time</dt>
          <dd>2:00 PM &ndash; 2:30 PM (PT)</dd>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <img src="https://i.pravatar.cc/64?img=12" alt="" class="size-4 shrink-0 rounded-full" />
          <dt class="sr-only">Host</dt>
          <dd>Hosted by Priya Shah</dd>
        </div>
      </dl>

      <div class="mt-5 flex gap-2">
        <button type="button" class="flex-1 rounded-md border border-gray-300 bg-white px-3.5 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">
          Reschedule
        </button>
        <button type="button" class="flex-1 rounded-md border border-gray-300 bg-white px-3.5 py-2 text-sm font-medium text-red-600 shadow-sm hover:bg-red-50">
          Cancel
        </button>
      </div>
    </div>
  </body>
</html>
