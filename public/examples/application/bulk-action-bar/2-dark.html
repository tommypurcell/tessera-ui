<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div
      role="toolbar"
      aria-label="Bulk actions"
      class="flex w-full max-w-xl items-center justify-between rounded-t-lg border border-b-0 border-blue-900 bg-blue-950/40 px-4 py-3"
    >
      <div class="flex items-center gap-3">
        <button
          type="button"
          aria-label="Clear selection"
          class="inline-flex size-5 items-center justify-center rounded border border-blue-500 bg-blue-500 text-white focus:ring-2 focus:ring-blue-400 focus:outline-none"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </button>
        <span class="text-sm font-medium text-blue-200">12 rows selected</span>
      </div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          class="rounded-md border border-blue-800 bg-gray-900 px-3 py-1.5 text-sm font-medium text-blue-300 hover:bg-gray-800 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        >
          Export
        </button>
        <button
          type="button"
          class="rounded-md border border-blue-800 bg-gray-900 px-3 py-1.5 text-sm font-medium text-blue-300 hover:bg-gray-800 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        >
          Assign
        </button>
        <button
          type="button"
          class="rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-500 focus:ring-2 focus:ring-red-400 focus:outline-none"
        >
          Delete
        </button>
      </div>
    </div>
  </body>
</html>
