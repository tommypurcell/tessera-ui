<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 256px; display: grid; place-items: center; padding: 32px; background: #f8fafc; font-family: Arial, Helvetica, sans-serif; }
      button { min-height: 44px; border: 0; border-radius: 9px; padding: 0 17px; background: #0f172a; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgb(15 23 42 / 0.18); transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease; }
      button:hover { background: #1e293b; transform: translateY(-1px); box-shadow: 0 6px 12px rgb(15 23 42 / 0.16); }
      button:active { transform: translateY(0); box-shadow: 0 1px 2px rgb(15 23 42 / 0.18); }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
      button:disabled { cursor: not-allowed; opacity: .45; transform: none; box-shadow: none; }
    </style>
  </head>
  <body><button type="button">Invite teammates</button></body>
</html>
