<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 256px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px; background: #f8fafc; font-family: Arial, Helvetica, sans-serif; }
      button { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 1px solid #dbe3ee; border-radius: 9px; background: #fff; color: #475569; cursor: pointer; transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease; }
      button:hover { border-color: #94a3b8; background: #f8fafc; color: #0f172a; transform: translateY(-1px); }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
      svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }
    </style>
  </head>
  <body>
    <button type="button" aria-label="Download report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" /></svg></button>
    <button type="button" aria-label="More actions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" /></svg></button>
  </body>
</html>
