<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-950 p-4 shadow-sm">
      <div class="flex items-center justify-between px-1 pb-3">
        <button
          type="button"
          aria-label="Previous month"
          class="inline-flex size-7 items-center justify-center rounded-md text-gray-400 hover:bg-gray-800 hover:text-white"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
        </button>

        <p class="text-sm font-semibold text-white">August 2026</p>

        <button
          type="button"
          aria-label="Next month"
          class="inline-flex size-7 items-center justify-center rounded-md text-gray-400 hover:bg-gray-800 hover:text-white"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-y-1 text-center">
        <span class="text-xs font-medium text-gray-500">Su</span>
        <span class="text-xs font-medium text-gray-500">Mo</span>
        <span class="text-xs font-medium text-gray-500">Tu</span>
        <span class="text-xs font-medium text-gray-500">We</span>
        <span class="text-xs font-medium text-gray-500">Th</span>
        <span class="text-xs font-medium text-gray-500">Fr</span>
        <span class="text-xs font-medium text-gray-500">Sa</span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">1</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">2</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">3</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">4</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">5</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">6</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">7</button>
        <button type="button" aria-current="date" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm font-semibold text-blue-400 ring-1 ring-inset ring-blue-400 hover:bg-blue-950">8</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">9</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">10</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">11</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">12</button>
        <button type="button" aria-pressed="true" class="mx-auto flex size-8 items-center justify-center rounded-md bg-blue-600 text-sm font-semibold text-white hover:bg-blue-500">13</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">14</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">15</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">16</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">17</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">18</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">19</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">20</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">21</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">22</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">23</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">24</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">25</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">26</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">27</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">28</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">29</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300 hover:bg-gray-800">30</button>
        <button type="button" disabled class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700">31</button>
      </div>
    </div>
  </body>
</html>
