<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-center justify-between px-1 pb-3">
        <button
          type="button"
          aria-label="Previous month"
          class="inline-flex size-7 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-900"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
        </button>

        <p class="text-sm font-semibold text-gray-900">August 2026</p>

        <button
          type="button"
          aria-label="Next month"
          class="inline-flex size-7 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-900"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-y-1 text-center">
        <span class="text-xs font-medium text-gray-400">Su</span>
        <span class="text-xs font-medium text-gray-400">Mo</span>
        <span class="text-xs font-medium text-gray-400">Tu</span>
        <span class="text-xs font-medium text-gray-400">We</span>
        <span class="text-xs font-medium text-gray-400">Th</span>
        <span class="text-xs font-medium text-gray-400">Fr</span>
        <span class="text-xs font-medium text-gray-400">Sa</span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">1</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">2</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">3</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">4</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">5</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">6</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">7</button>
        <button type="button" aria-current="date" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm font-semibold text-blue-600 ring-1 ring-inset ring-blue-600 hover:bg-blue-50">8</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">9</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">10</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">11</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">12</button>
        <button type="button" aria-pressed="true" class="mx-auto flex size-8 items-center justify-center rounded-md bg-blue-600 text-sm font-semibold text-white hover:bg-blue-700">13</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">14</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">15</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">16</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">17</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">18</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">19</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">20</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">21</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">22</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">23</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">24</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">25</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">26</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">27</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">28</button>
        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">29</button>

        <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-700 hover:bg-gray-100">30</button>
        <button type="button" disabled class="mx-auto flex size-8 items-center justify-center rounded-md text-sm text-gray-300">31</button>
      </div>
    </div>
  </body>
</html>
