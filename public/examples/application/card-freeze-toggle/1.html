<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
      <div class="js-card relative aspect-video w-full overflow-hidden rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 p-4 text-white">
        <p class="text-xs font-medium text-white/70">Tessera Card</p>
        <p class="mt-4 font-mono text-lg tracking-widest">&bull;&bull;&bull;&bull; 4831</p>
        <p class="mt-3 text-xs text-white/70">Jordan Avery &middot; 05/28</p>

        <div class="js-overlay absolute inset-0 hidden items-center justify-center bg-black/50">
          <span class="inline-flex items-center gap-1.5 rounded-full bg-white/90 px-3 py-1 text-xs font-semibold text-gray-900">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 1.5a3.75 3.75 0 0 0-3.75 3.75v3h7.5v-3A3.75 3.75 0 0 0 12 1.5Zm-5.25 6.75v-3a5.25 5.25 0 1 1 10.5 0v3h.75a1.5 1.5 0 0 1 1.5 1.5v10.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5V9.75a1.5 1.5 0 0 1 1.5-1.5h.75Z" />
            </svg>
            Frozen
          </span>
        </div>
      </div>

      <div class="mt-4 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-900">Freeze card</p>
          <p class="js-status-out text-xs text-gray-500">Card is active</p>
        </div>

        <label for="freeze-1" class="relative block h-6 w-11 shrink-0 rounded-full bg-gray-300 transition-colors has-checked:bg-red-500">
          <input type="checkbox" id="freeze-1" class="js-freeze peer sr-only" />
          <span class="absolute inset-y-0 start-0 m-1 size-4 rounded-full bg-white transition-[inset-inline-start] peer-checked:start-5"></span>
        </label>
      </div>
    </div>

    <script>
      ;(function () {
        var checkbox = document.getElementById('freeze-1')
        var statusOut = document.querySelector('.js-status-out')
        var card = document.querySelector('.js-card')
        var overlay = document.querySelector('.js-overlay')

        checkbox.addEventListener('change', function () {
          var frozen = checkbox.checked
          statusOut.textContent = frozen ? 'Card is frozen' : 'Card is active'
          card.classList.toggle('grayscale', frozen)
          overlay.classList.toggle('hidden', !frozen)
          overlay.classList.toggle('flex', frozen)
        })
      })()
    </script>
  </body>
</html>
