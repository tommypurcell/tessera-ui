<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-950 p-6">
    <div class="flex flex-col items-center">
      <div class="relative h-72 w-56">
        <div class="absolute inset-0 translate-y-4 scale-90 rounded-2xl border border-gray-700 bg-gray-900 opacity-60 shadow-sm"></div>
        <div class="absolute inset-0 translate-y-2 scale-95 rounded-2xl border border-gray-700 bg-gray-900 opacity-80 shadow-sm"></div>
        <div class="absolute inset-0 overflow-hidden rounded-2xl border border-gray-700 bg-gray-900 shadow-lg shadow-black/40">
          <img
            src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&h=400&fit=crop"
            alt=""
            class="h-44 w-full object-cover"
          />
          <div class="p-3">
            <h3 class="text-sm font-semibold text-white">Maya Chen, 28</h3>
            <p class="mt-0.5 text-xs text-gray-400">Product designer · 3 km away</p>
            <div class="mt-2 flex flex-wrap gap-1">
              <span class="rounded-full bg-gray-800 px-2 py-0.5 text-[10px] font-medium text-gray-300">Hiking</span>
              <span class="rounded-full bg-gray-800 px-2 py-0.5 text-[10px] font-medium text-gray-300">Coffee</span>
              <span class="rounded-full bg-gray-800 px-2 py-0.5 text-[10px] font-medium text-gray-300">Design</span>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4 flex items-center gap-4">
        <button
          type="button"
          aria-label="Reject"
          class="inline-flex size-12 items-center justify-center rounded-full border border-gray-700 bg-gray-900 text-red-400 shadow-sm transition-colors hover:bg-red-500/10"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
        <button
          type="button"
          aria-label="Accept"
          class="inline-flex size-12 items-center justify-center rounded-full border border-gray-700 bg-gray-900 text-emerald-400 shadow-sm transition-colors hover:bg-emerald-500/10"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
            <path fill-rule="evenodd" d="M11.645 20.91a.75.75 0 0 1-.65-.375C9.24 17.845 5.5 14.7 5.5 10.75a5.25 5.25 0 0 1 9.5-3.077 5.25 5.25 0 0 1 9.5 3.077c0 3.95-3.74 7.095-5.495 9.785a.75.75 0 0 1-.65.375h-6.71Z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
