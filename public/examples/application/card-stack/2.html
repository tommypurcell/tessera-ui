<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-50 p-6">
    <div class="relative h-56 w-64">
      <div class="absolute inset-x-4 top-6 rotate-3 rounded-xl border border-gray-200 bg-white p-4 opacity-70 shadow-sm"></div>
      <div class="absolute inset-x-2 top-3 -rotate-2 rounded-xl border border-gray-200 bg-white p-4 opacity-85 shadow-sm"></div>
      <div class="absolute inset-0 rounded-xl border border-gray-200 bg-white p-4 shadow-lg shadow-gray-900/10">
        <span class="inline-flex items-center rounded-full bg-indigo-50 px-2 py-0.5 text-[10px] font-semibold text-indigo-600">
          RECOMMENDED
        </span>
        <h3 class="mt-2 text-sm font-semibold text-gray-900">Designing with constraints</h3>
        <p class="mt-1 text-xs leading-relaxed text-gray-500">
          Why limitations often lead to better product decisions than open-ended freedom.
        </p>
        <p class="mt-3 text-[11px] text-gray-400">6 min read · Design</p>

        <div class="absolute bottom-4 right-4 flex gap-2">
          <button type="button" aria-label="Skip" class="inline-flex size-9 items-center justify-center rounded-full border border-gray-200 text-gray-400 hover:bg-gray-50">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
          <button type="button" aria-label="Save" class="inline-flex size-9 items-center justify-center rounded-full bg-gray-900 text-white hover:bg-gray-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
