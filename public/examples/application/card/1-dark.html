<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div class="overflow-hidden rounded-xl border border-gray-800 bg-gray-950 shadow-sm">
      <img
        src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=640&h=320&fit=crop"
        alt=""
        class="h-40 w-full object-cover"
      />

      <div class="p-5">
        <p class="text-xs font-semibold uppercase tracking-wide text-blue-400">Product update</p>
        <h3 class="mt-1.5 text-base font-semibold text-white">Faster deploys, less waiting</h3>
        <p class="mt-1.5 text-sm leading-relaxed text-gray-400">
          Cold starts are down 60% and build caching now spans branches, so your team ships
          without watching a spinner.
        </p>

        <div class="mt-5 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <img
              src="https://i.pravatar.cc/64?img=12"
              alt=""
              class="size-7 rounded-full"
            />
            <span class="text-xs font-medium text-gray-300">Priya Shah</span>
          </div>

          <button
            type="button"
            class="rounded-md border border-gray-700 bg-gray-900 px-3 py-1.5 text-xs font-medium text-gray-200 shadow-sm hover:bg-gray-800"
          >
            Read more
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
