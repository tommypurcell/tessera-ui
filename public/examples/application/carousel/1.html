<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="relative overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm" role="region" aria-roledescription="carousel" aria-label="Featured photos">
      <div class="relative h-56 w-full">
        <img
          src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&h=448&fit=crop"
          alt="Slide 2 of 3: mountain lake at sunrise"
          class="h-full w-full object-cover"
        />
      </div>

      <button
        type="button"
        aria-label="Previous slide"
        class="absolute left-3 top-1/2 -translate-y-1/2 inline-flex size-8 items-center justify-center rounded-full bg-white/90 text-gray-700 shadow-md hover:bg-white"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
      </button>

      <button
        type="button"
        aria-label="Next slide"
        class="absolute right-3 top-1/2 -translate-y-1/2 inline-flex size-8 items-center justify-center rounded-full bg-white/90 text-gray-700 shadow-md hover:bg-white"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </button>

      <div class="absolute inset-x-0 bottom-3 flex items-center justify-center gap-1.5" role="tablist" aria-label="Slide navigation">
        <button type="button" role="tab" aria-label="Go to slide 1" aria-selected="false" class="size-1.5 rounded-full bg-white/60"></button>
        <button type="button" role="tab" aria-label="Go to slide 2" aria-selected="true" class="h-1.5 w-4 rounded-full bg-white"></button>
        <button type="button" role="tab" aria-label="Go to slide 3" aria-selected="false" class="size-1.5 rounded-full bg-white/60"></button>
      </div>
    </div>
  </body>
</html>
