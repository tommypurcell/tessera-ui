<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-xl border border-gray-200 bg-white shadow-sm">
      <div class="flex gap-3 p-4">
        <img
          src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=160&h=160&fit=crop"
          alt="Aria Over-Ear Headphones in matte black"
          class="size-16 shrink-0 rounded-lg object-cover"
        />

        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-gray-900">Aria Over-Ear Headphones</p>
              <p class="text-xs text-gray-500">Color: Matte Black</p>
            </div>

            <button type="button" aria-label="Remove Aria Over-Ear Headphones from cart" class="inline-flex size-7 shrink-0 items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-700">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <div class="mt-3 flex items-center justify-between">
            <div role="group" aria-label="Quantity for Aria Over-Ear Headphones" class="flex items-center rounded-md border border-gray-300">
              <button type="button" aria-label="Decrease quantity" class="flex size-7 items-center justify-center text-gray-500 hover:bg-gray-100">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
                </svg>
              </button>
              <span class="w-7 text-center text-sm text-gray-900" aria-live="polite">2</span>
              <button type="button" aria-label="Increase quantity" class="flex size-7 items-center justify-center text-gray-500 hover:bg-gray-100">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
              </button>
            </div>

            <div class="text-right">
              <p class="text-sm font-semibold text-gray-900">$159.98</p>
              <p class="text-xs text-gray-400">$79.99 each</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
