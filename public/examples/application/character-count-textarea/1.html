<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-50 p-6">
    <div class="flex w-full max-w-md flex-col gap-6">
      <div class="flex w-full flex-col gap-1.5">
        <label for="cc-1" class="text-sm font-medium text-gray-900">Feedback</label>
        <textarea id="cc-1" rows="4" aria-describedby="cc-1-count" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">Great work on the release notes.</textarea>
        <div id="cc-1-count" class="flex justify-end text-xs">
          <span class="text-gray-400">128 characters remaining</span>
        </div>
      </div>

      <div class="flex w-full flex-col gap-1.5">
        <label for="cc-2" class="text-sm font-medium text-gray-900">Feedback</label>
        <textarea id="cc-2" rows="4" aria-describedby="cc-2-count" class="w-full rounded-md border border-red-400 px-3 py-2 text-sm text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-1">Just wanted to say the new dashboard redesign looks fantastic! The updated color palette and spacing feel much more polished than before, and the new empty states are a nice touch too.</textarea>
        <div id="cc-2-count" class="flex justify-end text-xs">
          <span class="font-medium text-red-600">24 characters over limit</span>
        </div>
      </div>
    </div>
  </body>
</html>
