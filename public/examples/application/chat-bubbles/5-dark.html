<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-1.5 bg-black p-6">
    <p class="my-2 text-center text-xs font-medium text-gray-500">Yesterday 8:34 PM</p>

    <div class="flex justify-start">
      <div
        class="relative max-w-[75%] rounded-[18px] rounded-bl-[4px] bg-gray-800 px-3.5 py-2 text-[15px] leading-snug text-gray-100 before:absolute before:bottom-0 before:left-[-7px] before:size-5 before:bg-gray-800 before:[mask-image:radial-gradient(circle_10px_at_20px_0,transparent_99%,#000_100%)]"
      >
        Running about 15 minutes behind, kicking off the drive now.
      </div>
    </div>

    <div class="flex justify-end">
      <div
        class="relative max-w-[75%] rounded-[18px] rounded-br-[4px] bg-blue-500 px-3.5 py-2 text-[15px] leading-snug text-white before:absolute before:right-[-7px] before:bottom-0 before:size-5 before:bg-blue-500 before:[mask-image:radial-gradient(circle_10px_at_0_0,transparent_99%,#000_100%)]"
      >
        No rush, we haven't sat down yet
      </div>
    </div>

    <p class="mt-3 mb-2 text-center text-xs font-medium text-gray-500">Today 10:36 AM</p>

    <div class="flex justify-start">
      <div
        class="relative max-w-[75%] rounded-[18px] rounded-bl-[4px] bg-gray-800 px-3.5 py-2 text-[15px] leading-snug text-gray-100 before:absolute before:bottom-0 before:left-[-7px] before:size-5 before:bg-gray-800 before:[mask-image:radial-gradient(circle_10px_at_20px_0,transparent_99%,#000_100%)]"
      >
        Table's ready whenever you get here
      </div>
    </div>

    <div class="mt-2 flex justify-end">
      <div
        class="relative max-w-[75%] rounded-[18px] rounded-br-[4px] bg-blue-500 px-3.5 py-2 text-[15px] leading-snug text-white before:absolute before:right-[-7px] before:bottom-0 before:size-5 before:bg-blue-500 before:[mask-image:radial-gradient(circle_10px_at_0_0,transparent_99%,#000_100%)]"
      >
        Pulling in now, two minutes out
      </div>
    </div>

    <div class="mt-1 flex flex-col items-end gap-1">
      <div
        class="relative max-w-[75%] rounded-[18px] rounded-br-[4px] bg-blue-500 px-3.5 py-2 text-[15px] leading-snug text-white before:absolute before:right-[-7px] before:bottom-0 before:size-5 before:bg-blue-500 before:[mask-image:radial-gradient(circle_10px_at_0_0,transparent_99%,#000_100%)]"
      >
        See you in a sec
      </div>
      <span class="pr-1 text-xs text-gray-500">Delivered</span>
    </div>
  </body>
</html>
