<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-900">Order summary</h3>

      <dl class="mt-4 flex flex-col gap-2.5 text-sm">
        <div class="flex items-center justify-between">
          <dt class="text-gray-600">Subtotal (3 items)</dt>
          <dd class="text-gray-900">$239.97</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-gray-600">Shipping</dt>
          <dd class="text-gray-900">$6.50</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-gray-600">Tax</dt>
          <dd class="text-gray-900">$19.72</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-emerald-700">Promo (WELCOME10)</dt>
          <dd class="text-emerald-700">-$24.00</dd>
        </div>
      </dl>

      <div class="mt-4 flex gap-2 border-t border-gray-100 pt-4">
        <label for="promo-code" class="sr-only">Promo code</label>
        <input
          id="promo-code"
          type="text"
          placeholder="Promo code"
          class="min-w-0 flex-1 rounded-md border border-gray-300 px-3 py-1.5 text-sm text-gray-900 shadow-sm focus:border-gray-500 focus:outline-none"
        />
        <button type="button" class="shrink-0 rounded-md border border-gray-300 bg-white px-3 py-1.5 text-xs font-semibold text-gray-700 shadow-sm hover:bg-gray-50">
          Apply
        </button>
      </div>

      <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-4">
        <span class="text-sm font-semibold text-gray-900">Total</span>
        <span class="text-lg font-semibold text-gray-900">$242.19</span>
      </div>

      <button type="button" class="mt-4 w-full rounded-md bg-blue-600 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">
        Proceed to checkout
      </button>
    </div>
  </body>
</html>
