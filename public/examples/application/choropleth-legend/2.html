<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-32 items-center justify-center p-6">
    <div class="w-72">
      <p class="mb-2 text-xs font-medium text-gray-600">Unemployment rate</p>
      <div class="flex overflow-hidden rounded-full">
        <span aria-hidden="true" class="h-2.5 flex-1 bg-blue-100"></span>
        <span aria-hidden="true" class="h-2.5 flex-1 bg-blue-300"></span>
        <span aria-hidden="true" class="h-2.5 flex-1 bg-blue-500"></span>
        <span aria-hidden="true" class="h-2.5 flex-1 bg-blue-700"></span>
      </div>
      <ul role="list" class="mt-2 grid grid-cols-4 text-xs text-gray-500">
        <li>0–2%</li>
        <li>2–4%</li>
        <li>4–6%</li>
        <li>6%+</li>
      </ul>
    </div>
  </body>
</html>
