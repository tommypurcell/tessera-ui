<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="overflow-x-auto rounded-lg border border-gray-800 p-4">
      <table class="w-full border-separate border-spacing-1 text-center">
        <caption class="mb-3 text-left text-sm font-semibold text-white">Weekly cohort retention</caption>
        <thead>
          <tr>
            <th scope="col" class="w-24 text-left text-xs font-medium text-gray-400">Cohort</th>
            <th scope="col" class="text-xs font-medium text-gray-400">W0</th>
            <th scope="col" class="text-xs font-medium text-gray-400">W1</th>
            <th scope="col" class="text-xs font-medium text-gray-400">W2</th>
            <th scope="col" class="text-xs font-medium text-gray-400">W3</th>
            <th scope="col" class="text-xs font-medium text-gray-400">W4</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row" class="text-left text-xs font-medium text-gray-300">Jun 30</th>
            <td class="rounded-md bg-indigo-500 px-3 py-2 text-xs font-medium text-white">100%</td>
            <td class="rounded-md bg-indigo-600 px-3 py-2 text-xs font-medium text-white">58%</td>
            <td class="rounded-md bg-indigo-700 px-3 py-2 text-xs font-medium text-white">44%</td>
            <td class="rounded-md bg-indigo-800 px-3 py-2 text-xs font-medium text-white">37%</td>
            <td class="rounded-md bg-indigo-900 px-3 py-2 text-xs font-medium text-indigo-200">33%</td>
          </tr>
          <tr>
            <th scope="row" class="text-left text-xs font-medium text-gray-300">Jul 7</th>
            <td class="rounded-md bg-indigo-500 px-3 py-2 text-xs font-medium text-white">100%</td>
            <td class="rounded-md bg-indigo-600 px-3 py-2 text-xs font-medium text-white">61%</td>
            <td class="rounded-md bg-indigo-700 px-3 py-2 text-xs font-medium text-white">46%</td>
            <td class="rounded-md bg-indigo-800 px-3 py-2 text-xs font-medium text-white">39%</td>
            <td class="rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-gray-600">&mdash;</td>
          </tr>
          <tr>
            <th scope="row" class="text-left text-xs font-medium text-gray-300">Jul 14</th>
            <td class="rounded-md bg-indigo-500 px-3 py-2 text-xs font-medium text-white">100%</td>
            <td class="rounded-md bg-indigo-600 px-3 py-2 text-xs font-medium text-white">64%</td>
            <td class="rounded-md bg-indigo-700 px-3 py-2 text-xs font-medium text-white">49%</td>
            <td class="rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-gray-600">&mdash;</td>
            <td class="rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-gray-600">&mdash;</td>
          </tr>
          <tr>
            <th scope="row" class="text-left text-xs font-medium text-gray-300">Jul 21</th>
            <td class="rounded-md bg-indigo-500 px-3 py-2 text-xs font-medium text-white">100%</td>
            <td class="rounded-md bg-indigo-600 px-3 py-2 text-xs font-medium text-white">67%</td>
            <td class="rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-gray-600">&mdash;</td>
            <td class="rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-gray-600">&mdash;</td>
            <td class="rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-gray-600">&mdash;</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-3 flex items-center gap-2 text-xs text-gray-400">
      <span>Lower retention</span>
      <span class="flex gap-1">
        <span class="size-3 rounded-sm bg-indigo-900"></span>
        <span class="size-3 rounded-sm bg-indigo-800"></span>
        <span class="size-3 rounded-sm bg-indigo-700"></span>
        <span class="size-3 rounded-sm bg-indigo-600"></span>
        <span class="size-3 rounded-sm bg-indigo-500"></span>
      </span>
      <span>Higher retention</span>
    </div>
  </body>
</html>
