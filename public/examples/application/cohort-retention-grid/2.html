<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-lg border border-gray-200 p-4">
      <h3 class="text-sm font-semibold text-gray-900">Monthly retention</h3>
      <table class="mt-3 w-full border-separate border-spacing-1 text-center">
        <thead>
          <tr>
            <th scope="col" class="w-16 text-left text-xs font-medium text-gray-500">Cohort</th>
            <th scope="col" class="text-xs font-medium text-gray-500">M0</th>
            <th scope="col" class="text-xs font-medium text-gray-500">M1</th>
            <th scope="col" class="text-xs font-medium text-gray-500">M2</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row" class="text-left text-xs font-medium text-gray-700">May</th>
            <td class="rounded-md bg-emerald-600 px-3 py-2 text-xs font-medium text-white">100%</td>
            <td class="rounded-md bg-emerald-400 px-3 py-2 text-xs font-medium text-white">71%</td>
            <td class="rounded-md bg-emerald-200 px-3 py-2 text-xs font-medium text-gray-900">54%</td>
          </tr>
          <tr>
            <th scope="row" class="text-left text-xs font-medium text-gray-700">Jun</th>
            <td class="rounded-md bg-emerald-600 px-3 py-2 text-xs font-medium text-white">100%</td>
            <td class="rounded-md bg-emerald-400 px-3 py-2 text-xs font-medium text-white">74%</td>
            <td class="rounded-md bg-gray-100 px-3 py-2 text-xs font-medium text-gray-400">&mdash;</td>
          </tr>
          <tr>
            <th scope="row" class="text-left text-xs font-medium text-gray-700">Jul</th>
            <td class="rounded-md bg-emerald-600 px-3 py-2 text-xs font-medium text-white">100%</td>
            <td class="rounded-md bg-gray-100 px-3 py-2 text-xs font-medium text-gray-400">&mdash;</td>
            <td class="rounded-md bg-gray-100 px-3 py-2 text-xs font-medium text-gray-400">&mdash;</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
