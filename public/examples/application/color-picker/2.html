<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-xs rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <div
        class="relative h-32 w-full rounded-md"
        style="background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, #f59e0b)"
      >
        <div class="absolute size-3.5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow" style="left: 72%; top: 22%; background-color: #f59e0b"></div>
      </div>

      <div class="mt-3">
        <label for="color-picker-hue" class="sr-only">Hue</label>
        <input
          id="color-picker-hue"
          type="range"
          min="0"
          max="360"
          value="38"
          class="h-2.5 w-full appearance-none rounded-full"
          style="background-image: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)"
        />
      </div>

      <div class="mt-2.5">
        <label for="color-picker-alpha" class="sr-only">Opacity</label>
        <div
          class="relative h-2.5 w-full rounded-full"
          style="background-image: repeating-conic-gradient(#e5e7eb 0% 25%, transparent 0% 50%); background-size: 8px 8px"
        >
          <input
            id="color-picker-alpha"
            type="range"
            min="0"
            max="100"
            value="100"
            class="absolute inset-0 h-2.5 w-full appearance-none rounded-full"
            style="background-image: linear-gradient(to right, transparent, #f59e0b)"
          />
        </div>
      </div>

      <div class="mt-3 flex items-center gap-2">
        <span class="size-8 shrink-0 rounded-md border border-black/10" style="background-color: #f59e0b"></span>
        <div class="grid flex-1 grid-cols-3 gap-1.5">
          <div>
            <label for="color-picker-r" class="block text-center text-[10px] font-medium uppercase text-gray-400">R</label>
            <input id="color-picker-r" type="text" value="245" class="block w-full rounded-md border-gray-300 px-1.5 py-1 text-center text-xs text-gray-700 shadow-sm focus:border-gray-900 focus:ring-gray-900" />
          </div>
          <div>
            <label for="color-picker-g" class="block text-center text-[10px] font-medium uppercase text-gray-400">G</label>
            <input id="color-picker-g" type="text" value="158" class="block w-full rounded-md border-gray-300 px-1.5 py-1 text-center text-xs text-gray-700 shadow-sm focus:border-gray-900 focus:ring-gray-900" />
          </div>
          <div>
            <label for="color-picker-b" class="block text-center text-[10px] font-medium uppercase text-gray-400">B</label>
            <input id="color-picker-b" type="text" value="11" class="block w-full rounded-md border-gray-300 px-1.5 py-1 text-center text-xs text-gray-700 shadow-sm focus:border-gray-900 focus:ring-gray-900" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
