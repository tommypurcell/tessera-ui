<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-xl border border-gray-200 bg-white">
      <div class="grid grid-cols-[1fr_auto_1fr] gap-3 border-b border-gray-100 px-5 py-2.5 text-xs font-semibold uppercase tracking-wide text-gray-400">
        <span>Source column</span>
        <span></span>
        <span>Maps to</span>
      </div>

      <ul class="divide-y divide-gray-100">
        <li class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 px-5 py-3">
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-900">full_name</p>
            <p class="truncate text-xs text-gray-400">e.g. "Priya Chandran"</p>
          </div>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 text-gray-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
          </svg>
          <div class="flex items-center gap-1.5">
            <select aria-label="Map full_name to" class="w-full rounded-md border border-gray-300 bg-white py-1.5 pl-2.5 pr-7 text-sm text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <option>Full name</option>
              <option>Email</option>
              <option>Phone</option>
              <option>Ignore column</option>
            </select>
            <span class="shrink-0 rounded-full bg-emerald-50 px-1.5 py-0.5 text-[10px] font-medium text-emerald-700">Auto</span>
          </div>
        </li>

        <li class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 px-5 py-3">
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-900">email_addr</p>
            <p class="truncate text-xs text-gray-400">e.g. "priya@acme.com"</p>
          </div>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 text-gray-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
          </svg>
          <div class="flex items-center gap-1.5">
            <select aria-label="Map email_addr to" class="w-full rounded-md border border-gray-300 bg-white py-1.5 pl-2.5 pr-7 text-sm text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <option>Full name</option>
              <option selected>Email</option>
              <option>Phone</option>
              <option>Ignore column</option>
            </select>
            <span class="shrink-0 rounded-full bg-emerald-50 px-1.5 py-0.5 text-[10px] font-medium text-emerald-700">Auto</span>
          </div>
        </li>

        <li class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 px-5 py-3">
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-900">notes_internal</p>
            <p class="truncate text-xs text-gray-400">e.g. "Referred by Sam"</p>
          </div>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 text-gray-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
          </svg>
          <div class="flex items-center gap-1.5">
            <select aria-label="Map notes_internal to" class="w-full rounded-md border border-amber-300 bg-white py-1.5 pl-2.5 pr-7 text-sm text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <option>Full name</option>
              <option>Email</option>
              <option>Phone</option>
              <option selected>Ignore column</option>
            </select>
            <span class="shrink-0 rounded-full bg-amber-50 px-1.5 py-0.5 text-[10px] font-medium text-amber-700">Manual</span>
          </div>
        </li>
      </ul>

      <div class="flex items-center justify-between border-t border-gray-100 px-5 py-3">
        <span class="text-xs text-gray-500">2 of 3 columns mapped</span>
        <button type="button" class="rounded-md bg-gray-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-gray-800">Continue</button>
      </div>
    </div>
  </body>
</html>
