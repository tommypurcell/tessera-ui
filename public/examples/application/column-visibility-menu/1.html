<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm justify-center p-6">
    <div class="relative inline-flex">
      <button
        type="button"
        aria-haspopup="true"
        aria-expanded="true"
        class="flex items-center gap-2 rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50"
      >
        <svg class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M3 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM8 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1H9a1 1 0 01-1-1V4zM13 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" />
        </svg>
        Columns
        <svg class="h-3.5 w-3.5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
        </svg>
      </button>

      <div class="absolute left-0 top-full z-10 mt-2 w-64 rounded-lg border border-gray-200 bg-white py-1.5 shadow-lg">
        <p class="px-3 pb-1.5 pt-1 text-xs font-semibold tracking-wide text-gray-400 uppercase">Toggle columns</p>

        <ul role="group" aria-label="Table columns" class="flex flex-col">
          <li class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-50">
            <svg class="h-3.5 w-3.5 shrink-0 cursor-grab text-gray-300" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M7 4a1 1 0 11-2 0 1 1 0 012 0zM7 10a1 1 0 11-2 0 1 1 0 012 0zM7 16a1 1 0 11-2 0 1 1 0 012 0zM15 4a1 1 0 11-2 0 1 1 0 012 0zM15 10a1 1 0 11-2 0 1 1 0 012 0zM15 16a1 1 0 11-2 0 1 1 0 012 0z" />
            </svg>
            <label class="flex flex-1 items-center gap-2 text-sm text-gray-700">
              <input type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
              Name
            </label>
          </li>
          <li class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-50">
            <svg class="h-3.5 w-3.5 shrink-0 cursor-grab text-gray-300" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M7 4a1 1 0 11-2 0 1 1 0 012 0zM7 10a1 1 0 11-2 0 1 1 0 012 0zM7 16a1 1 0 11-2 0 1 1 0 012 0zM15 4a1 1 0 11-2 0 1 1 0 012 0zM15 10a1 1 0 11-2 0 1 1 0 012 0zM15 16a1 1 0 11-2 0 1 1 0 012 0z" />
            </svg>
            <label class="flex flex-1 items-center gap-2 text-sm text-gray-700">
              <input type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
              Email
            </label>
          </li>
          <li class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-50">
            <svg class="h-3.5 w-3.5 shrink-0 cursor-grab text-gray-300" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M7 4a1 1 0 11-2 0 1 1 0 012 0zM7 10a1 1 0 11-2 0 1 1 0 012 0zM7 16a1 1 0 11-2 0 1 1 0 012 0zM15 4a1 1 0 11-2 0 1 1 0 012 0zM15 10a1 1 0 11-2 0 1 1 0 012 0zM15 16a1 1 0 11-2 0 1 1 0 012 0z" />
            </svg>
            <label class="flex flex-1 items-center gap-2 text-sm text-gray-400">
              <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
              Company
            </label>
          </li>
          <li class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-50">
            <svg class="h-3.5 w-3.5 shrink-0 cursor-grab text-gray-300" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M7 4a1 1 0 11-2 0 1 1 0 012 0zM7 10a1 1 0 11-2 0 1 1 0 012 0zM7 16a1 1 0 11-2 0 1 1 0 012 0zM15 4a1 1 0 11-2 0 1 1 0 012 0zM15 10a1 1 0 11-2 0 1 1 0 012 0zM15 16a1 1 0 11-2 0 1 1 0 012 0z" />
            </svg>
            <label class="flex flex-1 items-center gap-2 text-sm text-gray-700">
              <input type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
              Role
            </label>
          </li>
          <li class="flex items-center gap-2 px-3 py-1.5 opacity-50">
            <svg class="h-3.5 w-3.5 shrink-0 text-gray-300" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M7 4a1 1 0 11-2 0 1 1 0 012 0zM7 10a1 1 0 11-2 0 1 1 0 012 0zM7 16a1 1 0 11-2 0 1 1 0 012 0zM15 4a1 1 0 11-2 0 1 1 0 012 0zM15 10a1 1 0 11-2 0 1 1 0 012 0zM15 16a1 1 0 11-2 0 1 1 0 012 0z" />
            </svg>
            <label class="flex flex-1 items-center gap-2 text-sm text-gray-400">
              <input type="checkbox" checked disabled class="h-4 w-4 cursor-not-allowed rounded border-gray-300 text-indigo-600" />
              Status
              <span class="ml-auto text-[10px] font-medium tracking-wide text-gray-400 uppercase">Required</span>
            </label>
          </li>
        </ul>

        <div class="mt-1 border-t border-gray-200 px-3 pt-1.5">
          <button type="button" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">Reset to default</button>
        </div>
      </div>
    </div>
  </body>
</html>
