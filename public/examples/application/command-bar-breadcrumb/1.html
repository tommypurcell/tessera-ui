<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-start justify-center bg-gray-50 p-6">
    <nav aria-label="Breadcrumb" class="w-full max-w-lg">
      <ol class="flex flex-wrap items-center gap-1 text-sm">
        <li class="flex items-center gap-1">
          <a href="#" class="rounded px-1.5 py-1 text-gray-500 hover:bg-gray-100 hover:text-gray-900">Workspace</a>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5 text-gray-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </li>
        <li class="relative flex items-center gap-1">
          <button type="button" aria-expanded="true" aria-haspopup="listbox" class="flex items-center gap-1 rounded bg-gray-100 px-1.5 py-1 font-medium text-gray-900">
            Design System
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5 text-gray-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5 text-gray-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>

          <ul role="listbox" aria-label="Sibling projects" class="absolute left-0 top-full z-10 mt-1.5 w-52 overflow-hidden rounded-lg border border-gray-200 bg-white py-1 shadow-lg shadow-gray-900/10">
            <li role="option" aria-selected="true" class="flex cursor-pointer items-center justify-between bg-gray-50 px-3 py-1.5 text-sm font-medium text-gray-900">
              Design System
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </li>
            <li role="option" aria-selected="false" class="cursor-pointer px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">Marketing Site</li>
            <li role="option" aria-selected="false" class="cursor-pointer px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">Mobile App</li>
            <li role="option" aria-selected="false" class="cursor-pointer px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">Internal Tools</li>
          </ul>
        </li>
        <li class="flex items-center gap-1">
          <a href="#" class="rounded px-1.5 py-1 text-gray-500 hover:bg-gray-100 hover:text-gray-900">Components</a>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5 text-gray-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </li>
        <li aria-current="page" class="rounded px-1.5 py-1 font-medium text-gray-900">Hover Card</li>
      </ol>
    </nav>
  </body>
</html>
