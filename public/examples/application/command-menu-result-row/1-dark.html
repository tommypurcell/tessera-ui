<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-md flex-col p-6">
    <ul role="listbox" aria-label="Search results" class="flex flex-col gap-0.5 rounded-lg border border-gray-800 bg-gray-900 p-1.5">
      <li role="option" aria-selected="true">
        <button type="button" class="flex w-full items-center gap-3 rounded-md bg-indigo-500/10 px-2.5 py-2 text-left">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-gray-800 text-indigo-300 shadow-sm ring-1 ring-gray-700">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
            </svg>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium text-gray-100">Search documentation</span>
            <span class="block truncate text-xs text-gray-400">Actions</span>
          </span>
          <kbd class="rounded border border-gray-700 bg-gray-800 px-1.5 py-0.5 font-mono text-[11px] text-gray-300 shadow-[0_1px_0_#000]">↵</kbd>
        </button>
      </li>

      <li role="option" aria-selected="false">
        <button type="button" class="flex w-full items-center gap-3 rounded-md px-2.5 py-2 text-left hover:bg-gray-800">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-gray-800 text-gray-400">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h5.586A2 2 0 0113 2.586L16.414 6A2 2 0 0117 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" />
            </svg>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium text-gray-100">Pricing.tsx</span>
            <span class="block truncate text-xs text-gray-400">src/pages &middot; edited 2h ago</span>
          </span>
          <span class="shrink-0 rounded bg-gray-800 px-1.5 py-0.5 text-[11px] font-medium text-gray-400">File</span>
        </button>
      </li>

      <li role="option" aria-selected="false">
        <button type="button" class="flex w-full items-center gap-3 rounded-md px-2.5 py-2 text-left hover:bg-gray-800">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-gray-800">
            <img src="https://i.pravatar.cc/64?img=32" alt="" class="h-7 w-7 rounded-full object-cover" />
          </span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium text-gray-100">Priya Shah</span>
            <span class="block truncate text-xs text-gray-400">priya@acme.com</span>
          </span>
          <span class="shrink-0 rounded bg-gray-800 px-1.5 py-0.5 text-[11px] font-medium text-gray-400">Person</span>
        </button>
      </li>

      <li role="option" aria-selected="false" aria-disabled="true">
        <button type="button" disabled class="flex w-full cursor-not-allowed items-center gap-3 rounded-md px-2.5 py-2 text-left opacity-50">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-gray-800 text-gray-500">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-11.25a.75.75 0 00-1.5 0v3.5a.75.75 0 00.22.53l2.5 2.5a.75.75 0 101.06-1.06l-2.28-2.28V6.75z" clip-rule="evenodd" />
            </svg>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium text-gray-500">Restart deployment</span>
            <span class="block truncate text-xs text-gray-500">Requires admin access</span>
          </span>
        </button>
      </li>
    </ul>
  </body>
</html>
