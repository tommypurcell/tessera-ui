                <li class="flex gap-3">
                  <img src="https://i.pravatar.cc/64?img=33" alt="" class="size-8 shrink-0 rounded-full" />

            </div>

      </ol>

      <form class="mt-5 flex gap-3 border-t border-gray-100 pt-4">
        <img src="https://i.pravatar.cc/64?img=47" alt="" class="size-8 shrink-0 rounded-full" />

        <div class="flex min-w-0 flex-1 flex-col gap-2">
          <label for="comment-composer" class="sr-only">Write a comment</label>
          <textarea
            id="comment-composer"
            rows="2"
            placeholder="Write a comment…"
            class="w-full resize-none rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-gray-500 focus:outline-none"
          ></textarea>

          <button
            type="submit"
            class="self-end rounded-md bg-blue-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-blue-700"
          >
            Comment
          </button>
        </div>
      </form>
    </div>

</html>
