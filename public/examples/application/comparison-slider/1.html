<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-md flex-col gap-4 p-6">
    <div id="compare-1" class="group relative aspect-video w-full overflow-hidden rounded-lg border border-gray-100 select-none">
      <img
        src="https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=640&h=360&fit=crop"
        alt="After: renovated living room with bright natural light"
        class="absolute inset-0 size-full object-cover"
      />

      <div class="js-reveal absolute inset-0 size-full overflow-hidden" style="clip-path: inset(0 50% 0 0)">
        <img
          src="https://images.unsplash.com/photo-1484154218962-a197022b5858?w=640&h=360&fit=crop"
          alt="Before: outdated living room with dim lighting"
          class="absolute inset-0 size-full object-cover"
        />
      </div>

      <div
        class="js-handle pointer-events-none absolute inset-y-0 w-0.5 bg-white shadow-[0_0_0_1px_rgba(0,0,0,0.1)]"
        style="left: 50%; transform: translateX(-50%)"
      >
        <span class="absolute top-1/2 left-1/2 flex size-8 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white text-gray-600 shadow-md">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7l-5 5 5 5M16 7l5 5-5 5" />
          </svg>
        </span>
      </div>

      <input
        type="range"
        min="0"
        max="100"
        value="50"
        aria-label="Comparison slider position"
        class="js-slider absolute inset-0 size-full cursor-ew-resize appearance-none bg-transparent opacity-0"
      />

      <span class="pointer-events-none absolute top-3 left-3 rounded bg-black/60 px-2 py-1 text-xs font-medium text-white">Before</span>
      <span class="pointer-events-none absolute top-3 right-3 rounded bg-black/60 px-2 py-1 text-xs font-medium text-white">After</span>
    </div>

    <script>
      ;(function () {
        var root = document.getElementById('compare-1')
        var slider = root.querySelector('.js-slider')
        var reveal = root.querySelector('.js-reveal')
        var handle = root.querySelector('.js-handle')

        slider.addEventListener('input', function () {
          var value = slider.value
          reveal.style.clipPath = 'inset(0 ' + (100 - value) + '% 0 0)'
          handle.style.left = value + '%'
        })
      })()
    </script>
  </body>
</html>
