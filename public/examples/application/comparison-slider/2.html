<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-md flex-col gap-3 p-6">
    <div id="compare-2" class="group relative aspect-video w-full overflow-hidden rounded-lg select-none">
      <img
        src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=640&h=360&fit=crop"
        alt="After: landscaped garden in full bloom"
        class="absolute inset-0 size-full object-cover"
      />

      <div class="js-reveal absolute inset-0 size-full overflow-hidden" style="clip-path: inset(0 65% 0 0)">
        <img
          src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=640&h=360&fit=crop"
          alt="Before: overgrown and neglected garden"
          class="absolute inset-0 size-full object-cover grayscale"
        />
      </div>

      <div
        class="js-handle pointer-events-none absolute inset-y-0 w-1 bg-white"
        style="left: 35%; transform: translateX(-50%)"
      >
        <span class="absolute top-1/2 left-1/2 flex size-9 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white text-gray-700 shadow-lg">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7l-5 5 5 5M16 7l5 5-5 5" />
          </svg>
        </span>
      </div>

      <input
        type="range"
        min="0"
        max="100"
        value="35"
        aria-label="Garden renovation comparison slider"
        class="js-slider absolute inset-0 size-full cursor-ew-resize appearance-none bg-transparent opacity-0"
      />
    </div>

    <div class="flex items-center justify-between text-xs font-medium text-gray-500">
      <span class="flex items-center gap-1.5">
        <span class="size-2 rounded-full bg-gray-300"></span>
        Before renovation
      </span>
      <span class="flex items-center gap-1.5">
        <span class="size-2 rounded-full bg-blue-500"></span>
        After renovation
      </span>
    </div>

    <script>
      ;(function () {
        var root = document.getElementById('compare-2')
        var slider = root.querySelector('.js-slider')
        var reveal = root.querySelector('.js-reveal')
        var handle = root.querySelector('.js-handle')

        slider.addEventListener('input', function () {
          var value = slider.value
          reveal.style.clipPath = 'inset(0 ' + (100 - value) + '% 0 0)'
          handle.style.left = value + '%'
        })
      })()
    </script>
  </body>
</html>
