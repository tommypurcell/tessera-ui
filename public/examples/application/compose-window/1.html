<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-end justify-end bg-gray-50 p-6">
    <div class="flex w-96 flex-col overflow-hidden rounded-t-lg border border-gray-200 bg-white shadow-xl">
      <div class="flex items-center justify-between bg-gray-800 px-4 py-2.5">
        <p class="text-sm font-medium text-white">New message</p>
        <div class="flex items-center gap-1">
          <button type="button" aria-label="Minimize" class="flex size-6 items-center justify-center rounded text-gray-300 hover:bg-gray-700 hover:text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15" />
            </svg>
          </button>
          <button type="button" aria-label="Close" class="flex size-6 items-center justify-center rounded text-gray-300 hover:bg-gray-700 hover:text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <div class="border-b border-gray-100 px-4 py-2">
        <div class="flex items-center gap-2">
          <label for="compose-to" class="w-14 shrink-0 text-xs text-gray-400">To</label>
          <input id="compose-to" type="email" value="jordan@northwind.co" class="w-full border-0 p-0 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-0" />
        </div>
      </div>

      <div class="border-b border-gray-100 px-4 py-2">
        <div class="flex items-center gap-2">
          <label for="compose-subject" class="w-14 shrink-0 text-xs text-gray-400">Subject</label>
          <input id="compose-subject" type="text" value="Q3 roadmap review" class="w-full border-0 p-0 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-0" />
        </div>
      </div>

      <textarea
        aria-label="Message body"
        rows="7"
        class="resize-none border-0 px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-0"
        placeholder="Write your message..."
      >Hi Jordan,

Sharing the draft roadmap ahead of Thursday's sync — take a look when you get a chance.</textarea>

      <div class="flex items-center justify-between border-t border-gray-100 px-4 py-2.5">
        <button type="button" class="rounded-md bg-indigo-600 px-4 py-1.5 text-sm font-semibold text-white hover:bg-indigo-700">
          Send
        </button>
        <button type="button" aria-label="Delete draft" class="flex size-7 items-center justify-center rounded text-gray-400 hover:bg-gray-50 hover:text-gray-600">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
