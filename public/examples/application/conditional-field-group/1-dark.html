<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-6 p-6">
    <!-- Checkbox reveals a field group -->
    <div class="rounded-lg border border-gray-800 p-4">
      <label class="flex items-start gap-2.5">
        <input type="checkbox" checked class="mt-0.5 h-4 w-4 rounded border-gray-700 bg-gray-950 text-indigo-500 focus:ring-indigo-400" />
        <span class="text-sm font-medium text-gray-100">Email me about product updates</span>
      </label>

      <div class="mt-3 ml-6.5 flex flex-col gap-3 border-l border-gray-800 pl-4">
        <div class="flex flex-col gap-1.5">
          <label for="cfg-email" class="text-xs font-medium text-gray-300">Email address</label>
          <input id="cfg-email" type="email" value="jordan@acme.com" class="rounded-md border border-gray-700 bg-gray-950 px-3 py-1.5 text-sm text-white shadow-sm focus:border-gray-500 focus:outline-none" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="cfg-frequency" class="text-xs font-medium text-gray-300">Frequency</label>
          <select id="cfg-frequency" class="rounded-md border border-gray-700 bg-gray-950 px-3 py-1.5 text-sm text-white shadow-sm focus:border-gray-500 focus:outline-none">
            <option>Weekly</option>
            <option>Monthly</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Unchecked group, no revealed fields -->
    <div class="rounded-lg border border-gray-800 p-4">
      <label class="flex items-start gap-2.5">
        <input type="checkbox" class="mt-0.5 h-4 w-4 rounded border-gray-700 bg-gray-950 text-indigo-500 focus:ring-indigo-400" />
        <span class="text-sm font-medium text-gray-100">Ship to a different address</span>
      </label>
      <p class="mt-1 ml-6.5 text-xs text-gray-400">Leave unchecked to use your billing address for shipping.</p>
    </div>
  </body>
</html>
