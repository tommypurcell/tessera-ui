<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex items-start justify-center p-6">
    <div
      role="alertdialog"
      aria-labelledby="confirmTitle"
      aria-describedby="confirmDescription"
      class="w-full max-w-sm rounded-xl bg-gray-900 p-6 shadow-2xl"
    >
      <div class="flex items-start gap-4">
        <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-red-400/10">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 text-red-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <h2 id="confirmTitle" class="text-base font-semibold text-white">Delete project</h2>
          <p id="confirmDescription" class="mt-1.5 text-sm leading-relaxed text-gray-400">
            This will permanently delete <span class="font-medium text-white">acme-marketing-site</span> and all
            of its deployments. This action cannot be undone.
          </p>
        </div>
      </div>

      <div class="mt-5 flex flex-col gap-1.5">
        <label for="confirm-phrase-2" class="text-sm font-medium text-gray-200">
          Type <span class="font-mono font-semibold text-white">acme-marketing-site</span> to confirm
        </label>
        <input
          id="confirm-phrase-2"
          type="text"
          value="acme-marketing-site"
          aria-describedby="confirm-phrase-help-2"
          class="rounded-md border border-emerald-400 bg-gray-900 px-3 py-2 text-sm text-white shadow-sm focus:border-emerald-400 focus:outline-none"
        />
        <p id="confirm-phrase-help-2" class="flex items-center gap-1 text-xs text-emerald-400">
          <svg aria-hidden="true" class="size-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
          Confirmed — ready to delete
        </p>
      </div>

      <div class="mt-6 flex justify-end gap-2.5">
        <button
          type="button"
          class="rounded-md border border-gray-600 bg-gray-800 px-3.5 py-2 text-sm font-medium text-gray-200 shadow-sm hover:bg-gray-700"
        >
          Cancel
        </button>
        <button
          type="button"
          class="rounded-md bg-red-500 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-red-400"
        >
          Delete project
        </button>
      </div>
    </div>
  </body>
</html>
