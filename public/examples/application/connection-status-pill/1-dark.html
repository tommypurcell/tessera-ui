<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-3 p-6">
    <span
      class="inline-flex w-fit items-center gap-2 rounded-full border border-green-900/60 bg-green-950/50 py-1 pr-3 pl-2 text-sm font-medium text-green-300"
      role="status"
    >
      <span class="relative flex size-2">
        <span class="absolute inline-flex size-full animate-ping rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex size-2 rounded-full bg-green-400"></span>
      </span>
      Connected
    </span>

    <span
      class="inline-flex w-fit items-center gap-2 rounded-full border border-amber-900/60 bg-amber-950/50 py-1 pr-3 pl-2 text-sm font-medium text-amber-300"
      role="status"
    >
      <span class="relative flex size-2">
        <span class="absolute inline-flex size-full animate-ping rounded-full bg-amber-400 opacity-75"></span>
        <span class="relative inline-flex size-2 rounded-full bg-amber-400"></span>
      </span>
      Reconnecting&hellip;
    </span>

    <span class="inline-flex w-fit items-center gap-2 rounded-full border border-gray-700 bg-gray-800 py-1 pr-3 pl-2 text-sm font-medium text-gray-300" role="status">
      <span class="size-2 rounded-full bg-gray-500"></span>
      Offline
    </span>
  </body>
</html>
