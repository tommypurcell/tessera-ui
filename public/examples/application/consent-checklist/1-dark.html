<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <form class="w-full max-w-sm rounded-xl border border-gray-800 bg-gray-900 p-6">
      <h2 class="text-base font-semibold text-white">Before you continue</h2>
      <p class="mt-1 text-sm text-gray-400">Please review and accept the following to create your account.</p>

      <div class="mt-4 flex flex-col gap-3">
        <label class="flex items-start gap-2.5">
          <input
            type="checkbox"
            checked
            class="mt-0.5 size-4 rounded border-gray-600 bg-gray-950 text-blue-500 focus:ring-blue-400"
          />
          <span class="text-sm text-gray-200">
            I agree to the <a href="#" class="font-medium text-blue-400 hover:text-blue-300">Terms of Service</a>
          </span>
        </label>

        <label class="flex items-start gap-2.5">
          <input
            type="checkbox"
            class="mt-0.5 size-4 rounded border-gray-600 bg-gray-950 text-blue-500 focus:ring-blue-400"
          />
          <span class="text-sm text-gray-200">
            I agree to the <a href="#" class="font-medium text-blue-400 hover:text-blue-300">Privacy Policy</a>
          </span>
        </label>

        <label class="flex items-start gap-2.5">
          <input
            type="checkbox"
            class="mt-0.5 size-4 rounded border-gray-600 bg-gray-950 text-blue-500 focus:ring-blue-400"
          />
          <span class="text-sm text-gray-200">I am at least 18 years old</span>
        </label>
      </div>

      <p class="mt-3 text-xs text-gray-500">All three agreements are required to continue.</p>

      <button
        type="submit"
        disabled
        aria-disabled="true"
        class="mt-5 w-full cursor-not-allowed rounded-md bg-gray-800 px-4 py-2.5 text-sm font-medium text-gray-500"
      >
        Create account
      </button>
    </form>
  </body>
</html>
