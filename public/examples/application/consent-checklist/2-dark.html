<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <form class="w-full max-w-sm rounded-xl border border-gray-800 bg-gray-900 p-6">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-white">Data processing consent</h2>
        <label class="flex items-center gap-1.5 text-xs font-medium text-gray-400">
          <input
            type="checkbox"
            checked
            class="size-3.5 rounded border-gray-600 bg-gray-950 text-blue-500 focus:ring-blue-400"
          />
          Select all
        </label>
      </div>

      <div class="mt-4 flex flex-col divide-y divide-gray-800">
        <label class="flex items-start justify-between gap-3 py-3">
          <span class="flex items-start gap-2.5">
            <input
              type="checkbox"
              checked
              class="mt-0.5 size-4 rounded border-gray-600 bg-gray-950 text-blue-500 focus:ring-blue-400"
            />
            <span class="text-sm text-gray-200">Process my data to provide the service</span>
          </span>
          <span class="shrink-0 rounded-full bg-red-500/10 px-2 py-0.5 text-xs font-medium text-red-400">Required</span>
        </label>

        <label class="flex items-start justify-between gap-3 py-3">
          <span class="flex items-start gap-2.5">
            <input
              type="checkbox"
              checked
              class="mt-0.5 size-4 rounded border-gray-600 bg-gray-950 text-blue-500 focus:ring-blue-400"
            />
            <span class="text-sm text-gray-200">Send me product usage analytics</span>
          </span>
          <span class="shrink-0 rounded-full bg-red-500/10 px-2 py-0.5 text-xs font-medium text-red-400">Required</span>
        </label>

        <label class="flex items-start justify-between gap-3 py-3">
          <span class="flex items-start gap-2.5">
            <input
              type="checkbox"
              checked
              class="mt-0.5 size-4 rounded border-gray-600 bg-gray-950 text-blue-500 focus:ring-blue-400"
            />
            <span class="text-sm text-gray-200">Send me marketing emails</span>
          </span>
          <span class="shrink-0 rounded-full bg-gray-800 px-2 py-0.5 text-xs font-medium text-gray-400">Optional</span>
        </label>
      </div>

      <button
        type="submit"
        class="mt-5 w-full rounded-md bg-white px-4 py-2.5 text-sm font-medium text-gray-900 shadow-sm hover:bg-gray-200"
      >
        Continue
      </button>
    </form>
  </body>
</html>
