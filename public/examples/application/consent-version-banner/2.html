<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-5">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-900">Updated Privacy Policy</h2>
        <span class="rounded-full bg-blue-50 px-2 py-0.5 text-xs font-medium text-blue-700">v2.3</span>
      </div>
      <p class="mt-1 text-xs text-gray-500">Effective March 1, 2026 — here's what changed:</p>

      <ul class="mt-3 flex flex-col gap-2">
        <li class="flex items-start gap-2 text-sm text-gray-700">
          <span class="mt-1.5 size-1 shrink-0 rounded-full bg-gray-400" aria-hidden="true"></span>
          Added details on how we use data for AI-based recommendations
        </li>
        <li class="flex items-start gap-2 text-sm text-gray-700">
          <span class="mt-1.5 size-1 shrink-0 rounded-full bg-gray-400" aria-hidden="true"></span>
          Clarified data retention periods for closed accounts
        </li>
        <li class="flex items-start gap-2 text-sm text-gray-700">
          <span class="mt-1.5 size-1 shrink-0 rounded-full bg-gray-400" aria-hidden="true"></span>
          Added a new regional data processor in the EU
        </li>
      </ul>

      <div class="mt-4 flex items-center justify-end gap-3 border-t border-gray-100 pt-4">
        <button type="button" class="rounded-md px-3.5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">
          Remind me later
        </button>
        <button
          type="button"
          class="rounded-md bg-gray-900 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-gray-700"
        >
          Accept and continue
        </button>
      </div>
    </div>
  </body>
</html>
