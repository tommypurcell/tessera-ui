<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-end p-0">
    <div
      role="dialog"
      aria-label="Cookie preferences"
      aria-describedby="cookie-consent-description"
      class="w-full border-t border-gray-700 bg-gray-900 p-4 shadow-[0_-4px_16px_-4px_rgba(0,0,0,0.4)] sm:p-5"
    >
      <div class="mx-auto flex max-w-3xl flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <p id="cookie-consent-description" class="text-sm leading-relaxed text-gray-400">
          We use cookies to run essential site features and, with your permission, to analyze traffic and
          personalize content.
          <a href="#" class="font-medium text-white hover:underline">Learn more</a>
        </p>

        <div class="flex shrink-0 flex-wrap items-center gap-2.5">
          <button
            type="button"
            class="rounded-md px-3.5 py-2 text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white"
          >
            Reject non-essential
          </button>
          <button
            type="button"
            class="rounded-md border border-gray-600 bg-gray-800 px-3.5 py-2 text-sm font-medium text-gray-200 shadow-sm hover:bg-gray-700"
          >
            Customize
          </button>
          <button
            type="button"
            class="rounded-md bg-blue-300 px-3.5 py-2 text-sm font-medium text-gray-900 shadow-sm hover:bg-blue-200"
          >
            Accept all
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
