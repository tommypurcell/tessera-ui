<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-end p-0">
    <div
      role="dialog"
      aria-label="Cookie preferences"
      class="w-full border-t border-gray-700 bg-gray-900 p-5 shadow-[0_-4px_16px_-4px_rgba(0,0,0,0.4)]"
    >
      <div class="mx-auto flex max-w-2xl flex-col gap-4">
        <div>
          <h2 class="text-sm font-semibold text-white">Manage cookie preferences</h2>
          <p class="mt-1 text-sm text-gray-400">Essential cookies are always on. Choose which other categories to allow.</p>
        </div>

        <div class="flex flex-col divide-y divide-gray-800 rounded-lg border border-gray-700">
          <div class="flex items-center justify-between gap-4 p-3.5">
            <div>
              <p class="text-sm font-medium text-white">Essential</p>
              <p class="text-xs text-gray-400">Required for login, cart, and security. Cannot be disabled.</p>
            </div>
            <label for="essential-cookies" class="relative block h-8 w-12 shrink-0 opacity-60">
              <input type="checkbox" id="essential-cookies" checked disabled class="peer sr-only" />
              <span class="absolute inset-0 m-auto h-2 rounded-full bg-blue-300"></span>
              <span class="absolute inset-y-0 start-6 m-auto size-6 rounded-full bg-white shadow"></span>
            </label>
          </div>

          <div class="flex items-center justify-between gap-4 p-3.5">
            <div>
              <p class="text-sm font-medium text-white">Analytics</p>
              <p class="text-xs text-gray-400">Helps us understand how the site is used.</p>
            </div>
            <label for="analytics-cookies" class="relative block h-8 w-12 shrink-0 [-webkit-tap-highlight-color:transparent]">
              <input type="checkbox" id="analytics-cookies" checked class="peer sr-only" />
              <span class="absolute inset-0 m-auto h-2 rounded-full bg-gray-700 peer-checked:bg-blue-300"></span>
              <span class="absolute inset-y-0 start-0 m-auto size-6 rounded-full bg-white shadow transition-[inset-inline-start] peer-checked:start-6"></span>
            </label>
          </div>

          <div class="flex items-center justify-between gap-4 p-3.5">
            <div>
              <p class="text-sm font-medium text-white">Personalization</p>
              <p class="text-xs text-gray-400">Tailors content and recommendations to you.</p>
            </div>
            <label for="personalization-cookies" class="relative block h-8 w-12 shrink-0 [-webkit-tap-highlight-color:transparent]">
              <input type="checkbox" id="personalization-cookies" class="peer sr-only" />
              <span class="absolute inset-0 m-auto h-2 rounded-full bg-gray-700 peer-checked:bg-blue-300"></span>
              <span class="absolute inset-y-0 start-0 m-auto size-6 rounded-full bg-white shadow transition-[inset-inline-start] peer-checked:start-6"></span>
            </label>
          </div>
        </div>

        <div class="flex justify-end gap-2.5">
          <button
            type="button"
            class="rounded-md border border-gray-600 bg-gray-800 px-3.5 py-2 text-sm font-medium text-gray-200 shadow-sm hover:bg-gray-700"
          >
            Back
          </button>
          <button
            type="button"
            class="rounded-md bg-blue-300 px-3.5 py-2 text-sm font-medium text-gray-900 shadow-sm hover:bg-blue-200"
          >
            Save preferences
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
