<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm">
      <label for="copy-field-invite-link" class="block text-sm font-medium text-gray-700">Invite link</label>
      <div class="mt-1.5 flex items-center rounded-md border border-emerald-300 bg-white shadow-sm ring-1 ring-emerald-500">
        <input
          id="copy-field-invite-link"
          type="text"
          readonly
          value="https://tessera.dev/invite/8k2nfq"
          class="block w-full truncate rounded-l-md border-0 bg-transparent px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-0"
        />
        <button
          type="button"
          aria-live="polite"
          class="inline-flex shrink-0 items-center gap-1.5 rounded-r-md border-l border-emerald-300 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
          Copied
        </button>
      </div>
      <p class="mt-1.5 text-xs text-emerald-600">Link copied to clipboard.</p>
    </div>
  </body>
</html>
