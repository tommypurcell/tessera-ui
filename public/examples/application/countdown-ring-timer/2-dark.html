<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-4 p-6">
    <div class="flex items-center gap-3 rounded-lg border border-gray-800 bg-gray-900 px-4 py-3">
      <div id="ring-2-dark" class="relative flex size-10 shrink-0 items-center justify-center">
        <svg class="size-10 -rotate-90" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3.5" class="text-gray-800" />
          <circle
            class="js-ring text-orange-400 transition-[stroke-dashoffset] duration-1000 ease-linear"
            cx="20"
            cy="20"
            r="16"
            fill="none"
            stroke="currentColor"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-dasharray="100.5"
            stroke-dashoffset="20.1"
          />
        </svg>
        <span class="js-time absolute text-[10px] font-semibold tabular-nums text-white">12</span>
      </div>

      <div class="min-w-0 flex-1">
        <p class="text-sm font-medium text-white">Session expiring</p>
        <p class="text-xs text-gray-400">You'll be signed out automatically</p>
      </div>

      <button
        type="button"
        class="shrink-0 rounded-md bg-gray-100 px-3 py-1.5 text-xs font-semibold text-gray-900 transition hover:bg-white"
      >
        Stay signed in
      </button>
    </div>

    <script>
      ;(function () {
        var root = document.getElementById('ring-2-dark')
        var ring = root.querySelector('.js-ring')
        var timeEl = root.querySelector('.js-time')
        var total = 15
        var remaining = 12
        var circumference = 100.5

        function tick() {
          if (remaining <= 0) return
          remaining -= 1
          timeEl.textContent = String(remaining)
          ring.style.strokeDashoffset = String(circumference * (1 - remaining / total))
        }

        setInterval(tick, 1000)
      })()
    </script>
  </body>
</html>
