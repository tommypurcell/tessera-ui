<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <form class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-6">
      <h2 class="text-base font-semibold text-gray-900">Payment details</h2>

      <div class="mt-4 flex flex-col gap-1.5">
        <label for="cc-number" class="text-sm font-medium text-gray-700">Card number</label>
        <div class="relative">
          <input
            id="cc-number"
            type="text"
            inputmode="numeric"
            autocomplete="cc-number"
            value="4242 4242 4242 4242"
            class="w-full rounded-md border border-gray-300 py-2 pr-11 pl-3 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          />
          <svg xmlns="http://www.w3.org/2000/svg" class="absolute top-1/2 right-3 h-5 w-7 -translate-y-1/2 text-blue-600" viewBox="0 0 32 20" fill="none" aria-label="Visa" role="img">
            <rect width="32" height="20" rx="3" fill="currentColor" />
            <text x="16" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="white" font-family="sans-serif">VISA</text>
          </svg>
        </div>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="cc-expiry" class="text-sm font-medium text-gray-700">Expiry</label>
          <input
            id="cc-expiry"
            type="text"
            inputmode="numeric"
            autocomplete="cc-exp"
            placeholder="MM / YY"
            value="08 / 29"
            class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="cc-cvc" class="text-sm font-medium text-gray-700">CVC</label>
          <input
            id="cc-cvc"
            type="text"
            inputmode="numeric"
            autocomplete="cc-csc"
            placeholder="123"
            value="123"
            class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          />
        </div>
      </div>

      <div class="mt-4 flex flex-col gap-1.5">
        <label for="cc-name" class="text-sm font-medium text-gray-700">Name on card</label>
        <input
          id="cc-name"
          type="text"
          autocomplete="cc-name"
          value="Jordan Reyes"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
        />
      </div>

      <button
        type="submit"
        class="mt-5 w-full rounded-md bg-gray-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-gray-700"
      >
        Pay $48.00
      </button>
    </form>
  </body>
</html>
