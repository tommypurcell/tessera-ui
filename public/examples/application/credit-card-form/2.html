<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <form class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-6">
      <div class="rounded-lg bg-gradient-to-br from-gray-800 to-gray-950 p-4 text-white" aria-hidden="true">
        <div class="flex items-center justify-between">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-6 text-gray-300" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="6" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
            <rect x="2" y="9" width="20" height="2" fill="currentColor" />
          </svg>
          <span class="text-sm font-semibold tracking-wide">VISA</span>
        </div>
        <p class="mt-5 font-mono text-lg tracking-widest">•••• •••• •••• 4242</p>
        <div class="mt-3 flex items-center justify-between text-xs text-gray-300">
          <span>Jordan Reyes</span>
          <span>08/29</span>
        </div>
      </div>

      <div class="mt-5 flex flex-col gap-1.5">
        <label for="cc2-number" class="text-sm font-medium text-gray-700">Card number</label>
        <input
          id="cc2-number"
          type="text"
          inputmode="numeric"
          autocomplete="cc-number"
          value="4242 4242 4242 4242"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div class="mt-4 grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="cc2-expiry" class="text-sm font-medium text-gray-700">Expiry</label>
          <input
            id="cc2-expiry"
            type="text"
            inputmode="numeric"
            autocomplete="cc-exp"
            value="08 / 29"
            class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="cc2-cvc" class="text-sm font-medium text-gray-700">CVC</label>
          <input
            id="cc2-cvc"
            type="text"
            inputmode="numeric"
            autocomplete="cc-csc"
            value="123"
            class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          />
        </div>
      </div>

      <button
        type="submit"
        class="mt-5 w-full rounded-md bg-gray-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-gray-700"
      >
        Save card
      </button>
    </form>
  </body>
</html>
