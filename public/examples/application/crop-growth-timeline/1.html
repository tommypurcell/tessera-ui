<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-xl rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
      <div class="flex items-center justify-between">

        <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700">
          <span class="size-1.5 rounded-full bg-emerald-500"></span>
          Day 62 of 108
        </span>
      </div>

      <div class="mt-6">
        <div class="relative flex justify-between">
          <div class="absolute left-4 right-4 top-4 h-0.5 bg-gray-200"></div>
          <div class="absolute left-4 top-4 h-0.5 bg-emerald-500" style="width: 46%"></div>

          <div class="relative z-10 flex flex-col items-center gap-2">
            <span class="flex size-8 items-center justify-center rounded-full bg-emerald-500 text-white">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </span>
            <div class="text-center">
              <p class="text-xs font-medium text-gray-900">Seeded</p>
              <p class="text-[11px] text-gray-500">Apr 12</p>
            </div>
          </div>

          <div class="relative z-10 flex flex-col items-center gap-2">
            <span class="flex size-8 items-center justify-center rounded-full bg-emerald-500 text-white">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </span>
            <div class="text-center">
              <p class="text-xs font-medium text-gray-900">Sprouted</p>
              <p class="text-[11px] text-gray-500">Apr 21</p>
            </div>
          </div>

          <div class="relative z-10 flex flex-col items-center gap-2">
            <span aria-current="true" class="flex size-8 items-center justify-center rounded-full bg-emerald-500 text-white ring-4 ring-emerald-100">
              <span class="size-2.5 rounded-full bg-white"></span>
            </span>
            <div class="text-center">
              <p class="text-xs font-semibold text-gray-900">Vegetative</p>
              <p class="text-[11px] text-gray-500">May 20 &ndash; Jun 18</p>
            </div>
          </div>

          <div class="relative z-10 flex flex-col items-center gap-2">
            <span class="flex size-8 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-xs font-medium text-gray-400">4</span>
            <div class="text-center">
              <p class="text-xs font-medium text-gray-500">Flowering</p>
              <p class="text-[11px] text-gray-400">Jun 19 &ndash; Jul 9</p>
            </div>
          </div>

          <div class="relative z-10 flex flex-col items-center gap-2">
            <span class="flex size-8 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-xs font-medium text-gray-400">5</span>
            <div class="text-center">
              <p class="text-xs font-medium text-gray-500">Harvest</p>
              <p class="text-[11px] text-gray-400">Jul 28</p>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-6 flex items-center justify-between rounded-md border border-gray-200 bg-gray-50 px-4 py-3">
        <div class="flex items-center gap-2.5">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-amber-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
          <div>
            <p class="text-xs font-medium text-gray-900">78&deg;F &middot; Sunny</p>
            <p class="text-[11px] text-gray-500">Growing degree days: 842</p>
          </div>
        </div>
        <p class="text-xs text-gray-500">Next: side-dress fertilizer in 4 days</p>
