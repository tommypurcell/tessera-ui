<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center p-6">
    <div class="w-full max-w-xs">
      <label class="mb-1.5 block text-sm font-medium text-gray-200" for="convert-from">You send</label>
      <div class="flex items-center rounded-md border border-gray-600 bg-gray-900 shadow-sm focus-within:border-gray-400 focus-within:ring-1 focus-within:ring-gray-400">
        <input
          type="text"
          inputmode="decimal"
          id="convert-from"
          value="500.00"
          class="h-10 w-full border-0 bg-transparent px-3 text-sm text-white focus:outline-none focus:ring-0"
        />
        <label for="convert-from-currency" class="sr-only">From currency</label>
        <select
          id="convert-from-currency"
          class="h-10 shrink-0 rounded-e-md border-0 border-s border-gray-700 bg-transparent pe-7 ps-2 text-sm font-medium text-gray-300 focus:outline-none focus:ring-0"
        >
          <option class="bg-gray-900">USD</option>
          <option class="bg-gray-900">EUR</option>
          <option class="bg-gray-900">GBP</option>
        </select>
      </div>

      <div class="relative my-1 flex items-center justify-center">
        <div class="absolute inset-x-0 h-px bg-gray-800"></div>
        <button
          type="button"
          aria-label="Swap currencies"
          class="relative z-10 flex size-8 items-center justify-center rounded-full border border-gray-700 bg-gray-900 text-gray-400 shadow-sm hover:bg-gray-800 hover:text-white"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5 7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" />
          </svg>
        </button>
      </div>

      <label class="mb-1.5 block text-sm font-medium text-gray-200" for="convert-to">You receive</label>
      <div class="flex items-center rounded-md border border-gray-700 bg-gray-800 shadow-sm">
        <input
          type="text"
          inputmode="decimal"
          id="convert-to"
          value="462.15"
          readonly
          class="h-10 w-full border-0 bg-transparent px-3 text-sm text-white focus:outline-none focus:ring-0"
        />
        <label for="convert-to-currency" class="sr-only">To currency</label>
        <select
          id="convert-to-currency"
          class="h-10 shrink-0 rounded-e-md border-0 border-s border-gray-700 bg-transparent pe-7 ps-2 text-sm font-medium text-gray-300 focus:outline-none focus:ring-0"
        >
          <option class="bg-gray-900">EUR</option>
          <option class="bg-gray-900">USD</option>
          <option class="bg-gray-900">GBP</option>
        </select>
      </div>

      <p class="mt-2.5 text-center text-xs text-gray-400">1 USD = 0.9243 EUR · Updated 2m ago</p>
    </div>
  </body>
</html>
