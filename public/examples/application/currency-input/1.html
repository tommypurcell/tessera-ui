<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center p-6">
    <div class="w-full max-w-xs">
      <label for="price-input" class="mb-1.5 block text-sm font-medium text-gray-700">Price</label>
      <div class="flex items-center rounded-md border border-gray-300 bg-white shadow-sm transition-colors focus-within:border-gray-900 focus-within:ring-1 focus-within:ring-gray-900">
        <span class="flex items-center pl-3 text-sm font-medium text-gray-500" aria-hidden="true">$</span>
        <input
          type="text"
          inputmode="decimal"
          id="price-input"
          value="1,249.00"
          aria-label="Price in US dollars"
          class="h-10 w-full border-0 bg-transparent px-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-0"
        />
        <label for="price-currency" class="sr-only">Currency</label>
        <select
          id="price-currency"
          class="h-10 shrink-0 rounded-e-md border-0 border-s border-gray-200 bg-transparent pe-7 ps-2 text-sm font-medium text-gray-600 focus:outline-none focus:ring-0"
        >
          <option>USD</option>
          <option>EUR</option>
          <option>GBP</option>
          <option>JPY</option>
        </select>
      </div>
      <p class="mt-1.5 text-xs text-gray-500">Displayed to customers at checkout, rounded to 2 decimal places.</p>
    </div>
  </body>
</html>
