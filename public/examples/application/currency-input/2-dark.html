<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center p-6">
    <div class="w-full max-w-xs">
      <label for="refund-input" class="mb-1.5 block text-sm font-medium text-gray-200">Refund amount</label>
      <div
        class="flex items-center rounded-md border border-red-400 bg-gray-900 shadow-sm ring-1 ring-red-400"
      >
        <span class="flex items-center pl-3 text-sm font-medium text-gray-400" aria-hidden="true">$</span>
        <input
          type="text"
          inputmode="decimal"
          id="refund-input"
          value="2,500.00"
          aria-invalid="true"
          aria-describedby="refund-input-error"
          class="h-10 w-full border-0 bg-transparent px-2 text-sm text-white placeholder:text-gray-500 focus:outline-none focus:ring-0"
        />
        <label for="refund-currency" class="sr-only">Currency</label>
        <select
          id="refund-currency"
          class="h-10 shrink-0 rounded-e-md border-0 border-s border-gray-700 bg-transparent pe-7 ps-2 text-sm font-medium text-gray-300 focus:outline-none focus:ring-0"
        >
          <option class="bg-gray-900">USD</option>
          <option class="bg-gray-900">EUR</option>
          <option class="bg-gray-900">GBP</option>
          <option class="bg-gray-900">JPY</option>
        </select>
      </div>
      <p id="refund-input-error" role="alert" class="mt-1.5 text-xs text-red-400">Refund cannot exceed the original charge of $1,800.00.</p>
    </div>
  </body>
</html>
