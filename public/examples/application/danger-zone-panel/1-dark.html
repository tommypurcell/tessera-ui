<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <section class="rounded-lg border border-red-900/60 bg-red-950/20" aria-labelledby="dangerZoneTitle">
      <div class="border-b border-red-900/60 px-5 py-4">
        <h2 id="dangerZoneTitle" class="text-sm font-semibold text-red-200">Danger zone</h2>
        <p class="mt-0.5 text-sm text-red-300">These actions are permanent and cannot be undone.</p>
      </div>

      <div class="flex items-center justify-between gap-4 px-5 py-4">
        <div class="flex flex-col gap-0.5">
          <p class="text-sm font-medium text-white">Delete this account</p>
          <p class="text-sm text-gray-400">Permanently remove your account and all associated data.</p>
        </div>

        <button
          type="button"
          data-modal-open
          class="shrink-0 rounded-md border border-red-900/60 bg-gray-900 px-3.5 py-2 text-sm font-medium text-red-300 transition-colors hover:bg-red-950/40"
        >
          Delete account
        </button>
      </div>
    </section>

    <dialog
      aria-labelledby="deleteAccountTitle"
      aria-describedby="deleteAccountDescription"
      class="m-auto max-w-md rounded-lg bg-white p-6 shadow-lg backdrop:bg-black/50 dark:bg-gray-900"
    >
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <h2 id="deleteAccountTitle" class="text-lg font-semibold text-gray-900 dark:text-white">Are you absolutely sure?</h2>
          <p id="deleteAccountDescription" class="text-sm text-gray-600 dark:text-gray-400">
            This action cannot be undone. This will permanently delete your account and remove your data from our
            servers.
          </p>
        </div>

        <div class="flex justify-end gap-2">
          <button
            type="button"
            data-modal-close
            class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:hover:bg-gray-800"
          >
            Cancel
          </button>
          <button
            type="button"
            data-modal-close
            class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-400"
          >
            Delete account
          </button>
        </div>
      </div>
    </dialog>

    <script>
      const dialogEl = document.querySelector('dialog')
      const openButtonEl = document.querySelector('[data-modal-open]')

      openButtonEl.addEventListener('click', () => dialogEl.showModal())

      document.querySelectorAll('[data-modal-close]').forEach((buttonEl) => {
        buttonEl.addEventListener('click', () => dialogEl.close())
      })
    </script>
  </body>
</html>
