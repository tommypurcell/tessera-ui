<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-3xl bg-gray-950 p-6">
    <div class="overflow-hidden rounded-xl border border-gray-800">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-800">
          <thead class="bg-gray-900">
            <tr>
              <th scope="col" class="px-4 py-3 text-left">
                <button type="button" class="inline-flex items-center gap-1 text-xs font-medium uppercase tracking-wide text-gray-400 hover:text-gray-200">
                  Name
                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15 12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9" />
                  </svg>
                </button>
              </th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-400">Role</th>
              <th scope="col" class="px-4 py-3 text-left">
                <button type="button" aria-sort="descending" class="inline-flex items-center gap-1 text-xs font-medium uppercase tracking-wide text-white">
                  Salary
                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-3.5">
                    <path fill-rule="evenodd" d="M12 20.25a.75.75 0 0 1-.75-.75V6.31l-5.47 5.47a.75.75 0 0 1-1.06-1.06l6.75-6.75a.75.75 0 0 1 1.06 0l6.75 6.75a.75.75 0 1 1-1.06 1.06l-5.47-5.47V19.5a.75.75 0 0 1-.75.75Z" clip-rule="evenodd" />
                  </svg>
                </button>
              </th>
              <th scope="col" class="px-4 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-400">Status</th>
              <th scope="col" class="px-4 py-3">
                <span class="sr-only">Actions</span>
              </th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-800 bg-gray-900">
            <tr class="hover:bg-gray-800">
              <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-white">Nandor the Relentless</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">Vampire Warrior</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">$0</td>
              <td class="whitespace-nowrap px-4 py-3">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-green-900/50 px-2 py-0.5 text-xs font-medium text-green-400">
                  <span class="size-1.5 rounded-full bg-green-500"></span>
                  Active
                </span>
              </td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <button type="button" class="text-gray-500 hover:text-gray-300" aria-label="Row actions for Nandor the Relentless">
                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
                    <path d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                  </svg>
                </button>
              </td>
            </tr>

            <tr class="hover:bg-gray-800">
              <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-white">Laszlo Cravensworth</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">Vampire Gentleman</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">$0</td>
              <td class="whitespace-nowrap px-4 py-3">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-green-900/50 px-2 py-0.5 text-xs font-medium text-green-400">
                  <span class="size-1.5 rounded-full bg-green-500"></span>
                  Active
                </span>
              </td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <button type="button" class="text-gray-500 hover:text-gray-300" aria-label="Row actions for Laszlo Cravensworth">
                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
                    <path d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                  </svg>
                </button>
              </td>
            </tr>

            <tr class="hover:bg-gray-800">
              <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-white">Colin Robinson</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">Energy Vampire</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">$53,000</td>
              <td class="whitespace-nowrap px-4 py-3">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-gray-800 px-2 py-0.5 text-xs font-medium text-gray-300">
                  <span class="size-1.5 rounded-full bg-gray-500"></span>
                  Invited
                </span>
              </td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <button type="button" class="text-gray-500 hover:text-gray-300" aria-label="Row actions for Colin Robinson">
                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
                    <path d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                  </svg>
                </button>
              </td>
            </tr>

            <tr class="hover:bg-gray-800">
              <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-white">Guillermo de la Cruz</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">Familiar</td>
              <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400">$0</td>
              <td class="whitespace-nowrap px-4 py-3">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-red-900/50 px-2 py-0.5 text-xs font-medium text-red-400">
                  <span class="size-1.5 rounded-full bg-red-500"></span>
                  Suspended
                </span>
              </td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <button type="button" class="text-gray-500 hover:text-gray-300" aria-label="Row actions for Guillermo de la Cruz">
                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
                    <path d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="flex items-center justify-between border-t border-gray-800 bg-gray-900 px-4 py-2.5 text-sm text-gray-400">
        <span>Showing <span class="font-medium text-gray-200">4</span> of <span class="font-medium text-gray-200">4</span> results</span>
        <div class="flex items-center gap-1.5">
          <button type="button" disabled class="rounded-md border border-gray-800 px-2.5 py-1 text-xs font-medium text-gray-600">Previous</button>
          <button type="button" disabled class="rounded-md border border-gray-800 px-2.5 py-1 text-xs font-medium text-gray-600">Next</button>
        </div>
      </div>
    </div>
  </body>
</html>
