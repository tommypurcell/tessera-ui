<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-start justify-center bg-gray-50 p-6">
    <div class="w-full max-w-xs">
      <label for="date-picker-input" class="mb-1.5 block text-sm font-medium text-gray-700">Departure date</label>

      <button
        id="date-picker-input"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="true"
        class="flex w-full items-center gap-2.5 rounded-md border border-gray-300 bg-white px-3 py-2 text-left text-sm text-gray-900 shadow-sm focus:border-gray-500 focus:outline-none"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 text-gray-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
        </svg>
        <span class="grow">Aug 14, 2026</span>
      </button>

      <div
        role="dialog"
        aria-label="Choose date"
        class="relative mt-2 w-72 rounded-xl border border-gray-200 bg-white p-3 shadow-lg shadow-gray-900/10"
      >
        <div class="mb-2 flex items-center justify-between px-1">
          <button type="button" aria-label="Previous month" class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
          </button>
          <span class="text-sm font-medium text-gray-900">August 2026</span>
          <button type="button" aria-label="Next month" class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        </div>

        <div class="grid grid-cols-7 gap-y-1 text-center text-xs">
          <span class="py-1 font-medium text-gray-400">S</span>
          <span class="py-1 font-medium text-gray-400">M</span>
          <span class="py-1 font-medium text-gray-400">T</span>
          <span class="py-1 font-medium text-gray-400">W</span>
          <span class="py-1 font-medium text-gray-400">T</span>
          <span class="py-1 font-medium text-gray-400">F</span>
          <span class="py-1 font-medium text-gray-400">S</span>

          <span></span><span></span><span></span><span></span><span></span>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">1</button>

          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">2</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">3</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">4</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">5</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">6</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">7</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">8</button>

          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">9</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">10</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">11</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">12</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">13</button>
          <button
            type="button"
            aria-current="date"
            aria-selected="true"
            class="mx-auto flex size-8 items-center justify-center rounded-full bg-gray-900 text-sm font-medium text-white"
          >
            14
          </button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">15</button>

          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">16</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">17</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">18</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">19</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">20</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">21</button>
          <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-700 hover:bg-gray-100">22</button>
        </div>

        <div class="mt-3 flex items-center justify-between border-t border-gray-100 pt-3">
          <button type="button" class="text-xs font-medium text-gray-500 hover:text-gray-700">Today</button>
          <button type="button" class="rounded-md bg-gray-900 px-3 py-1.5 text-xs font-medium text-white hover:bg-gray-700">Apply</button>
        </div>
      </div>
    </div>
  </body>
</html>
