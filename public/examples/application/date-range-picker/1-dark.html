<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-start justify-center bg-gray-950 p-6">
    <div class="w-full max-w-md">
      <label for="date-range-input" class="mb-1.5 block text-sm font-medium text-gray-300">Report period</label>

      <button
        id="date-range-input"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="true"
        class="flex w-full items-center gap-2.5 rounded-md border border-gray-700 bg-gray-900 px-3 py-2 text-left text-sm text-white shadow-sm focus:border-gray-500 focus:outline-none"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 text-gray-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
        </svg>
        <span class="grow">Aug 3 – Aug 14, 2026</span>
      </button>

      <div role="dialog" aria-label="Choose date range" class="relative mt-2 flex w-full overflow-hidden rounded-xl border border-gray-800 bg-gray-900 shadow-lg shadow-black/40">
        <div class="flex w-36 shrink-0 flex-col gap-0.5 border-r border-gray-800 p-2">
          <button type="button" class="rounded-md px-2.5 py-1.5 text-left text-sm text-gray-400 hover:bg-gray-800">Today</button>
          <button type="button" aria-current="true" class="rounded-md bg-gray-800 px-2.5 py-1.5 text-left text-sm font-medium text-white">Last 7 days</button>
          <button type="button" class="rounded-md px-2.5 py-1.5 text-left text-sm text-gray-400 hover:bg-gray-800">Last 30 days</button>
          <button type="button" class="rounded-md px-2.5 py-1.5 text-left text-sm text-gray-400 hover:bg-gray-800">Month to date</button>
          <button type="button" class="rounded-md px-2.5 py-1.5 text-left text-sm text-gray-400 hover:bg-gray-800">Custom</button>
        </div>

        <div class="flex-1 p-3">
          <div class="mb-2 flex items-center justify-between px-1">
            <button type="button" aria-label="Previous month" class="rounded-md p-1 text-gray-500 hover:bg-gray-800 hover:text-gray-300">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
              </svg>
            </button>
            <span class="text-sm font-medium text-white">August 2026</span>
            <button type="button" aria-label="Next month" class="rounded-md p-1 text-gray-500 hover:bg-gray-800 hover:text-gray-300">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
              </svg>
            </button>
          </div>

          <div class="grid grid-cols-7 gap-y-1 text-center text-xs">
            <span class="py-1 font-medium text-gray-500">S</span>
            <span class="py-1 font-medium text-gray-500">M</span>
            <span class="py-1 font-medium text-gray-500">T</span>
            <span class="py-1 font-medium text-gray-500">W</span>
            <span class="py-1 font-medium text-gray-500">T</span>
            <span class="py-1 font-medium text-gray-500">F</span>
            <span class="py-1 font-medium text-gray-500">S</span>

            <span></span><span></span><span></span><span></span><span></span>
            <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-300 hover:bg-gray-800">1</button>
            <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-300 hover:bg-gray-800">2</button>

            <button type="button" aria-selected="true" class="mx-auto flex size-8 items-center justify-center rounded-full bg-white text-sm font-medium text-gray-900">3</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">4</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">5</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">6</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">7</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">8</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">9</button>

            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">10</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">11</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">12</button>
            <button type="button" class="mx-auto flex size-8 w-full items-center justify-center bg-gray-800 text-sm text-gray-200">13</button>
            <button type="button" aria-selected="true" class="mx-auto flex size-8 items-center justify-center rounded-full bg-white text-sm font-medium text-gray-900">14</button>
            <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-300 hover:bg-gray-800">15</button>
            <button type="button" class="mx-auto flex size-8 items-center justify-center rounded-full text-sm text-gray-300 hover:bg-gray-800">16</button>
          </div>

          <div class="mt-3 flex items-center justify-between border-t border-gray-800 pt-3">
            <span class="text-xs text-gray-400">12 nights selected</span>
            <div class="flex gap-2">
              <button type="button" class="rounded-md border border-gray-700 px-3 py-1.5 text-xs font-medium text-gray-300 hover:bg-gray-800">Cancel</button>
              <button type="button" class="rounded-md bg-white px-3 py-1.5 text-xs font-medium text-gray-900 hover:bg-gray-200">Apply</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
