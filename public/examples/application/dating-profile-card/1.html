<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex flex-col items-center gap-4 bg-gray-50 p-6">
    <div class="relative h-[26rem] w-72 overflow-hidden rounded-2xl bg-gradient-to-br from-rose-300 via-orange-300 to-amber-200 shadow-lg shadow-gray-900/20">
      <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-4 pt-16 text-white">
        <div class="flex items-baseline gap-1.5">
          <h3 class="text-lg font-semibold">Maya Chen</h3>
          <span class="text-sm text-white/80">28</span>
        </div>
        <p class="mt-0.5 text-xs text-white/70">Product designer &middot; 3 km away</p>
        <p class="mt-2 text-xs leading-relaxed text-white/90">
          Weekend hiker, coffee snob, and occasional pottery-class dropout. Looking for someone to argue about
          trail routes with.
        </p>
        <div class="mt-2.5 flex flex-wrap gap-1.5">
          <span class="rounded-full bg-white/20 px-2 py-0.5 text-[10px] font-medium backdrop-blur-sm">Hiking</span>
          <span class="rounded-full bg-white/20 px-2 py-0.5 text-[10px] font-medium backdrop-blur-sm">Coffee</span>
          <span class="rounded-full bg-white/20 px-2 py-0.5 text-[10px] font-medium backdrop-blur-sm">Pottery</span>
        </div>
      </div>

      <div class="absolute top-3 right-3 rounded-full bg-black/40 px-2 py-1 text-[10px] font-medium text-white backdrop-blur-sm">
        Swipe to decide
      </div>
    </div>

    <div class="flex items-center gap-4">
      <button
        type="button"
        aria-label="Pass on Maya Chen"
        class="inline-flex size-12 items-center justify-center rounded-full border border-gray-200 bg-white text-red-500 shadow-sm transition-colors hover:bg-red-50"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
      <button
        type="button"
        aria-label="Like Maya Chen"
        class="inline-flex size-12 items-center justify-center rounded-full border border-gray-200 bg-white text-rose-500 shadow-sm transition-colors hover:bg-rose-50"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
          <path fill-rule="evenodd" d="M11.645 20.91a.75.75 0 0 1-.65-.375C9.24 17.845 5.5 14.7 5.5 10.75a5.25 5.25 0 0 1 9.5-3.077 5.25 5.25 0 0 1 9.5 3.077c0 3.95-3.74 7.095-5.495 9.785a.75.75 0 0 1-.65.375h-6.71Z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </body>
</html>
