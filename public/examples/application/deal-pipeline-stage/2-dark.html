<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-start justify-center bg-gray-950 p-6">
    <div class="flex gap-3">
      <div class="w-56 rounded-lg border border-gray-700 bg-gray-900/60 p-2">
        <div class="flex items-center justify-between px-1.5 py-1">
          <h3 class="text-sm font-semibold text-white">Proposal <span class="text-xs font-normal text-gray-500">(2)</span></h3>
          <span class="text-xs font-semibold text-gray-300">$64K</span>
        </div>
        <div class="mt-1 space-y-2">
          <div class="rounded-md border border-gray-700 bg-gray-900 p-2.5 shadow-sm">
            <p class="text-sm font-medium text-white">Fenwick Co</p>
            <p class="mt-1 text-sm font-semibold text-white">$38,000</p>
          </div>
          <div class="rounded-md border border-gray-700 bg-gray-900 p-2.5 shadow-sm">
            <p class="text-sm font-medium text-white">Harborlight</p>
            <p class="mt-1 text-sm font-semibold text-white">$26,000</p>
          </div>
        </div>
      </div>

      <div class="w-56 rounded-lg border border-indigo-500/30 bg-indigo-500/10 p-2">
        <div class="flex items-center justify-between px-1.5 py-1">
          <h3 class="text-sm font-semibold text-indigo-200">Closed Won <span class="text-xs font-normal text-indigo-400">(1)</span></h3>
          <span class="text-xs font-semibold text-indigo-300">$95K</span>
        </div>
        <div class="mt-1 space-y-2">
          <div class="rounded-md border border-indigo-500/30 bg-gray-900 p-2.5 shadow-sm">
            <p class="text-sm font-medium text-white">Rendezvous Inc</p>
            <p class="mt-1 text-sm font-semibold text-indigo-300">$95,000</p>
          </div>
          <button
            type="button"
            class="flex w-full items-center justify-center gap-1 rounded-md border border-dashed border-indigo-500/30 py-2 text-xs font-medium text-indigo-400 hover:border-indigo-400 hover:text-indigo-300"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            Add deal
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
