<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <ul class="grid grid-cols-2 gap-3">
      <li class="rounded-xl border border-gray-800 bg-gray-950 p-4 shadow-sm">
        <div class="flex items-start justify-between">
          <div class="flex size-9 items-center justify-center rounded-full bg-amber-950 text-amber-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
            </svg>
          </div>

          <label for="device-light" class="relative block h-6 w-11 shrink-0 rounded-full bg-gray-700 transition-colors has-checked:bg-emerald-500">
            <input type="checkbox" id="device-light" checked class="peer sr-only" />
            <span class="absolute inset-y-0 start-0 m-1 size-4 rounded-full bg-white transition-[inset-inline-start] peer-checked:start-5"></span>
          </label>
        </div>

        <p class="mt-3 text-sm font-medium text-white">Living Room Light</p>
        <p class="text-xs text-emerald-400">On</p>
      </li>

      <li class="rounded-xl border border-gray-800 bg-gray-950 p-4 shadow-sm">
        <div class="flex items-start justify-between">
          <div class="flex size-9 items-center justify-center rounded-full bg-blue-950 text-blue-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v11.25m0 0a2.25 2.25 0 1 1-2.25 2.25M12 14.25a2.25 2.25 0 1 0 2.25 2.25M12 3a1.5 1.5 0 0 1 1.5 1.5v9.157M12 3a1.5 1.5 0 0 0-1.5 1.5v9.157" />
            </svg>
          </div>

          <label for="device-thermostat" class="relative block h-6 w-11 shrink-0 rounded-full bg-gray-700 transition-colors has-checked:bg-emerald-500">
            <input type="checkbox" id="device-thermostat" checked class="peer sr-only" />
            <span class="absolute inset-y-0 start-0 m-1 size-4 rounded-full bg-white transition-[inset-inline-start] peer-checked:start-5"></span>
          </label>
        </div>

        <p class="mt-3 text-sm font-medium text-white">Thermostat</p>
        <p class="text-xs text-emerald-400">On &middot; 71&deg;F</p>
      </li>

      <li class="rounded-xl border border-gray-800 bg-gray-950 p-4 shadow-sm">
        <div class="flex items-start justify-between">
          <div class="flex size-9 items-center justify-center rounded-full bg-gray-800 text-gray-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
          </div>

          <label for="device-lock" class="relative block h-6 w-11 shrink-0 rounded-full bg-gray-700 transition-colors has-checked:bg-emerald-500">
            <input type="checkbox" id="device-lock" class="peer sr-only" />
            <span class="absolute inset-y-0 start-0 m-1 size-4 rounded-full bg-white transition-[inset-inline-start] peer-checked:start-5"></span>
          </label>
        </div>

        <p class="mt-3 text-sm font-medium text-white">Front Door Lock</p>
        <p class="text-xs text-gray-500">Locked</p>
      </li>

      <li class="rounded-xl border border-gray-800 bg-gray-950 p-4 shadow-sm">
        <div class="flex items-start justify-between">
          <div class="flex size-9 items-center justify-center rounded-full bg-gray-800 text-gray-500">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5 4.5 3h15l.75 10.5m-16.5 0h16.5m-16.5 0v6a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-6" />
            </svg>
          </div>

          <label for="device-plug" class="relative block h-6 w-11 shrink-0 rounded-full bg-gray-700 transition-colors has-checked:bg-emerald-500">
            <input type="checkbox" id="device-plug" class="peer sr-only" />
            <span class="absolute inset-y-0 start-0 m-1 size-4 rounded-full bg-white transition-[inset-inline-start] peer-checked:start-5"></span>
          </label>
        </div>

        <p class="mt-3 text-sm font-medium text-gray-500">Office Plug</p>
        <p class="text-xs text-gray-500">Off</p>
      </li>
    </ul>
  </body>
</html>
