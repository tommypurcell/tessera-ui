<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-black/60 p-6">
    <div role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description" class="w-full max-w-sm rounded-xl border border-gray-800 bg-gray-900 p-6 shadow-2xl">
      <div class="flex items-start gap-4">
        <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-red-900/40">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 text-red-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <h2 id="dialog-title" class="text-base font-semibold text-white">Delete project</h2>
          <p id="dialog-description" class="mt-1.5 text-sm leading-relaxed text-gray-400">
            This will permanently delete the "Marketing site" project and all of its deployments. This action cannot be undone.
          </p>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-2.5">
        <button type="button" class="rounded-md border border-gray-700 bg-gray-900 px-3.5 py-2 text-sm font-medium text-gray-200 shadow-sm hover:bg-gray-800">
          Cancel
        </button>
        <button type="button" class="rounded-md bg-red-600 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-red-500">
          Delete project
        </button>
      </div>
    </div>
  </body>
</html>
