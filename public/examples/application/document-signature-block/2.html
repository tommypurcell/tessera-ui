<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>

    <link href="/component.css" rel="stylesheet" />

  <body class="mx-auto max-w-sm p-6">

          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=64&h=64&fit=crop&crop=faces"
          alt="Marcus Chen, signed"
          class="size-8 rounded-full border-2 border-white object-cover"
        />
        <span class="flex size-8 items-center justify-center rounded-full border-2 border-white bg-gray-100 text-[11px] font-semibold text-gray-500" title="Sofia Ramirez, pending">
          SR
