<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <img
        src="https://images.unsplash.com/photo-1509099836639-18ba1795216d?w=400&h=160&fit=crop"
        alt=""
        class="h-28 w-full rounded-md object-cover"
      />
      <h3 class="mt-3 text-sm font-semibold text-gray-900">Clean water for Kaya village</h3>

      <div class="mt-3">
        <div class="flex items-end justify-between">
          <span class="text-lg font-bold text-gray-900">$18,420</span>
          <span class="text-xs text-gray-500">raised of $25,000 goal</span>
        </div>
        <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-gray-100">
          <div class="h-full w-[74%] rounded-full bg-emerald-500"></div>
        </div>
      </div>

      <div class="mt-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="flex -space-x-1.5">
            <img src="https://i.pravatar.cc/48?img=12" alt="" class="size-6 rounded-full object-cover ring-2 ring-white" />
            <img src="https://i.pravatar.cc/48?img=32" alt="" class="size-6 rounded-full object-cover ring-2 ring-white" />
            <img src="https://i.pravatar.cc/48?img=5" alt="" class="size-6 rounded-full object-cover ring-2 ring-white" />
          </div>
          <span class="text-xs text-gray-500">312 donors</span>
        </div>
        <button type="button" class="rounded-md bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-500">
          Donate
        </button>
      </div>
    </div>
  </body>
</html>
