<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-md rounded-lg border border-gray-700 bg-gray-900 p-3 shadow-sm">

          <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-gray-800">
