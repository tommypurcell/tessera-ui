<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag Handle Row</title>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body class="bg-white p-6">
    <ul class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-2">
      <li class="flex items-center gap-2 rounded-lg px-2 py-2">
        <button type="button" class="cursor-grab touch-none rounded p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600" aria-label="Reorder Draft the onboarding checklist">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="6" r="1.4" />
            <circle cx="15" cy="6" r="1.4" />
            <circle cx="9" cy="12" r="1.4" />
            <circle cx="15" cy="12" r="1.4" />
            <circle cx="9" cy="18" r="1.4" />
            <circle cx="15" cy="18" r="1.4" />
          </svg>
        </button>
        <span class="text-sm text-gray-900">Draft the onboarding checklist</span>
      </li>

      <li aria-hidden="true" class="mx-2 h-0.5 rounded-full bg-blue-500"></li>

      <li class="flex items-center gap-2 rounded-lg px-2 py-2">
        <button type="button" class="cursor-grab touch-none rounded p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600" aria-label="Reorder Review pull request #482">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="6" r="1.4" />
            <circle cx="15" cy="6" r="1.4" />
            <circle cx="9" cy="12" r="1.4" />
            <circle cx="15" cy="12" r="1.4" />
            <circle cx="9" cy="18" r="1.4" />
            <circle cx="15" cy="18" r="1.4" />
          </svg>
        </button>
        <span class="text-sm text-gray-900">Review pull request #482</span>
      </li>

      <li class="flex items-center gap-2 rounded-lg px-2 py-2">
        <button type="button" class="cursor-grab touch-none rounded p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600" aria-label="Reorder Schedule Q3 retro">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="6" r="1.4" />
            <circle cx="15" cy="6" r="1.4" />
            <circle cx="9" cy="12" r="1.4" />
            <circle cx="15" cy="12" r="1.4" />
            <circle cx="9" cy="18" r="1.4" />
            <circle cx="15" cy="18" r="1.4" />
          </svg>
        </button>
        <span class="text-sm text-gray-900">Schedule Q3 retro</span>
      </li>

      <li class="flex items-center gap-2 rounded-lg px-2 py-2">
        <button type="button" class="cursor-grab touch-none rounded p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600" aria-label="Reorder Update API docs">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="6" r="1.4" />
            <circle cx="15" cy="6" r="1.4" />
            <circle cx="9" cy="12" r="1.4" />
            <circle cx="15" cy="12" r="1.4" />
            <circle cx="9" cy="18" r="1.4" />
            <circle cx="15" cy="18" r="1.4" />
          </svg>
        </button>
        <span class="text-sm text-gray-900">Update API docs</span>
      </li>
    </ul>
  </body>
</html>
