<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <span class="block text-sm font-medium text-gray-700" id="duration-input-preset-label">Timer duration</span>
      <div role="radiogroup" aria-labelledby="duration-input-preset-label" class="mt-2 flex flex-wrap gap-1.5">
        <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 bg-white px-3 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">15m</button>
        <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 bg-white px-3 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">30m</button>
        <button type="button" role="radio" aria-checked="true" class="rounded-full bg-gray-900 px-3 py-1 text-xs font-medium text-white">1h</button>
        <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 bg-white px-3 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">2h</button>
        <button type="button" role="radio" aria-checked="false" class="rounded-full border border-gray-300 bg-white px-3 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">Custom</button>
      </div>

      <div class="mt-3 flex items-center gap-1 border-t border-gray-100 pt-3">
        <label for="duration-input-custom-h" class="sr-only">Custom hours</label>
        <input
          id="duration-input-custom-h"
          type="text"
          inputmode="numeric"
          placeholder="0"
          disabled
          class="w-10 rounded-md border-gray-300 bg-gray-50 py-1 text-center text-sm text-gray-400 shadow-sm"
        />
        <span class="text-sm text-gray-400">h</span>
        <label for="duration-input-custom-m" class="sr-only">Custom minutes</label>
        <input
          id="duration-input-custom-m"
          type="text"
          inputmode="numeric"
          placeholder="00"
          disabled
          class="w-10 rounded-md border-gray-300 bg-gray-50 py-1 text-center text-sm text-gray-400 shadow-sm"
        />
        <span class="text-sm text-gray-400">m</span>
        <span class="ml-auto text-xs text-gray-500">Selected: 1h 00m</span>
      </div>
    </div>
  </body>
</html>
