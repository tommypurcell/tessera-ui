<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <fieldset class="flex flex-col gap-2">
      <legend class="text-sm font-medium text-gray-100">Story points</legend>

      <div role="radiogroup" aria-label="Story points" class="flex flex-wrap gap-1.5">
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">1</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">2</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">3</button>
        <button type="button" role="radio" aria-checked="true" class="flex size-9 items-center justify-center rounded-full border border-blue-500 bg-blue-500 text-sm font-medium text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">5</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">8</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">13</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">?</button>
      </div>
    </fieldset>
  </body>
</html>
