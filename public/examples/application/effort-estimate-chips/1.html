<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <fieldset class="flex flex-col gap-2">
      <legend class="text-sm font-medium text-gray-900">Story points</legend>

      <div role="radiogroup" aria-label="Story points" class="flex flex-wrap gap-1.5">
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">1</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">2</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">3</button>
        <button type="button" role="radio" aria-checked="true" class="flex size-9 items-center justify-center rounded-full border border-blue-600 bg-blue-600 text-sm font-medium text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">5</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">8</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">13</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 items-center justify-center rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">?</button>
      </div>
    </fieldset>
  </body>
</html>
