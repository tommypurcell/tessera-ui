<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="w-72 rounded-xl border border-gray-800 bg-gray-950 shadow-lg">
      <div class="p-2">
        <label for="emoji-search" class="sr-only">Search emoji</label>
        <input
          id="emoji-search"
          type="text"
          placeholder="Search emoji…"
          class="w-full rounded-md border border-gray-700 bg-gray-900 px-3 py-1.5 text-sm text-white shadow-sm focus:border-gray-500 focus:outline-none"
        />
      </div>

      <div role="tablist" aria-label="Emoji categories" class="flex items-center gap-0.5 border-b border-gray-800 px-2 pb-2">
        <button type="button" role="tab" aria-selected="true" class="flex size-8 items-center justify-center rounded-md bg-gray-800 text-base">
          🕒
        </button>
        <button type="button" role="tab" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-base hover:bg-gray-800">
          😀
        </button>
        <button type="button" role="tab" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-base hover:bg-gray-800">
          👋
        </button>
        <button type="button" role="tab" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-base hover:bg-gray-800">
          🐾
        </button>
        <button type="button" role="tab" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-base hover:bg-gray-800">
          🍔
        </button>
        <button type="button" role="tab" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-base hover:bg-gray-800">
          💡
        </button>
      </div>

      <div class="p-2">
        <p class="px-1 pb-1.5 text-xs font-medium text-gray-500">Recently used</p>
        <div role="listbox" aria-label="Recently used emoji" class="grid grid-cols-7 gap-0.5">
          <button type="button" role="option" aria-label="Thumbs up" aria-selected="true" class="flex size-8 items-center justify-center rounded-md bg-gray-800 text-lg">
            👍
          </button>
          <button type="button" role="option" aria-label="Heart" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            ❤️
          </button>
          <button type="button" role="option" aria-label="Grinning face" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            😄
          </button>
          <button type="button" role="option" aria-label="Clapping hands" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            👏
          </button>
          <button type="button" role="option" aria-label="Fire" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            🔥
          </button>
          <button type="button" role="option" aria-label="Party popper" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            🎉
          </button>
          <button type="button" role="option" aria-label="Eyes" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            👀
          </button>
          <button type="button" role="option" aria-label="Rocket" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            🚀
          </button>
          <button type="button" role="option" aria-label="Thinking face" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            🤔
          </button>
          <button type="button" role="option" aria-label="Sparkles" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            ✨
          </button>
          <button type="button" role="option" aria-label="Check mark" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            ✅
          </button>
          <button type="button" role="option" aria-label="Laughing face" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            😂
          </button>
          <button type="button" role="option" aria-label="Star" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            ⭐
          </button>
          <button type="button" role="option" aria-label="Waving hand" aria-selected="false" class="flex size-8 items-center justify-center rounded-md text-lg hover:bg-gray-800">
            👋
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
