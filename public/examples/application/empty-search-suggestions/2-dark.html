<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-md flex-col items-center gap-5 rounded-lg border border-gray-800 bg-gray-900 px-6 py-10 text-center">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-12 text-gray-600">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>

      <div class="flex flex-col gap-1">
        <p class="text-sm font-medium text-white">No results for &ldquo;<span class="font-semibold">running shues</span>&rdquo;</p>
        <p class="text-sm text-gray-400">
          Did you mean
          <button type="button" class="font-medium text-blue-400 hover:text-blue-300">running shoes</button>?
        </p>
      </div>

      <div class="w-full border-t border-gray-800 pt-4">
        <p class="text-xs font-medium tracking-wide text-gray-500 uppercase">Browse categories instead</p>
        <div class="mt-2.5 flex flex-wrap items-center justify-center gap-2">
          <button type="button" class="rounded-full bg-gray-800 px-3 py-1.5 text-sm font-medium text-gray-200 hover:bg-gray-700">Men's shoes</button>
          <button type="button" class="rounded-full bg-gray-800 px-3 py-1.5 text-sm font-medium text-gray-200 hover:bg-gray-700">Women's shoes</button>
          <button type="button" class="rounded-full bg-gray-800 px-3 py-1.5 text-sm font-medium text-gray-200 hover:bg-gray-700">Trail running</button>
        </div>
      </div>
    </div>
  </body>
</html>
