<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs justify-center p-6">
    <div class="relative inline-flex">
      <button
        type="button"
        aria-haspopup="true"
        aria-expanded="true"
        class="flex items-center gap-2 rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50"
      >
        <span class="h-2 w-2 rounded-full bg-amber-500" aria-hidden="true"></span>
        Staging
        <svg class="h-3.5 w-3.5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
        </svg>
      </button>

      <div class="absolute left-0 top-full z-10 mt-2 w-52 rounded-lg border border-gray-200 bg-white py-1 shadow-lg">
        <button type="button" class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-50">
          <span class="h-2 w-2 rounded-full bg-gray-400" aria-hidden="true"></span>
          Development
        </button>
        <button type="button" class="flex w-full items-center justify-between gap-2 bg-amber-50 px-3 py-2 text-left text-sm font-medium text-gray-900">
          <span class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-amber-500" aria-hidden="true"></span>
            Staging
          </span>
          <svg class="h-4 w-4 text-amber-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" />
          </svg>
        </button>
        <button type="button" class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-50">
          <span class="h-2 w-2 rounded-full bg-emerald-500" aria-hidden="true"></span>
          Production
        </button>
      </div>
    </div>
  </body>
</html>
