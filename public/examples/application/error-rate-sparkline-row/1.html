<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="overflow-hidden rounded-xl border border-gray-200">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Endpoint</th>
            <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-gray-500">24h trend</th>
            <th scope="col" class="px-4 py-2.5 text-right text-xs font-medium uppercase tracking-wide text-gray-500">Error rate</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 bg-white">
          <tr>
            <td class="whitespace-nowrap px-4 py-3">
              <code class="text-sm text-gray-900">GET /api/v1/orders</code>
            </td>
            <td class="whitespace-nowrap px-4 py-3">
              <div class="flex items-end gap-0.5" aria-hidden="true">
                <span class="w-1.5 rounded-sm bg-gray-200" style="height: 4px"></span>
                <span class="w-1.5 rounded-sm bg-gray-200" style="height: 5px"></span>
                <span class="w-1.5 rounded-sm bg-gray-200" style="height: 4px"></span>
                <span class="w-1.5 rounded-sm bg-gray-200" style="height: 6px"></span>
                <span class="w-1.5 rounded-sm bg-gray-200" style="height: 4px"></span>
                <span class="w-1.5 rounded-sm bg-gray-200" style="height: 5px"></span>
                <span class="w-1.5 rounded-sm bg-gray-200" style="height: 3px"></span>
              </div>
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-right">
              <span class="inline-flex items-center gap-1.5 rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">
                <span class="size-1.5 rounded-full bg-green-500"></span>
                0.2%
              </span>
            </td>
          </tr>

          <tr>
            <td class="whitespace-nowrap px-4 py-3">
              <code class="text-sm text-gray-900">POST /api/v1/checkout</code>
            </td>
            <td class="whitespace-nowrap px-4 py-3">
              <div class="flex items-end gap-0.5" aria-hidden="true">
                <span class="w-1.5 rounded-sm bg-yellow-300" style="height: 5px"></span>
                <span class="w-1.5 rounded-sm bg-yellow-300" style="height: 8px"></span>
                <span class="w-1.5 rounded-sm bg-yellow-300" style="height: 10px"></span>
                <span class="w-1.5 rounded-sm bg-yellow-400" style="height: 14px"></span>
                <span class="w-1.5 rounded-sm bg-yellow-400" style="height: 16px"></span>
                <span class="w-1.5 rounded-sm bg-yellow-400" style="height: 18px"></span>
                <span class="w-1.5 rounded-sm bg-yellow-500" style="height: 20px"></span>
              </div>
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-right">
              <span class="inline-flex items-center gap-1.5 rounded-full bg-yellow-100 px-2 py-0.5 text-xs font-medium text-yellow-700">
                <span class="size-1.5 rounded-full bg-yellow-500"></span>
                4.8%
              </span>
            </td>
          </tr>

          <tr>
            <td class="whitespace-nowrap px-4 py-3">
              <code class="text-sm text-gray-900">POST /api/v1/webhooks</code>
            </td>
            <td class="whitespace-nowrap px-4 py-3">
              <div class="flex items-end gap-0.5" aria-hidden="true">
                <span class="w-1.5 rounded-sm bg-red-300" style="height: 6px"></span>
                <span class="w-1.5 rounded-sm bg-red-300" style="height: 10px"></span>
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 16px"></span>
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 22px"></span>
                <span class="w-1.5 rounded-sm bg-red-500" style="height: 20px"></span>
                <span class="w-1.5 rounded-sm bg-red-500" style="height: 24px"></span>
                <span class="w-1.5 rounded-sm bg-red-600" style="height: 26px"></span>
              </div>
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-right">
              <span class="inline-flex items-center gap-1.5 rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700">
                <span class="size-1.5 rounded-full bg-red-500"></span>
                18.4%
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
