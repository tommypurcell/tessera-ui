<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-[560px] items-start justify-center bg-gray-950 p-6">
    <div class="w-full max-w-2xl overflow-hidden rounded-lg border border-gray-700 bg-gray-900 shadow-sm">
      <div class="flex border-b border-gray-700">
        <div class="w-14 shrink-0 border-r border-gray-700 py-2"></div>
        <div class="flex-1 border-r border-gray-700 py-2 text-center">
          <p class="text-xs font-medium text-gray-400">Mon</p>
          <p class="text-sm font-semibold text-white">10</p>
        </div>
        <div class="flex-1 border-r border-gray-700 bg-white/5 py-2 text-center">
          <p class="text-xs font-medium text-white">Tue</p>
          <p class="text-sm font-semibold text-white">11</p>
        </div>
        <div class="flex-1 py-2 text-center">
          <p class="text-xs font-medium text-gray-400">Wed</p>
          <p class="text-sm font-semibold text-white">12</p>
        </div>
      </div>

      <div class="flex">
        <div class="w-14 shrink-0 border-r border-gray-700">
          <div class="h-16 border-b border-gray-800 px-2 pt-1 text-right text-xs text-gray-500">9 AM</div>
          <div class="h-16 border-b border-gray-800 px-2 pt-1 text-right text-xs text-gray-500">10 AM</div>
          <div class="h-16 border-b border-gray-800 px-2 pt-1 text-right text-xs text-gray-500">11 AM</div>
          <div class="h-16 border-b border-gray-800 px-2 pt-1 text-right text-xs text-gray-500">12 PM</div>
          <div class="h-16 px-2 pt-1 text-right text-xs text-gray-500">1 PM</div>
        </div>

        <div class="relative flex-1 border-r border-gray-700">
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16"></div>

          <div class="absolute inset-x-1 top-4 h-14 rounded-md border border-blue-800 bg-blue-950 p-1.5">
            <p class="truncate text-xs font-semibold text-blue-200">Design sync</p>
            <p class="truncate text-[11px] text-blue-400">9:15 – 10:00 AM</p>
          </div>
        </div>

        <div class="relative flex-1 border-r border-gray-700 bg-white/5">
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16"></div>

          <div class="absolute left-1 top-0 h-32 w-[calc(50%-4px)] rounded-md border border-violet-800 bg-violet-950 p-1.5">
            <p class="truncate text-xs font-semibold text-violet-200">Roadmap review</p>
            <p class="truncate text-[11px] text-violet-400">9:00 – 11:00 AM</p>
          </div>
          <div class="absolute right-1 top-8 h-16 w-[calc(50%-4px)] rounded-md border border-amber-800 bg-amber-950 p-1.5">
            <p class="truncate text-xs font-semibold text-amber-200">1:1 with Priya</p>
            <p class="truncate text-[11px] text-amber-400">9:30 – 10:30</p>
          </div>

          <div class="pointer-events-none absolute inset-x-0 top-[104px] z-10 flex items-center">
            <span class="-ml-1 size-2 shrink-0 rounded-full bg-red-500"></span>
            <span class="h-px w-full bg-red-500"></span>
          </div>
        </div>

        <div class="relative flex-1">
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16 border-b border-gray-800"></div>
          <div class="h-16"></div>

          <div class="absolute inset-x-1 top-14 h-16 rounded-md border border-emerald-800 bg-emerald-950 p-1.5">
            <p class="truncate text-xs font-semibold text-emerald-200">Ship review</p>
            <p class="truncate text-[11px] text-emerald-400">11:00 AM – 12:00 PM</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
