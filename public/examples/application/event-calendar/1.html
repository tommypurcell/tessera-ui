<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-[560px] items-start justify-center bg-gray-50 p-6">
    <div class="w-full max-w-2xl overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
      <div class="flex border-b border-gray-200">
        <div class="w-14 shrink-0 border-r border-gray-200 py-2"></div>
        <div class="flex-1 border-r border-gray-200 py-2 text-center">
          <p class="text-xs font-medium text-gray-500">Mon</p>
          <p class="text-sm font-semibold text-gray-900">10</p>
        </div>
        <div class="flex-1 border-r border-gray-200 bg-gray-50/60 py-2 text-center">
          <p class="text-xs font-medium text-gray-900">Tue</p>
          <p class="text-sm font-semibold text-gray-900">11</p>
        </div>
        <div class="flex-1 py-2 text-center">
          <p class="text-xs font-medium text-gray-500">Wed</p>
          <p class="text-sm font-semibold text-gray-900">12</p>
        </div>
      </div>

      <div class="flex">
        <div class="w-14 shrink-0 border-r border-gray-200">
          <div class="h-16 border-b border-gray-100 px-2 pt-1 text-right text-xs text-gray-400">9 AM</div>
          <div class="h-16 border-b border-gray-100 px-2 pt-1 text-right text-xs text-gray-400">10 AM</div>
          <div class="h-16 border-b border-gray-100 px-2 pt-1 text-right text-xs text-gray-400">11 AM</div>
          <div class="h-16 border-b border-gray-100 px-2 pt-1 text-right text-xs text-gray-400">12 PM</div>
          <div class="h-16 px-2 pt-1 text-right text-xs text-gray-400">1 PM</div>
        </div>

        <div class="relative flex-1 border-r border-gray-200">
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16"></div>

          <div class="absolute inset-x-1 top-4 h-14 rounded-md border border-blue-200 bg-blue-50 p-1.5">
            <p class="truncate text-xs font-semibold text-blue-900">Design sync</p>
            <p class="truncate text-[11px] text-blue-700">9:15 – 10:00 AM</p>
          </div>
        </div>

        <div class="relative flex-1 border-r border-gray-200 bg-gray-50/60">
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16"></div>

          <div class="absolute left-1 top-0 h-32 w-[calc(50%-4px)] rounded-md border border-violet-200 bg-violet-50 p-1.5">
            <p class="truncate text-xs font-semibold text-violet-900">Roadmap review</p>
            <p class="truncate text-[11px] text-violet-700">9:00 – 11:00 AM</p>
          </div>
          <div class="absolute right-1 top-8 h-16 w-[calc(50%-4px)] rounded-md border border-amber-200 bg-amber-50 p-1.5">
            <p class="truncate text-xs font-semibold text-amber-900">1:1 with Priya</p>
            <p class="truncate text-[11px] text-amber-700">9:30 – 10:30</p>
          </div>

          <div class="pointer-events-none absolute inset-x-0 top-[104px] z-10 flex items-center">
            <span class="-ml-1 size-2 shrink-0 rounded-full bg-red-500"></span>
            <span class="h-px w-full bg-red-500"></span>
          </div>
        </div>

        <div class="relative flex-1">
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16 border-b border-gray-100"></div>
          <div class="h-16"></div>

          <div class="absolute inset-x-1 top-14 h-16 rounded-md border border-emerald-200 bg-emerald-50 p-1.5">
            <p class="truncate text-xs font-semibold text-emerald-900">Ship review</p>
            <p class="truncate text-[11px] text-emerald-700">11:00 AM – 12:00 PM</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
