<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="overflow-hidden rounded-xl border border-gray-200">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="w-8 px-3 py-2.5"></th>
            <th scope="col" class="px-2 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Order</th>
            <th scope="col" class="px-2 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Customer</th>
            <th scope="col" class="px-2 py-2.5 text-right text-xs font-medium uppercase tracking-wide text-gray-500">Total</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 bg-white">
          <tr>
            <td class="px-3 py-3">
              <button type="button" aria-expanded="true" aria-label="Collapse order #4821" class="text-gray-400 hover:text-gray-600">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
              </button>
            </td>
            <td class="whitespace-nowrap px-2 py-3 text-sm font-medium text-gray-900">#4821</td>
            <td class="whitespace-nowrap px-2 py-3 text-sm text-gray-600">Nandor the Relentless</td>
            <td class="whitespace-nowrap px-2 py-3 text-right text-sm text-gray-600">$284.00</td>
          </tr>

          <tr>
            <td colspan="4" class="bg-gray-50 px-3 py-3">
              <div class="pl-8 text-sm text-gray-600">
                <div class="flex items-center justify-between py-1">
                  <span>Nightclub velvet rope (x2)</span>
                  <span class="text-gray-900">$180.00</span>
                </div>
                <div class="flex items-center justify-between py-1">
                  <span>Coffin polish kit</span>
                  <span class="text-gray-900">$64.00</span>
                </div>
                <div class="flex items-center justify-between border-t border-gray-200 py-1.5 pt-2 font-medium text-gray-900">
                  <span>Shipping</span>
                  <span>$40.00</span>
                </div>
              </div>
            </td>
          </tr>

          <tr>
            <td class="px-3 py-3">
              <button type="button" aria-expanded="false" aria-label="Expand order #4809" class="text-gray-400 hover:text-gray-600">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
              </button>
            </td>
            <td class="whitespace-nowrap px-2 py-3 text-sm font-medium text-gray-900">#4809</td>
            <td class="whitespace-nowrap px-2 py-3 text-sm text-gray-600">Nadja</td>
            <td class="whitespace-nowrap px-2 py-3 text-right text-sm text-gray-600">$96.50</td>
          </tr>

          <tr>
            <td class="px-3 py-3">
              <button type="button" aria-expanded="false" aria-label="Expand order #4790" class="text-gray-400 hover:text-gray-600">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
              </button>
            </td>
            <td class="whitespace-nowrap px-2 py-3 text-sm font-medium text-gray-900">#4790</td>
            <td class="whitespace-nowrap px-2 py-3 text-sm text-gray-600">Colin Robinson</td>
            <td class="whitespace-nowrap px-2 py-3 text-right text-sm text-gray-600">$412.75</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
