<!doctype html>
<html lang="en" class="font-sans antialiased dark">

    <link href="/component.css" rel="stylesheet" />

  </head>
  <body class="mx-auto max-w-2xl bg-gray-950 p-6">
    <div class="overflow-hidden rounded-xl border border-gray-800">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-800">
          <thead>
            <tr>
              <th scope="col" class="sticky left-0 bg-gray-900 px-4 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-400">Feature</th>

              <th scope="col" class="bg-gray-800 px-4 py-3 text-center text-sm font-semibold text-white">

          <tbody class="divide-y divide-gray-800">
            <tr>

                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />

                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
                <span class="sr-only">Included</span>
              </td>
              <td class="bg-gray-900 px-4 py-3 text-center">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" class="mx-auto size-4 text-white">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />

                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />

                <span class="sr-only">Not included</span>

              <td class="bg-gray-900 px-4 py-3 text-center text-sm text-gray-400">24/7 phone</td>
            </tr>
          </tbody>
        </table>
      </div>

</html>
