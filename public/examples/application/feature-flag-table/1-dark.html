<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl bg-gray-950 p-6">
    <div class="overflow-hidden rounded-xl border border-gray-800">
      <table class="min-w-full divide-y divide-gray-800">
        <thead class="bg-gray-900">
          <tr>
            <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-gray-400">Flag</th>
            <th scope="col" class="px-3 py-2.5 text-center text-xs font-medium uppercase tracking-wide text-gray-400">Dev</th>
            <th scope="col" class="px-3 py-2.5 text-center text-xs font-medium uppercase tracking-wide text-gray-400">Staging</th>
            <th scope="col" class="px-3 py-2.5 text-center text-xs font-medium uppercase tracking-wide text-gray-400">Production</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-800 bg-gray-900">
          <tr>
            <td class="whitespace-nowrap px-4 py-3">
              <code class="text-sm font-medium text-white">new-checkout-flow</code>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="true" aria-label="new-checkout-flow in Dev, enabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-white">
                <span class="inline-block size-3.5 translate-x-4.5 rounded-full bg-gray-900 transition"></span>
              </button>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="true" aria-label="new-checkout-flow in Staging, enabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-white">
                <span class="inline-block size-3.5 translate-x-4.5 rounded-full bg-gray-900 transition"></span>
              </button>
            </td>
            <td class="px-3 py-3 text-center">
              <div class="flex flex-col items-center gap-1">
                <button type="button" role="switch" aria-checked="true" aria-label="new-checkout-flow in Production, enabled at 25 percent rollout" class="relative inline-flex h-5 w-9 items-center rounded-full bg-white">
                  <span class="inline-block size-3.5 translate-x-4.5 rounded-full bg-gray-900 transition"></span>
                </button>
                <span class="text-[10px] text-gray-500">25% rollout</span>
              </div>
            </td>
          </tr>

          <tr>
            <td class="whitespace-nowrap px-4 py-3">
              <code class="text-sm font-medium text-white">ai-search-suggestions</code>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="true" aria-label="ai-search-suggestions in Dev, enabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-white">
                <span class="inline-block size-3.5 translate-x-4.5 rounded-full bg-gray-900 transition"></span>
              </button>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="false" aria-label="ai-search-suggestions in Staging, disabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-gray-700">
                <span class="inline-block size-3.5 translate-x-0.5 rounded-full bg-gray-300 transition"></span>
              </button>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="false" aria-label="ai-search-suggestions in Production, disabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-gray-700">
                <span class="inline-block size-3.5 translate-x-0.5 rounded-full bg-gray-300 transition"></span>
              </button>
            </td>
          </tr>

          <tr>
            <td class="whitespace-nowrap px-4 py-3">
              <code class="text-sm font-medium text-white">legacy-export-api</code>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="false" aria-label="legacy-export-api in Dev, disabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-gray-700">
                <span class="inline-block size-3.5 translate-x-0.5 rounded-full bg-gray-300 transition"></span>
              </button>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="true" aria-label="legacy-export-api in Staging, enabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-white">
                <span class="inline-block size-3.5 translate-x-4.5 rounded-full bg-gray-900 transition"></span>
              </button>
            </td>
            <td class="px-3 py-3 text-center">
              <button type="button" role="switch" aria-checked="true" aria-label="legacy-export-api in Production, enabled" class="relative inline-flex h-5 w-9 items-center rounded-full bg-white">
                <span class="inline-block size-3.5 translate-x-4.5 rounded-full bg-gray-900 transition"></span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
