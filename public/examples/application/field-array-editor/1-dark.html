<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-md">
      <label class="mb-1.5 block text-sm font-medium text-gray-300">Team member emails</label>

      <div class="space-y-2">
        <div class="flex items-center gap-2">
          <button type="button" aria-label="Drag to reorder" class="flex size-8 shrink-0 cursor-grab items-center justify-center text-gray-600 hover:text-gray-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
            </svg>
          </button>
          <input type="email" value="priya@acme.com" class="h-10 w-full rounded-md border border-gray-700 bg-gray-900 px-3 text-sm text-white shadow-sm focus:border-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-100" />
          <button type="button" aria-label="Remove" class="flex size-8 shrink-0 items-center justify-center rounded-md text-gray-500 transition-colors hover:bg-white/5 hover:text-red-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button type="button" aria-label="Drag to reorder" class="flex size-8 shrink-0 cursor-grab items-center justify-center text-gray-600 hover:text-gray-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
            </svg>
          </button>
          <input type="email" value="dev-team@acme.com" class="h-10 w-full rounded-md border border-gray-700 bg-gray-900 px-3 text-sm text-white shadow-sm focus:border-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-100" />
          <button type="button" aria-label="Remove" class="flex size-8 shrink-0 items-center justify-center rounded-md text-gray-500 transition-colors hover:bg-white/5 hover:text-red-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button type="button" aria-label="Drag to reorder" class="flex size-8 shrink-0 cursor-grab items-center justify-center text-gray-600 hover:text-gray-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
            </svg>
          </button>
          <div class="relative w-full">
            <input type="email" value="not-an-email" aria-invalid="true" aria-describedby="row3-error-dark" class="h-10 w-full rounded-md border border-red-800 bg-gray-900 px-3 text-sm text-white shadow-sm focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500" />
            <p id="row3-error-dark" class="mt-1 text-xs text-red-400">Enter a valid email address.</p>
          </div>
          <button type="button" aria-label="Remove" class="flex size-8 shrink-0 items-center justify-center self-start rounded-md text-gray-500 transition-colors hover:bg-white/5 hover:text-red-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="mt-3 flex items-center gap-1.5 text-sm font-medium text-gray-300 hover:text-white">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Add another email
      </button>
    </div>
  </body>
</html>
