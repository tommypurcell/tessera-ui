<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-32 items-center justify-center p-6">
    <div class="flex w-full max-w-md flex-wrap items-center gap-1.5">
      <span class="inline-flex items-center gap-1 rounded-full bg-gray-100 py-1 pl-3 pr-1.5 text-sm text-gray-700">
        Status: Active
        <button type="button" aria-label="Remove Status: Active filter" class="rounded-full p-0.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </span>

      <span class="inline-flex items-center gap-1 rounded-full bg-gray-100 py-1 pl-3 pr-1.5 text-sm text-gray-700">
        Owner: Priya Shah
        <button type="button" aria-label="Remove Owner: Priya Shah filter" class="rounded-full p-0.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </span>

      <span class="inline-flex items-center gap-1 rounded-full bg-gray-100 py-1 pl-3 pr-1.5 text-sm text-gray-700">
        Priority: High
        <button type="button" aria-label="Remove Priority: High filter" class="rounded-full p-0.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </span>

      <button
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        class="inline-flex items-center rounded-full border border-dashed border-gray-300 px-3 py-1 text-sm font-medium text-gray-600 hover:bg-gray-50"
      >
        +3 more
      </button>
    </div>
  </body>
</html>
