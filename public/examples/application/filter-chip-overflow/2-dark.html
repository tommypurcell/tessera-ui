<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-start justify-center p-6">
    <div class="flex w-full max-w-md flex-wrap items-center gap-1.5">
      <span class="inline-flex items-center gap-1 rounded-full bg-gray-800 py-1 pl-3 pr-1.5 text-sm text-gray-200">
        Status: Active
        <button type="button" aria-label="Remove Status: Active filter" class="rounded-full p-0.5 text-gray-400 hover:bg-gray-700 hover:text-white">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </span>

      <span class="inline-flex items-center gap-1 rounded-full bg-gray-800 py-1 pl-3 pr-1.5 text-sm text-gray-200">
        Owner: Priya Shah
        <button type="button" aria-label="Remove Owner: Priya Shah filter" class="rounded-full p-0.5 text-gray-400 hover:bg-gray-700 hover:text-white">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </span>

      <span class="inline-flex items-center gap-1 rounded-full bg-gray-800 py-1 pl-3 pr-1.5 text-sm text-gray-200">
        Priority: High
        <button type="button" aria-label="Remove Priority: High filter" class="rounded-full p-0.5 text-gray-400 hover:bg-gray-700 hover:text-white">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </span>

      <div class="relative">
        <button
          type="button"
          aria-haspopup="dialog"
          aria-expanded="true"
          class="inline-flex items-center rounded-full border border-gray-600 bg-gray-800 px-3 py-1 text-sm font-medium text-white"
        >
          +3 more
        </button>

        <div
          role="dialog"
          aria-label="More filters"
          class="absolute left-0 top-full z-10 mt-2 w-56 rounded-lg border border-gray-700 bg-gray-900 p-2 shadow-lg shadow-black/30"
        >
          <span class="flex items-center justify-between gap-2 rounded-md px-2 py-1.5 text-sm text-gray-200 hover:bg-gray-800">
            Label: Bug
            <button type="button" aria-label="Remove Label: Bug filter" class="rounded-full p-0.5 text-gray-500 hover:bg-gray-700 hover:text-white">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </span>
          <span class="flex items-center justify-between gap-2 rounded-md px-2 py-1.5 text-sm text-gray-200 hover:bg-gray-800">
            Milestone: v2.4
            <button type="button" aria-label="Remove Milestone: v2.4 filter" class="rounded-full p-0.5 text-gray-500 hover:bg-gray-700 hover:text-white">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </span>
          <span class="flex items-center justify-between gap-2 rounded-md px-2 py-1.5 text-sm text-gray-200 hover:bg-gray-800">
            Created: Last 7 days
            <button type="button" aria-label="Remove Created: Last 7 days filter" class="rounded-full p-0.5 text-gray-500 hover:bg-gray-700 hover:text-white">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
