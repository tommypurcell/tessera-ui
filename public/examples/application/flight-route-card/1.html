<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center p-6">
    <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="flex size-6 items-center justify-center rounded bg-gray-900 text-[10px] font-bold text-white">UA</span>
          <span class="text-xs text-gray-500">United Airlines · UA 892</span>
        </div>
        <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-700">Nonstop</span>
      </div>

      <div class="mt-3 flex items-center gap-3">
        <div class="text-center">
          <p class="text-lg font-semibold text-gray-900">SFO</p>
          <p class="text-xs text-gray-500">9:40 AM</p>
        </div>

        <div class="flex flex-1 flex-col items-center">
          <p class="text-xs text-gray-400">7h 55m</p>
          <div class="relative mt-1 h-px w-full bg-gray-300">
            <svg aria-hidden="true" class="absolute -top-1.5 right-0 size-3 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-6 6m6-6 6 6" transform="rotate(90 12 12)" />
            </svg>
          </div>
        </div>

        <div class="text-center">
          <p class="text-lg font-semibold text-gray-900">NRT</p>
          <p class="text-xs text-gray-500">1:35 PM+1</p>
        </div>
      </div>

      <div class="mt-3 flex items-center justify-between border-t border-gray-100 pt-3">
        <p class="text-xs text-gray-500">San Francisco → Tokyo Narita</p>
        <p class="text-sm font-semibold text-gray-900">$742</p>
      </div>
    </div>
  </body>
</html>
