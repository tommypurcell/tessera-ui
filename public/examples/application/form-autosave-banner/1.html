<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-8 p-6">
    <!-- Unsaved changes -->
    <div class="flex items-center justify-between gap-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 shrink-0 rounded-full bg-amber-500" aria-hidden="true"></span>
        <p class="text-sm font-medium text-amber-900">You have unsaved changes</p>
      </div>
      <div class="flex shrink-0 gap-2">
        <button type="button" class="rounded-md border border-amber-300 bg-white px-3 py-1.5 text-xs font-medium text-amber-800 shadow-sm hover:bg-amber-50">
          Discard
        </button>
        <button type="button" class="rounded-md bg-amber-600 px-3 py-1.5 text-xs font-medium text-white shadow-sm hover:bg-amber-500">
          Save changes
        </button>
      </div>
    </div>

    <!-- All saved -->
    <div class="flex items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 px-4 py-3">
      <svg class="h-4 w-4 shrink-0 text-emerald-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" />
      </svg>
      <p class="text-sm text-gray-600">All changes saved &middot; a few seconds ago</p>
    </div>
  </body>
</html>
