<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-lg border border-green-200 bg-green-50/50 p-5">
      <div class="flex items-center gap-3">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-6 shrink-0 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="text-sm font-semibold text-gray-900">You're all set up</h3>
      </div>

      <p class="mt-2 text-sm text-gray-600">Your workspace is ready. Here's what to do next:</p>

      <ol class="mt-3 flex flex-col gap-2">
        <li class="flex items-start gap-2 text-sm text-gray-700">
          <span class="mt-0.5 flex size-4 shrink-0 items-center justify-center rounded-full bg-green-600 text-[10px] font-bold text-white">1</span>
          Invite your team members
        </li>
        <li class="flex items-start gap-2 text-sm text-gray-700">
          <span class="mt-0.5 flex size-4 shrink-0 items-center justify-center rounded-full bg-green-600 text-[10px] font-bold text-white">2</span>
          Connect your first data source
        </li>
        <li class="flex items-start gap-2 text-sm text-gray-700">
          <span class="mt-0.5 flex size-4 shrink-0 items-center justify-center rounded-full bg-green-600 text-[10px] font-bold text-white">3</span>
          Create your first dashboard
        </li>
      </ol>

      <button type="button" class="mt-4 w-full rounded-md bg-green-600 py-2 text-sm font-medium text-white hover:bg-green-700">
        Go to dashboard
      </button>
    </div>
  </body>
</html>
