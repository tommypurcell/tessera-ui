<!doctype html>
<html lang="en" class="font-sans antialiased">

    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>

  <body class="flex justify-center bg-gray-50 p-6">
    <div class="flex w-full max-w-[220px] flex-col items-center gap-4 rounded-lg border border-gray-200 bg-white p-5">
      <h3 class="self-start text-sm font-medium text-gray-900">Fuel level</h3>

      <div class="flex items-end gap-4">

        </div>

        <div class="flex flex-col gap-1">
          <span class="text-2xl font-bold text-gray-900">68%</span>
          <span class="text-xs text-gray-500">312 mi range</span>
        </div>
      </div>
    </div>
