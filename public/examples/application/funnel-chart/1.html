<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="flex w-full max-w-md flex-col gap-4 rounded-lg border border-gray-200 bg-white p-6">
      <h2 class="text-sm font-medium text-gray-900">Signup conversion</h2>

      <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-1">
          <div class="flex items-baseline justify-between text-sm">
            <span class="font-medium text-gray-700">Visited pricing</span>
            <span class="flex items-baseline gap-2">
              <span class="font-medium text-gray-900">12,400</span>
            </span>
          </div>
          <div class="h-6 w-full rounded-sm bg-gray-100">
            <div class="h-6 rounded-sm bg-blue-600" style="width: 100%" role="img" aria-label="Visited pricing: 12,400"></div>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <div class="flex items-baseline justify-between text-sm">
            <span class="font-medium text-gray-700">Started signup</span>
            <span class="flex items-baseline gap-2">
              <span class="font-medium text-gray-900">4,850</span>
              <span class="text-xs text-red-500">-61%</span>
            </span>
          </div>
          <div class="h-6 w-full rounded-sm bg-gray-100">
            <div class="h-6 rounded-sm bg-blue-600" style="width: 39.1%" role="img" aria-label="Started signup: 4,850, 61% drop-off from previous stage"></div>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <div class="flex items-baseline justify-between text-sm">
            <span class="font-medium text-gray-700">Verified email</span>
            <span class="flex items-baseline gap-2">
              <span class="font-medium text-gray-900">3,920</span>
              <span class="text-xs text-red-500">-19%</span>
            </span>
          </div>
          <div class="h-6 w-full rounded-sm bg-gray-100">
            <div class="h-6 rounded-sm bg-blue-600" style="width: 31.6%" role="img" aria-label="Verified email: 3,920, 19% drop-off from previous stage"></div>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <div class="flex items-baseline justify-between text-sm">
            <span class="font-medium text-gray-700">Completed onboarding</span>
            <span class="flex items-baseline gap-2">
              <span class="font-medium text-gray-900">2,610</span>
              <span class="text-xs text-red-500">-33%</span>
            </span>
          </div>
          <div class="h-6 w-full rounded-sm bg-gray-100">
            <div class="h-6 rounded-sm bg-blue-600" style="width: 21%" role="img" aria-label="Completed onboarding: 2,610, 33% drop-off from previous stage"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
