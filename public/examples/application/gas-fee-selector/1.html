<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-5">
      <h3 class="text-sm font-semibold text-gray-900">Network fee</h3>

      <div class="mt-3 grid grid-cols-3 gap-2">
        <label class="flex cursor-pointer flex-col items-center gap-1 rounded-lg border border-gray-200 px-2 py-3 hover:bg-gray-50">
          <input type="radio" name="gas-fee" class="sr-only" />
          <span class="text-xs font-medium text-gray-500">Slow</span>
          <span class="text-sm font-semibold text-gray-900">~5 min</span>
          <span class="text-xs text-gray-400">$0.42</span>
        </label>

        <label class="flex cursor-pointer flex-col items-center gap-1 rounded-lg border-2 border-gray-900 bg-gray-50 px-2 py-3">
          <input type="radio" name="gas-fee" checked class="sr-only" />
          <span class="text-xs font-medium text-gray-900">Average</span>
          <span class="text-sm font-semibold text-gray-900">~1 min</span>
          <span class="text-xs text-gray-500">$1.15</span>
        </label>

        <label class="flex cursor-pointer flex-col items-center gap-1 rounded-lg border border-gray-200 px-2 py-3 hover:bg-gray-50">
          <input type="radio" name="gas-fee" class="sr-only" />
          <span class="text-xs font-medium text-gray-500">Fast</span>
          <span class="text-sm font-semibold text-gray-900">~15 sec</span>
          <span class="text-xs text-gray-400">$2.87</span>
        </label>
      </div>

      <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3 text-sm">
        <span class="text-gray-500">Estimated fee</span>
        <span class="font-medium text-gray-900">$1.15</span>
      </div>
    </div>
  </body>
</html>
