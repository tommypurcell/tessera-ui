<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-xs rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-900">Server load</h3>

      <div class="mt-2" role="img" aria-label="Gauge showing 72 percent, in the warning zone">
        <svg viewBox="0 0 200 100" class="w-full">
          <path d="M 20 100 A 80 80 0 0 1 82 22" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round" />
          <path d="M 86 20 A 80 80 0 0 1 114 20" fill="none" stroke="#eab308" stroke-width="16" stroke-linecap="round" />
          <path d="M 118 22 A 80 80 0 0 1 180 100" fill="none" stroke="#ef4444" stroke-width="16" stroke-linecap="round" />
          <g transform="rotate(129.6 100 100)">
            <line x1="100" y1="100" x2="100" y2="45" stroke="#111827" stroke-width="4" stroke-linecap="round" />
          </g>
          <circle cx="100" cy="100" r="7" fill="#111827" />
        </svg>
      </div>

      <div class="mt-3 text-center">
        <span class="text-2xl font-bold text-gray-900">72%</span>
      </div>

      <div class="mt-1 flex items-center justify-between text-xs text-gray-500">
        <span>0</span>
        <span class="font-medium text-amber-600">Warning zone</span>
        <span>100</span>
      </div>
    </div>
  </body>
</html>
