<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-sm items-center gap-4 rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-sm">
      <div class="relative w-28 shrink-0" role="img" aria-label="Gauge showing 91 out of 100, healthy zone">
        <svg viewBox="0 0 200 110" class="w-full">
          <path d="M 20 100 A 80 80 0 0 1 82 22" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round" />
          <path d="M 86 20 A 80 80 0 0 1 114 20" fill="none" stroke="#eab308" stroke-width="18" stroke-linecap="round" />
          <path d="M 118 22 A 80 80 0 0 1 180 100" fill="none" stroke="#ef4444" stroke-width="18" stroke-linecap="round" />
          <g transform="rotate(23 100 100)">
            <line x1="100" y1="100" x2="100" y2="28" stroke="#f9fafb" stroke-width="4" stroke-linecap="round" />
          </g>
          <circle cx="100" cy="100" r="7" fill="#f9fafb" />
        </svg>
      </div>
      <div class="min-w-0">
        <p class="text-xs font-medium uppercase tracking-wide text-gray-400">Customer satisfaction</p>
        <p class="mt-0.5 text-2xl font-bold text-white">91<span class="text-base font-medium text-gray-500">/100</span></p>
        <p class="mt-0.5 text-xs text-emerald-400">Healthy — above target of 80</p>
      </div>
    </div>
  </body>
</html>
