<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm bg-gray-950 p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-900 p-5">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-medium text-gray-400">Q3 revenue goal</h3>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-green-900/50 px-2 py-0.5 text-xs font-medium text-green-400">
          <span class="size-1.5 rounded-full bg-green-500"></span>
          On pace
        </span>
      </div>

      <div class="mt-2 flex items-baseline gap-1.5">
        <span class="text-2xl font-semibold text-white">$84,200</span>
        <span class="text-sm text-gray-500">of $100,000</span>
      </div>

      <div class="relative mt-4 h-2.5 w-full overflow-hidden rounded-full bg-gray-800">
        <div class="absolute inset-y-0 left-0 rounded-full bg-white" style="width: 84%"></div>
        <div class="absolute inset-y-0 w-px bg-gray-500" style="left: 76%" aria-hidden="true"></div>
      </div>

      <div class="mt-1.5 flex items-center justify-between text-xs text-gray-500">
        <span>84% of goal</span>
        <span>Expected today: 76%</span>
      </div>

      <div class="mt-4 flex items-center gap-2 rounded-lg bg-gray-800 px-3 py-2.5">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 shrink-0 text-gray-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
        </svg>
        <p class="text-xs text-gray-300">Ahead of pace — projected to finish at <span class="font-medium text-white">$109,400</span> by Sep 30.</p>
      </div>
    </div>
  </body>
</html>
