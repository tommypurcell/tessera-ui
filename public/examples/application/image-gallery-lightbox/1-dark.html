<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-950 p-6">
    <div class="grid w-full max-w-lg grid-cols-3 gap-2">
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg ring-2 ring-gray-100 ring-offset-2 ring-offset-gray-950">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-700 to-blue-900"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-violet-700 to-violet-900 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-amber-700 to-amber-900 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-emerald-700 to-emerald-900 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-rose-700 to-rose-900 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-gray-700 to-gray-900 transition-opacity group-hover:opacity-80"></div>
        <div class="absolute inset-0 flex items-center justify-center bg-black/50 text-lg font-semibold text-white">+8</div>
      </button>
    </div>
  </body>
</html>
