<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-50 p-6">
    <div class="grid w-full max-w-lg grid-cols-3 gap-2">
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg ring-2 ring-gray-900 ring-offset-2">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-200 to-blue-400"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-violet-200 to-violet-400 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-amber-200 to-amber-400 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-emerald-200 to-emerald-400 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-rose-200 to-rose-400 transition-opacity group-hover:opacity-80"></div>
      </button>
      <button type="button" class="group relative aspect-square overflow-hidden rounded-lg">
        <div class="absolute inset-0 bg-gradient-to-br from-gray-200 to-gray-400 transition-opacity group-hover:opacity-80"></div>
        <div class="absolute inset-0 flex items-center justify-center bg-black/50 text-lg font-semibold text-white">+8</div>
      </button>
    </div>
  </body>
</html>
