<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-gray-950 p-0">
    <div role="dialog" aria-modal="true" aria-label="Image viewer" class="relative flex h-full min-h-96 w-full flex-col">
      <div class="flex items-center justify-between px-4 py-3">
        <span class="text-sm font-medium text-white/80">3 / 12</span>
        <button type="button" aria-label="Close" class="rounded-full p-1.5 text-white/70 transition-colors hover:bg-white/10 hover:text-white">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="relative flex flex-1 items-center justify-center px-4">
        <button type="button" aria-label="Previous image" class="absolute left-2 flex size-10 items-center justify-center rounded-full bg-white/10 text-white transition-colors hover:bg-white/20">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
        </button>

        <div class="aspect-[4/3] w-full max-w-sm overflow-hidden rounded-lg bg-gradient-to-br from-amber-300 to-amber-500 shadow-2xl"></div>

        <button type="button" aria-label="Next image" class="absolute right-2 flex size-10 items-center justify-center rounded-full bg-white/10 text-white transition-colors hover:bg-white/20">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>

      <div class="px-4 pb-4 pt-2 text-center">
        <p class="text-sm text-white">Sunset over the harbor, Lisbon</p>
        <p class="mt-0.5 text-xs text-white/50">Shot on a 35mm lens, golden hour</p>
      </div>
    </div>
  </body>
</html>
