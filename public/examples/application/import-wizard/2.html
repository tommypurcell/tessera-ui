<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
      <div class="border-b border-gray-200 px-6 py-5">
        <ol class="flex items-center">
          <li class="flex items-center">
            <div class="flex items-center gap-2">
              <span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-gray-900 text-xs font-medium text-white">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
              </span>
              <span class="text-sm font-medium text-gray-900">Upload</span>
            </div>
            <div class="mx-3 h-px w-8 bg-gray-900 sm:w-12"></div>
          </li>

          <li class="flex items-center">
            <div class="flex items-center gap-2">
              <span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-gray-900 text-xs font-medium text-white">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
              </span>
              <span class="text-sm font-medium text-gray-900">Map columns</span>
            </div>
            <div class="mx-3 h-px w-8 bg-gray-900 sm:w-12"></div>
          </li>

          <li class="flex items-center">
            <span aria-current="step" class="flex size-7 shrink-0 items-center justify-center rounded-full border-2 border-gray-900 text-xs font-semibold text-gray-900">3</span>
            <span class="ml-2 text-sm font-medium text-gray-900">Review</span>
          </li>
        </ol>
      </div>

      <div class="px-6 py-6">
        <h2 class="text-base font-semibold text-gray-900">Review and import</h2>
        <p class="mt-1 text-sm text-gray-500">248 rows ready to import from customers.csv.</p>

        <div class="mt-4 overflow-hidden rounded-md border border-gray-200">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-xs font-medium text-gray-500">
              <tr>
                <th scope="col" class="px-3 py-2">Name</th>
                <th scope="col" class="px-3 py-2">Email</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-gray-700">
              <tr>
                <td class="px-3 py-2">Priya Natarajan</td>
                <td class="px-3 py-2">priya@example.com</td>
              </tr>
              <tr>
                <td class="px-3 py-2">Marcus Webb</td>
                <td class="px-3 py-2">marcus@example.com</td>
              </tr>
              <tr>
                <td class="px-3 py-2 text-gray-400">+ 246 more rows</td>
                <td class="px-3 py-2"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="mt-4 flex items-center gap-2 rounded-md bg-amber-50 px-3 py-2 text-sm text-amber-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          3 rows are missing an email and will be skipped.
        </div>
      </div>

      <div class="flex items-center justify-between border-t border-gray-200 px-6 py-4">
        <button type="button" class="rounded-md border border-gray-300 bg-white px-3.5 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">
          Back
        </button>
        <button type="button" class="rounded-md bg-gray-900 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-gray-700">
          Import 245 rows
        </button>
      </div>
    </div>
  </body>
</html>
