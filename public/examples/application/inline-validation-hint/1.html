<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-6 p-6">
    <div class="flex flex-col gap-1.5">
      <label for="username" class="text-sm font-medium text-gray-700">Username</label>
      <input
        id="username"
        type="text"
        aria-describedby="username-hint"
        value="jordan_reyes"
        class="rounded-md border border-green-400 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-green-500 focus:outline-none"
      />
      <p id="username-hint" class="flex items-center gap-1.5 text-xs text-green-600 transition-opacity duration-150">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
        Username is available
      </p>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="password" class="text-sm font-medium text-gray-700">Password</label>
      <input
        id="password"
        type="password"
        aria-invalid="true"
        aria-describedby="password-hint"
        value="short"
        class="rounded-md border border-red-400 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-red-500 focus:outline-none"
      />
      <p id="password-hint" role="alert" class="flex items-center gap-1.5 text-xs text-red-600 transition-opacity duration-150">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        Must be at least 8 characters
      </p>
    </div>
  </body>
</html>
