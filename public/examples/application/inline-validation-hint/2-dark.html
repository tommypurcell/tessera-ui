<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-6 bg-gray-950 p-6">
    <div class="flex flex-col gap-1.5">
      <label for="coupon-dark" class="text-sm font-medium text-gray-300">Coupon code</label>
      <div class="relative">
        <input
          id="coupon-dark"
          type="text"
          aria-describedby="coupon-hint-dark"
          value="SAVE20"
          class="w-full rounded-md border border-green-600 bg-gray-900 py-2 pr-9 pl-3 text-sm text-white shadow-sm focus:border-green-500 focus:outline-none"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="absolute top-1/2 right-3 size-4 -translate-y-1/2 text-green-400 transition-opacity duration-150"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <p id="coupon-hint-dark" class="text-xs text-green-400 transition-opacity duration-150">20% discount applied</p>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="promo-dark" class="text-sm font-medium text-gray-300">Promo code</label>
      <div class="relative">
        <input
          id="promo-dark"
          type="text"
          aria-invalid="true"
          aria-describedby="promo-hint-dark"
          value="EXPIRED10"
          class="w-full rounded-md border border-red-500 bg-gray-900 py-2 pr-9 pl-3 text-sm text-white shadow-sm focus:border-red-500 focus:outline-none"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="absolute top-1/2 right-3 size-4 -translate-y-1/2 text-red-400 transition-opacity duration-150"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <p id="promo-hint-dark" role="alert" class="text-xs text-red-400 transition-opacity duration-150">This code has expired</p>
    </div>
  </body>
</html>
