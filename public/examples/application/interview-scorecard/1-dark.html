<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-md flex-col p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-900">
      <div class="border-b border-gray-800 px-5 py-4">
        <h2 class="text-sm font-semibold text-gray-100">Interview scorecard</h2>
        <p class="mt-0.5 text-xs text-gray-400">Priya Shah &middot; Senior Product Designer</p>
      </div>

      <div class="flex flex-col divide-y divide-gray-800">
        <div class="px-5 py-3.5">
          <div class="flex items-center justify-between">
            <p class="text-sm font-medium text-gray-100">Communication</p>
            <div class="flex items-center gap-1" role="radiogroup" aria-label="Communication rating">
              <button type="button" class="h-6 w-6 rounded-full bg-indigo-500 text-xs font-semibold text-white">1</button>
              <button type="button" class="h-6 w-6 rounded-full bg-indigo-500 text-xs font-semibold text-white">2</button>
              <button type="button" class="h-6 w-6 rounded-full bg-indigo-500 text-xs font-semibold text-white">3</button>
              <button type="button" class="h-6 w-6 rounded-full bg-indigo-500 text-xs font-semibold text-white">4</button>
              <button type="button" class="h-6 w-6 rounded-full border border-gray-700 text-xs font-medium text-gray-500">5</button>
            </div>
          </div>
          <p class="mt-1 text-xs text-gray-400">Clear, structured answers with good follow-up questions.</p>
        </div>

        <div class="px-5 py-3.5">
          <div class="flex items-center justify-between">
            <p class="text-sm font-medium text-gray-100">System design</p>
            <div class="flex items-center gap-1" role="radiogroup" aria-label="System design rating">
              <button type="button" class="h-6 w-6 rounded-full bg-indigo-500 text-xs font-semibold text-white">1</button>
              <button type="button" class="h-6 w-6 rounded-full bg-indigo-500 text-xs font-semibold text-white">2</button>
              <button type="button" class="h-6 w-6 rounded-full border border-gray-700 text-xs font-medium text-gray-500">3</button>
              <button type="button" class="h-6 w-6 rounded-full border border-gray-700 text-xs font-medium text-gray-500">4</button>
              <button type="button" class="h-6 w-6 rounded-full border border-gray-700 text-xs font-medium text-gray-500">5</button>
            </div>
          </div>
          <p class="mt-1 text-xs text-gray-400">Solid fundamentals, needs more depth on tradeoffs.</p>
        </div>

        <div class="px-5 py-3.5">
          <label for="scorecard-notes" class="text-sm font-medium text-gray-100">Additional notes</label>
          <textarea
            id="scorecard-notes"
            rows="2"
            class="mt-2 w-full rounded-md border border-gray-700 bg-gray-950 px-3 py-2 text-sm text-white shadow-sm focus:border-gray-500 focus:outline-none"
          >
Strong communicator, would pair well with the design team.</textarea
          >
        </div>
      </div>

      <div class="border-t border-gray-800 px-5 py-4">
        <p class="mb-2 text-xs font-medium text-gray-300">Overall recommendation</p>
        <div class="flex gap-2">
          <button type="button" class="flex-1 rounded-md bg-emerald-500 px-3 py-1.5 text-xs font-medium text-white shadow-sm">Strong hire</button>
          <button type="button" class="flex-1 rounded-md border border-gray-700 px-3 py-1.5 text-xs font-medium text-gray-200 shadow-sm hover:bg-gray-800">Hire</button>
          <button type="button" class="flex-1 rounded-md border border-gray-700 px-3 py-1.5 text-xs font-medium text-gray-200 shadow-sm hover:bg-gray-800">No hire</button>
        </div>
      </div>
    </div>
  </body>
</html>
