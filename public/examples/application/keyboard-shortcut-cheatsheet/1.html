<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-2xl justify-center p-6">
    <div class="fixed inset-0 flex items-center justify-center bg-gray-900/40 p-6">
      <div role="dialog" aria-modal="true" aria-labelledby="cheatsheet-title" class="w-full max-w-lg rounded-xl border border-gray-200 bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
          <h2 id="cheatsheet-title" class="text-sm font-semibold text-gray-900">Keyboard shortcuts</h2>
          <button type="button" aria-label="Close" class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
            </svg>
          </button>
        </div>

        <div class="grid grid-cols-2 gap-x-6 gap-y-5 px-5 py-5">
          <div>
            <h3 class="mb-2 text-xs font-semibold tracking-wide text-gray-400 uppercase">General</h3>
            <ul class="flex flex-col gap-2">
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Command palette</span>
                <span class="flex items-center gap-0.5">
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">⌘</kbd>
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">K</kbd>
                </span>
              </li>
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Search</span>
                <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">/</kbd>
              </li>
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Close dialog</span>
                <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">Esc</kbd>
              </li>
            </ul>
          </div>

          <div>
            <h3 class="mb-2 text-xs font-semibold tracking-wide text-gray-400 uppercase">Editing</h3>
            <ul class="flex flex-col gap-2">
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Save</span>
                <span class="flex items-center gap-0.5">
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">⌘</kbd>
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">S</kbd>
                </span>
              </li>
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Undo</span>
                <span class="flex items-center gap-0.5">
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">⌘</kbd>
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">Z</kbd>
                </span>
              </li>
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Duplicate</span>
                <span class="flex items-center gap-0.5">
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">⌘</kbd>
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">D</kbd>
                </span>
              </li>
            </ul>
          </div>

          <div>
            <h3 class="mb-2 text-xs font-semibold tracking-wide text-gray-400 uppercase">Navigation</h3>
            <ul class="flex flex-col gap-2">
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Next item</span>
                <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">↓</kbd>
              </li>
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Previous item</span>
                <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">↑</kbd>
              </li>
            </ul>
          </div>

          <div>
            <h3 class="mb-2 text-xs font-semibold tracking-wide text-gray-400 uppercase">View</h3>
            <ul class="flex flex-col gap-2">
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Toggle sidebar</span>
                <span class="flex items-center gap-0.5">
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">⌘</kbd>
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">B</kbd>
                </span>
              </li>
              <li class="flex items-center justify-between">
                <span class="text-sm text-gray-700">Zoom in</span>
                <span class="flex items-center gap-0.5">
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">⌘</kbd>
                  <kbd class="rounded border border-gray-300 bg-gray-50 px-1.5 py-0.5 font-mono text-[11px] text-gray-600 shadow-[0_1px_0_#d1d5db]">+</kbd>
                </span>
              </li>
            </ul>
          </div>
        </div>

        <div class="border-t border-gray-200 px-5 py-3">
          <p class="text-xs text-gray-500">Press <kbd class="rounded border border-gray-300 bg-gray-50 px-1 py-0.5 font-mono text-[10px] text-gray-600">?</kbd> anytime to open this list.</p>
        </div>
      </div>
    </div>
  </body>
</html>
