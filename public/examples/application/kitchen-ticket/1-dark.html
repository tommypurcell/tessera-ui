<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-xs rounded-lg border border-amber-500/40 bg-gray-900 shadow-sm">
      <div class="flex items-center justify-between rounded-t-lg bg-amber-500 px-3 py-2">
        <span class="text-sm font-bold text-amber-950">Table 12</span>
        <span class="inline-flex items-center gap-1 rounded-full bg-gray-950/30 px-2 py-0.5 text-xs font-semibold text-amber-950">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
          </svg>
          07:42
        </span>
      </div>

      <ul class="divide-y divide-dashed divide-gray-700 px-3 py-2">
        <li class="flex items-start justify-between py-1.5">
          <span class="text-sm text-white">2× Margherita pizza</span>
        </li>
        <li class="flex items-start justify-between py-1.5">
          <span class="text-sm text-white">1× Caesar salad <span class="text-xs text-red-400">(no anchovies)</span></span>
        </li>
        <li class="flex items-start justify-between py-1.5">
          <span class="text-sm text-white">3× Sparkling water</span>
        </li>
      </ul>

      <div class="border-t border-dashed border-gray-700 p-2.5">
        <button type="button" class="w-full rounded-md bg-white py-2 text-sm font-semibold text-gray-900 hover:bg-gray-200">
          Bump
        </button>
      </div>
    </div>
  </body>
</html>
