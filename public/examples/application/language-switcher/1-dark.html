<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="w-56 rounded-xl border border-gray-800 bg-gray-950 shadow-lg">
      <ul role="listbox" aria-label="Language">
        <li>
          <button type="button" role="option" aria-selected="true" class="flex w-full items-center gap-2.5 px-3 py-2 text-left hover:bg-gray-800">
            <span aria-hidden="true" class="text-lg leading-none">🇺🇸</span>
            <span class="min-w-0 flex-1 text-sm font-medium text-white">English (US)</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 shrink-0 text-blue-400">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </button>
        </li>
        <li>
          <button type="button" role="option" aria-selected="false" class="flex w-full items-center gap-2.5 px-3 py-2 text-left hover:bg-gray-800">
            <span aria-hidden="true" class="text-lg leading-none">🇫🇷</span>
            <span class="min-w-0 flex-1 text-sm text-gray-200">Français</span>
          </button>
        </li>
        <li>
          <button type="button" role="option" aria-selected="false" class="flex w-full items-center gap-2.5 px-3 py-2 text-left hover:bg-gray-800">
            <span aria-hidden="true" class="text-lg leading-none">🇩🇪</span>
            <span class="min-w-0 flex-1 text-sm text-gray-200">Deutsch</span>
          </button>
        </li>
        <li>
          <button type="button" role="option" aria-selected="false" class="flex w-full items-center gap-2.5 px-3 py-2 text-left hover:bg-gray-800">
            <span aria-hidden="true" class="text-lg leading-none">🇯🇵</span>
            <span class="min-w-0 flex-1 text-sm text-gray-200">日本語</span>
          </button>
        </li>
        <li>
          <button type="button" role="option" aria-selected="false" class="flex w-full items-center gap-2.5 px-3 py-2 text-left hover:bg-gray-800">
            <span aria-hidden="true" class="text-lg leading-none">🇧🇷</span>
            <span class="min-w-0 flex-1 text-sm text-gray-200">Português (BR)</span>
          </button>
        </li>
      </ul>
    </div>
  </body>
</html>
