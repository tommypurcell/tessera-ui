<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-40 items-center justify-center p-6">
    <div class="w-72">
      <div class="flex items-baseline justify-between">
        <p class="text-sm font-medium text-gray-700">Lead score</p>
        <p class="text-sm font-semibold text-gray-900">22 <span class="font-normal text-gray-500">/ 100</span></p>
      </div>

      <div class="relative mt-2">
        <div class="flex h-2.5 overflow-hidden rounded-full">
          <span aria-hidden="true" class="h-full flex-[33] bg-gray-300"></span>
          <span aria-hidden="true" class="h-full flex-[33] bg-amber-400"></span>
          <span aria-hidden="true" class="h-full flex-[34] bg-emerald-500"></span>
        </div>
        <div aria-hidden="true" class="absolute -top-1 size-4.5 rounded-full border-2 border-white bg-gray-900 shadow" style="left: calc(22% - 9px)"></div>
      </div>

      <div class="mt-1.5 flex justify-between text-xs text-gray-500">
        <span>Cold</span>
        <span>Warm</span>
        <span>Hot</span>
      </div>

      <p class="mt-3 inline-flex items-center gap-1.5 rounded-full bg-gray-100 px-2.5 py-1 text-xs font-medium text-gray-600">
        <span aria-hidden="true" class="size-1.5 rounded-full bg-gray-400"></span>
        Cold lead — low fit and intent
      </p>
    </div>
  </body>
</html>
