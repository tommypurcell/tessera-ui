<!doctype html>
<html lang="en" class="dark font-sans antialiased">

  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">

            <label class="flex flex-col items-center gap-1.5">
              <input type="radio" name="likert-onboarding-dark" class="size-4 border-gray-600 bg-gray-800 text-white focus:ring-white" />
              <span class="text-[10px] text-gray-500">1</span>

            <label class="flex flex-col items-center gap-1.5">

            </label>
            <label class="flex flex-col items-center gap-1.5">
              <input type="radio" name="likert-onboarding-dark" checked class="size-4 border-gray-600 bg-gray-800 text-white focus:ring-white" />

            </label>
            <label class="flex flex-col items-center gap-1.5">

              <input type="radio" name="likert-onboarding-dark" class="size-4 border-gray-600 bg-gray-800 text-white focus:ring-white" />
              <span class="text-[10px] text-gray-500">5</span>
            </label>
          </div>
          <span class="w-20 shrink-0 text-right text-xs text-gray-400">Agree</span>
        </div>
      </fieldset>
    </div>

</html>
