<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-4 p-6">
    <div class="flex items-center gap-3 rounded-lg border border-gray-800 bg-gray-900 px-4 py-3">
      <div class="flex -space-x-2">
        <span class="relative inline-block">
          <img
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=64&h=64&fit=crop&crop=faces"
            alt="Ava Wilson"
            class="size-8 rounded-full object-cover ring-2 ring-gray-900"
          />
          <span class="absolute right-0 bottom-0 size-2.5 rounded-full bg-green-500 ring-2 ring-gray-900"></span>
        </span>

        <span class="relative inline-block">
          <img
            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=64&h=64&fit=crop&crop=faces"
            alt="Jordan Lee"
            class="size-8 rounded-full object-cover ring-2 ring-gray-900"
          />
          <span class="absolute right-0 bottom-0 size-2.5 rounded-full bg-green-500 ring-2 ring-gray-900"></span>
        </span>

        <span class="relative inline-block">
          <img
            src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=64&h=64&fit=crop&crop=faces"
            alt="Sam Okafor"
            class="size-8 rounded-full object-cover ring-2 ring-gray-900"
          />
          <span class="absolute right-0 bottom-0 flex size-2.5">
            <span class="absolute inline-flex size-full animate-ping rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex size-2.5 rounded-full bg-green-500 ring-2 ring-gray-900"></span>
          </span>
        </span>

        <span class="flex size-8 items-center justify-center rounded-full bg-gray-800 text-[11px] font-semibold text-gray-300 ring-2 ring-gray-900">
          +4
        </span>
      </div>

      <p class="text-sm whitespace-nowrap text-gray-300">
        <span class="font-medium text-white">7 people</span> viewing this document
      </p>
    </div>
  </body>
</html>
