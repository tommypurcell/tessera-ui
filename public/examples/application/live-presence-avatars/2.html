<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs flex-col gap-4 p-6">
    <div class="inline-flex w-fit items-center gap-1.5 rounded-full border border-gray-200 bg-white py-1 pr-3 pl-1 shadow-sm">
      <div class="flex -space-x-1.5">
        <img
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=48&h=48&fit=crop&crop=faces"
          alt="Ava Wilson"
          class="size-6 rounded-full object-cover ring-2 ring-white"
        />
        <img
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=48&h=48&fit=crop&crop=faces"
          alt="Jordan Lee"
          class="size-6 rounded-full object-cover ring-2 ring-white"
        />
        <span class="relative inline-block">
          <img
            src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=48&h=48&fit=crop&crop=faces"
            alt="Sam Okafor"
            class="size-6 rounded-full object-cover ring-2 ring-white"
          />
          <span class="absolute -right-0.5 -bottom-0.5 flex size-2">
            <span class="absolute inline-flex size-full animate-ping rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex size-2 rounded-full bg-green-500 ring-1 ring-white"></span>
          </span>
        </span>
      </div>

      <span class="text-xs font-medium text-gray-600">3 online</span>
    </div>
  </body>
</html>
