<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-900 p-5">
      <p class="text-sm font-semibold text-gray-100">Skip logic</p>

      <ul class="mt-3 space-y-2">
        <li class="flex flex-wrap items-center gap-2 rounded-lg border border-gray-800 bg-gray-800/40 px-3 py-2.5">
          <span class="shrink-0 text-xs font-semibold uppercase tracking-wide text-gray-500">If</span>
          <select aria-label="Condition question" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option>Q2: Have you used our product before?</option>
          </select>
          <select aria-label="Condition operator" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option selected>is</option>
            <option>is not</option>
          </select>
          <select aria-label="Condition value" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option selected>"No"</option>
            <option>"Yes"</option>
          </select>
          <span class="shrink-0 text-xs font-semibold uppercase tracking-wide text-gray-500">then jump to</span>
          <select aria-label="Jump target question" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option>Q5: What made you choose us?</option>
          </select>
          <button type="button" aria-label="Delete this rule" class="ml-auto flex size-7 shrink-0 items-center justify-center rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-300">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </li>

        <li class="flex flex-wrap items-center gap-2 rounded-lg border border-gray-800 bg-gray-800/40 px-3 py-2.5">
          <span class="shrink-0 text-xs font-semibold uppercase tracking-wide text-gray-500">If</span>
          <select aria-label="Condition question" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option>Q2: Have you used our product before?</option>
          </select>
          <select aria-label="Condition operator" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option>is</option>
            <option selected>is not</option>
          </select>
          <select aria-label="Condition value" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option>"No"</option>
            <option selected>"Yes"</option>
          </select>
          <span class="shrink-0 text-xs font-semibold uppercase tracking-wide text-gray-500">then jump to</span>
          <select aria-label="Jump target question" class="rounded-md border border-gray-700 bg-gray-800 py-1.5 pl-2.5 pr-7 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option>Q7: How can we improve?</option>
          </select>
          <button type="button" aria-label="Delete this rule" class="ml-auto flex size-7 shrink-0 items-center justify-center rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-300">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </li>
      </ul>

      <button type="button" class="mt-3 flex items-center gap-1.5 text-xs font-medium text-indigo-400 hover:text-indigo-300">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Add rule
      </button>
    </div>
