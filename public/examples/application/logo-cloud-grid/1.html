<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <p class="text-center text-sm font-medium text-gray-500">Trusted by teams at</p>

    <div class="mt-6 grid grid-cols-3 divide-x divide-y divide-gray-100 overflow-hidden rounded-xl border border-gray-100 sm:grid-cols-4">
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Northwind" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" class="h-6 w-auto fill-gray-400">
          <rect width="24" height="24" y="4" rx="4" />
          <text x="32" y="21" font-family="sans-serif" font-size="14" font-weight="600">Northwind</text>
        </svg>
      </div>
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Prism Collective" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 32" class="h-6 w-auto fill-gray-400">
          <circle cx="12" cy="16" r="10" />
          <text x="30" y="21" font-family="sans-serif" font-size="14" font-weight="600">Prism</text>
        </svg>
      </div>
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Harbor United" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 32" class="h-6 w-auto fill-gray-400">
          <polygon points="12,4 22,26 2,26" />
          <text x="30" y="21" font-family="sans-serif" font-size="14" font-weight="600">Harbor</text>
        </svg>
      </div>
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Aria Labs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 32" class="h-6 w-auto fill-gray-400">
          <rect width="20" height="20" x="2" y="6" rx="10" />
          <text x="28" y="21" font-family="sans-serif" font-size="14" font-weight="600">Aria</text>
        </svg>
      </div>
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Fragment" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" class="h-6 w-auto fill-gray-400">
          <rect width="24" height="8" y="4" rx="2" />
          <rect width="24" height="8" y="16" rx="2" />
          <text x="32" y="21" font-family="sans-serif" font-size="14" font-weight="600">Fragment</text>
        </svg>
      </div>
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Vertex" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 32" class="h-6 w-auto fill-gray-400">
          <polygon points="12,4 24,26 0,26" />
          <text x="30" y="21" font-family="sans-serif" font-size="14" font-weight="600">Vertex</text>
        </svg>
      </div>
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Meridian" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" class="h-6 w-auto fill-gray-400">
          <circle cx="12" cy="16" r="10" />
          <circle cx="12" cy="16" r="4" fill="white" />
          <text x="30" y="21" font-family="sans-serif" font-size="14" font-weight="600">Meridian</text>
        </svg>
      </div>
      <div class="flex items-center justify-center p-6">
        <svg aria-label="Solstice" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 32" class="h-6 w-auto fill-gray-400">
          <rect width="20" height="20" x="2" y="6" rx="4" />
          <text x="28" y="21" font-family="sans-serif" font-size="14" font-weight="600">Solstice</text>
        </svg>
      </div>
    </div>
  </body>
</html>
