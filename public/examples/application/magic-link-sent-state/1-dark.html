<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm items-center justify-center p-6">
    <div class="w-full rounded-xl border border-gray-800 bg-gray-900 p-6 text-center">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-indigo-500/10 text-indigo-400">
        <svg class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M3 4a2 2 0 00-2 2v1.161l8.441 4.221a1.25 1.25 0 001.118 0L19 7.162V6a2 2 0 00-2-2H3z" />
          <path d="M19 8.839l-7.77 3.885a2.75 2.75 0 01-2.46 0L1 8.839V14a2 2 0 002 2h14a2 2 0 002-2V8.839z" />
        </svg>
      </div>

      <h2 class="mt-4 text-base font-semibold text-gray-100">Check your email</h2>
      <p class="mt-1.5 text-sm text-gray-400">
        We sent a sign-in link to
        <br />
        <span class="font-medium text-gray-100">jordan@acme.com</span>
      </p>

      <button
        type="button"
        disabled
        class="mt-6 w-full cursor-not-allowed rounded-md border border-gray-800 bg-gray-950 px-4 py-2 text-sm font-medium text-gray-500"
      >
        Resend link in 0:45
      </button>

      <p class="mt-4 text-xs text-gray-400">
        Wrong email?
        <a href="#" class="font-medium text-indigo-400 hover:text-indigo-300">Change it</a>
      </p>
    </div>
  </body>
</html>
