<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-stretch justify-center bg-gray-950 p-6">
    <div class="flex h-96 w-full max-w-2xl overflow-hidden rounded-lg border border-gray-700 bg-gray-900 shadow-sm">
      <div class="w-64 shrink-0 overflow-y-auto border-r border-gray-700">
        <div class="flex gap-3 border-b border-gray-800 p-3">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-blue-700 to-blue-900 text-xs font-bold text-white">1</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-white">Sunset Loft</p>
            <p class="text-xs text-gray-400">2 bed &middot; 1 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-white">$2,400/mo</p>
          </div>
        </div>

        <div class="flex gap-3 border-b border-gray-800 bg-white/5 p-3 ring-1 ring-inset ring-gray-100">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-violet-700 to-violet-900 text-xs font-bold text-white">2</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-white">Harbor View</p>
            <p class="text-xs text-gray-400">1 bed &middot; 1 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-white">$1,950/mo</p>
          </div>
        </div>

        <div class="flex gap-3 border-b border-gray-800 p-3">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-amber-700 to-amber-900 text-xs font-bold text-white">3</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-white">Garden Studio</p>
            <p class="text-xs text-gray-400">Studio &middot; 1 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-white">$1,600/mo</p>
          </div>
        </div>

        <div class="flex gap-3 p-3">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-emerald-700 to-emerald-900 text-xs font-bold text-white">4</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-white">Riverside Flat</p>
            <p class="text-xs text-gray-400">3 bed &middot; 2 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-white">$3,100/mo</p>
          </div>
        </div>
      </div>

      <div class="relative flex-1 bg-gray-800">
        <div class="absolute inset-0" style="background-image: linear-gradient(#374151 1px, transparent 1px), linear-gradient(90deg, #374151 1px, transparent 1px); background-size: 24px 24px"></div>

        <span class="absolute left-[22%] top-[30%] flex size-6 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gray-900 shadow">1</span>
        <span class="absolute left-[52%] top-[42%] flex size-8 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white text-xs font-bold text-gray-900 shadow-lg ring-4 ring-white/20">2</span>
        <span class="absolute left-[68%] top-[65%] flex size-6 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gray-900 shadow">3</span>
        <span class="absolute left-[35%] top-[72%] flex size-6 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gray-900 shadow">4</span>
      </div>
    </div>
  </body>
</html>
