<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-stretch justify-center bg-gray-50 p-6">
    <div class="flex h-96 w-full max-w-2xl overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
      <div class="w-64 shrink-0 overflow-y-auto border-r border-gray-200">
        <div class="flex gap-3 border-b border-gray-100 p-3">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-blue-200 to-blue-400 text-xs font-bold text-white">1</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-900">Sunset Loft</p>
            <p class="text-xs text-gray-500">2 bed &middot; 1 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-gray-900">$2,400/mo</p>
          </div>
        </div>

        <div class="flex gap-3 border-b border-gray-100 bg-gray-50 p-3 ring-1 ring-inset ring-gray-900">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-violet-200 to-violet-400 text-xs font-bold text-white">2</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-900">Harbor View</p>
            <p class="text-xs text-gray-500">1 bed &middot; 1 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-gray-900">$1,950/mo</p>
          </div>
        </div>

        <div class="flex gap-3 border-b border-gray-100 p-3">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-amber-200 to-amber-400 text-xs font-bold text-white">3</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-900">Garden Studio</p>
            <p class="text-xs text-gray-500">Studio &middot; 1 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-gray-900">$1,600/mo</p>
          </div>
        </div>

        <div class="flex gap-3 p-3">
          <span class="flex size-14 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-emerald-200 to-emerald-400 text-xs font-bold text-white">4</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-900">Riverside Flat</p>
            <p class="text-xs text-gray-500">3 bed &middot; 2 bath</p>
            <p class="mt-0.5 text-xs font-semibold text-gray-900">$3,100/mo</p>
          </div>
        </div>
      </div>

      <div class="relative flex-1 bg-gray-100">
        <div class="absolute inset-0" style="background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px); background-size: 24px 24px"></div>

        <span class="absolute left-[22%] top-[30%] flex size-6 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-gray-900 text-[11px] font-bold text-white shadow">1</span>
        <span class="absolute left-[52%] top-[42%] flex size-8 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-gray-900 text-xs font-bold text-white shadow-lg ring-4 ring-gray-900/20">2</span>
        <span class="absolute left-[68%] top-[65%] flex size-6 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-gray-900 text-[11px] font-bold text-white shadow">3</span>
        <span class="absolute left-[35%] top-[72%] flex size-6 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-gray-900 text-[11px] font-bold text-white shadow">4</span>
      </div>
    </div>
  </body>
</html>
