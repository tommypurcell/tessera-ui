<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-2xl overflow-hidden rounded-lg border border-gray-700 bg-gray-900 shadow-sm">
      <div class="flex items-center gap-1 border-b border-gray-700 px-2 py-1.5">
        <button type="button" class="rounded p-1.5 text-gray-400 hover:bg-white/5 hover:text-white" aria-label="Bold">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3.75h6a3.375 3.375 0 0 1 0 6.75h-6v-6.75Zm0 6.75h6.75a3.375 3.375 0 0 1 0 6.75h-6.75V10.5Z" />
          </svg>
        </button>
        <button type="button" class="rounded p-1.5 text-gray-400 hover:bg-white/5 hover:text-white" aria-label="Italic">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.75h6.5m-9.5 16.5h6.5M13 3.75l-3 16.5" />
          </svg>
        </button>
        <button type="button" class="rounded p-1.5 text-gray-400 hover:bg-white/5 hover:text-white" aria-label="Link">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
          </svg>
        </button>
        <button type="button" class="rounded p-1.5 text-gray-400 hover:bg-white/5 hover:text-white" aria-label="Bulleted list">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </button>
        <button type="button" class="rounded p-1.5 text-gray-400 hover:bg-white/5 hover:text-white" aria-label="Code">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.25 9-5.25 5.25M9 9l5.25 5.25M17.25 6.75 21 12l-3.75 5.25m-10.5 0L3 12l3.75-5.25" />
          </svg>
        </button>

        <div class="ml-auto flex items-center gap-1 rounded-md bg-gray-800 p-0.5 text-xs font-medium">
          <button type="button" aria-pressed="true" class="rounded px-2 py-1 bg-gray-950 text-white shadow-sm">Split</button>
          <button type="button" aria-pressed="false" class="rounded px-2 py-1 text-gray-400 hover:text-gray-200">Preview</button>
        </div>
      </div>

      <div class="grid grid-cols-2 divide-x divide-gray-700">
        <textarea
          class="h-64 w-full resize-none border-0 bg-transparent p-3 font-mono text-sm text-gray-200 focus:outline-none focus:ring-0"
          spellcheck="false"
        >## Release notes

**v2.4.0** ships three changes:

- Faster cold start
- Fixed dark mode flicker
- New `/export` command

See the [migration guide](#) for details.</textarea>

        <div class="h-64 overflow-y-auto p-3 text-sm text-gray-200">
          <h2 class="text-base font-semibold text-white">Release notes</h2>
          <p class="mt-2"><strong class="font-semibold text-white">v2.4.0</strong> ships three changes:</p>
          <ul class="mt-2 list-disc space-y-1 pl-5">
            <li>Faster cold start</li>
            <li>Fixed dark mode flicker</li>
            <li>New <code class="rounded bg-gray-800 px-1 py-0.5 font-mono text-xs text-gray-200">/export</code> command</li>
          </ul>
          <p class="mt-2">See the <a href="#" class="text-white underline decoration-gray-600 underline-offset-2 hover:decoration-gray-400">migration guide</a> for details.</p>
        </div>
      </div>
    </div>
  </body>
</html>
