<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col p-6">
    <div class="overflow-hidden rounded-lg border border-gray-800 bg-gray-900">
      <ul class="divide-y divide-gray-800">
        <li class="flex items-center gap-3 border-l-4 border-emerald-500 py-3 pl-3 pr-4">
          <span class="w-10 shrink-0 text-sm font-semibold text-emerald-400">Win</span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-100">Ranked &middot; Duo</p>
            <p class="mt-0.5 text-xs text-gray-400">14 min &middot; 2 hours ago</p>
          </div>
          <span class="shrink-0 font-mono text-sm font-semibold text-gray-100">18 – 12</span>
        </li>

        <li class="flex items-center gap-3 border-l-4 border-red-500 py-3 pl-3 pr-4">
          <span class="w-10 shrink-0 text-sm font-semibold text-red-400">Loss</span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-100">Ranked &middot; Solo</p>
            <p class="mt-0.5 text-xs text-gray-400">21 min &middot; 5 hours ago</p>
          </div>
          <span class="shrink-0 font-mono text-sm font-semibold text-gray-100">9 – 16</span>
        </li>

        <li class="flex items-center gap-3 border-l-4 border-gray-600 py-3 pl-3 pr-4">
          <span class="w-10 shrink-0 text-sm font-semibold text-gray-400">Draw</span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-100">Casual &middot; Squad</p>
            <p class="mt-0.5 text-xs text-gray-400">18 min &middot; Yesterday</p>
          </div>
          <span class="shrink-0 font-mono text-sm font-semibold text-gray-100">14 – 14</span>
        </li>

        <li class="flex items-center gap-3 border-l-4 border-emerald-500 py-3 pl-3 pr-4">
          <span class="w-10 shrink-0 text-sm font-semibold text-emerald-400">Win</span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-100">Ranked &middot; Duo</p>
            <p class="mt-0.5 text-xs text-gray-400">17 min &middot; Yesterday</p>
          </div>
          <span class="shrink-0 font-mono text-sm font-semibold text-gray-100">21 – 8</span>
        </li>
      </ul>
    </div>
  </body>
</html>
