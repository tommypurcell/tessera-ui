<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-5">
      <p class="text-sm font-semibold text-gray-900">Rate your agreement with each statement</p>

      <table class="mt-4 w-full border-collapse text-sm">
        <thead>
          <tr>
            <th scope="col" class="w-2/5 pb-2 text-left text-xs font-medium text-gray-400"></th>
            <th scope="col" class="pb-2 text-center text-xs font-medium text-gray-400">Strongly disagree</th>
            <th scope="col" class="pb-2 text-center text-xs font-medium text-gray-400">Disagree</th>
            <th scope="col" class="pb-2 text-center text-xs font-medium text-gray-400">Neutral</th>
            <th scope="col" class="pb-2 text-center text-xs font-medium text-gray-400">Agree</th>
            <th scope="col" class="pb-2 text-center text-xs font-medium text-gray-400">Strongly agree</th>
          </tr>
        </thead>
        <tbody role="radiogroup" aria-label="Matrix survey responses">
          <tr class="border-t border-gray-100">
            <th scope="row" class="py-3 pr-3 text-left text-sm font-normal text-gray-700">
              The onboarding process was easy to follow
            </th>
            <td class="py-3 text-center">
              <input type="radio" name="q1" aria-label="The onboarding process was easy to follow: Strongly disagree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q1" aria-label="The onboarding process was easy to follow: Disagree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q1" aria-label="The onboarding process was easy to follow: Neutral" checked class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q1" aria-label="The onboarding process was easy to follow: Agree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q1" aria-label="The onboarding process was easy to follow: Strongly agree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
          </tr>
          <tr class="border-t border-gray-100">
            <th scope="row" class="py-3 pr-3 text-left text-sm font-normal text-gray-700">
              Support responded quickly to my questions
            </th>
            <td class="py-3 text-center">
              <input type="radio" name="q2" aria-label="Support responded quickly to my questions: Strongly disagree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q2" aria-label="Support responded quickly to my questions: Disagree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q2" aria-label="Support responded quickly to my questions: Neutral" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q2" aria-label="Support responded quickly to my questions: Agree" checked class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q2" aria-label="Support responded quickly to my questions: Strongly agree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
          </tr>
          <tr class="border-t border-gray-100">
            <th scope="row" class="py-3 pr-3 text-left text-sm font-normal text-gray-700">
              The pricing is clear and fair
            </th>
            <td class="py-3 text-center">
              <input type="radio" name="q3" aria-label="The pricing is clear and fair: Strongly disagree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q3" aria-label="The pricing is clear and fair: Disagree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q3" aria-label="The pricing is clear and fair: Neutral" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q3" aria-label="The pricing is clear and fair: Agree" class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
            <td class="py-3 text-center">
              <input type="radio" name="q3" aria-label="The pricing is clear and fair: Strongly agree" checked class="size-4 border-gray-300 text-gray-900 focus:ring-gray-900" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
