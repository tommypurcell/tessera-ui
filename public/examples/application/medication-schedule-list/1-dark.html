<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <ul class="divide-y divide-gray-800 rounded-xl border border-gray-800 bg-gray-950 shadow-sm">
      <li class="flex items-center gap-3 p-4">
        <div class="w-16 shrink-0 whitespace-nowrap text-sm font-semibold text-white">8:00 AM</div>

        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-white">Lisinopril</p>
          <p class="text-xs text-gray-500">10mg &middot; 1 tablet</p>
        </div>

        <span class="shrink-0 inline-flex items-center gap-1 rounded-full bg-emerald-950 px-2 py-0.5 text-xs font-medium text-emerald-400">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
          Taken
        </span>
      </li>

      <li class="flex items-center gap-3 p-4">
        <div class="w-16 shrink-0 whitespace-nowrap text-sm font-semibold text-white">12:00 PM</div>

        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-white">Metformin</p>
          <p class="text-xs text-gray-500">500mg &middot; 2 tablets</p>
        </div>

        <div class="flex shrink-0 items-center gap-2">
          <button type="button" class="rounded-md border border-gray-700 bg-gray-900 px-2.5 py-1 text-xs font-medium text-gray-200 shadow-sm hover:bg-gray-800">
            Skip
          </button>
          <button type="button" class="rounded-md bg-blue-600 px-2.5 py-1 text-xs font-semibold text-white shadow-sm hover:bg-blue-500">
            Take
          </button>
        </div>
      </li>

      <li class="flex items-center gap-3 p-4">
        <div class="w-16 shrink-0 whitespace-nowrap text-sm font-semibold text-white">6:00 PM</div>

        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-white">Metformin</p>
          <p class="text-xs text-gray-500">500mg &middot; 2 tablets</p>
        </div>

        <div class="flex shrink-0 items-center gap-2">
          <button type="button" class="rounded-md border border-gray-700 bg-gray-900 px-2.5 py-1 text-xs font-medium text-gray-200 shadow-sm hover:bg-gray-800">
            Skip
          </button>
          <button type="button" class="rounded-md bg-blue-600 px-2.5 py-1 text-xs font-semibold text-white shadow-sm hover:bg-blue-500">
            Take
          </button>
        </div>
      </li>

      <li class="flex items-center gap-3 p-4">
        <div class="w-16 shrink-0 whitespace-nowrap text-sm font-semibold text-gray-600">9:00 PM</div>

        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-gray-600">Atorvastatin</p>
          <p class="text-xs text-gray-600">20mg &middot; 1 tablet</p>
        </div>

        <span class="shrink-0 rounded-full bg-gray-800 px-2 py-0.5 text-xs font-medium text-gray-400">
          Skipped
        </span>
      </li>
    </ul>
  </body>
</html>
