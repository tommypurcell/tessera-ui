<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="flex items-start justify-between gap-4 border-b border-gray-200 py-4">
      <div class="flex-1">
        <div class="flex items-center gap-2">
          <h3 class="text-sm font-semibold text-gray-900">Roasted Beet Salad</h3>
          <span class="rounded bg-green-50 px-1.5 py-0.5 text-[10px] font-semibold text-green-700">VEGAN</span>
          <span class="rounded bg-orange-50 px-1.5 py-0.5 text-[10px] font-semibold text-orange-700">GF</span>
        </div>
        <p class="mt-1 text-sm text-gray-600">
          Roasted beets, whipped goat cheese, candied walnuts, arugula, citrus vinaigrette.
        </p>
        <p class="mt-2 text-sm font-medium text-gray-900">$14</p>
      </div>

      <button
        type="button"
        aria-label="Add Roasted Beet Salad to order"
        class="flex size-9 shrink-0 items-center justify-center rounded-full border border-gray-300 text-gray-600 hover:border-gray-900 hover:text-gray-900"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>
  </body>
</html>
