<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <ul class="flex flex-col divide-y divide-gray-800">
      <li class="flex items-center justify-between gap-4 py-3">
        <div>
          <p class="text-sm font-medium text-white">Margherita Pizza</p>
          <p class="text-xs text-gray-500">Tomato, mozzarella, basil</p>
        </div>
        <div class="flex shrink-0 items-center gap-3">
          <span class="text-sm font-medium text-white">$16</span>
          <button
            type="button"
            aria-label="Add Margherita Pizza to order"
            class="flex size-7 items-center justify-center rounded-full bg-gray-100 text-gray-900 hover:bg-white"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>
        </div>
      </li>

      <li class="flex items-center justify-between gap-4 py-3">
        <div>
          <p class="text-sm font-medium text-white">Caesar Salad</p>
          <p class="text-xs text-gray-500">Romaine, parmesan, croutons</p>
        </div>
        <div class="flex shrink-0 items-center gap-3">
          <span class="text-sm font-medium text-white">$12</span>
          <button
            type="button"
            aria-label="Add Caesar Salad to order"
            class="flex size-7 items-center justify-center rounded-full bg-gray-100 text-gray-900 hover:bg-white"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>
        </div>
      </li>

      <li class="flex items-center justify-between gap-4 py-3">
        <div>
          <p class="text-sm font-medium text-white">Tiramisu</p>
          <p class="text-xs text-gray-500">Espresso, mascarpone, cocoa</p>
        </div>
        <div class="flex shrink-0 items-center gap-3">
          <span class="text-sm font-medium text-white">$9</span>
          <button
            type="button"
            aria-label="Add Tiramisu to order"
            class="flex size-7 items-center justify-center rounded-full bg-gray-100 text-gray-900 hover:bg-white"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>
        </div>
      </li>
    </ul>
  </body>
</html>
