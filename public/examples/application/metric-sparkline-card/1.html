<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <article class="w-72 rounded-lg border border-gray-100 bg-white p-6">

        </div>
        <div class="inline-flex items-center gap-1 self-start rounded-sm bg-green-100 p-1 text-green-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
          </svg>
          <span class="text-xs font-medium">12.4%</span>

        aria-label="Trend over the last 10 weeks, rising from 12 to 38"
        viewBox="0 0 200 48"
        class="mt-4 h-12 w-full"
        preserveAspectRatio="none"

        <polygon
          points="0,48 0.0,48.0 22.2,36.9 44.4,44.3 66.7,29.5 88.9,35.1 111.1,18.5 133.3,25.8 155.6,11.1 177.8,16.6 200.0,0.0 200,48"
          class="fill-green-500/10"

          points="0.0,48.0 22.2,36.9 44.4,44.3 66.7,29.5 88.9,35.1 111.1,18.5 133.3,25.8 155.6,11.1 177.8,16.6 200.0,0.0"
          fill="none"
          class="stroke-green-500"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <p class="mt-2 text-xs text-gray-400">Last 10 weeks</p>
    </article>
  </body>
</html>
