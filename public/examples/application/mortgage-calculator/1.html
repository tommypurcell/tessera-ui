<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-lg border border-gray-200 p-5">
      <h3 class="text-sm font-semibold text-gray-900">Mortgage calculator</h3>

      <div class="mt-4 grid grid-cols-2 gap-4">
        <label class="flex flex-col gap-1">
          <span class="text-xs font-medium text-gray-600">Home price</span>
          <div class="flex items-center rounded-md border border-gray-300 px-2.5 py-1.5 focus-within:border-indigo-600 focus-within:ring-1 focus-within:ring-indigo-600">
            <span class="text-sm text-gray-400">$</span>
            <input type="text" value="450,000" class="w-full border-0 p-0 pl-1 text-sm text-gray-900 focus:ring-0 focus:outline-none" />
          </div>
        </label>

        <label class="flex flex-col gap-1">
          <span class="text-xs font-medium text-gray-600">Down payment</span>
          <div class="flex items-center rounded-md border border-gray-300 px-2.5 py-1.5 focus-within:border-indigo-600 focus-within:ring-1 focus-within:ring-indigo-600">
            <span class="text-sm text-gray-400">$</span>
            <input type="text" value="90,000" class="w-full border-0 p-0 pl-1 text-sm text-gray-900 focus:ring-0 focus:outline-none" />
          </div>
        </label>

        <label class="flex flex-col gap-1">
          <span class="text-xs font-medium text-gray-600">Interest rate</span>
          <div class="flex items-center rounded-md border border-gray-300 px-2.5 py-1.5 focus-within:border-indigo-600 focus-within:ring-1 focus-within:ring-indigo-600">
            <input type="text" value="6.5" class="w-full border-0 p-0 text-sm text-gray-900 focus:ring-0 focus:outline-none" />
            <span class="text-sm text-gray-400">%</span>
          </div>
        </label>

        <label class="flex flex-col gap-1">
          <span class="text-xs font-medium text-gray-600">Loan term</span>
          <div class="flex items-center rounded-md border border-gray-300 px-2.5 py-1.5 focus-within:border-indigo-600 focus-within:ring-1 focus-within:ring-indigo-600">
            <input type="text" value="30" class="w-full border-0 p-0 text-sm text-gray-900 focus:ring-0 focus:outline-none" />
            <span class="text-sm text-gray-400">yrs</span>
          </div>
        </label>
      </div>

      <div class="mt-5 rounded-lg bg-indigo-50 px-4 py-3 text-center">
        <p class="text-xs font-medium text-indigo-700">Estimated monthly payment</p>
        <p class="mt-0.5 text-2xl font-bold text-indigo-900">$2,275</p>
      </div>
    </div>
  </body>
</html>
