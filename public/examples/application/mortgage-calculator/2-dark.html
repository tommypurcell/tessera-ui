<!doctype html>
<html lang="en" class="dark font-sans antialiased">

    <link href="/component.css" rel="stylesheet" />

  <body class="mx-auto max-w-sm p-6">

            Home insurance
          </span>
          <span class="font-medium text-white">$84</span>
        </div>
      </div>

      <div class="mt-4 flex h-2 overflow-hidden rounded-full bg-gray-800">
        <div class="h-full bg-indigo-500" style="width: 88%"></div>
        <div class="h-full bg-sky-400" style="width: 9%"></div>
