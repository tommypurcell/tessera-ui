<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <ul class="flex w-full max-w-sm flex-col gap-1.5">
      <li class="flex items-center gap-2.5 rounded-md border border-gray-200 bg-white px-3 py-2">
        <span class="flex size-8 shrink-0 items-center justify-center rounded bg-gray-100 text-[10px] font-semibold text-gray-500">PDF</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm text-gray-900">Q3-financial-report.pdf</p>
          <p class="text-xs text-gray-500">2.4 MB</p>
        </div>
        <button type="button" aria-label="Remove Q3-financial-report.pdf" class="shrink-0 rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </li>

      <li class="flex items-center gap-2.5 rounded-md border border-gray-200 bg-white px-3 py-2">
        <span class="flex size-8 shrink-0 items-center justify-center rounded bg-gray-100 text-[10px] font-semibold text-gray-500">PNG</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm text-gray-900">homepage-mockup.png</p>
          <p class="text-xs text-gray-500">840.0 KB</p>
        </div>
        <button type="button" aria-label="Remove homepage-mockup.png" class="shrink-0 rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </li>

      <li class="flex items-center gap-2.5 rounded-md border border-gray-200 bg-white px-3 py-2">
        <span class="flex size-8 shrink-0 items-center justify-center rounded bg-gray-100 text-[10px] font-semibold text-gray-500">CSV</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm text-gray-900">user-export.csv</p>
          <p class="text-xs text-gray-500">128.0 B</p>
        </div>
        <button type="button" aria-label="Remove user-export.csv" class="shrink-0 rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </li>
    </ul>
  </body>
</html>
