<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-xs flex-col gap-1.5">
      <label for="multiSelectDemoDark" class="text-sm font-medium text-gray-300">Assignees</label>

      <div class="relative">
        <div class="flex flex-wrap items-center gap-1.5 rounded-md border border-gray-700 bg-gray-900 p-1.5 focus-within:border-gray-500">
          <span class="inline-flex items-center gap-1 rounded-full bg-blue-500/10 py-0.5 pr-1 pl-2.5 text-sm text-blue-300">
            Priya Shah
            <button type="button" aria-label="Remove Priya Shah" class="rounded-full p-0.5 hover:bg-blue-500/20">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </span>
          <span class="inline-flex items-center gap-1 rounded-full bg-blue-500/10 py-0.5 pr-1 pl-2.5 text-sm text-blue-300">
            Marcus Lee
            <button type="button" aria-label="Remove Marcus Lee" class="rounded-full p-0.5 hover:bg-blue-500/20">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </span>

          <input
            id="multiSelectDemoDark"
            type="text"
            role="combobox"
            aria-expanded="true"
            aria-controls="multiSelectListboxDark"
            autocomplete="off"
            placeholder=""
            class="min-w-24 flex-1 border-0 bg-transparent p-1 text-sm text-gray-100 placeholder:text-gray-500 focus:ring-0 focus:outline-none"
          />
        </div>

        <ul id="multiSelectListboxDark" role="listbox" aria-label="Assignees" aria-multiselectable="true" class="absolute z-10 mt-1.5 w-full overflow-hidden rounded-md border border-gray-700 bg-gray-900 py-1 shadow-lg">
          <li role="option" aria-selected="true" class="flex cursor-pointer items-center justify-between gap-2 bg-blue-500/10 px-3 py-1.5 text-sm text-blue-300">
            <span>Priya Shah</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </li>
          <li role="option" aria-selected="false" class="flex cursor-pointer items-center justify-between gap-2 px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">
            <span>Preston Ng</span>
          </li>
          <li role="option" aria-selected="true" class="flex cursor-pointer items-center justify-between gap-2 bg-blue-500/10 px-3 py-1.5 text-sm text-blue-300">
            <span>Marcus Lee</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </li>
          <li role="option" aria-selected="false" class="flex cursor-pointer items-center justify-between gap-2 px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">
            <span>Dana Osei</span>
          </li>
          <li role="option" aria-selected="false" class="flex cursor-pointer items-center justify-between gap-2 px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">
            <span>Lena Fischer</span>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
