<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-lg rounded-lg border border-gray-700 bg-gray-900 p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <p class="text-sm font-semibold text-white">Shipping details</p>
        <span class="text-xs font-medium text-gray-400">Step 3 of 5</span>
      </div>

      <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-gray-800">
        <div class="h-full w-3/5 rounded-full bg-indigo-500"></div>
      </div>

      <div class="mt-4 rounded-md border border-dashed border-gray-700 p-6 text-center">
        <p class="text-sm text-gray-400">Shipping address form fields go here</p>
      </div>

      <div class="mt-4 flex justify-between">
        <button type="button" class="rounded-md border border-gray-700 bg-gray-900 px-3 py-1.5 text-sm font-medium text-gray-200 hover:bg-gray-800">
          Back
        </button>
        <button type="button" class="rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-medium text-white hover:bg-indigo-400">

        </button>
      </div>
