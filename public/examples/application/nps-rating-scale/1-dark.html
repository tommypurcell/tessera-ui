<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <fieldset class="flex w-full max-w-lg flex-col gap-2">
      <legend class="text-sm font-medium text-gray-100">How likely are you to recommend us to a friend or colleague?</legend>

      <div role="radiogroup" aria-label="How likely are you to recommend us to a friend or colleague?" class="flex gap-1.5">
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">0</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">1</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">2</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">3</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">4</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">5</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">6</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">7</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">8</button>
        <button type="button" role="radio" aria-checked="true" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-green-500 bg-green-500 text-sm font-medium text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">9</button>
        <button type="button" role="radio" aria-checked="false" class="flex size-9 shrink-0 items-center justify-center rounded-md border border-gray-700 text-sm font-medium text-gray-300 hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-1 focus-visible:ring-offset-gray-950">10</button>
      </div>

      <div class="flex justify-between text-xs text-gray-500">
        <span>Not at all likely</span>
        <span>Extremely likely</span>
      </div>
    </fieldset>
  </body>
</html>
