<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <table class="w-full max-w-xl border-collapse overflow-hidden rounded-lg border border-gray-800 bg-gray-900 text-sm">
      <thead>
        <tr class="border-b border-gray-800 text-left text-xs text-gray-500">
          <th class="px-4 py-2 font-medium">Locale</th>
          <th class="px-4 py-2 font-medium">Number</th>
          <th class="px-4 py-2 font-medium">Currency</th>
          <th class="px-4 py-2 font-medium">Date</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-800">
        <tr>
          <td class="px-4 py-2.5 font-mono text-xs text-gray-500">en-US</td>
          <td class="px-4 py-2.5 text-gray-100">1,234,567.89</td>
          <td class="px-4 py-2.5 text-gray-100">$1,234,567.89</td>
          <td class="px-4 py-2.5 text-gray-100">August 8, 2026</td>
        </tr>
        <tr>
          <td class="px-4 py-2.5 font-mono text-xs text-gray-500">de-DE</td>
          <td class="px-4 py-2.5 text-gray-100">1.234.567,89</td>
          <td class="px-4 py-2.5 text-gray-100">1.234.567,89&nbsp;&euro;</td>
          <td class="px-4 py-2.5 text-gray-100">8. August 2026</td>
        </tr>
        <tr>
          <td class="px-4 py-2.5 font-mono text-xs text-gray-500">ja-JP</td>
          <td class="px-4 py-2.5 text-gray-100">1,234,567.89</td>
          <td class="px-4 py-2.5 text-gray-100">&yen;1,234,568</td>
          <td class="px-4 py-2.5 text-gray-100">2026&#24180;8&#26376;8&#26085;</td>
        </tr>
        <tr>
          <td class="px-4 py-2.5 font-mono text-xs text-gray-500">ar-EG</td>
          <td class="px-4 py-2.5 text-gray-100" dir="rtl">١٬٢٣٤٬٥٦٧٫٨٩</td>
          <td class="px-4 py-2.5 text-gray-100" dir="rtl">١٬٢٣٤٬٥٦٧٫٨٩ ج.م.</td>
          <td class="px-4 py-2.5 text-gray-100" dir="rtl">٨ أغسطس ٢٠٢٦</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
