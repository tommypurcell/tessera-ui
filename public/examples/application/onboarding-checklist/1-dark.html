<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-4 p-6">
    <div class="rounded-lg border border-gray-800 bg-gray-900 p-6">
      <div class="flex items-start justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="relative flex size-11 shrink-0 items-center justify-center">
            <svg class="size-11 -rotate-90" viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="4" class="text-gray-800" />
              <circle
                cx="20"
                cy="20"
                r="16"
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
                stroke-dasharray="100.5"
                stroke-dashoffset="37.7"
                class="text-blue-400"
              />
            </svg>
            <span class="absolute text-xs font-semibold text-white">2/3</span>
          </div>
          <div>
            <h2 class="text-sm font-semibold text-white">Finish setting up</h2>
            <p class="text-xs text-gray-400">1 step left to go live</p>
          </div>
        </div>

        <button
          type="button"
          aria-label="Dismiss checklist"
          class="shrink-0 rounded-md p-1 text-gray-500 transition hover:bg-gray-800 hover:text-gray-300"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <ul class="mt-5 flex flex-col gap-3" role="list">
        <li class="flex items-center gap-3">
          <span class="flex size-5 shrink-0 items-center justify-center rounded-full bg-green-900/50 text-green-400">
            <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <span class="text-sm text-gray-500 line-through">Create your account</span>
        </li>

        <li class="flex items-center gap-3">
          <span class="flex size-5 shrink-0 items-center justify-center rounded-full bg-green-900/50 text-green-400">
            <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <span class="text-sm text-gray-500 line-through">Verify your email</span>
        </li>

        <li>
          <a
            href="#"
            class="group flex items-center gap-3 rounded-md -mx-2 px-2 py-1 transition hover:bg-gray-800"
          >
            <span class="flex size-5 shrink-0 items-center justify-center rounded-full border-2 border-blue-400"></span>
            <span class="text-sm font-medium text-white group-hover:text-blue-400">Invite your team</span>
          </a>
        </li>
      </ul>
    </div>
  </body>
</html>
