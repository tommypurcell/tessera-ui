<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-4 p-6">
    <div class="rounded-lg border border-gray-100 bg-white p-6">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-900">Get started with Tessera</h2>
        <span class="text-xs font-medium text-gray-500">3 of 4 complete</span>
      </div>

      <div
        class="mt-3 h-1.5 overflow-hidden rounded-full bg-gray-100"
        role="progressbar"
        aria-valuenow="75"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div class="h-full w-3/4 rounded-full bg-blue-600"></div>
      </div>

      <ul class="mt-5 flex flex-col gap-3" role="list">
        <li class="flex items-center gap-3">
          <svg class="size-4 shrink-0 text-green-500" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.25 12a9.75 9.75 0 1119.5 0 9.75 9.75 0 01-19.5 0zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
          </svg>
          <span class="text-sm text-gray-400 line-through">Connect your workspace</span>
        </li>

        <li class="flex items-center gap-3">
          <svg class="size-4 shrink-0 text-green-500" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.25 12a9.75 9.75 0 1119.5 0 9.75 9.75 0 01-19.5 0zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
          </svg>
          <span class="text-sm text-gray-400 line-through">Import your first project</span>
        </li>

        <li class="flex items-center gap-3">
          <svg class="size-4 shrink-0 text-green-500" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.25 12a9.75 9.75 0 1119.5 0 9.75 9.75 0 01-19.5 0zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
          </svg>
          <span class="text-sm text-gray-400 line-through">Customize your theme</span>
        </li>

        <li>
          <a href="#" class="group flex items-center gap-3 rounded-md -mx-2 px-2 py-1 transition hover:bg-gray-50">
            <span class="size-4 shrink-0 rounded-full border-2 border-gray-300 group-hover:border-blue-600"></span>
            <span class="text-sm font-medium text-gray-900 group-hover:text-blue-600">Invite a teammate</span>
          </a>
        </li>
      </ul>
    </div>
  </body>
</html>
