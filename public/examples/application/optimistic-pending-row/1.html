<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-xl border border-gray-200 bg-white">
      <ul class="divide-y divide-gray-100">
        <li class="flex items-center gap-3 px-4 py-3">
          <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-indigo-100 text-xs font-semibold text-indigo-700">JL</span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-900">Comment on "Q3 roadmap"</p>
            <p class="text-xs text-gray-400">Sent just now</p>
          </div>
        </li>

        <li aria-live="polite" class="flex items-center gap-3 px-4 py-3 opacity-60">
          <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-indigo-100 text-xs font-semibold text-indigo-700">JL</span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-900">Comment on "Design review"</p>
            <p class="flex items-center gap-1.5 text-xs text-gray-400">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="size-3 animate-spin text-gray-400">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"></path>
              </svg>
              Sending&hellip;
            </p>
          </div>
        </li>

        <li aria-live="polite" class="flex items-center gap-3 px-4 py-3">
          <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-rose-100 text-rose-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
            </svg>
          </span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-900">Comment on "Launch checklist"</p>
            <p class="text-xs text-rose-600">Failed to send</p>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button type="button" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">Retry</button>
            <button type="button" aria-label="Dismiss failed message" class="text-xs font-medium text-gray-400 hover:text-gray-600">Dismiss</button>
          </div>
        </li>
      </ul>
    </div>
  </body>
</html>
