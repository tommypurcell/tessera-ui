<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
      <ol aria-label="Order status" class="flex items-start">
        <li class="relative flex flex-1 flex-col items-center text-center">
          <div class="flex h-6 w-full items-center">
            <div class="flex size-6 items-center justify-center rounded-full bg-blue-600 text-white">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </div>
            <div class="h-0.5 flex-1 bg-blue-600"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-gray-900">Placed</p>
          <p class="text-xs text-gray-400">Aug 4</p>
        </li>

        <li class="relative flex flex-1 flex-col items-center text-center">
          <div class="flex h-6 w-full items-center">
            <div class="flex size-6 items-center justify-center rounded-full bg-blue-600 text-white">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </div>
            <div class="h-0.5 flex-1 bg-blue-600"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-gray-900">Shipped</p>
          <p class="text-xs text-gray-400">Aug 5</p>
        </li>

        <li class="relative flex flex-1 flex-col items-center text-center" aria-current="step">
          <div class="flex h-6 w-full items-center">
            <div class="flex size-6 items-center justify-center rounded-full bg-blue-600 ring-4 ring-blue-100">
              <span class="size-2 rounded-full bg-white"></span>
            </div>
            <div class="h-0.5 flex-1 bg-gray-200"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-blue-600">Out for delivery</p>
          <p class="text-xs text-gray-400">Aug 8</p>
        </li>

        <li class="relative flex flex-1 flex-col items-center text-center">
          <div class="flex h-6 w-full items-center">
            <div class="flex size-6 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-gray-300">
              <span class="size-2 rounded-full bg-gray-300"></span>
            </div>
          </div>
          <p class="mt-2 text-xs font-medium text-gray-400">Delivered</p>
          <p class="text-xs text-gray-300">Est. Aug 9</p>
        </li>
      </ol>
    </div>
  </body>
</html>
