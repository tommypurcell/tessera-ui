<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg bg-gray-950 p-6">
    <div class="flex items-center justify-between gap-4 rounded-xl border border-gray-800 bg-gray-900 px-4 py-3">
      <div class="flex items-center gap-2 text-sm text-gray-400">
        <span>Showing</span>
        <span class="font-medium text-white">21–40</span>
        <span>of</span>
        <span class="font-medium text-white">312</span>
      </div>

      <div class="flex items-center gap-3">
        <label class="flex items-center gap-1.5 text-sm text-gray-400">
          <span class="hidden sm:inline">Rows per page</span>
          <select class="rounded-md border border-gray-700 bg-gray-900 px-2 py-1 text-sm text-white shadow-sm focus:border-gray-500 focus:outline-none">
            <option>20</option>
          </select>
        </label>

        <div class="flex items-center gap-1">
          <button type="button" class="rounded-md border border-gray-700 bg-gray-900 p-1.5 text-gray-300 hover:bg-gray-800">
            <span class="sr-only">Previous page</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
          </button>
          <button type="button" class="rounded-md border border-gray-700 bg-gray-900 p-1.5 text-gray-300 hover:bg-gray-800">
            <span class="sr-only">Next page</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
