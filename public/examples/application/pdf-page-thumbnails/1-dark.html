<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-stretch justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-xl overflow-hidden rounded-lg border border-gray-700 bg-gray-900 shadow-sm">
      <nav aria-label="Page thumbnails" class="flex w-28 shrink-0 flex-col gap-2.5 overflow-y-auto border-r border-gray-700 bg-white/5 p-3">
        <button type="button" aria-current="true" class="group flex flex-col items-center gap-1">
          <span class="flex aspect-[3/4] w-full items-center justify-center rounded-sm border-2 border-white bg-gray-800 shadow-sm">
            <span class="w-3/4 space-y-1">
              <span class="block h-1 w-2/3 rounded-full bg-gray-500"></span>
              <span class="block h-1 w-full rounded-full bg-gray-600"></span>
              <span class="block h-1 w-full rounded-full bg-gray-600"></span>
              <span class="block h-1 w-1/2 rounded-full bg-gray-600"></span>
            </span>
          </span>
          <span class="text-xs font-semibold text-white">1</span>
        </button>

        <button type="button" aria-current="false" class="group flex flex-col items-center gap-1">
          <span class="flex aspect-[3/4] w-full items-center justify-center rounded-sm border border-gray-700 bg-gray-800 shadow-sm transition-colors group-hover:border-gray-500">
            <span class="w-3/4 space-y-1">
              <span class="block h-1 w-1/2 rounded-full bg-gray-600"></span>
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
            </span>
          </span>
          <span class="text-xs text-gray-400">2</span>
        </button>

        <button type="button" aria-current="false" class="group flex flex-col items-center gap-1">
          <span class="flex aspect-[3/4] w-full items-center justify-center rounded-sm border border-gray-700 bg-gray-800 shadow-sm transition-colors group-hover:border-gray-500">
            <span class="w-3/4 space-y-1">
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
              <span class="block h-1 w-2/3 rounded-full bg-gray-700"></span>
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
            </span>
          </span>
          <span class="text-xs text-gray-400">3</span>
        </button>

        <button type="button" aria-current="false" class="group flex flex-col items-center gap-1">
          <span class="flex aspect-[3/4] w-full items-center justify-center rounded-sm border border-gray-700 bg-gray-800 shadow-sm transition-colors group-hover:border-gray-500">
            <span class="w-3/4 space-y-1">
              <span class="block h-1 w-1/3 rounded-full bg-gray-600"></span>
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
            </span>
          </span>
          <span class="text-xs text-gray-400">4</span>
        </button>

        <button type="button" aria-current="false" class="group flex flex-col items-center gap-1">
          <span class="flex aspect-[3/4] w-full items-center justify-center rounded-sm border border-gray-700 bg-gray-800 shadow-sm transition-colors group-hover:border-gray-500">
            <span class="w-3/4 space-y-1">
              <span class="block h-1 w-2/3 rounded-full bg-gray-600"></span>
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
              <span class="block h-1 w-full rounded-full bg-gray-700"></span>
            </span>
          </span>
          <span class="text-xs text-gray-400">5</span>
        </button>
      </nav>

      <div class="flex flex-1 flex-col items-center justify-center gap-3 p-6">
        <div class="flex aspect-[3/4] w-40 flex-col gap-2 rounded-md border border-gray-700 bg-gray-800 p-4 shadow-sm">
          <span class="block h-2 w-3/4 rounded-full bg-gray-500"></span>
          <span class="mt-2 block h-1.5 w-full rounded-full bg-gray-700"></span>
          <span class="block h-1.5 w-full rounded-full bg-gray-700"></span>
          <span class="block h-1.5 w-5/6 rounded-full bg-gray-700"></span>
        </div>
        <p class="text-xs text-gray-400">Page 1 of 5</p>
      </div>
    </div>
  </body>
</html>
