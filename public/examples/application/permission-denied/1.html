<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center p-6">
    <div role="alert" class="flex max-w-sm flex-col items-center rounded-xl border border-gray-200 bg-white p-8 text-center shadow-sm">
      <div class="flex size-12 items-center justify-center rounded-full bg-gray-100">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-gray-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
      </div>

      <h2 class="mt-4 text-base font-semibold text-gray-900">You don't have access to this project</h2>
      <p class="mt-1.5 text-sm leading-relaxed text-gray-500">
        Ask an admin on the <span class="font-medium text-gray-700">Design Systems</span> team to grant you the
        Editor role.
      </p>

      <button
        type="button"
        class="mt-6 rounded-md bg-gray-900 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-gray-700"
      >
        Request access
      </button>
    </div>
  </body>
</html>
