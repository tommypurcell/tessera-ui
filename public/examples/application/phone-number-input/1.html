<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm">
      <label for="phone-input" class="mb-1.5 block text-sm font-medium text-gray-700">Phone number</label>
      <div class="flex items-stretch rounded-md border border-gray-300 bg-white shadow-sm transition-colors focus-within:border-gray-900 focus-within:ring-1 focus-within:ring-gray-900">
        <button
          type="button"
          class="flex shrink-0 items-center gap-1.5 rounded-l-md border-r border-gray-200 bg-gray-50 px-3 text-sm text-gray-700 transition-colors hover:bg-gray-100"
        >
          <span class="text-base leading-none" aria-hidden="true">🇺🇸</span>
          <span class="text-gray-500">+1</span>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
        <input
          type="tel"
          id="phone-input"
          value="(415) 555-0132"
          class="h-10 w-full border-0 bg-transparent px-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-0"
        />
      </div>
      <p class="mt-1.5 text-xs text-gray-500">We'll text a verification code to this number.</p>
    </div>
  </body>
</html>
