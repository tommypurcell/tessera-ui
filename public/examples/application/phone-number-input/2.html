<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-start justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm">
      <label for="phone-input-2" class="mb-1.5 block text-sm font-medium text-gray-700">Phone number</label>
      <div class="relative">
        <div class="flex items-stretch rounded-md border border-gray-900 bg-white shadow-sm ring-1 ring-gray-900">
          <button
            type="button"
            aria-expanded="true"
            aria-haspopup="listbox"
            class="flex shrink-0 items-center gap-1.5 rounded-l-md border-r border-gray-200 bg-gray-50 px-3 text-sm text-gray-700"
          >
            <span class="text-base leading-none" aria-hidden="true">🇬🇧</span>
            <span class="text-gray-500">+44</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3 text-gray-400">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
          <input
            type="tel"
            id="phone-input-2"
            value="20 7946 0958"
            class="h-10 w-full border-0 bg-transparent px-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-0"
          />
        </div>

        <ul role="listbox" aria-label="Country code" class="absolute left-0 top-full z-10 mt-1.5 w-56 overflow-hidden rounded-lg border border-gray-200 bg-white py-1 shadow-lg shadow-gray-900/10">
          <li role="option" aria-selected="false" class="flex cursor-pointer items-center justify-between px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">
            <span class="flex items-center gap-2"><span aria-hidden="true">🇺🇸</span>United States <span class="text-gray-400">+1</span></span>
          </li>
          <li role="option" aria-selected="true" class="flex cursor-pointer items-center justify-between bg-gray-50 px-3 py-1.5 text-sm font-medium text-gray-900">
            <span class="flex items-center gap-2"><span aria-hidden="true">🇬🇧</span>United Kingdom <span class="text-gray-400">+44</span></span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </li>
          <li role="option" aria-selected="false" class="flex cursor-pointer items-center justify-between px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">
            <span class="flex items-center gap-2"><span aria-hidden="true">🇩🇪</span>Germany <span class="text-gray-400">+49</span></span>
          </li>
          <li role="option" aria-selected="false" class="flex cursor-pointer items-center justify-between px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">
            <span class="flex items-center gap-2"><span aria-hidden="true">🇯🇵</span>Japan <span class="text-gray-400">+81</span></span>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
