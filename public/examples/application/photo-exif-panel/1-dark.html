<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-900 p-5">
      <p class="text-sm font-semibold text-gray-100">Image details</p>

      <svg viewBox="0 0 200 48" preserveAspectRatio="none" role="img" aria-label="Luminance histogram, mid-tone weighted with a highlight peak" class="mt-3 h-12 w-full">
        <polygon points="0,48 0,40 10,32 20,28 30,20 40,14 50,10 60,8 70,10 80,16 90,22 100,26 110,22 120,18 130,14 140,10 150,8 160,10 170,16 180,24 190,34 200,44 200,48" class="fill-gray-700" />
      </svg>

      <dl class="mt-4 space-y-2 text-sm">
        <div class="flex items-center justify-between border-b border-gray-800 pb-2">
          <dt class="text-gray-500">Camera</dt>
          <dd class="font-medium text-gray-100">Canon EOS R6</dd>
        </div>
        <div class="flex items-center justify-between border-b border-gray-800 pb-2">
          <dt class="text-gray-500">Lens</dt>
          <dd class="font-medium text-gray-100">RF 50mm F1.2L</dd>
        </div>
        <div class="flex items-center justify-between border-b border-gray-800 pb-2">
          <dt class="text-gray-500">Focal length</dt>
          <dd class="font-medium text-gray-100">50mm</dd>
        </div>
        <div class="flex items-center justify-between border-b border-gray-800 pb-2">
          <dt class="text-gray-500">Aperture</dt>
          <dd class="font-medium text-gray-100">f/1.8</dd>
        </div>
        <div class="flex items-center justify-between border-b border-gray-800 pb-2">
          <dt class="text-gray-500">Shutter speed</dt>
          <dd class="font-medium text-gray-100">1/500s</dd>
        </div>
        <div class="flex items-center justify-between border-b border-gray-800 pb-2">
          <dt class="text-gray-500">ISO</dt>
          <dd class="font-medium text-gray-100">400</dd>
        </div>
        <div class="flex items-center justify-between">
          <dt class="text-gray-500">Dimensions</dt>
          <dd class="font-medium text-gray-100">6000 &times; 4000</dd>
        </div>
      </dl>
    </div>
  </body>
</html>
