<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div id="grid-1">
      <div class="js-bar hidden items-center justify-between rounded-lg bg-gray-900 px-3 py-2 text-sm text-white">
        <span class="js-count-out font-medium">0 selected</span>
        <button type="button" class="js-clear text-xs font-medium text-gray-300 hover:text-white">Clear</button>
      </div>

      <ul class="mt-2 grid grid-cols-3 gap-1.5">
        <li class="js-tile relative aspect-square cursor-pointer overflow-hidden rounded-md bg-gradient-to-br from-rose-300 to-orange-300" role="button" tabindex="0" aria-pressed="false" aria-label="Select photo 1">
          <span class="js-check absolute top-1.5 right-1.5 hidden size-5 items-center justify-center rounded-full bg-blue-600 text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </span>
        </li>
        <li class="js-tile relative aspect-square cursor-pointer overflow-hidden rounded-md bg-gradient-to-br from-sky-300 to-indigo-300" role="button" tabindex="0" aria-pressed="false" aria-label="Select photo 2">
          <span class="js-check absolute top-1.5 right-1.5 hidden size-5 items-center justify-center rounded-full bg-blue-600 text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </span>
        </li>
        <li class="js-tile relative aspect-square cursor-pointer overflow-hidden rounded-md bg-gradient-to-br from-emerald-300 to-teal-300" role="button" tabindex="0" aria-pressed="false" aria-label="Select photo 3">
          <span class="js-check absolute top-1.5 right-1.5 hidden size-5 items-center justify-center rounded-full bg-blue-600 text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </span>
        </li>
        <li class="js-tile relative aspect-square cursor-pointer overflow-hidden rounded-md bg-gradient-to-br from-amber-300 to-yellow-200" role="button" tabindex="0" aria-pressed="false" aria-label="Select photo 4">
          <span class="js-check absolute top-1.5 right-1.5 hidden size-5 items-center justify-center rounded-full bg-blue-600 text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </span>
        </li>
        <li class="js-tile relative aspect-square cursor-pointer overflow-hidden rounded-md bg-gradient-to-br from-fuchsia-300 to-pink-300" role="button" tabindex="0" aria-pressed="false" aria-label="Select photo 5">
          <span class="js-check absolute top-1.5 right-1.5 hidden size-5 items-center justify-center rounded-full bg-blue-600 text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </span>
        </li>
        <li class="js-tile relative aspect-square cursor-pointer overflow-hidden rounded-md bg-gradient-to-br from-lime-300 to-emerald-400" role="button" tabindex="0" aria-pressed="false" aria-label="Select photo 6">
          <span class="js-check absolute top-1.5 right-1.5 hidden size-5 items-center justify-center rounded-full bg-blue-600 text-white">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </span>
        </li>
      </ul>
    </div>

    <script>
      ;(function () {
        var root = document.getElementById('grid-1')
        var tiles = root.querySelectorAll('.js-tile')
        var bar = root.querySelector('.js-bar')
        var countOut = root.querySelector('.js-count-out')
        var clearBtn = root.querySelector('.js-clear')
        var selected = new Set()

        function render() {
          countOut.textContent = selected.size + (selected.size === 1 ? ' selected' : ' selected')
          bar.classList.toggle('hidden', selected.size === 0)
          bar.classList.toggle('flex', selected.size > 0)
        }

        function toggleTile(tile) {
          var isSelected = selected.has(tile)
          if (isSelected) {
            selected.delete(tile)
          } else {
            selected.add(tile)
          }
          tile.setAttribute('aria-pressed', String(!isSelected))
          tile.classList.toggle('ring-2', !isSelected)
          tile.classList.toggle('ring-blue-600', !isSelected)
          tile.classList.toggle('ring-offset-2', !isSelected)
          var check = tile.querySelector('.js-check')
          check.classList.toggle('hidden', isSelected)
          check.classList.toggle('flex', !isSelected)
          render()
        }

        tiles.forEach(function (tile) {
          tile.addEventListener('click', function () {
            toggleTile(tile)
          })
          tile.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault()
              toggleTile(tile)
            }
          })
        })

        clearBtn.addEventListener('click', function () {
          selected.forEach(function (tile) {
            tile.setAttribute('aria-pressed', 'false')
            tile.classList.remove('ring-2', 'ring-blue-600', 'ring-offset-2')
            var check = tile.querySelector('.js-check')
            check.classList.add('hidden')
            check.classList.remove('flex')
          })
          selected.clear()
          render()
        })

        render()
      })()
    </script>
  </body>
</html>
