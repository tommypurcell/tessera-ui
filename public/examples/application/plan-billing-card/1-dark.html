<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-900 p-5">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs font-medium tracking-wide text-gray-500 uppercase">Current plan</p>
          <div class="mt-1 flex items-baseline gap-1">
            <h3 class="text-lg font-semibold text-gray-100">Pro</h3>
            <span class="text-sm text-gray-400">&middot; $49/mo</span>
          </div>
        </div>
        <span class="rounded-full bg-indigo-500/10 px-2.5 py-1 text-xs font-medium text-indigo-300">Active</span>
      </div>

      <div class="mt-4">
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium text-gray-300">API requests</span>
          <span class="text-gray-400">8,200 / 10,000</span>
        </div>
        <div class="mt-1.5 h-2 overflow-hidden rounded-full bg-gray-800">
          <div class="h-full rounded-full bg-indigo-500" style="width: 82%"></div>
        </div>
      </div>

      <p class="mt-4 text-xs text-gray-400">Renews on <span class="font-medium text-gray-200">September 12, 2026</span></p>

      <div class="mt-4 flex gap-2">
        <button type="button" class="flex-1 rounded-md border border-gray-700 px-3 py-2 text-sm font-medium text-gray-200 shadow-sm hover:bg-gray-800">
          Manage plan
        </button>
        <button type="button" class="flex-1 rounded-md bg-indigo-500 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-400">
          Upgrade
        </button>
      </div>
    </div>
  </body>
</html>
