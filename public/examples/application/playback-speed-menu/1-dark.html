<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm justify-center p-6">
    <div id="speed-menu-1-dark" class="relative inline-block">
      <button
        type="button"
        class="js-toggle inline-flex items-center gap-1.5 rounded-md border border-gray-700 bg-gray-950 px-3 py-1.5 text-sm font-medium text-gray-200 shadow-sm hover:bg-gray-900"
        aria-haspopup="true"
        aria-expanded="true"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.379.137.752.43.992l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a7.688 7.688 0 0 1 0-.255c.007-.379-.138-.752-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        Settings
      </button>

      <div role="menu" aria-label="Playback settings" class="js-main-panel absolute top-10 left-0 z-10 w-52 overflow-hidden rounded-lg border border-gray-800 bg-gray-950 py-1 shadow-lg">
        <p class="px-3 pt-1.5 pb-1 text-xs font-semibold text-gray-500">Playback speed</p>

        <button type="button" data-speed="0.5" class="js-speed-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="false">
          0.5x
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-check invisible size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
        <button type="button" data-speed="1" class="js-speed-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="true">
          Normal
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-check size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
        <button type="button" data-speed="1.5" class="js-speed-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="false">
          1.5x
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-check invisible size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
        <button type="button" data-speed="2" class="js-speed-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="false">
          2x
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-check invisible size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>

        <div class="my-1 border-t border-gray-800"></div>

        <button type="button" class="js-open-quality flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900">
          Quality
          <span class="flex items-center gap-1 text-gray-500">
            <span class="js-quality-label">Auto (1080p)</span>
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </span>
        </button>
      </div>

      <div role="menu" aria-label="Quality options" class="js-quality-panel invisible absolute top-10 left-0 z-10 w-52 overflow-hidden rounded-lg border border-gray-800 bg-gray-950 py-1 opacity-0 shadow-lg">
        <button type="button" class="js-back flex w-full items-center gap-1.5 px-3 py-1.5 text-sm font-semibold text-white hover:bg-gray-900">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
          Quality
        </button>
        <div class="my-1 border-t border-gray-800"></div>

        <button type="button" data-quality="Auto (1080p)" class="js-quality-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="true">
          Auto (1080p)
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-quality-check size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
        <button type="button" data-quality="1080p" class="js-quality-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="false">
          1080p
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-quality-check invisible size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
        <button type="button" data-quality="720p" class="js-quality-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="false">
          720p
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-quality-check invisible size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
        <button type="button" data-quality="480p" class="js-quality-option flex w-full items-center justify-between px-3 py-1.5 text-sm text-gray-200 hover:bg-gray-900" role="menuitemradio" aria-checked="false">
          480p
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="js-quality-check invisible size-3.5 text-blue-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
      </div>
    </div>

    <script>
      ;(function () {
        var root = document.getElementById('speed-menu-1-dark')
        var mainPanel = root.querySelector('.js-main-panel')
        var qualityPanel = root.querySelector('.js-quality-panel')
        var openQualityBtn = root.querySelector('.js-open-quality')
        var backBtn = root.querySelector('.js-back')
        var qualityLabel = root.querySelector('.js-quality-label')
        var speedOptions = root.querySelectorAll('.js-speed-option')
        var qualityOptions = root.querySelectorAll('.js-quality-option')

        function showQuality() {
          mainPanel.classList.add('invisible', 'opacity-0')
          qualityPanel.classList.remove('invisible', 'opacity-0')
        }

        function showMain() {
          qualityPanel.classList.add('invisible', 'opacity-0')
          mainPanel.classList.remove('invisible', 'opacity-0')
        }

        openQualityBtn.addEventListener('click', showQuality)
        backBtn.addEventListener('click', showMain)

        speedOptions.forEach(function (option) {
          option.addEventListener('click', function () {
            speedOptions.forEach(function (other) {
              var isSelected = other === option
              other.setAttribute('aria-checked', String(isSelected))
              other.querySelector('.js-check').classList.toggle('invisible', !isSelected)
            })
          })
        })

        qualityOptions.forEach(function (option) {
          option.addEventListener('click', function () {
            qualityOptions.forEach(function (other) {
              var isSelected = other === option
              other.setAttribute('aria-checked', String(isSelected))
              other.querySelector('.js-quality-check').classList.toggle('invisible', !isSelected)
            })
            qualityLabel.textContent = option.getAttribute('data-quality')
            showMain()
          })
        })
      })()
    </script>
  </body>
</html>
