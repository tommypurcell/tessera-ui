<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="flex w-full max-w-sm flex-col gap-3 rounded-lg border border-gray-200 bg-white p-5">
      <h2 class="text-sm font-medium text-gray-900">Which framework are you using for your next project?</h2>

      <div class="flex flex-col gap-2">
        <div class="relative overflow-hidden rounded-md border border-gray-200">
          <div class="absolute inset-y-0 left-0 bg-gray-100" style="width: 28%" aria-hidden="true"></div>
          <div class="relative flex items-center justify-between px-3 py-2 text-sm">
            <span class="text-gray-700">Astro</span>
            <span class="text-gray-500">28%</span>
          </div>
        </div>

        <div class="relative overflow-hidden rounded-md border border-gray-200">
          <div class="absolute inset-y-0 left-0 bg-blue-100" style="width: 45%" aria-hidden="true"></div>
          <div class="relative flex items-center justify-between px-3 py-2 text-sm">
            <span class="font-medium text-gray-900">Next.js</span>
            <span class="font-semibold text-gray-900">45%</span>
          </div>
        </div>

        <div class="relative overflow-hidden rounded-md border border-gray-200">
          <div class="absolute inset-y-0 left-0 bg-gray-100" style="width: 10%" aria-hidden="true"></div>
          <div class="relative flex items-center justify-between px-3 py-2 text-sm">
            <span class="text-gray-700">Remix</span>
            <span class="text-gray-500">10%</span>
          </div>
        </div>

        <div class="relative overflow-hidden rounded-md border border-gray-200">
          <div class="absolute inset-y-0 left-0 bg-gray-100" style="width: 17%" aria-hidden="true"></div>
          <div class="relative flex items-center justify-between px-3 py-2 text-sm">
            <span class="text-gray-700">SvelteKit</span>
            <span class="text-gray-500">17%</span>
          </div>
        </div>
      </div>

      <p class="text-xs text-gray-500">150 votes</p>
    </div>
  </body>
</html>
