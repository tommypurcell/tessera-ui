<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-start justify-center bg-gray-950 p-6">
    <div class="relative inline-block">
      <button
        type="button"
        aria-expanded="true"
        aria-haspopup="dialog"
        class="inline-flex items-center gap-1.5 rounded-md border border-gray-700 bg-gray-900 px-3 py-2 text-sm font-medium text-gray-200 shadow-sm transition-colors hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-100 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 text-gray-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M12 17.25h.008v.008H12v-.008Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        What is a workspace?
      </button>

      <div
        role="dialog"
        aria-label="Workspace help"
        class="absolute left-1/2 top-full z-10 mt-2 w-72 -translate-x-1/2 rounded-lg border border-gray-700 bg-gray-900 p-4 text-left shadow-lg shadow-black/40"
      >
        <div class="absolute -top-1.5 left-1/2 size-3 -translate-x-1/2 rotate-45 border-l border-t border-gray-700 bg-gray-900"></div>
        <div class="relative">
          <h3 class="text-sm font-semibold text-white">Workspaces</h3>
          <p class="mt-1.5 text-sm leading-relaxed text-gray-400">
            A workspace groups your projects, members, and billing under one shared account. You can belong to more than one.
          </p>
          <a href="#" class="mt-3 inline-flex items-center gap-1 text-sm font-medium text-white hover:underline">
            Learn more
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0-6.75-6.75M19.5 12l-6.75 6.75" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
