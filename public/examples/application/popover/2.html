<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-start justify-center bg-gray-50 p-6">
    <div class="relative inline-block">
      <button
        type="button"
        aria-expanded="true"
        aria-haspopup="dialog"
        class="inline-flex items-center gap-2 rounded-full border border-gray-200 bg-white py-1 pl-1 pr-3 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
      >
        <img
          src="https://i.pravatar.cc/64?img=32"
          alt=""
          class="size-6 rounded-full object-cover"
        />
        Priya Shah
      </button>

      <div
        role="dialog"
        aria-label="Priya Shah"
        class="absolute left-0 top-full z-10 mt-2 w-72 rounded-lg border border-gray-200 bg-white p-4 text-left shadow-lg shadow-gray-900/5"
      >
        <div class="flex items-start gap-3">
          <img
            src="https://i.pravatar.cc/96?img=32"
            alt=""
            class="size-12 shrink-0 rounded-full object-cover"
          />
          <div class="min-w-0">
            <h3 class="text-sm font-semibold text-gray-900">Priya Shah</h3>
            <p class="text-sm text-gray-500">Product Design · Tessera</p>
          </div>
        </div>
        <p class="mt-3 text-sm leading-relaxed text-gray-600">
          Leads the design system team. Usually online weekdays 9am–6pm IST.
        </p>
        <div class="mt-4 flex gap-2">
          <button
            type="button"
            class="inline-flex flex-1 items-center justify-center rounded-md bg-gray-900 px-3 py-1.5 text-sm font-medium text-white transition-colors hover:bg-gray-700"
          >
            Message
          </button>
          <button
            type="button"
            class="inline-flex flex-1 items-center justify-center rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50"
          >
            View profile
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
