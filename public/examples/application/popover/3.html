<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-start justify-center bg-gray-50 p-6">
    <div class="relative inline-block">
      <button
        type="button"
        aria-expanded="true"
        aria-haspopup="dialog"
        class="inline-flex items-center gap-1.5 rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
        </svg>
        Share
      </button>

      <div
        role="dialog"
        aria-label="Share this page"
        class="absolute left-1/2 top-full z-10 mt-2 w-80 -translate-x-1/2 rounded-lg border border-gray-200 bg-white p-4 text-left shadow-lg shadow-gray-900/5"
      >
        <div class="absolute -top-1.5 left-1/2 size-3 -translate-x-1/2 rotate-45 border-l border-t border-gray-200 bg-white"></div>
        <div class="relative">
          <h3 class="text-sm font-semibold text-gray-900">Share this page</h3>
          <p class="mt-1 text-sm text-gray-500">Anyone with the link can view.</p>
          <div class="mt-3 flex items-center gap-2">
            <label for="popover-share-link" class="sr-only">Page link</label>
            <input
              id="popover-share-link"
              type="text"
              readonly
              value="https://tessera.dev/s/9fk2p"
              class="block w-full rounded-md border-gray-300 bg-gray-50 text-sm text-gray-700 shadow-sm focus:border-gray-900 focus:ring-gray-900"
            />
            <button
              type="button"
              class="inline-flex shrink-0 items-center justify-center rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-gray-700"
            >
              Copy
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
