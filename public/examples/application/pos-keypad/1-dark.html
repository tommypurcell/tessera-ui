<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div id="pos-1-dark" class="rounded-xl border border-gray-800 bg-gray-950 p-5 shadow-sm">
      <p class="text-xs font-medium text-gray-400">Total due</p>
      <p class="text-2xl font-bold text-white">$18.50</p>

      <div class="mt-3 flex items-center justify-between rounded-md bg-gray-900 px-3 py-2">
        <span class="text-xs font-medium text-gray-400">Cash tendered</span>
        <span class="js-tendered-out text-sm font-semibold text-white">$0.00</span>
      </div>
      <div class="mt-1.5 flex items-center justify-between px-3">
        <span class="text-xs font-medium text-gray-400">Change due</span>
        <span class="js-change-out text-sm font-semibold text-emerald-400">$0.00</span>
      </div>

      <div class="mt-3 grid grid-cols-3 gap-2">
        <button type="button" data-cash="20" class="js-quick-cash rounded-md border border-gray-700 bg-gray-950 py-1.5 text-sm font-medium text-gray-200 hover:bg-gray-900">$20</button>
        <button type="button" data-cash="25" class="js-quick-cash rounded-md border border-gray-700 bg-gray-950 py-1.5 text-sm font-medium text-gray-200 hover:bg-gray-900">$25</button>
        <button type="button" data-cash="40" class="js-quick-cash rounded-md border border-gray-700 bg-gray-950 py-1.5 text-sm font-medium text-gray-200 hover:bg-gray-900">$40</button>
      </div>

      <div class="mt-3 grid grid-cols-3 gap-2">
        <button type="button" data-digit="1" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">1</button>
        <button type="button" data-digit="2" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">2</button>
        <button type="button" data-digit="3" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">3</button>
        <button type="button" data-digit="4" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">4</button>
        <button type="button" data-digit="5" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">5</button>
        <button type="button" data-digit="6" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">6</button>
        <button type="button" data-digit="7" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">7</button>
        <button type="button" data-digit="8" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">8</button>
        <button type="button" data-digit="9" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">9</button>
        <button type="button" class="js-clear rounded-md bg-gray-800 py-2.5 text-sm font-semibold text-gray-400 hover:bg-gray-700">Clear</button>
        <button type="button" data-digit="0" class="js-digit rounded-md bg-gray-800 py-2.5 text-base font-semibold text-white hover:bg-gray-700">0</button>
        <button type="button" class="js-backspace flex items-center justify-center rounded-md bg-gray-800 py-2.5 text-gray-400 hover:bg-gray-700" aria-label="Backspace">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75 14.25 12m0 0 2.25 2.25M14.25 12l2.25-2.25M14.25 12 12 14.25m-2.58 4.5H18a2.25 2.25 0 0 0 2.25-2.25V9.75A2.25 2.25 0 0 0 18 7.5H9.42a2.25 2.25 0 0 0-1.59.659L4.16 11.84a.6.6 0 0 0 0 .84l3.67 3.68a2.25 2.25 0 0 0 1.59.659Z" />
          </svg>
        </button>
      </div>

      <button type="button" class="mt-3 w-full rounded-md bg-blue-600 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500">
        Charge
      </button>
    </div>

    <script>
      ;(function () {
        var root = document.getElementById('pos-1-dark')
        var total = 18.5
        var cents = 0

        var tenderedOut = root.querySelector('.js-tendered-out')
        var changeOut = root.querySelector('.js-change-out')

        function fmt(n) {
          return '$' + n.toFixed(2)
        }

        function render() {
          var tendered = cents / 100
          var change = tendered - total
          tenderedOut.textContent = fmt(tendered)
          changeOut.textContent = fmt(Math.max(change, 0))
          changeOut.classList.toggle('text-emerald-400', change >= 0)
          changeOut.classList.toggle('text-red-400', change < 0)
        }

        root.querySelectorAll('.js-digit').forEach(function (button) {
          button.addEventListener('click', function () {
            var digit = button.getAttribute('data-digit')
            cents = cents * 10 + Number(digit)
            render()
          })
        })

        root.querySelector('.js-backspace').addEventListener('click', function () {
          cents = Math.floor(cents / 10)
          render()
        })

        root.querySelector('.js-clear').addEventListener('click', function () {
          cents = 0
          render()
        })

        root.querySelectorAll('.js-quick-cash').forEach(function (button) {
          button.addEventListener('click', function () {
            cents = Math.round(Number(button.getAttribute('data-cash')) * 100)
            render()
          })
        })

        render()
      })()
    </script>
  </body>
</html>
