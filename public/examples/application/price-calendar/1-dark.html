<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md bg-gray-950 p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-900 p-4">
      <div class="mb-3 flex items-center justify-between px-1">
        <button type="button" aria-label="Previous month" class="rounded-md p-1 text-gray-500 hover:bg-gray-800 hover:text-gray-300">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
        </button>
        <span class="text-sm font-medium text-white">August 2026</span>
        <button type="button" aria-label="Next month" class="rounded-md p-1 text-gray-500 hover:bg-gray-800 hover:text-gray-300">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-xs">
        <span class="pb-1 font-medium text-gray-500">S</span>
        <span class="pb-1 font-medium text-gray-500">M</span>
        <span class="pb-1 font-medium text-gray-500">T</span>
        <span class="pb-1 font-medium text-gray-500">W</span>
        <span class="pb-1 font-medium text-gray-500">T</span>
        <span class="pb-1 font-medium text-gray-500">F</span>
        <span class="pb-1 font-medium text-gray-500">S</span>

        <span></span><span></span><span></span><span></span><span></span>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">1</span>
          <span class="text-[10px] text-gray-500">$412</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">2</span>
          <span class="text-[10px] text-gray-500">$389</span>
        </button>

        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">3</span>
          <span class="text-[10px] text-gray-500">$355</span>
        </button>
        <button type="button" aria-current="true" class="flex flex-col items-center rounded-md bg-green-950/50 py-1.5 ring-1 ring-inset ring-green-800">
          <span class="font-medium text-green-400">4</span>
          <span class="text-[10px] font-medium text-green-400">$198</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">5</span>
          <span class="text-[10px] text-gray-500">$401</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">6</span>
          <span class="text-[10px] text-gray-500">$378</span>
        </button>
        <button type="button" aria-pressed="true" class="flex flex-col items-center rounded-md bg-white py-1.5">
          <span class="font-medium text-gray-900">7</span>
          <span class="text-[10px] font-medium text-gray-600">$342</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">8</span>
          <span class="text-[10px] text-gray-500">$367</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">9</span>
          <span class="text-[10px] text-gray-500">$421</span>
        </button>

        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">10</span>
          <span class="text-[10px] text-gray-500">$310</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">11</span>
          <span class="text-[10px] text-gray-500">$295</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">12</span>
          <span class="text-[10px] text-gray-500">$360</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">13</span>
          <span class="text-[10px] text-gray-500">$388</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">14</span>
          <span class="text-[10px] text-gray-500">$405</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">15</span>
          <span class="text-[10px] text-gray-500">$372</span>
        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-800">
          <span class="text-gray-300">16</span>
          <span class="text-[10px] text-gray-500">$329</span>
        </button>
      </div>

      <div class="mt-3 flex items-center justify-center gap-4 border-t border-gray-800 pt-3 text-xs text-gray-400">
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-sm bg-green-950/50 ring-1 ring-inset ring-green-800"></span>
          Cheapest
        </span>
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-sm bg-white"></span>
          Selected
        </span>
      </div>
    </div>
  </body>
</html>
