<!doctype html>
<html lang="en" class="font-sans antialiased">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />

  <body class="mx-auto max-w-md p-6">
    <div class="rounded-xl border border-gray-200 bg-white p-4">
      <div class="mb-3 flex items-center justify-between px-1">

        </button>
        <button type="button" class="flex flex-col items-center rounded-md py-1.5 hover:bg-gray-50">

        </button>

          <span class="text-[10px] text-gray-400">$372</span>
        </button>
