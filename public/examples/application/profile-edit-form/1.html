<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <form class="w-full max-w-lg rounded-xl border border-gray-200 bg-white">
      <div class="p-6">
        <h2 class="text-base font-semibold text-gray-900">Profile</h2>
        <p class="mt-1 text-sm text-gray-500">Update your photo and personal details.</p>

        <div class="mt-5 flex items-center gap-4">
          <img
            src="https://i.pravatar.cc/80?img=12"
            alt="Jordan Reyes"
            class="size-16 rounded-full object-cover"
          />
          <div class="flex flex-col gap-1">
            <button
              type="button"
              class="w-fit rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50"
            >
              Change photo
            </button>
            <p class="text-xs text-gray-500">JPG or PNG, up to 2MB.</p>
          </div>
        </div>

        <div class="mt-5 grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="pf-first" class="text-sm font-medium text-gray-700">First name</label>
            <input
              id="pf-first"
              type="text"
              value="Jordan"
              class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="pf-last" class="text-sm font-medium text-gray-700">Last name</label>
            <input
              id="pf-last"
              type="text"
              value="Reyes"
              class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
            />
          </div>
        </div>

        <div class="mt-4 flex flex-col gap-1.5">
          <label for="pf-email" class="text-sm font-medium text-gray-700">Email</label>
          <input
            id="pf-email"
            type="email"
            value="jordan@example.com"
            class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          />
        </div>

        <div class="mt-4 flex flex-col gap-1.5">
          <label for="pf-bio" class="text-sm font-medium text-gray-700">Bio</label>
          <textarea
            id="pf-bio"
            rows="3"
            class="resize-none rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          >
Product designer based in Portland.</textarea
          >
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 rounded-b-xl border-t border-gray-200 bg-gray-50 px-6 py-4">
        <button type="button" class="rounded-md px-3.5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-md bg-gray-900 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-gray-700"
        >
          Save changes
        </button>
      </div>
    </form>
  </body>
</html>
