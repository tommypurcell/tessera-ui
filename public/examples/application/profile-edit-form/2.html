<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <form class="w-full max-w-lg rounded-xl border border-gray-200 bg-white p-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-base font-semibold text-gray-900">Public profile</h2>
          <p class="mt-1 text-sm text-gray-500">This is how others will see you.</p>
        </div>
        <div class="flex items-center gap-2 rounded-full bg-amber-50 px-3 py-1 text-xs font-medium text-amber-700">
          <span class="size-1.5 rounded-full bg-amber-500" aria-hidden="true"></span>
          Unsaved changes
        </div>
      </div>

      <div class="mt-5 flex items-center gap-4">
        <img src="https://i.pravatar.cc/80?img=32" alt="Priya Natarajan" class="size-16 rounded-full object-cover" />
        <button
          type="button"
          class="rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50"
        >
          Change photo
        </button>
      </div>

      <div class="mt-5 flex flex-col gap-1.5">
        <label for="pf2-display" class="text-sm font-medium text-gray-700">Display name</label>
        <input
          id="pf2-display"
          type="text"
          value="Priya N."
          class="rounded-md border border-blue-400 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div class="mt-4 flex flex-col gap-1.5">
        <label for="pf2-handle" class="text-sm font-medium text-gray-700">Username</label>
        <div class="flex rounded-md border border-gray-300 shadow-sm focus-within:border-blue-500">
          <span class="flex items-center pl-3 text-sm text-gray-400">tessera.app/</span>
          <input
            id="pf2-handle"
            type="text"
            value="priyan"
            class="min-w-0 flex-1 rounded-r-md border-0 py-2 pr-3 pl-1 text-sm text-gray-900 focus:outline-none"
          />
        </div>
      </div>

      <div class="mt-6 flex items-center justify-end gap-3 border-t border-gray-200 pt-4">
        <button type="button" class="rounded-md px-3.5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">
          Discard
        </button>
        <button
          type="submit"
          class="rounded-md bg-blue-600 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700"
        >
          Save changes
        </button>
      </div>
    </form>
  </body>
</html>
