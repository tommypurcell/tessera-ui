<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-end justify-end p-6">
    <div role="status" aria-label="Deploying to production" class="w-full max-w-sm rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-lg shadow-black/30">
      <div class="flex items-center justify-between gap-2">
        <p class="text-sm font-semibold text-white">Deploying to production</p>
        <span class="text-xs font-medium text-gray-400">2 of 4</span>
      </div>

      <div class="mt-2.5 h-1.5 w-full overflow-hidden rounded-full bg-gray-800">
        <div class="h-full w-1/2 rounded-full bg-blue-300"></div>
      </div>

      <ul role="list" class="mt-3 flex flex-col gap-2">
        <li class="flex items-center gap-2 text-sm">
          <svg aria-hidden="true" class="size-4 shrink-0 text-emerald-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
          <span class="text-gray-500 line-through decoration-gray-600">Build assets</span>
        </li>
        <li class="flex items-center gap-2 text-sm">
          <svg aria-hidden="true" class="size-4 shrink-0 animate-spin text-blue-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="font-medium text-white">Run database migrations</span>
        </li>
        <li class="flex items-center gap-2 text-sm">
          <span aria-hidden="true" class="flex size-4 shrink-0 items-center justify-center">
            <span class="size-1.5 rounded-full bg-gray-600"></span>
          </span>
          <span class="text-gray-500">Deploy to edge nodes</span>
        </li>
        <li class="flex items-center gap-2 text-sm">
          <span aria-hidden="true" class="flex size-4 shrink-0 items-center justify-center">
            <span class="size-1.5 rounded-full bg-gray-600"></span>
          </span>
          <span class="text-gray-500">Run health checks</span>
        </li>
      </ul>
    </div>
  </body>
</html>
