<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-950 p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-white">Time off balance</h3>
        <span class="text-xs text-gray-500">Resets Jan 1</span>
      </div>

      <p class="mt-3 text-3xl font-semibold text-white">
        7<span class="text-base font-normal text-gray-400"> days remaining</span>
      </p>

      <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-gray-800">
        <div class="h-full rounded-full bg-blue-500" style="width: 53%"></div>
      </div>

      <dl class="mt-4 grid grid-cols-3 gap-2 border-t border-gray-800 pt-4 text-center">
        <div>
          <dt class="text-xs text-gray-500">Accrued</dt>
          <dd class="mt-0.5 text-sm font-semibold text-white">15</dd>
        </div>
        <div>
          <dt class="text-xs text-gray-500">Used</dt>
          <dd class="mt-0.5 text-sm font-semibold text-white">6</dd>
        </div>
        <div>
          <dt class="text-xs text-gray-500">Pending</dt>
          <dd class="mt-0.5 text-sm font-semibold text-amber-400">2</dd>
        </div>
      </dl>

      <button type="button" class="mt-4 w-full rounded-md bg-blue-600 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500">
        Request time off
      </button>
    </div>
  </body>
</html>
