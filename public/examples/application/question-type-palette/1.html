<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <p class="text-sm font-semibold text-gray-900">Add a question</p>
      <p class="mt-0.5 text-xs text-gray-500">Drag a type onto your form</p>

      <div class="mt-3 grid grid-cols-2 gap-2">
        <button type="button" class="group flex cursor-grab flex-col items-start gap-2 rounded-md border border-gray-200 p-3 text-left transition-colors hover:border-gray-900 hover:bg-gray-50">
          <span class="flex size-8 items-center justify-center rounded-md bg-blue-100 text-blue-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
          </span>
          <span class="text-xs font-medium text-gray-900">Multiple choice</span>
        </button>

        <button type="button" class="group flex cursor-grab flex-col items-start gap-2 rounded-md border border-gray-200 p-3 text-left transition-colors hover:border-gray-900 hover:bg-gray-50">
          <span class="flex size-8 items-center justify-center rounded-md bg-amber-100 text-amber-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
              <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006Z" clip-rule="evenodd" />
            </svg>
          </span>
          <span class="text-xs font-medium text-gray-900">Rating</span>
        </button>

        <button type="button" class="group flex cursor-grab flex-col items-start gap-2 rounded-md border border-gray-200 p-3 text-left transition-colors hover:border-gray-900 hover:bg-gray-50">
          <span class="flex size-8 items-center justify-center rounded-md bg-violet-100 text-violet-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
            </svg>
          </span>
          <span class="text-xs font-medium text-gray-900">Short text</span>
        </button>

        <button type="button" class="group flex cursor-grab flex-col items-start gap-2 rounded-md border border-gray-200 p-3 text-left transition-colors hover:border-gray-900 hover:bg-gray-50">
          <span class="flex size-8 items-center justify-center rounded-md bg-emerald-100 text-emerald-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          </span>
          <span class="text-xs font-medium text-gray-900">Scale (1–5)</span>
        </button>
      </div>
    </div>
  </body>
</html>
