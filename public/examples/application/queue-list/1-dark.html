<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-sm rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-sm">
      <p class="text-xs font-semibold uppercase tracking-wide text-gray-500">Now playing</p>
      <div class="mt-2 flex items-center gap-3 rounded-md bg-white/5 p-2">
        <span class="flex size-10 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-blue-500 to-violet-600">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="size-3.5">
            <path d="M8 5v14l11-7z" />
          </svg>
        </span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-white">Midnight Static</p>
          <p class="truncate text-xs text-gray-400">Nova Field</p>
        </div>
        <div class="h-4 w-16">
          <svg viewBox="0 0 40 16" class="size-full">
            <rect x="0" y="6" width="3" height="10" rx="1" class="fill-blue-400"><animate attributeName="height" values="10;4;10" dur="0.9s" repeatCount="indefinite" /></rect>
            <rect x="6" y="2" width="3" height="14" rx="1" class="fill-blue-400"><animate attributeName="height" values="14;6;14" dur="1.1s" repeatCount="indefinite" /></rect>
            <rect x="12" y="4" width="3" height="12" rx="1" class="fill-blue-400"><animate attributeName="height" values="12;3;12" dur="0.8s" repeatCount="indefinite" /></rect>
            <rect x="18" y="0" width="3" height="16" rx="1" class="fill-blue-400"><animate attributeName="height" values="16;7;16" dur="1s" repeatCount="indefinite" /></rect>
          </svg>
        </div>
      </div>

      <p class="mt-4 text-xs font-semibold uppercase tracking-wide text-gray-500">Up next</p>
      <ol class="mt-2 space-y-1">
        <li class="group flex items-center gap-2 rounded-md p-2 hover:bg-white/5">
          <button type="button" aria-label="Drag to reorder" class="shrink-0 cursor-grab text-gray-600 hover:text-gray-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
            </svg>
          </button>
          <span class="flex size-9 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-emerald-500 to-teal-700"></span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-white">Glass Horizon</p>
            <p class="truncate text-xs text-gray-400">Coral Drift</p>
          </div>
          <span class="shrink-0 text-xs text-gray-500">3:24</span>
          <button type="button" aria-label="Remove from queue" class="shrink-0 rounded p-1 text-gray-500 opacity-0 transition-opacity hover:bg-white/10 hover:text-gray-300 group-hover:opacity-100">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>

        <li class="group flex items-center gap-2 rounded-md p-2 hover:bg-white/5">
          <button type="button" aria-label="Drag to reorder" class="shrink-0 cursor-grab text-gray-600 hover:text-gray-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
            </svg>
          </button>
          <span class="flex size-9 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-amber-500 to-orange-700"></span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-white">Paper Lanterns</p>
            <p class="truncate text-xs text-gray-400">June Static</p>
          </div>
          <span class="shrink-0 text-xs text-gray-500">4:02</span>
          <button type="button" aria-label="Remove from queue" class="shrink-0 rounded p-1 text-gray-500 opacity-0 transition-opacity hover:bg-white/10 hover:text-gray-300 group-hover:opacity-100">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>

        <li class="group flex items-center gap-2 rounded-md p-2 hover:bg-white/5">
          <button type="button" aria-label="Drag to reorder" class="shrink-0 cursor-grab text-gray-600 hover:text-gray-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
            </svg>
          </button>
          <span class="flex size-9 shrink-0 items-center justify-center rounded-md bg-gradient-to-br from-rose-500 to-pink-700"></span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-white">Low Tide</p>
            <p class="truncate text-xs text-gray-400">Nova Field</p>
          </div>
          <span class="shrink-0 text-xs text-gray-500">2:51</span>
          <button type="button" aria-label="Remove from queue" class="shrink-0 rounded p-1 text-gray-500 opacity-0 transition-opacity hover:bg-white/10 hover:text-gray-300 group-hover:opacity-100">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>
      </ol>
    </div>
  </body>
</html>
