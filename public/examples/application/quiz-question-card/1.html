<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="flex w-full max-w-md flex-col gap-4 rounded-lg border border-gray-200 bg-white p-6">
      <h2 class="text-sm font-medium text-gray-900">Which HTTP status code means "Not Found"?</h2>

      <div class="flex flex-col gap-2">
        <button type="button" disabled class="rounded-md border border-gray-200 px-3 py-2 text-left text-sm text-gray-400">200 OK</button>
        <button type="button" disabled class="rounded-md border border-red-500 bg-red-50 px-3 py-2 text-left text-sm text-red-800">301 Moved Permanently <span class="ml-2 text-xs font-medium">✕ Your answer</span></button>
        <button type="button" disabled class="rounded-md border border-green-500 bg-green-50 px-3 py-2 text-left text-sm text-green-800">404 Not Found <span class="ml-2 text-xs font-medium">✓ Correct</span></button>
        <button type="button" disabled class="rounded-md border border-gray-200 px-3 py-2 text-left text-sm text-gray-400">500 Internal Server Error</button>
      </div>
    </div>
  </body>
</html>
