<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-4 p-6">
    <div class="flex gap-3 rounded-lg border border-amber-200 bg-amber-50 p-4 dark:border-amber-900/60 dark:bg-amber-950/50" role="alert">
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        class="mt-0.5 size-5 shrink-0 text-amber-500 dark:text-amber-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.74-3L13.74 4a2 2 0 00-3.48 0L3.33 16a2 2 0 001.74 3z" />
      </svg>

      <div class="flex flex-1 flex-col gap-2">
        <div class="flex items-baseline justify-between gap-2">
          <p class="text-sm font-semibold text-amber-900 dark:text-amber-100">Approaching your storage limit</p>
          <p class="text-xs font-medium text-amber-700 dark:text-amber-300">92 GB / 100 GB</p>
        </div>

        <div
          class="h-2 w-full overflow-hidden rounded-full bg-amber-200/70 dark:bg-amber-900/60"
          role="progressbar"
          aria-valuenow="92"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Storage used"
        >
          <div class="h-full rounded-full bg-amber-500 dark:bg-amber-400" style="width: 92%"></div>
        </div>

        <p class="text-sm text-amber-700 dark:text-amber-300">
          You've used 92% of your available storage. Upgrade your plan to avoid interruptions.
        </p>

        <div class="mt-1">
          <button
            type="button"
            class="rounded-md bg-amber-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-amber-700 dark:bg-amber-500 dark:hover:bg-amber-400"
          >
            Upgrade plan
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
