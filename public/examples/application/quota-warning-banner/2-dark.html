<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-lg flex-col gap-4 p-6">
    <div class="flex gap-3 rounded-lg border border-red-200 bg-red-50 p-4 dark:border-red-900/60 dark:bg-red-950/50" role="alert">
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        class="mt-0.5 size-5 shrink-0 text-red-500 dark:text-red-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>

      <div class="flex flex-1 flex-col gap-2">
        <p class="text-sm font-semibold text-red-900 dark:text-red-100">API request limit exceeded</p>

        <div class="flex items-baseline justify-between gap-2">
          <div
            class="h-2 w-full overflow-hidden rounded-full bg-red-200/70 dark:bg-red-900/60"
            role="progressbar"
            aria-valuenow="100"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="API requests used"
          >
            <div class="h-full rounded-full bg-red-600 dark:bg-red-400" style="width: 100%"></div>
          </div>
          <p class="shrink-0 text-xs font-medium text-red-700 dark:text-red-300">50,000 / 50,000</p>
        </div>

        <p class="text-sm text-red-700 dark:text-red-300">
          You've reached this month's request limit. New requests will be rejected until your quota resets or you upgrade.
        </p>

        <div class="mt-1 flex gap-3">
          <button
            type="button"
            class="rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-400"
          >
            Upgrade now
          </button>
          <button type="button" class="rounded-md px-3 py-1.5 text-sm font-medium text-red-800 hover:bg-red-100 dark:text-red-200 dark:hover:bg-red-900/40">
            View usage
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
