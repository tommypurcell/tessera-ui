<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-4 p-6">
    <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-800 bg-gray-900 px-4 py-3">
      <div class="min-w-0">
        <p class="text-sm font-medium text-white">API rate limit hit</p>
        <p id="rl-2-status-dark" class="text-xs text-gray-400">Retry available in <span class="font-mono tabular-nums">10s</span></p>
      </div>

      <button
        id="rl-2-btn-dark"
        type="button"
        disabled
        class="shrink-0 rounded-md bg-gray-800 px-3 py-1.5 text-xs font-semibold text-gray-500 transition disabled:cursor-not-allowed"
      >
        Retry
      </button>
    </div>

    <script>
      ;(function () {
        var statusEl = document.getElementById('rl-2-status-dark')
        var timeEl = statusEl.querySelector('span')
        var btn = document.getElementById('rl-2-btn-dark')
        var remaining = 10

        function tick() {
          if (remaining <= 0) return
          remaining -= 1
          timeEl.textContent = remaining + 's'
          if (remaining === 0) {
            statusEl.textContent = 'Ready to retry'
            btn.disabled = false
            btn.className = 'shrink-0 rounded-md bg-gray-100 px-3 py-1.5 text-xs font-semibold text-gray-900 transition hover:bg-white'
          }
        }

        setInterval(tick, 1000)
      })()
    </script>
  </body>
</html>
