<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-4 p-6">
    <div class="relative rounded-lg border border-gray-100 bg-white p-5">
      <button
        type="button"
        aria-label="Dismiss"
        class="absolute top-3 right-3 rounded-md p-1 text-gray-400 transition hover:bg-gray-50 hover:text-gray-600"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <p class="pr-6 text-sm font-semibold text-gray-900">Enjoying Tessera UI?</p>
      <p class="mt-0.5 text-sm text-gray-500">Tap a star to let us know how we're doing.</p>

      <fieldset class="mt-3 flex items-center gap-1">
        <legend class="sr-only">Rate your experience</legend>

        <input type="radio" id="rateus-1" name="rateus" value="1" class="peer/1 sr-only" />
        <label for="rateus-1" class="cursor-pointer text-gray-200 transition hover:text-yellow-400 peer-checked/1:text-yellow-400">
          <span class="sr-only">1 star</span>
          <svg class="size-7" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.68-1.54 1.11l-3.56-2.58a1 1 0 00-1.18 0l-3.56 2.58c-.78.57-1.84-.19-1.54-1.11l1.36-4.18a1 1 0 00-.36-1.12L1.4 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z" /></svg>
        </label>

        <input type="radio" id="rateus-2" name="rateus" value="2" class="peer/2 sr-only" />
        <label for="rateus-2" class="cursor-pointer text-gray-200 transition hover:text-yellow-400 peer-checked/2:text-yellow-400">
          <span class="sr-only">2 stars</span>
          <svg class="size-7" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.68-1.54 1.11l-3.56-2.58a1 1 0 00-1.18 0l-3.56 2.58c-.78.57-1.84-.19-1.54-1.11l1.36-4.18a1 1 0 00-.36-1.12L1.4 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z" /></svg>
        </label>

        <input type="radio" id="rateus-3" name="rateus" value="3" class="peer/3 sr-only" />
        <label for="rateus-3" class="cursor-pointer text-gray-200 transition hover:text-yellow-400 peer-checked/3:text-yellow-400">
          <span class="sr-only">3 stars</span>
          <svg class="size-7" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.68-1.54 1.11l-3.56-2.58a1 1 0 00-1.18 0l-3.56 2.58c-.78.57-1.84-.19-1.54-1.11l1.36-4.18a1 1 0 00-.36-1.12L1.4 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z" /></svg>
        </label>

        <input type="radio" id="rateus-4" name="rateus" value="4" class="peer/4 sr-only" checked />
        <label for="rateus-4" class="cursor-pointer text-gray-200 transition hover:text-yellow-400 peer-checked/4:text-yellow-400">
          <span class="sr-only">4 stars</span>
          <svg class="size-7" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.68-1.54 1.11l-3.56-2.58a1 1 0 00-1.18 0l-3.56 2.58c-.78.57-1.84-.19-1.54-1.11l1.36-4.18a1 1 0 00-.36-1.12L1.4 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z" /></svg>
        </label>

        <input type="radio" id="rateus-5" name="rateus" value="5" class="peer/5 sr-only" />
        <label for="rateus-5" class="cursor-pointer text-gray-200 transition hover:text-yellow-400 peer-checked/5:text-yellow-400">
          <span class="sr-only">5 stars</span>
          <svg class="size-7" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.68-1.54 1.11l-3.56-2.58a1 1 0 00-1.18 0l-3.56 2.58c-.78.57-1.84-.19-1.54-1.11l1.36-4.18a1 1 0 00-.36-1.12L1.4 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z" /></svg>
        </label>
      </fieldset>

      <div class="mt-4 flex items-center gap-2 rounded-md bg-green-50 px-3 py-2 text-sm text-green-800">
        <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        Thanks! Mind leaving a review on the App Store?
      </div>
    </div>
  </body>
</html>
