<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />

  </head>
  <body class="mx-auto flex max-w-sm flex-col gap-4 p-6">
    <div class="relative rounded-lg border border-gray-800 bg-gray-900 p-5">
      <button
        type="button"
        aria-label="Dismiss"
        class="absolute top-3 right-3 rounded-md p-1 text-gray-500 transition hover:bg-gray-800 hover:text-gray-300"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <p class="pr-6 text-sm font-semibold text-white">Sorry to hear that</p>

      </div>

      <label for="rateus-feedback-dark" class="mt-3 block text-xs font-medium text-gray-400">
        What could we improve?
      </label>
      <textarea
        id="rateus-feedback-dark"
        rows="3"
        placeholder="Tell us what went wrong…"
        class="mt-1.5 w-full resize-none rounded-md border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder:text-gray-500 focus:border-gray-100 focus:outline-none"
      ></textarea>

      <button
        type="button"
        class="mt-3 w-full rounded-md bg-gray-100 px-3 py-2 text-sm font-semibold text-gray-900 transition hover:bg-white"
      >
        Send feedback
      </button>
    </div>
  </body>
</html>
