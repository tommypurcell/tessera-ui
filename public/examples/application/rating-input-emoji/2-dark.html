<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-md flex-col gap-4 p-6">
    <div class="flex items-center justify-between gap-4 rounded-lg border border-gray-800 bg-gray-900 px-5 py-4">
      <p class="text-sm font-medium text-gray-200">Rate this article</p>

      <fieldset class="flex items-center gap-1">
        <legend class="sr-only">Satisfaction rating</legend>

        <input type="radio" id="rate2-1-dark" name="rate2-dark" value="1" class="peer/1 sr-only" />
        <label
          for="rate2-1-dark"
          class="flex size-8 cursor-pointer items-center justify-center rounded-full text-lg opacity-40 grayscale transition hover:opacity-100 hover:grayscale-0 peer-checked/1:bg-gray-800 peer-checked/1:opacity-100 peer-checked/1:grayscale-0"
        >
          <span aria-hidden="true">😡</span>
          <span class="sr-only">Terrible</span>
        </label>

        <input type="radio" id="rate2-2-dark" name="rate2-dark" value="2" class="peer/2 sr-only" />
        <label
          for="rate2-2-dark"
          class="flex size-8 cursor-pointer items-center justify-center rounded-full text-lg opacity-40 grayscale transition hover:opacity-100 hover:grayscale-0 peer-checked/2:bg-gray-800 peer-checked/2:opacity-100 peer-checked/2:grayscale-0"
        >
          <span aria-hidden="true">🙁</span>
          <span class="sr-only">Not great</span>
        </label>

        <input type="radio" id="rate2-3-dark" name="rate2-dark" value="3" class="peer/3 sr-only" />
        <label
          for="rate2-3-dark"
          class="flex size-8 cursor-pointer items-center justify-center rounded-full text-lg opacity-40 grayscale transition hover:opacity-100 hover:grayscale-0 peer-checked/3:bg-gray-800 peer-checked/3:opacity-100 peer-checked/3:grayscale-0"
        >
          <span aria-hidden="true">😐</span>
          <span class="sr-only">Okay</span>
        </label>

        <input type="radio" id="rate2-4-dark" name="rate2-dark" value="4" class="peer/4 sr-only" />
        <label
          for="rate2-4-dark"
          class="flex size-8 cursor-pointer items-center justify-center rounded-full text-lg opacity-40 grayscale transition hover:opacity-100 hover:grayscale-0 peer-checked/4:bg-gray-800 peer-checked/4:opacity-100 peer-checked/4:grayscale-0"
        >
          <span aria-hidden="true">🙂</span>
          <span class="sr-only">Good</span>
        </label>

        <input type="radio" id="rate2-5-dark" name="rate2-dark" value="5" class="peer/5 sr-only" checked />
        <label
          for="rate2-5-dark"
          class="flex size-8 cursor-pointer items-center justify-center rounded-full text-lg opacity-40 grayscale transition hover:opacity-100 hover:grayscale-0 peer-checked/5:bg-green-500/10 peer-checked/5:opacity-100 peer-checked/5:grayscale-0"
        >
          <span aria-hidden="true">😄</span>
          <span class="sr-only">Excellent</span>
        </label>
      </fieldset>
    </div>
  </body>
</html>
