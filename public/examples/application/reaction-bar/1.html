<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div role="group" aria-label="Reactions" class="flex flex-wrap items-center gap-1.5">
      <button type="button" aria-pressed="true" aria-label="Thumbs up, 8 reactions, you reacted" class="inline-flex items-center gap-1 rounded-full border border-blue-200 bg-blue-50 px-2 py-1 text-xs font-medium text-blue-700 hover:bg-blue-100">
        <span aria-hidden="true">👍</span>
        <span>8</span>
      </button>

      <button type="button" aria-pressed="false" aria-label="Heart, 3 reactions" class="inline-flex items-center gap-1 rounded-full border border-gray-200 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">
        <span aria-hidden="true">❤️</span>
        <span>3</span>
      </button>

      <button type="button" aria-pressed="false" aria-label="Party popper, 5 reactions" class="inline-flex items-center gap-1 rounded-full border border-gray-200 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">
        <span aria-hidden="true">🎉</span>
        <span>5</span>
      </button>

      <button type="button" aria-label="Add reaction" class="inline-flex size-6 items-center justify-center rounded-full border border-dashed border-gray-300 text-gray-400 hover:border-gray-400 hover:text-gray-600">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>
  </body>
</html>
