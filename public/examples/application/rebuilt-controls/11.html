<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div
      class="w-full max-w-md overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl"
      role="dialog"
      aria-label="Command palette"
    >
      <div class="flex items-center gap-2 border-b border-slate-200 px-3 py-2.5">
        <span class="text-slate-400" aria-hidden="true">⌘K</span>
        <input
          type="text"
          placeholder="Type a command or search…"
          aria-label="Command palette search"
          value="deploy"
          class="w-full border-none p-0 text-sm text-slate-900 outline-none placeholder:text-slate-400"
        />
      </div>
      <ul role="listbox" class="max-h-64 overflow-auto p-1.5 text-sm">
        <li class="px-2.5 py-1.5 text-xs font-semibold tracking-wide text-slate-400 uppercase">Actions</li>
        <li
          role="option"
          aria-selected="true"
          class="flex items-center justify-between rounded-md bg-blue-50 px-2.5 py-2 text-blue-700"
        >
          Deploy to production
          <kbd class="rounded bg-white px-1.5 py-0.5 text-xs text-slate-500">↵</kbd>
        </li>
        <li role="option" aria-selected="false" class="flex items-center justify-between rounded-md px-2.5 py-2 text-slate-700 hover:bg-slate-50">
          Deploy to staging
        </li>
        <li class="mt-1 px-2.5 py-1.5 text-xs font-semibold tracking-wide text-slate-400 uppercase">Navigation</li>
        <li role="option" aria-selected="false" class="rounded-md px-2.5 py-2 text-slate-700 hover:bg-slate-50">
          Go to settings
        </li>
      </ul>
    </div>
  </body>
</html>
