<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="w-full max-w-xs">
      <label class="mb-1.5 block text-sm font-medium text-slate-700" for="date-picker-trigger">
        Check-in date
      </label>
      <button
        id="date-picker-trigger"
        type="button"
        class="flex w-full items-center justify-between rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900"
      >
        March 14, 2026
        <span aria-hidden="true">📅</span>
      </button>
      <div class="mt-2 w-fit rounded-xl border border-slate-200 bg-white p-3 shadow-lg">
        <div class="mb-2 flex items-center justify-between">
          <button type="button" aria-label="Previous month" class="rounded-md p-1 text-slate-500 hover:bg-slate-100">
            ‹
          </button>
          <p class="text-xs font-semibold text-slate-900">March 2026</p>
          <button type="button" aria-label="Next month" class="rounded-md p-1 text-slate-500 hover:bg-slate-100">
            ›
          </button>
        </div>
        <div class="grid grid-cols-7 gap-0.5 text-center text-[11px] text-slate-400">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="mt-0.5 grid grid-cols-7 gap-0.5 text-center text-xs">
          <span class="py-1 text-slate-300">1</span>
          <span class="py-1 text-slate-700">2</span>
          <span class="py-1 text-slate-700">3</span>
          <span class="py-1 text-slate-700">4</span>
          <span class="py-1 text-slate-700">5</span>
          <span class="py-1 text-slate-700">6</span>
          <span class="py-1 text-slate-700">7</span>
          <span class="py-1 text-slate-700">8</span>
          <span class="py-1 text-slate-700">9</span>
          <span class="py-1 text-slate-700">10</span>
          <span class="py-1 text-slate-700">11</span>
          <span class="py-1 text-slate-700">12</span>
          <span class="py-1 text-slate-700">13</span>
          <button type="button" class="rounded-full bg-blue-600 py-1 font-semibold text-white">14</button>
        </div>
      </div>
    </div>
  </body>
</html>
