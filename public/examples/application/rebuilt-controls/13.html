<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="w-full max-w-xs">
      <label class="mb-1.5 block text-sm font-medium text-slate-700" for="date-input-example">
        Date of birth
      </label>
      <div class="relative">
        <input
          id="date-input-example"
          type="text"
          placeholder="YYYY-MM-DD"
          value="1994-06-21"
          class="w-full rounded-lg border border-slate-300 py-2 pr-9 pl-3 text-sm text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
        <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400" aria-hidden="true">
          📅
        </span>
      </div>
      <p class="mt-1.5 text-xs text-emerald-600">Valid date</p>
    </div>
  </body>
</html>
