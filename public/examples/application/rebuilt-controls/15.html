<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="flex h-72 w-full max-w-lg justify-end overflow-hidden rounded-xl border border-slate-200 bg-slate-900/10">
      <div class="flex h-full w-72 flex-col border-l border-slate-200 bg-white shadow-xl" role="dialog" aria-label="Edit item">
        <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
          <p class="text-sm font-semibold text-slate-900">Edit item</p>
          <button type="button" aria-label="Close panel" class="rounded-md p-1 text-slate-400 hover:bg-slate-100">
            ×
          </button>
        </div>
        <div class="flex-1 space-y-3 p-4">
          <div>
            <label class="mb-1 block text-xs font-medium text-slate-500">Title</label>
            <input
              type="text"
              value="Q3 roadmap review"
              class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-sm text-slate-900"
            />
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-slate-500">Status</label>
            <input
              type="text"
              value="In progress"
              class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-sm text-slate-900"
            />
          </div>
        </div>
        <div class="flex justify-end gap-2 border-t border-slate-200 px-4 py-3">
          <button type="button" class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700">
            Cancel
          </button>
          <button type="button" class="rounded-lg bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white">
            Save
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
