<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="flex h-64 w-full max-w-md items-center justify-center rounded-xl bg-slate-900/10 p-6">
      <div
        role="dialog"
        aria-label="Confirm deletion"
        class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-5 shadow-xl"
      >
        <div class="flex items-start gap-3">
          <div class="flex size-9 shrink-0 items-center justify-center rounded-full bg-red-50 text-red-600" aria-hidden="true">
            !
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-900">Delete this project?</p>
            <p class="mt-1 text-sm text-slate-500">
              This will permanently remove "Q3 launch plan" and all of its tasks. This action can't be undone.
            </p>
          </div>
        </div>
        <div class="mt-5 flex justify-end gap-2">
          <button type="button" class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700">
            Cancel
          </button>
          <button type="button" class="rounded-lg bg-red-600 px-3 py-1.5 text-sm font-semibold text-white">
            Delete
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
