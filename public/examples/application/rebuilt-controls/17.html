<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="flex h-32 w-full max-w-xs items-center justify-center">
      <div class="relative inline-block">
        <button
          type="button"
          aria-describedby="tooltip-example"
          class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700"
        >
          Hover me
        </button>
        <div
          id="tooltip-example"
          role="tooltip"
          class="absolute -top-9 left-1/2 -translate-x-1/2 rounded-md bg-slate-900 px-2.5 py-1.5 text-xs whitespace-nowrap text-white shadow-lg"
        >
          Saves your changes
          <span
            class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-900"
            aria-hidden="true"
          ></span>
        </div>
      </div>
    </div>
  </body>
</html>
