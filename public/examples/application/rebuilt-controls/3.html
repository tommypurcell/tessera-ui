<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="w-full max-w-xs rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <label class="mb-3 block text-sm font-medium text-slate-700">
        Enter the 6-digit code sent to your phone
      </label>
      <div class="flex justify-between gap-2" role="group" aria-label="One-time passcode">
        <input
          inputmode="numeric"
          maxlength="1"
          value="4"
          aria-label="Digit 1"
          class="size-11 rounded-lg border border-slate-300 text-center text-lg font-semibold text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
        <input
          inputmode="numeric"
          maxlength="1"
          value="2"
          aria-label="Digit 2"
          class="size-11 rounded-lg border border-slate-300 text-center text-lg font-semibold text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
        <input
          inputmode="numeric"
          maxlength="1"
          value="9"
          aria-label="Digit 3"
          class="size-11 rounded-lg border-2 border-blue-500 text-center text-lg font-semibold text-slate-900 ring-2 ring-blue-100"
        />
        <input
          inputmode="numeric"
          maxlength="1"
          aria-label="Digit 4"
          class="size-11 rounded-lg border border-slate-300 text-center text-lg font-semibold text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
        <input
          inputmode="numeric"
          maxlength="1"
          aria-label="Digit 5"
          class="size-11 rounded-lg border border-slate-300 text-center text-lg font-semibold text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
        <input
          inputmode="numeric"
          maxlength="1"
          aria-label="Digit 6"
          class="size-11 rounded-lg border border-slate-300 text-center text-lg font-semibold text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
      </div>
      <p class="mt-3 text-xs text-slate-500">
        Didn't get a code?
        <button type="button" class="font-medium text-blue-600 hover:text-blue-700">Resend</button>
      </p>
    </div>
  </body>
</html>
