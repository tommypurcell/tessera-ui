<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="w-full max-w-sm">
      <div
        class="flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 px-6 py-10 text-center"
      >
        <div
          class="flex size-11 items-center justify-center rounded-full bg-blue-50 text-blue-600"
          aria-hidden="true"
        >
          ⬆
        </div>
        <p class="text-sm font-medium text-slate-700">
          Drag and drop files here, or
          <button type="button" class="font-semibold text-blue-600 hover:text-blue-700">browse</button>
        </p>
        <p class="text-xs text-slate-500">PNG, JPG, or PDF up to 10MB</p>
      </div>
      <ul class="mt-3 space-y-2">
        <li class="flex items-center gap-3 rounded-lg border border-slate-200 p-2.5">
          <span
            class="flex size-8 shrink-0 items-center justify-center rounded bg-red-50 text-xs font-semibold text-red-600"
          >
            PDF
          </span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-slate-700">Design-brief-v3.pdf</p>
            <div class="mt-1 h-1.5 w-full rounded-full bg-slate-100">
              <div class="h-1.5 w-2/3 rounded-full bg-blue-500"></div>
            </div>
          </div>
          <span class="shrink-0 text-xs text-slate-500">68%</span>
        </li>
        <li class="flex items-center gap-3 rounded-lg border border-slate-200 p-2.5">
          <span
            class="flex size-8 shrink-0 items-center justify-center rounded bg-emerald-50 text-xs font-semibold text-emerald-600"
          >
            ✓
          </span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-slate-700">cover-photo.jpg</p>
          </div>
          <span class="shrink-0 text-xs text-emerald-600">Done</span>
        </li>
      </ul>
    </div>
  </body>
</html>
