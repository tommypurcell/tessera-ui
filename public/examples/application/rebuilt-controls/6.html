<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="w-full max-w-xs rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="mb-3 flex items-center justify-between">
        <button type="button" aria-label="Previous month" class="rounded-md p-1.5 text-slate-500 hover:bg-slate-100">
          ‹
        </button>
        <p class="text-sm font-semibold text-slate-900">March 2026</p>
        <button type="button" aria-label="Next month" class="rounded-md p-1.5 text-slate-500 hover:bg-slate-100">
          ›
        </button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-400">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="mt-1 grid grid-cols-7 gap-1 text-center text-sm">
        <span class="py-1.5 text-slate-300">22</span>
        <span class="py-1.5 text-slate-300">23</span>
        <span class="py-1.5 text-slate-300">24</span>
        <span class="py-1.5 text-slate-300">25</span>
        <span class="py-1.5 text-slate-300">26</span>
        <span class="py-1.5 text-slate-300">27</span>
        <span class="py-1.5 text-slate-300">28</span>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">1</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">2</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">3</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">4</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">5</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">6</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">7</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">8</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">9</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">10</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">11</button>
        <button
          type="button"
          aria-current="date"
          class="rounded-full bg-slate-100 py-1.5 font-semibold text-slate-900 ring-1 ring-inset ring-slate-300"
        >
          12
        </button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">13</button>
        <button type="button" aria-selected="true" class="rounded-full bg-blue-600 py-1.5 font-semibold text-white">
          14
        </button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">15</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">16</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">17</button>
        <button type="button" class="rounded-full py-1.5 text-slate-700 hover:bg-slate-100">18</button>
      </div>
    </div>
  </body>
</html>
