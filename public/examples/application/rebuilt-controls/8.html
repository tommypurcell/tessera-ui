<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="flex h-64 w-full max-w-lg overflow-hidden rounded-xl border border-slate-200 shadow-sm">
      <div class="w-40 shrink-0 border-r border-slate-200 bg-slate-50 p-3 text-sm text-slate-600">
        Panel A
        <p class="mt-1 text-xs text-slate-400">Resize using the handle</p>
      </div>
      <div
        role="separator"
        aria-orientation="vertical"
        tabindex="0"
        class="flex w-1.5 shrink-0 cursor-col-resize items-center justify-center bg-slate-100 hover:bg-blue-100"
      >
        <span class="h-8 w-0.5 rounded-full bg-slate-300"></span>
      </div>
      <div class="flex-1 bg-white p-3 text-sm text-slate-600">
        Panel B
        <p class="mt-1 text-xs text-slate-400">Grows to fill remaining space</p>
      </div>
      <div
        role="separator"
        aria-orientation="vertical"
        tabindex="0"
        class="flex w-1.5 shrink-0 cursor-col-resize items-center justify-center bg-slate-100 hover:bg-blue-100"
      >
        <span class="h-8 w-0.5 rounded-full bg-slate-300"></span>
      </div>
      <div class="w-32 shrink-0 border-l border-slate-200 bg-slate-50 p-3 text-sm text-slate-600">Panel C</div>
    </div>
  </body>
</html>
