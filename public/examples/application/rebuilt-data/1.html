<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="grid w-full max-w-2xl gap-4 sm:grid-cols-2">
      <div class="grid gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex items-start justify-between">
          <div>
            <p class="text-xs text-slate-500">Revenue</p>
            <p class="text-2xl font-semibold">$48,240</p>
          </div>
          <span class="rounded-full bg-emerald-50 px-2 py-1 text-xs text-emerald-700">+12.8%</span>
        </div>
        <div class="flex h-24 items-end gap-2 border-b border-l border-slate-200 px-3">
          <span class="h-1/3 flex-1 rounded-t bg-blue-200"></span
          ><span class="h-1/2 flex-1 rounded-t bg-blue-300"></span
          ><span class="h-2/3 flex-1 rounded-t bg-blue-400"></span
          ><span class="h-5/6 flex-1 rounded-t bg-blue-500"></span
          ><span class="h-full flex-1 rounded-t bg-blue-600"></span>
        </div>
      </div>
      <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-xs text-slate-500">
            <tr>
              <th class="px-3 py-2">Project</th>
              <th class="px-3 py-2">Status</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <tr>
              <th class="px-3 py-3 font-medium">Atlas</th>
              <td class="px-3 py-3 text-emerald-700">Active</td>
            </tr>
            <tr>
              <th class="px-3 py-3 font-medium">Northstar</th>
              <td class="px-3 py-3 text-amber-700">Review</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
