<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div class="w-full max-w-xs bg-white p-5 font-mono text-xs text-gray-800 shadow-lg ring-1 ring-white/10">
      <div class="text-center">
        <p class="text-sm font-semibold">Tessera Coffee Co.</p>
        <p class="mt-0.5 text-gray-500">482 Market St, San Francisco</p>
        <p class="text-gray-500">Mar 8, 2026 &middot; 9:14 AM</p>
      </div>

      <div class="mt-3 border-t border-dashed border-gray-300 pt-3">
        <div class="flex justify-between">
          <span>2x Cappuccino</span>
          <span>$9.00</span>
        </div>
        <div class="flex justify-between">
          <span>1x Almond Croissant</span>
          <span>$4.50</span>
        </div>
        <div class="flex justify-between">
          <span>1x Cold Brew</span>
          <span>$5.25</span>
        </div>
      </div>

      <div class="mt-3 border-t border-dashed border-gray-300 pt-3">
        <div class="flex justify-between text-gray-500">
          <span>Subtotal</span>
          <span>$18.75</span>
        </div>
        <div class="flex justify-between text-gray-500">
          <span>Tax</span>
          <span>$1.69</span>
        </div>
        <div class="mt-1 flex justify-between text-sm font-semibold text-gray-900">
          <span>Total</span>
          <span>$20.44</span>
        </div>
      </div>

      <div class="mt-4 border-t border-dashed border-gray-300 pt-3 text-center text-gray-500">
        <p>Thank you for visiting!</p>
        <p class="mt-1">Order #4821</p>
      </div>
    </div>
  </body>
</html>
