<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="w-72 rounded-xl border border-gray-200 bg-white shadow-lg">
      <div class="p-2">
        <label for="workspace-search" class="sr-only">Search workspaces</label>
        <input
          id="workspace-search"
          type="text"
          placeholder="Find a workspace…"
          class="w-full rounded-md border border-gray-300 px-3 py-1.5 text-sm text-gray-900 shadow-sm focus:border-gray-500 focus:outline-none"
        />
      </div>

      <div class="border-t border-gray-100 p-2">
        <p class="px-1 pb-1 text-xs font-semibold uppercase tracking-wide text-gray-400">Pinned</p>
        <ul>
          <li>
            <button type="button" aria-current="true" class="flex w-full items-center gap-2.5 rounded-md bg-gray-100 px-2 py-1.5 text-left">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-md bg-blue-600 text-xs font-semibold text-white">T</span>
              <span class="min-w-0 flex-1 truncate text-sm font-medium text-gray-900">Tessera UI</span>
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 shrink-0 text-blue-600">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </button>
          </li>
          <li>
            <button type="button" class="flex w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left hover:bg-gray-50">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-md bg-purple-600 text-xs font-semibold text-white">A</span>
              <span class="min-w-0 flex-1 truncate text-sm text-gray-700">Acme Marketing</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="border-t border-gray-100 p-2">
        <p class="px-1 pb-1 text-xs font-semibold uppercase tracking-wide text-gray-400">Recent</p>
        <ul>
          <li>
            <button type="button" class="flex w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left hover:bg-gray-50">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-md bg-emerald-600 text-xs font-semibold text-white">N</span>
              <span class="min-w-0 flex-1 truncate text-sm text-gray-700">Northwind Labs</span>
            </button>
          </li>
          <li>
            <button type="button" class="flex w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left hover:bg-gray-50">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-md bg-amber-600 text-xs font-semibold text-white">S</span>
              <span class="min-w-0 flex-1 truncate text-sm text-gray-700">Studio Pixel</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="border-t border-gray-100 p-2">
        <button type="button" class="flex w-full items-center gap-2.5 rounded-md px-2 py-1.5 text-left text-sm font-medium text-gray-700 hover:bg-gray-50">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Create workspace
        </button>
      </div>
    </div>
  </body>
</html>
