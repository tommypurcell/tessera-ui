<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div id="step-1" class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
      <div class="relative aspect-video w-full bg-gradient-to-br from-amber-300 to-orange-400">
        <span class="absolute top-3 left-3 flex size-7 items-center justify-center rounded-full bg-white text-sm font-bold text-gray-900 shadow">3</span>
      </div>

      <div class="p-4">
        <p class="text-sm text-gray-700">Simmer the sauce uncovered, stirring occasionally, until it thickens and coats the back of a spoon.</p>

        <div class="mt-3 flex items-center justify-between rounded-lg bg-gray-50 px-3 py-2">
          <span class="js-time font-mono text-lg font-semibold tabular-nums text-gray-900">08:00</span>
          <div class="flex items-center gap-1.5">
            <button type="button" class="js-toggle rounded-md bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700">Start</button>
            <button type="button" class="js-reset rounded-md border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      ;(function () {
        var root = document.getElementById('step-1')
        var timeEl = root.querySelector('.js-time')
        var toggleBtn = root.querySelector('.js-toggle')
        var resetBtn = root.querySelector('.js-reset')
        var totalSeconds = 8 * 60
        var remaining = totalSeconds
        var intervalId = null

        function format(seconds) {
          var mins = Math.floor(seconds / 60)
          var secs = seconds % 60
          return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0')
        }

        function render() {
          timeEl.textContent = format(remaining)
        }

        function tick() {
          if (remaining <= 0) {
            stop()
            return
          }
          remaining -= 1
          render()
          if (remaining <= 0) stop()
        }

        function start() {
          if (intervalId || remaining <= 0) return
          intervalId = setInterval(tick, 1000)
          toggleBtn.textContent = 'Pause'
        }

        function pause() {
          clearInterval(intervalId)
          intervalId = null
          toggleBtn.textContent = 'Start'
        }

        function stop() {
          clearInterval(intervalId)
          intervalId = null
          toggleBtn.textContent = 'Start'
        }

        toggleBtn.addEventListener('click', function () {
          if (intervalId) {
            pause()
          } else {
            start()
          }
        })

        resetBtn.addEventListener('click', function () {
          pause()
          remaining = totalSeconds
          render()
        })

        render()
      })()
    </script>
  </body>
</html>
