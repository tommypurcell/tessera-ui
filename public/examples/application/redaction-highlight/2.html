<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm divide-y divide-gray-100 rounded-lg border border-gray-200 bg-white shadow-sm">
      <div class="flex items-center justify-between px-3 py-2.5">
        <span class="text-xs font-medium text-gray-500">Social security number</span>
        <span class="flex items-center gap-1.5">
          <span class="rounded bg-gray-900 px-2 py-0.5 font-mono text-xs text-gray-900 select-none">000-00-0000</span>
          <button type="button" aria-label="Reveal social security number" class="text-gray-400 hover:text-gray-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </span>
      </div>

      <div class="flex items-center justify-between px-3 py-2.5">
        <span class="text-xs font-medium text-gray-500">Routing number</span>
        <span class="flex items-center gap-1.5">
          <span class="rounded bg-gray-900 px-2 py-0.5 font-mono text-xs text-gray-900 select-none">000000000</span>
          <button type="button" aria-label="Reveal routing number" class="text-gray-400 hover:text-gray-700">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </span>
      </div>

      <div class="flex items-center justify-between px-3 py-2.5">
        <span class="text-xs font-medium text-gray-500">Date of birth</span>
        <span class="text-xs text-gray-900">March 14, 1990</span>
      </div>
    </div>
  </body>
</html>
