<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs flex-col items-center gap-4 p-6">
    <div class="relative flex size-44 items-center justify-center">
      <svg class="size-44 -rotate-90" viewBox="0 0 160 160" role="img" aria-label="8 of 12 reps completed">
        <circle cx="80" cy="80" r="70" fill="none" stroke="currentColor" stroke-width="12" class="text-gray-800" />
        <circle
          cx="80"
          cy="80"
          r="70"
          fill="none"
          stroke="currentColor"
          stroke-width="12"
          stroke-linecap="round"
          stroke-dasharray="439.8"
          stroke-dashoffset="146.6"
          class="text-purple-400"
        />
      </svg>

      <div class="absolute flex flex-col items-center">
        <p class="font-mono text-4xl font-semibold text-white">8</p>
        <p class="text-xs font-medium text-gray-500">of 12 reps</p>
      </div>
    </div>

    <div class="text-center">
      <p class="text-sm font-semibold text-white">Set 2 of 4</p>
      <p class="text-xs text-gray-400">Barbell squat · 60kg</p>
    </div>

    <button
      type="button"
      class="w-full rounded-md bg-purple-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-purple-400"
    >
      Log rep
    </button>
  </body>
</html>
