<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-xl overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
      <div class="flex items-center gap-2 border-b border-gray-200 p-3">
        <label for="rb-method" class="sr-only">HTTP method</label>
        <select id="rb-method" class="h-9 shrink-0 rounded-md border border-gray-300 bg-emerald-50 px-2.5 text-sm font-semibold text-emerald-700 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900">
          <option>GET</option>
          <option selected>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
        </select>
        <input
          type="text"
          value="https://api.tessera-ui.com/v1/components"
          class="h-9 w-full rounded-md border border-gray-300 px-3 font-mono text-sm text-gray-900 shadow-sm focus:outline-none focus:ring-1 focus:ring-gray-900"
        />
        <button type="button" class="h-9 shrink-0 rounded-md bg-gray-900 px-4 text-sm font-medium text-white shadow-sm hover:bg-gray-800">Send</button>
      </div>

      <div class="flex items-center gap-4 border-b border-gray-200 px-3 text-sm">
        <button type="button" class="border-b-2 border-transparent py-2 font-medium text-gray-500 hover:text-gray-700">Params</button>
        <button type="button" aria-current="true" class="border-b-2 border-gray-900 py-2 font-medium text-gray-900">Headers</button>
        <button type="button" class="border-b-2 border-transparent py-2 font-medium text-gray-500 hover:text-gray-700">Body</button>
        <button type="button" class="border-b-2 border-transparent py-2 font-medium text-gray-500 hover:text-gray-700">Auth</button>
      </div>

      <div class="p-3">
        <div class="grid grid-cols-[1fr_1fr_auto] gap-2 text-xs font-medium text-gray-400">
          <span>KEY</span>
          <span>VALUE</span>
          <span></span>
        </div>
        <div class="mt-1.5 space-y-1.5">
          <div class="grid grid-cols-[1fr_1fr_auto] items-center gap-2">
            <input type="text" value="Content-Type" class="h-8 rounded-md border border-gray-200 px-2 font-mono text-xs text-gray-700" />
            <input type="text" value="application/json" class="h-8 rounded-md border border-gray-200 px-2 font-mono text-xs text-gray-700" />
            <button type="button" aria-label="Remove header" class="rounded p-1 text-gray-300 hover:bg-gray-100 hover:text-gray-600">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div class="grid grid-cols-[1fr_1fr_auto] items-center gap-2">
            <input type="text" value="Authorization" class="h-8 rounded-md border border-gray-200 px-2 font-mono text-xs text-gray-700" />
            <input type="text" value="Bearer &bull;&bull;&bull;&bull;&bull;&bull;" class="h-8 rounded-md border border-gray-200 px-2 font-mono text-xs text-gray-700" />
            <button type="button" aria-label="Remove header" class="rounded p-1 text-gray-300 hover:bg-gray-100 hover:text-gray-600">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
        <button type="button" class="mt-2 flex items-center gap-1 text-xs font-medium text-gray-500 hover:text-gray-700">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Add header
        </button>
      </div>
    </div>
  </body>
</html>
