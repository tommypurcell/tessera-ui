<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="overflow-hidden rounded-xl border border-gray-800 bg-gray-900">
      <table class="w-full table-fixed text-left text-sm">
        <thead>
          <tr class="border-b border-gray-800 text-xs font-medium uppercase tracking-wide text-gray-500">
            <th scope="col" class="group relative w-48 px-4 py-2.5">
              <button type="button" aria-label="Sort by Name, currently ascending" class="flex items-center gap-1 hover:text-gray-300">
                Name
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3 text-gray-100">
                  <path fill-rule="evenodd" d="M10 3a.75.75 0 0 1 .75.75v10.638l3.96-4.158a.75.75 0 1 1 1.08 1.04l-5.25 5.5a.75.75 0 0 1-1.08 0l-5.25-5.5a.75.75 0 1 1 1.08-1.04l3.96 4.158V3.75A.75.75 0 0 1 10 3Z" clip-rule="evenodd" transform="rotate(180 10 10)" />
                </svg>
              </button>
              <span aria-hidden="true" class="absolute right-0 top-0 h-full w-1 cursor-col-resize bg-transparent group-hover:bg-gray-700"></span>
            </th>
            <th scope="col" class="group relative w-32 px-4 py-2.5">
              <button type="button" aria-label="Sort by Status" class="flex items-center gap-1 hover:text-gray-300">
                Status
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3 text-gray-600">
                  <path fill-rule="evenodd" d="M10.53 3.47a.75.75 0 0 0-1.06 0l-3 3a.75.75 0 1 0 1.06 1.06L9.25 5.81v8.69a.75.75 0 0 0 1.5 0V5.81l1.72 1.72a.75.75 0 1 0 1.06-1.06l-3-3Z" clip-rule="evenodd" />
                </svg>
              </button>
              <span aria-hidden="true" class="absolute right-0 top-0 h-full w-1 cursor-col-resize bg-transparent group-hover:bg-gray-700"></span>
            </th>
            <th scope="col" class="group relative w-40 px-4 py-2.5">
              <button type="button" aria-label="Sort by Updated" class="flex items-center gap-1 hover:text-gray-300">
                Updated
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3 text-gray-600">
                  <path fill-rule="evenodd" d="M10.53 3.47a.75.75 0 0 0-1.06 0l-3 3a.75.75 0 1 0 1.06 1.06L9.25 5.81v8.69a.75.75 0 0 0 1.5 0V5.81l1.72 1.72a.75.75 0 1 0 1.06-1.06l-3-3Z" clip-rule="evenodd" />
                </svg>
              </button>
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-800">
          <tr>
            <td class="px-4 py-3 font-medium text-gray-100">Marketing site</td>
            <td class="px-4 py-3 text-gray-400">Active</td>
            <td class="px-4 py-3 text-gray-400">2 hours ago</td>
          </tr>
          <tr>
            <td class="px-4 py-3 font-medium text-gray-100">Docs portal</td>
            <td class="px-4 py-3 text-gray-400">Active</td>
            <td class="px-4 py-3 text-gray-400">Yesterday</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
