<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div
      class="flex h-80 w-full max-w-2xl flex-col overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm"
    >
      <div class="flex-1 overflow-auto p-4">
        <h3 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Preview</h3>
        <div class="mt-3 flex h-32 items-center justify-center rounded-md border border-dashed border-gray-300 text-sm text-gray-400">
          Canvas preview area
        </div>
      </div>

      <div
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize panels"
        tabindex="0"
        class="group relative h-px shrink-0 cursor-row-resize bg-gray-200 focus:outline-none"
      >
        <span
          class="absolute inset-x-0 top-1/2 h-4 -translate-y-1/2 group-hover:bg-gray-900/5 group-focus-visible:bg-gray-900/10"
        ></span>
        <span
          class="absolute left-1/2 top-1/2 h-1 w-8 -translate-x-1/2 -translate-y-1/2 rounded-full bg-gray-300 group-hover:bg-gray-400"
        ></span>
      </div>

      <div class="h-28 overflow-auto bg-gray-900 p-4">
        <h3 class="text-xs font-semibold uppercase tracking-wide text-gray-500">Console</h3>
        <pre class="mt-2 whitespace-pre-wrap font-mono text-xs leading-relaxed text-gray-300">$ pnpm dev
▲ Local:   http://localhost:4321
▲ ready in 312ms</pre>
      </div>
    </div>
  </body>
</html>
