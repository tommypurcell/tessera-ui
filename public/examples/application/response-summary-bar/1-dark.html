<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-950 p-5 shadow-sm">
      <div class="flex flex-col gap-3">
        <div>
          <div class="flex items-center justify-between text-sm">
            <span class="font-medium text-white">Very satisfied</span>
            <span class="text-gray-400">45% <span class="text-gray-500">(108)</span></span>
          </div>
          <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-gray-800">
            <div class="h-full rounded-full bg-blue-500" style="width: 45%"></div>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between text-sm">
            <span class="font-medium text-white">Satisfied</span>
            <span class="text-gray-400">30% <span class="text-gray-500">(72)</span></span>
          </div>
          <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-gray-800">
            <div class="h-full rounded-full bg-blue-500" style="width: 30%"></div>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between text-sm">
            <span class="font-medium text-white">Neutral</span>
            <span class="text-gray-400">15% <span class="text-gray-500">(36)</span></span>
          </div>
          <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-gray-800">
            <div class="h-full rounded-full bg-blue-500" style="width: 15%"></div>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between text-sm">
            <span class="font-medium text-white">Dissatisfied</span>
            <span class="text-gray-400">10% <span class="text-gray-500">(24)</span></span>
          </div>
          <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-gray-800">
            <div class="h-full rounded-full bg-blue-500" style="width: 10%"></div>
          </div>
        </div>
      </div>

      <p class="mt-4 border-t border-gray-800 pt-3 text-xs text-gray-500">240 responses</p>
    </div>
  </body>
</html>
