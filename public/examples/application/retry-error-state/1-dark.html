<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-md flex-col items-center p-6">
    <div class="flex w-full flex-col items-center rounded-lg border border-gray-800 px-6 py-12 text-center" role="alert">
      <div class="flex size-12 items-center justify-center rounded-full bg-red-950/50">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
      </div>

      <h3 class="mt-4 text-sm font-semibold text-white">Couldn't load your dashboard</h3>
      <p class="mt-1.5 max-w-xs text-sm text-gray-400">
        We ran into a problem reaching the server. Check your connection and try again.
      </p>

      <button
        type="button"
        class="mt-5 inline-flex items-center gap-1.5 rounded-md bg-gray-100 px-3.5 py-2 text-sm font-medium text-gray-900 hover:bg-white"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Try again
      </button>
    </div>
  </body>
</html>
