<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm p-6">
    <div class="flex items-start gap-3 rounded-lg border border-gray-200 bg-gray-50 p-4" role="alert">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="mt-0.5 size-5 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>

      <div class="flex flex-1 flex-col gap-1">
        <p class="text-sm font-medium text-gray-900">Failed to load recent activity</p>
        <p class="text-xs text-gray-500">Request timed out (504)</p>
      </div>

      <button
        type="button"
        class="shrink-0 rounded-md px-2.5 py-1 text-xs font-medium text-gray-700 hover:bg-gray-200"
      >
        Retry
      </button>
    </div>
  </body>
</html>
