<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-md rounded-lg border border-gray-700 bg-gray-900 p-5 shadow-sm">
      <p class="text-sm font-semibold text-white">Weekly active users</p>

      <div class="relative mt-24">
        <svg viewBox="0 0 320 120" class="w-full overflow-visible" aria-hidden="true">
          <line x1="0" y1="20" x2="320" y2="20" class="stroke-gray-800" stroke-width="1" />
          <line x1="0" y1="60" x2="320" y2="60" class="stroke-gray-800" stroke-width="1" />
          <line x1="0" y1="100" x2="320" y2="100" class="stroke-gray-800" stroke-width="1" />

          <polyline
            points="0,90 53,70 107,75 160,40 213,50 267,15 320,25"
            fill="none"
            class="stroke-blue-400"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <polyline
            points="0,100 53,95 107,80 160,85 213,65 267,60 320,45"
            fill="none"
            class="stroke-violet-400"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <line x1="267" y1="0" x2="267" y2="120" class="stroke-gray-700" stroke-width="1" stroke-dasharray="3 3" />
          <circle cx="267" cy="15" r="4" class="fill-blue-400 stroke-gray-900" stroke-width="2" />
          <circle cx="267" cy="60" r="4" class="fill-violet-400 stroke-gray-900" stroke-width="2" />
        </svg>

        <div class="absolute left-[83.4375%] top-0 w-44 -translate-x-1/2 -translate-y-[calc(100%+12px)] rounded-lg border border-gray-700 bg-gray-900 p-3 text-left shadow-lg shadow-black/40">
          <p class="text-xs font-medium text-gray-400">Thursday, Jun 12</p>
          <dl class="mt-2 space-y-1.5">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-1.5">
                <span class="size-2 shrink-0 rounded-full bg-blue-400"></span>
                <dt class="text-xs text-gray-400">Desktop</dt>
              </div>
              <dd class="text-xs font-semibold text-white">4,812</dd>
            </div>
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-1.5">
                <span class="size-2 shrink-0 rounded-full bg-violet-400"></span>
                <dt class="text-xs text-gray-400">Mobile</dt>
              </div>
              <dd class="text-xs font-semibold text-white">3,204</dd>
            </div>
          </dl>
          <div class="mt-2 flex items-center gap-1 border-t border-gray-800 pt-2 text-xs font-medium text-emerald-400">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
            </svg>
            +12.4% vs. last week
          </div>
        </div>
      </div>

      <div class="mt-4 flex items-center gap-4 text-xs text-gray-400">
        <span class="flex items-center gap-1.5"><span class="size-2 rounded-full bg-blue-400"></span>Desktop</span>
        <span class="flex items-center gap-1.5"><span class="size-2 rounded-full bg-violet-400"></span>Mobile</span>
      </div>
    </div>
  </body>
</html>
