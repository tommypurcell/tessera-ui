<!doctype html>

  <body class="mx-auto max-w-lg p-6">
    <div role="radiogroup" aria-label="Scene" class="grid grid-cols-2 gap-3">
      <button type="button" role="radio" aria-checked="true" class="flex flex-col items-center gap-2 rounded-xl border-2 border-blue-500 bg-blue-950 p-4">

        </svg>
        <span class="text-sm font-medium text-gray-200">Away</span>
      </button>

      <button type="button" role="radio" aria-checked="false" class="flex flex-col items-center gap-2 rounded-xl border border-gray-800 bg-gray-950 p-4 hover:bg-gray-900">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-gray-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
        <span class="text-sm font-medium text-gray-200">Movie Night</span>
      </button>

      <button type="button" role="radio" aria-checked="false" class="flex flex-col items-center gap-2 rounded-xl border border-gray-800 bg-gray-950 p-4 hover:bg-gray-900">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-gray-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />

        <span class="text-sm font-medium text-gray-200">Good Morning</span>
      </button>
    </div>
  </body>
</html>
