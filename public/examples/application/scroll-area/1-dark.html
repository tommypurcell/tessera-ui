    <style>
      .tessera-scroll-area {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 transparent;
      }
      .tessera-scroll-area::-webkit-scrollbar {
        width: 8px;
      }
      .tessera-scroll-area::-webkit-scrollbar-track {
        background: transparent;
      }
      .tessera-scroll-area::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .tessera-scroll-area::-webkit-scrollbar-thumb:hover {
        background-color: #6b7280;
      }
    </style>
  </head>
