<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm bg-gray-950 p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-900 p-5">
      <div class="mb-4 border-b border-gray-800 pb-2 text-center text-xs font-medium uppercase tracking-wide text-gray-500">Screen this way</div>

      <div class="flex flex-col items-center gap-2">
        <div class="flex items-center gap-2">
          <span class="w-4 text-right text-xs text-gray-500">A</span>
          <div class="flex gap-1.5">
            <button type="button" aria-label="Seat A1, available" class="flex size-7 items-center justify-center rounded-md text-[11px] font-medium text-gray-400 ring-1 ring-inset ring-gray-700 hover:bg-gray-800">1</button>
            <button type="button" aria-label="Seat A2, available" class="flex size-7 items-center justify-center rounded-md text-[11px] font-medium text-gray-400 ring-1 ring-inset ring-gray-700 hover:bg-gray-800">2</button>
          </div>
          <div class="w-4"></div>
          <div class="flex gap-1.5">
            <button type="button" aria-pressed="true" aria-label="Seat A3, selected" class="flex size-7 items-center justify-center rounded-md bg-white text-[11px] font-medium text-gray-900">3</button>
            <button type="button" aria-label="Seat A4, available" class="flex size-7 items-center justify-center rounded-md text-[11px] font-medium text-gray-400 ring-1 ring-inset ring-gray-700 hover:bg-gray-800">4</button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span class="w-4 text-right text-xs text-gray-500">B</span>
          <div class="flex gap-1.5">
            <button type="button" disabled aria-label="Seat B1, taken" class="flex size-7 items-center justify-center rounded-md bg-gray-800 text-[11px] text-gray-600">1</button>
            <button type="button" aria-label="Seat B2, available" class="flex size-7 items-center justify-center rounded-md text-[11px] font-medium text-gray-400 ring-1 ring-inset ring-gray-700 hover:bg-gray-800">2</button>
          </div>
          <div class="w-4"></div>
          <div class="flex gap-1.5">
            <button type="button" aria-pressed="true" aria-label="Seat B3, selected" class="flex size-7 items-center justify-center rounded-md bg-white text-[11px] font-medium text-gray-900">3</button>
            <button type="button" disabled aria-label="Seat B4, taken" class="flex size-7 items-center justify-center rounded-md bg-gray-800 text-[11px] text-gray-600">4</button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span class="w-4 text-right text-xs text-gray-500">C</span>
          <div class="flex gap-1.5">
            <button type="button" aria-label="Seat C1, available" class="flex size-7 items-center justify-center rounded-md text-[11px] font-medium text-gray-400 ring-1 ring-inset ring-gray-700 hover:bg-gray-800">1</button>
            <button type="button" aria-label="Seat C2, available" class="flex size-7 items-center justify-center rounded-md text-[11px] font-medium text-gray-400 ring-1 ring-inset ring-gray-700 hover:bg-gray-800">2</button>
          </div>
          <div class="w-4"></div>
          <div class="flex gap-1.5">
            <button type="button" aria-label="Seat C3, available" class="flex size-7 items-center justify-center rounded-md text-[11px] font-medium text-gray-400 ring-1 ring-inset ring-gray-700 hover:bg-gray-800">3</button>
            <button type="button" disabled aria-label="Seat C4, taken" class="flex size-7 items-center justify-center rounded-md bg-gray-800 text-[11px] text-gray-600">4</button>
          </div>
        </div>
      </div>

      <div class="mt-5 flex items-center justify-center gap-4 border-t border-gray-800 pt-3 text-xs text-gray-400">
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-sm ring-1 ring-inset ring-gray-700"></span>
          Available
        </span>
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-sm bg-gray-800"></span>
          Taken
        </span>
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-sm bg-white"></span>
          Selected
        </span>
      </div>
    </div>
  </body>
</html>
