<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="flex w-full max-w-md flex-col gap-3 rounded-lg border border-gray-200 bg-white p-6">
      <h2 class="text-sm font-medium text-gray-900">Traffic by device</h2>

      <div class="flex h-4 w-full overflow-hidden rounded-full">
        <div style="width: 55%; background-color: #2563eb" role="img" aria-label="Desktop: 1,100 (55%)"></div>
        <div style="width: 38%; background-color: #16a34a" role="img" aria-label="Mobile: 760 (38%)"></div>
        <div style="width: 7%; background-color: #d97706" role="img" aria-label="Tablet: 140 (7%)"></div>
      </div>

      <ul class="flex flex-wrap gap-x-5 gap-y-1.5 text-sm">
        <li class="flex items-center gap-1.5">
          <span aria-hidden="true" class="size-2.5 shrink-0 rounded-full" style="background-color: #2563eb"></span>
          <span class="text-gray-700">Desktop</span>
          <span class="font-medium text-gray-900">55%</span>
        </li>
        <li class="flex items-center gap-1.5">
          <span aria-hidden="true" class="size-2.5 shrink-0 rounded-full" style="background-color: #16a34a"></span>
          <span class="text-gray-700">Mobile</span>
          <span class="font-medium text-gray-900">38%</span>
        </li>
        <li class="flex items-center gap-1.5">
          <span aria-hidden="true" class="size-2.5 shrink-0 rounded-full" style="background-color: #d97706"></span>
          <span class="text-gray-700">Tablet</span>
          <span class="font-medium text-gray-900">7%</span>
        </li>
      </ul>
    </div>
  </body>
</html>
