<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-32 items-center justify-center bg-gray-900 p-6">
    <div role="tablist" aria-label="Slides" class="flex items-center gap-1.5">
      <button type="button" role="tab" aria-selected="false" aria-label="Go to slide 1" class="size-2 rounded-full bg-white/40"></button>
      <button type="button" role="tab" aria-selected="true" aria-label="Go to slide 2, current slide" class="h-2 w-5 rounded-full bg-white"></button>
      <button type="button" role="tab" aria-selected="false" aria-label="Go to slide 3" class="size-2 rounded-full bg-white/40"></button>
      <button type="button" role="tab" aria-selected="false" aria-label="Go to slide 4" class="size-2 rounded-full bg-white/40"></button>
      <button type="button" role="tab" aria-selected="false" aria-label="Go to slide 5" class="size-2 rounded-full bg-white/40"></button>
    </div>
  </body>
</html>
