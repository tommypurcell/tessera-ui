<!doctype html>
<html lang="en" class="font-sans antialiased">

    <link href="/component.css" rel="stylesheet" />

  <body class="flex justify-center p-6">
    <div class="w-full max-w-md rounded-lg border border-gray-200 bg-white p-4">

        <div class="flex items-start gap-3">
          <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085z" />

          </div>
        </div>
        <button type="button" class="shrink-0 rounded-md border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 shadow-sm hover:bg-gray-50">
          Schedule
        </button>
      </div>
      <div
        role="progressbar"
        aria-label="Mileage until oil change is due"
        aria-valuenow="44380"
        aria-valuemin="40000"
        aria-valuemax="45000"
        class="mt-3 h-2 w-full overflow-hidden rounded-full bg-gray-100"
      >
        <div class="h-full rounded-full bg-amber-500" style="width: 88%"></div>
      </div>
    </div>
  </body>
</html>
