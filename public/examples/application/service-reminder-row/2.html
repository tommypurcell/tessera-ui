<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="w-full max-w-md rounded-lg border border-gray-200 bg-white">
      <div class="border-b border-gray-200 px-4 py-3">
        <h2 class="text-sm font-semibold text-gray-900">Upcoming maintenance</h2>
      </div>
      <ul class="divide-y divide-gray-100">
        <li class="flex items-center justify-between gap-3 px-4 py-3">
          <div>
            <p class="text-sm font-medium text-gray-900">Brake inspection</p>
            <p class="mt-0.5 text-xs text-red-600">Overdue by 340 mi</p>
          </div>
          <button type="button" class="shrink-0 rounded-md bg-red-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-red-700">
            Schedule now
          </button>
        </li>
        <li class="flex items-center justify-between gap-3 px-4 py-3">
          <div>
            <p class="text-sm font-medium text-gray-900">Tire rotation</p>
            <p class="mt-0.5 text-xs text-amber-600">Due in 480 mi</p>
          </div>
          <button type="button" class="shrink-0 rounded-md border border-gray-300 px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">
            Schedule
          </button>
        </li>
        <li class="flex items-center justify-between gap-3 px-4 py-3">
          <div>
            <p class="text-sm font-medium text-gray-900">Cabin air filter</p>
            <p class="mt-0.5 text-xs text-gray-500">Due in 3,200 mi</p>
          </div>
          <button type="button" class="shrink-0 rounded-md border border-gray-300 px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">
            Schedule
          </button>
        </li>
      </ul>
    </div>
  </body>
</html>
