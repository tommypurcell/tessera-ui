<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-black/60 p-6">
    <div role="dialog" aria-modal="true" aria-labelledby="share-dialog-title" class="w-full max-w-sm rounded-xl border border-gray-800 bg-gray-900 p-6 shadow-2xl">
      <h2 id="share-dialog-title" class="text-base font-semibold text-white">Share "Q3 Roadmap"</h2>

      <div class="mt-4 flex gap-2">
        <input
          type="email"
          placeholder="Email address"
          class="w-full rounded-md border border-gray-700 bg-gray-900 px-3 py-2 text-sm text-white shadow-sm placeholder:text-gray-500 focus:border-gray-500 focus:outline-none"
        />
        <select class="rounded-md border border-gray-700 bg-gray-900 px-2.5 py-2 text-sm text-white shadow-sm focus:border-gray-500 focus:outline-none">
          <option>Can edit</option>
        </select>
        <button type="button" class="shrink-0 rounded-md bg-white px-3.5 py-2 text-sm font-medium text-gray-900 hover:bg-gray-200">Invite</button>
      </div>

      <div class="mt-5 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-gray-800 text-xs font-medium text-gray-300">NR</span>
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-white">Nandor the Relentless</p>
              <p class="truncate text-xs text-gray-500">nandor@nightclub.com</p>
            </div>
          </div>
          <span class="shrink-0 text-xs font-medium text-gray-400">Owner</span>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-gray-800 text-xs font-medium text-gray-300">NJ</span>
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-white">Nadja</p>
              <p class="truncate text-xs text-gray-500">nadja@nightclub.com</p>
            </div>
          </div>
          <select class="shrink-0 rounded-md border border-gray-700 bg-gray-900 px-2 py-1 text-xs text-gray-300 focus:border-gray-500 focus:outline-none">
            <option>Can edit</option>
          </select>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-gray-800 text-xs font-medium text-gray-300">GC</span>
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-white">Guillermo de la Cruz</p>
              <p class="truncate text-xs text-gray-500">guillermo@nightclub.com</p>
            </div>
          </div>
          <select class="shrink-0 rounded-md border border-gray-700 bg-gray-900 px-2 py-1 text-xs text-gray-300 focus:border-gray-500 focus:outline-none">
            <option>Can view</option>
          </select>
        </div>
      </div>

      <div class="mt-5 flex items-center justify-between gap-3 rounded-lg bg-gray-800 px-3 py-2.5">
        <div class="flex min-w-0 items-center gap-2">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 shrink-0 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
          </svg>
          <span class="truncate text-xs text-gray-400">Anyone with the link can view</span>
        </div>
        <button type="button" class="shrink-0 text-xs font-medium text-white hover:underline">Copy link</button>
      </div>
    </div>
  </body>
</html>
