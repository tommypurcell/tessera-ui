<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-start justify-center p-6">
    <div class="w-56">
      <label for="nav-filter" class="sr-only">Filter navigation</label>
      <div class="flex items-center rounded-md border border-gray-600 bg-gray-900 shadow-sm focus-within:border-gray-400 focus-within:ring-1 focus-within:ring-gray-400">

            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </span>
        <input
          type="text"
          id="nav-filter"
          value="dep"
          placeholder="Filter pages…"
          class="h-8 w-full border-0 bg-transparent px-2 text-sm text-white placeholder:text-gray-500 focus:outline-none focus:ring-0"
        />
      </div>

      <ul role="list" class="mt-2 flex flex-col gap-0.5">
        <li>
          <a href="#deployments" class="block rounded-md px-2.5 py-1.5 text-sm text-white">
            <mark class="rounded-sm bg-blue-400/20 text-white">Dep</mark>loyments
          </a>
        </li>
        <li>
          <a href="#dependencies" class="block rounded-md px-2.5 py-1.5 text-sm text-white">
            <mark class="rounded-sm bg-blue-400/20 text-white">Dep</mark>endencies
          </a>
        </li>
      </ul>
    </div>
