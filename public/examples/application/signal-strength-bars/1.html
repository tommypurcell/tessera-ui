<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-50 p-6">
    <div class="flex flex-col gap-4 rounded-lg border border-gray-200 bg-white p-5">
      <div class="flex items-center gap-2" role="img" aria-label="Signal strength: 3 of 4 bars, 5G">
        <div class="flex items-end gap-0.5">
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 9px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 12px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 15px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-200" style="height: 18px"></span>
        </div>
        <span class="text-xs font-medium text-gray-500">5G</span>
      </div>

      <div class="flex items-center gap-2" role="img" aria-label="Signal strength: 4 of 4 bars, 5G">
        <div class="flex items-end gap-0.5">
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 9px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 12px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 15px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 18px"></span>
        </div>
        <span class="text-xs font-medium text-gray-500">5G</span>
      </div>

      <div class="flex items-center gap-2" role="img" aria-label="Signal strength: 1 of 4 bars, LTE">
        <div class="flex items-end gap-0.5">
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-900" style="height: 9px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-200" style="height: 12px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-200" style="height: 15px"></span>
          <span aria-hidden="true" class="w-1 rounded-sm bg-gray-200" style="height: 18px"></span>
        </div>
        <span class="text-xs font-medium text-gray-500">LTE</span>
      </div>
    </div>
  </body>
</html>
