<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-sm">
      <span class="block text-sm font-medium text-gray-300" id="signature-pad-label-dark">Sign below</span>
      <div class="relative mt-1.5 h-40 w-full rounded-lg border border-gray-700 bg-gray-900 shadow-sm">
        <svg
          aria-hidden="true"
          viewBox="0 0 320 160"
          class="absolute inset-0 size-full text-white"
        >
          <path
            d="M30 110 C 50 60, 70 60, 85 100 S 120 130, 135 90 S 160 40, 180 95 S 210 140, 230 85 S 260 45, 280 100"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <div
          role="img"
          aria-label="Signature drawing area"
          class="absolute inset-x-4 bottom-3 border-t border-dashed border-gray-700"
        ></div>
      </div>
      <div class="mt-2 flex items-center justify-between">
        <p class="text-xs text-gray-400">Draw your signature using your mouse or finger.</p>
        <div class="flex shrink-0 gap-2">
          <button type="button" class="rounded-md border border-gray-700 bg-gray-900 px-2.5 py-1 text-xs font-medium text-gray-200 hover:bg-gray-800">
            Undo
          </button>
          <button type="button" class="rounded-md border border-gray-700 bg-gray-900 px-2.5 py-1 text-xs font-medium text-gray-200 hover:bg-gray-800">
            Clear
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
