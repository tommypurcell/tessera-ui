<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-sm rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-sm">
      <div role="tablist" aria-label="Signature method" class="inline-flex rounded-md bg-gray-800 p-0.5 text-sm">
        <button type="button" role="tab" aria-selected="false" class="rounded-[5px] px-3 py-1 font-medium text-gray-400 hover:text-gray-200">
          Draw
        </button>
        <button type="button" role="tab" aria-selected="true" class="rounded-[5px] bg-gray-900 px-3 py-1 font-medium text-white shadow-sm">
          Type
        </button>
      </div>

      <div class="mt-3">
        <label for="signature-pad-typed-dark" class="sr-only">Type your full name</label>
        <input
          id="signature-pad-typed-dark"
          type="text"
          value="Jordan Ellis"
          placeholder="Type your full name"
          class="block w-full rounded-md border-gray-700 bg-gray-800 text-sm text-gray-200 shadow-sm focus:border-white focus:ring-white"
        />
        <div class="mt-3 flex h-20 items-center justify-center rounded-md border border-dashed border-gray-700 bg-gray-800/60">
          <p class="text-3xl text-white" style="font-family: 'Brush Script MT', cursive">Jordan Ellis</p>
        </div>
      </div>

      <div class="mt-3 flex items-center justify-between">
        <p class="text-xs text-gray-400">By typing your name you agree this is your signature.</p>
        <button type="button" class="shrink-0 rounded-md bg-white px-3 py-1.5 text-xs font-semibold text-gray-900 hover:bg-gray-200">
          Confirm
        </button>
      </div>
    </div>
  </body>
</html>
