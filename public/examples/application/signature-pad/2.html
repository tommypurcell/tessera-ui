<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <div role="tablist" aria-label="Signature method" class="inline-flex rounded-md bg-gray-100 p-0.5 text-sm">
        <button type="button" role="tab" aria-selected="false" class="rounded-[5px] px-3 py-1 font-medium text-gray-500 hover:text-gray-700">
          Draw
        </button>
        <button type="button" role="tab" aria-selected="true" class="rounded-[5px] bg-white px-3 py-1 font-medium text-gray-900 shadow-sm">
          Type
        </button>
      </div>

      <div class="mt-3">
        <label for="signature-pad-typed" class="sr-only">Type your full name</label>
        <input
          id="signature-pad-typed"
          type="text"
          value="Jordan Ellis"
          placeholder="Type your full name"
          class="block w-full rounded-md border-gray-300 text-sm text-gray-700 shadow-sm focus:border-gray-900 focus:ring-gray-900"
        />
        <div class="mt-3 flex h-20 items-center justify-center rounded-md border border-dashed border-gray-300 bg-gray-50">
          <p class="text-3xl text-gray-900" style="font-family: 'Brush Script MT', cursive">Jordan Ellis</p>
        </div>
      </div>

      <div class="mt-3 flex items-center justify-between">
        <p class="text-xs text-gray-500">By typing your name you agree this is your signature.</p>
        <button type="button" class="shrink-0 rounded-md bg-gray-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-gray-700">
          Confirm
        </button>
      </div>
    </div>
  </body>
</html>
