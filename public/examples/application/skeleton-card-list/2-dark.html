<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <div class="flex flex-col divide-y divide-gray-800 rounded-lg border border-gray-800" role="status" aria-label="Loading list">
      <div class="flex items-center gap-3 p-4">
        <div class="size-10 shrink-0 animate-pulse rounded-full bg-gray-800"></div>
        <div class="flex flex-1 flex-col gap-2">
          <div class="h-3.5 w-1/2 animate-pulse rounded bg-gray-800"></div>
          <div class="h-3 w-1/3 animate-pulse rounded bg-gray-800"></div>
        </div>
      </div>

      <div class="flex items-center gap-3 p-4">
        <div class="size-10 shrink-0 animate-pulse rounded-full bg-gray-800"></div>
        <div class="flex flex-1 flex-col gap-2">
          <div class="h-3.5 w-2/3 animate-pulse rounded bg-gray-800"></div>
          <div class="h-3 w-1/4 animate-pulse rounded bg-gray-800"></div>
        </div>
      </div>

      <div class="flex items-center gap-3 p-4">
        <div class="size-10 shrink-0 animate-pulse rounded-full bg-gray-800"></div>
        <div class="flex flex-1 flex-col gap-2">
          <div class="h-3.5 w-2/5 animate-pulse rounded bg-gray-800"></div>
          <div class="h-3 w-1/3 animate-pulse rounded bg-gray-800"></div>
        </div>
      </div>

      <span class="sr-only">Loading content&hellip;</span>
    </div>
  </body>
</html>
