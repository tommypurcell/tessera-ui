<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="min-h-[520px] bg-gray-50">
    <div class="fixed inset-0 bg-gray-900/30" aria-hidden="true"></div>

    <div role="dialog" aria-modal="true" aria-labelledby="slide-over-title" class="fixed inset-y-0 right-0 flex w-full max-w-sm flex-col border-l border-gray-200 bg-white shadow-xl">
      <div class="flex shrink-0 items-start justify-between border-b border-gray-200 px-5 py-4">
        <div>
          <h2 id="slide-over-title" class="text-sm font-semibold text-gray-900">New team member</h2>
          <p class="mt-0.5 text-xs text-gray-500">Invite someone and set their role.</p>
        </div>
        <button type="button" aria-label="Close" class="rounded-md p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto px-5 py-4">
        <div class="space-y-4">
          <div>
            <label for="so-name" class="mb-1.5 block text-sm font-medium text-gray-700">Full name</label>
            <input type="text" id="so-name" value="Priya Nair" class="h-10 w-full rounded-md border border-gray-300 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900" />
          </div>
          <div>
            <label for="so-email" class="mb-1.5 block text-sm font-medium text-gray-700">Email address</label>
            <input type="email" id="so-email" value="priya@acme.com" class="h-10 w-full rounded-md border border-gray-300 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900" />
          </div>
          <div>
            <label for="so-role" class="mb-1.5 block text-sm font-medium text-gray-700">Role</label>
            <select id="so-role" class="h-10 w-full rounded-md border border-gray-300 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900">
              <option>Member</option>
              <option selected>Admin</option>
              <option>Owner</option>
            </select>
          </div>
          <div>
            <label for="so-note" class="mb-1.5 block text-sm font-medium text-gray-700">Note (optional)</label>
            <textarea id="so-note" rows="3" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900" placeholder="Add context for the rest of the team…"></textarea>
          </div>
          <label class="flex items-start gap-2">
            <input type="checkbox" checked class="mt-0.5 size-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900" />
            <span class="text-sm text-gray-600">Send an email invite immediately</span>
          </label>
        </div>
      </div>

      <div class="flex shrink-0 items-center justify-end gap-2 border-t border-gray-200 bg-gray-50 px-5 py-3">
        <button type="button" class="rounded-md border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:bg-gray-50">Cancel</button>
        <button type="button" class="rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-gray-800">Send invite</button>
      </div>
    </div>
  </body>
</html>
