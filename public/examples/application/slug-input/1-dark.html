<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div class="w-full max-w-sm">
      <div class="flex flex-col gap-1.5">
        <label for="slug-title-dark" class="text-sm font-medium text-gray-300">Title</label>
        <input
          id="slug-title-dark"
          type="text"
          value="How to Write Better Tailwind CSS"
          class="rounded-md border border-gray-700 bg-gray-900 px-3 py-2 text-sm text-white shadow-sm focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div class="mt-3 flex flex-col gap-1.5">
        <label for="slug-value-dark" class="text-sm font-medium text-gray-300">URL slug</label>
        <div class="flex items-center gap-1 rounded-md border border-blue-500 bg-gray-900 px-3 py-2 shadow-sm focus-within:border-blue-400">
          <span class="shrink-0 text-sm text-gray-500">tessera.dev/blog/</span>
          <input
            id="slug-value-dark"
            type="text"
            value="how-to-write-better-tailwind-css"
            class="min-w-0 flex-1 border-0 bg-transparent p-0 text-sm text-white focus:outline-none"
          />
        </div>
        <p class="text-xs text-gray-500">Auto-generated from the title. Edit to set a custom URL.</p>
      </div>
    </div>
  </body>
</html>
