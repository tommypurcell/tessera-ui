<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-72 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-md rounded-lg border border-gray-700 bg-gray-900 p-5 shadow-sm">
      <p class="text-sm font-semibold text-white">Spending by category</p>
      <p class="text-xs text-gray-400">This month</p>

      <div class="mt-4 flex items-center gap-6">
        <div class="relative shrink-0" style="width: 180px; height: 180px">
          <svg viewBox="0 0 180 180" class="size-full">
            <circle cx="90.0" cy="90.0" r="70" fill="none" stroke="#374151" stroke-width="22" />
            <circle cx="90.0" cy="90.0" r="70" fill="none" stroke="#60a5fa" stroke-width="22" stroke-dasharray="227.77 212.06" stroke-dashoffset="0.00" transform="rotate(-90 90.0 90.0)" />
          <circle cx="90.0" cy="90.0" r="70" fill="none" stroke="#a78bfa" stroke-width="22" stroke-dasharray="97.39 342.43" stroke-dashoffset="-227.77" transform="rotate(-90 90.0 90.0)" />
          <circle cx="90.0" cy="90.0" r="70" fill="none" stroke="#f472b6" stroke-width="22" stroke-dasharray="53.41 386.42" stroke-dashoffset="-325.15" transform="rotate(-90 90.0 90.0)" />
          <circle cx="90.0" cy="90.0" r="70" fill="none" stroke="#fbbf24" stroke-width="22" stroke-dasharray="28.27 411.55" stroke-dashoffset="-378.56" transform="rotate(-90 90.0 90.0)" />
          <circle cx="90.0" cy="90.0" r="70" fill="none" stroke="#34d399" stroke-width="22" stroke-dasharray="32.99 406.84" stroke-dashoffset="-406.84" transform="rotate(-90 90.0 90.0)" />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-xl font-semibold text-white">$2,800</span>
            <span class="text-xs text-gray-400">total</span>
          </div>
        </div>

        <div class="min-w-0 flex-1 space-y-2">
          <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="size-2.5 rounded-full" style="background-color: #60a5fa"></span><span class="text-white">Housing</span></span><span class="text-gray-400">$1,450 <span class="ml-1 text-xs">(52%)</span></span></div>
        <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="size-2.5 rounded-full" style="background-color: #a78bfa"></span><span class="text-white">Food</span></span><span class="text-gray-400">$620 <span class="ml-1 text-xs">(22%)</span></span></div>
        <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="size-2.5 rounded-full" style="background-color: #f472b6"></span><span class="text-white">Transport</span></span><span class="text-gray-400">$340 <span class="ml-1 text-xs">(12%)</span></span></div>
        <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="size-2.5 rounded-full" style="background-color: #fbbf24"></span><span class="text-white">Subscriptions</span></span><span class="text-gray-400">$180 <span class="ml-1 text-xs">(6%)</span></span></div>
        <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="size-2.5 rounded-full" style="background-color: #34d399"></span><span class="text-white">Other</span></span><span class="text-gray-400">$210 <span class="ml-1 text-xs">(8%)</span></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
