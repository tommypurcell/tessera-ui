<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm justify-center p-6">
    <div class="relative inline-flex">
      <span class="inline-flex divide-x divide-indigo-400 overflow-hidden rounded-md shadow-sm">
        <button
          type="button"
          class="bg-indigo-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-400 focus:relative focus:z-10 focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-gray-900 focus:outline-none"
        >
          Deploy
        </button>

        <button
          type="button"
          data-menu-toggle
          aria-haspopup="menu"
          aria-expanded="false"
          aria-label="More deploy options"
          class="bg-indigo-500 px-2 py-2 text-white transition-colors hover:bg-indigo-400 focus:relative focus:z-10 focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-gray-900 focus:outline-none"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
      </span>

      <div
        data-menu
        role="menu"
        hidden
        class="absolute end-0 top-11 z-10 w-56 overflow-hidden rounded-md border border-gray-700 bg-gray-800 py-1 shadow-lg"
      >
        <button type="button" role="menuitem" class="block w-full px-3 py-2 text-left text-sm text-gray-200 hover:bg-gray-700">
          Deploy to staging
        </button>
        <button type="button" role="menuitem" class="block w-full px-3 py-2 text-left text-sm text-gray-200 hover:bg-gray-700">
          Deploy to preview
        </button>
        <button type="button" role="menuitem" class="block w-full px-3 py-2 text-left text-sm text-gray-200 hover:bg-gray-700">
          Schedule deployment&hellip;
        </button>
      </div>
    </div>

    <script>
      const toggleEl = document.querySelector('[data-menu-toggle]')
      const menuEl = document.querySelector('[data-menu]')

      toggleEl.addEventListener('click', () => {
        const isOpen = !menuEl.hidden
        menuEl.hidden = isOpen
        toggleEl.setAttribute('aria-expanded', String(!isOpen))
      })

      document.addEventListener('click', (event) => {
        if (!event.target.closest('[data-menu-toggle]') && !event.target.closest('[data-menu]')) {
          menuEl.hidden = true
          toggleEl.setAttribute('aria-expanded', 'false')
        }
      })
    </script>
  </body>
</html>
