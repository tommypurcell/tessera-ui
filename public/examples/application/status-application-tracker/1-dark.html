            <span class="text-[11px] font-medium text-gray-500">Decision</span>
          </div>

      <dl class="mt-5 grid grid-cols-2 gap-3 border-t border-gray-800 pt-4 text-sm">
        <div>
          <dt class="text-xs text-gray-500">Processing office</dt>
