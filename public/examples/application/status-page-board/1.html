<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-xl border border-gray-200 bg-white">
      <div class="flex items-center gap-2 border-b border-gray-200 px-4 py-3">
        <span class="size-2 rounded-full bg-green-500"></span>
        <span class="text-sm font-medium text-gray-900">All systems operational</span>
      </div>

      <div class="divide-y divide-gray-100">
        <div class="px-4 py-2.5 text-xs font-medium uppercase tracking-wide text-gray-400">Core services</div>

        <div class="flex items-center justify-between px-4 py-3">
          <span class="text-sm text-gray-700">API</span>
          <div class="flex items-center gap-3">
            <div class="flex items-end gap-0.5" aria-hidden="true">
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
            </div>
            <span class="inline-flex items-center gap-1.5 rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">
              <span class="size-1.5 rounded-full bg-green-500"></span>
              Operational
            </span>
          </div>
        </div>

        <div class="flex items-center justify-between px-4 py-3">
          <span class="text-sm text-gray-700">Dashboard</span>
          <div class="flex items-center gap-3">
            <div class="flex items-end gap-0.5" aria-hidden="true">
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
            </div>
            <span class="inline-flex items-center gap-1.5 rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">
              <span class="size-1.5 rounded-full bg-green-500"></span>
              Operational
            </span>
          </div>
        </div>

        <div class="px-4 py-2.5 text-xs font-medium uppercase tracking-wide text-gray-400">Infrastructure</div>

        <div class="flex items-center justify-between px-4 py-3">
          <span class="text-sm text-gray-700">Webhooks</span>
          <div class="flex items-center gap-3">
            <div class="flex items-end gap-0.5" aria-hidden="true">
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-yellow-400"></span>
              <span class="h-3 w-1 rounded-sm bg-yellow-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
            </div>
            <span class="inline-flex items-center gap-1.5 rounded-full bg-yellow-100 px-2 py-0.5 text-xs font-medium text-yellow-700">
              <span class="size-1.5 rounded-full bg-yellow-500"></span>
              Degraded
            </span>
          </div>
        </div>

        <div class="flex items-center justify-between px-4 py-3">
          <span class="text-sm text-gray-700">File storage</span>
          <div class="flex items-center gap-3">
            <div class="flex items-end gap-0.5" aria-hidden="true">
              <span class="h-3 w-1 rounded-sm bg-red-400"></span>
              <span class="h-3 w-1 rounded-sm bg-red-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
              <span class="h-3 w-1 rounded-sm bg-green-400"></span>
            </div>
            <span class="inline-flex items-center gap-1.5 rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700">
              <span class="size-1.5 rounded-full bg-red-500"></span>
              Outage
            </span>
          </div>
        </div>
      </div>

      <div class="border-t border-gray-200 px-4 py-2.5 text-xs text-gray-400">Uptime over last 6 hours</div>
    </div>
  </body>
</html>
