<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-stretch justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-2xl overflow-hidden rounded-lg border border-gray-700 bg-gray-900 shadow-sm">
      <nav aria-label="Onboarding steps" class="w-56 shrink-0 border-r border-gray-700 bg-white/5 p-5">
        <ol class="space-y-1">
          <li>
            <div class="flex items-center gap-3 rounded-md px-2 py-2">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-white">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
              </span>
              <span class="text-sm font-medium text-gray-500">Account details</span>
            </div>
          </li>
          <li>
            <div class="flex items-center gap-3 rounded-md px-2 py-2">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-white">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
              </span>
              <span class="text-sm font-medium text-gray-500">Workspace setup</span>
            </div>
          </li>
          <li>
            <div aria-current="step" class="flex items-center gap-3 rounded-md bg-gray-800 px-2 py-2 shadow-sm ring-1 ring-gray-700">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-gray-900">3</span>
              <span class="text-sm font-semibold text-white">Invite your team</span>
            </div>
          </li>
          <li>
            <div class="flex items-center gap-3 rounded-md px-2 py-2">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full border-2 border-gray-600 text-xs font-medium text-gray-500">4</span>
              <span class="text-sm font-medium text-gray-500">Connect billing</span>
            </div>
          </li>
          <li>
            <div class="flex items-center gap-3 rounded-md px-2 py-2">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full border-2 border-gray-600 text-xs font-medium text-gray-500">5</span>
              <span class="text-sm font-medium text-gray-500">Review &amp; finish</span>
            </div>
          </li>
        </ol>
      </nav>

      <div class="flex-1 p-6">
        <h2 class="text-sm font-semibold text-white">Invite your team</h2>
        <p class="mt-1 text-xs text-gray-400">Add teammates by email — you can always invite more later.</p>

        <div class="mt-4 space-y-2">
          <div class="h-10 rounded-md border border-gray-700 bg-gray-800"></div>
          <div class="h-10 rounded-md border border-gray-700 bg-gray-800"></div>
        </div>

        <div class="mt-5 flex items-center justify-between">
          <button type="button" class="text-sm font-medium text-gray-400 hover:text-gray-200">Back</button>
          <button type="button" class="rounded-md bg-white px-3 py-1.5 text-sm font-medium text-gray-900 shadow-sm hover:bg-gray-200">Continue</button>
        </div>
      </div>
    </div>
  </body>
</html>
