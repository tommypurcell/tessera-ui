<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-sm flex-col p-6">
    <div class="h-80 overflow-y-auto rounded-lg border border-gray-800 bg-gray-900">
      <div>
        <h2 class="sticky top-0 z-10 border-b border-gray-800 bg-gray-900/95 px-4 py-2 text-sm font-semibold text-white backdrop-blur">
          Account
        </h2>
        <ul role="list" class="divide-y divide-gray-800/60">
          <li class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-300">Profile information</span>
            <svg class="size-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </li>
          <li class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-300">Password &amp; security</span>
            <svg class="size-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </li>
        </ul>
      </div>

      <div>
        <h2 class="sticky top-0 z-10 border-b border-gray-800 bg-gray-900/95 px-4 py-2 text-sm font-semibold text-white backdrop-blur">
          Notifications
        </h2>
        <ul role="list" class="divide-y divide-gray-800/60">
          <li class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-300">Email preferences</span>
            <svg class="size-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </li>
          <li class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-300">Push notifications</span>
            <svg class="size-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </li>
        </ul>
      </div>

      <div>
        <h2 class="sticky top-0 z-10 border-b border-gray-800 bg-gray-900/95 px-4 py-2 text-sm font-semibold text-white backdrop-blur">
          Billing
        </h2>
        <ul role="list" class="divide-y divide-gray-800/60">
          <li class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-300">Payment methods</span>
            <svg class="size-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </li>
          <li class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-300">Billing history</span>
            <svg class="size-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
