<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <ul class="flex gap-4 overflow-x-auto pb-1" aria-label="Stories">
      <li class="flex shrink-0 flex-col items-center gap-1.5">
        <button
          type="button"
          aria-label="Add to your story"
          class="relative flex size-16 items-center justify-center rounded-full border-2 border-dashed border-gray-700 text-gray-500 hover:border-gray-600 hover:text-gray-400"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
        <span class="text-xs text-gray-400">Your story</span>
      </li>

      <li class="flex shrink-0 flex-col items-center gap-1.5">
        <span class="inline-flex rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 p-1">
          <span class="inline-flex rounded-full bg-gray-950 p-0.5">
            <img
              src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=96&h=96&fit=crop&crop=faces"
              alt="Ava Wilson's story, unseen"
              class="size-14 rounded-full object-cover"
            />
          </span>
        </span>
        <span class="text-xs text-gray-400">Ava</span>
      </li>

      <li class="flex shrink-0 flex-col items-center gap-1.5">
        <span class="inline-flex rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 p-1">
          <span class="inline-flex rounded-full bg-gray-950 p-0.5">
            <img
              src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=96&h=96&fit=crop&crop=faces"
              alt="Marcus Chen's story, unseen"
              class="size-14 rounded-full object-cover"
            />
          </span>
        </span>
        <span class="text-xs text-gray-400">Marcus</span>
      </li>

      <li class="flex shrink-0 flex-col items-center gap-1.5">
        <span class="inline-flex rounded-full bg-gray-700 p-1">
          <span class="inline-flex rounded-full bg-gray-950 p-0.5">
            <img
              src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=96&h=96&fit=crop&crop=faces"
              alt="Sofia Ramirez's story, seen"
              class="size-14 rounded-full object-cover"
            />
          </span>
        </span>
        <span class="text-xs text-gray-500">Sofia</span>
      </li>
    </ul>
  </body>
</html>
