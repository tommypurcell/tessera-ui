<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <ul class="flex gap-3" aria-label="Stories">
      <li>
        <span class="inline-flex rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 p-0.5">
          <span class="inline-flex rounded-full bg-gray-950 p-0.5">
            <img
              src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=72&h=72&fit=crop&crop=faces"
              alt="Ava Wilson's story, unseen"
              class="size-11 rounded-full object-cover"
            />
          </span>
        </span>
      </li>
      <li>
        <span class="inline-flex rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 p-0.5">
          <span class="inline-flex rounded-full bg-gray-950 p-0.5">
            <img
              src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=72&h=72&fit=crop&crop=faces"
              alt="Marcus Chen's story, unseen"
              class="size-11 rounded-full object-cover"
            />
          </span>
        </span>
      </li>
      <li>
        <span class="inline-flex rounded-full bg-gray-700 p-0.5">
          <span class="inline-flex rounded-full bg-gray-950 p-0.5">
            <img
              src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=72&h=72&fit=crop&crop=faces"
              alt="Sofia Ramirez's story, seen"
              class="size-11 rounded-full object-cover"
            />
          </span>
        </span>
      </li>
      <li>
        <button
          type="button"
          aria-label="View 5 more stories"
          class="flex size-11 items-center justify-center rounded-full bg-gray-800 text-xs font-semibold text-gray-300 hover:bg-gray-700"
        >
          +5
        </button>
      </li>
    </ul>
  </body>
</html>
