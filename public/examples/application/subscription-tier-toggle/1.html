<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="flex flex-col items-center gap-3">
      <div role="radiogroup" aria-label="Billing period" class="inline-flex items-center gap-1 rounded-full bg-gray-100 p-1">
        <button type="button" role="radio" aria-checked="false" class="rounded-full px-4 py-1.5 text-sm font-medium text-gray-600 hover:text-gray-900">
          Monthly
        </button>
        <button type="button" role="radio" aria-checked="true" class="inline-flex items-center gap-1.5 rounded-full bg-white px-4 py-1.5 text-sm font-semibold text-gray-900 shadow-sm">
          Annual
          <span class="rounded-full bg-emerald-100 px-1.5 py-0.5 text-xs font-semibold text-emerald-700">
            Save 20%
          </span>
        </button>
      </div>

      <p class="text-sm text-gray-500">
        <span class="text-2xl font-semibold text-gray-900">$16</span>
        /month, billed annually
      </p>
    </div>
  </body>
</html>
