<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-sm">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-semibold text-gray-900">Recommended for you</h2>
        <button type="button" class="text-xs font-medium text-gray-500">See all</button>
      </div>

      <div class="mt-3 flex snap-x snap-mandatory gap-3 overflow-x-auto pb-2 pl-1 pr-8 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        <div class="w-[72%] shrink-0 snap-start rounded-xl border border-gray-200 bg-white shadow-sm">
          <div class="h-28 w-full rounded-t-xl bg-gradient-to-br from-indigo-200 to-indigo-400"></div>
          <div class="p-3">
            <p class="text-sm font-semibold text-gray-900">Wireless earbuds</p>
            <p class="mt-0.5 text-xs text-gray-500">Active noise cancelling</p>
            <p class="mt-1.5 text-sm font-bold text-gray-900">$89.00</p>
          </div>
        </div>

        <div class="w-[72%] shrink-0 snap-start rounded-xl border border-gray-200 bg-white shadow-sm">
          <div class="h-28 w-full rounded-t-xl bg-gradient-to-br from-amber-200 to-amber-400"></div>
          <div class="p-3">
            <p class="text-sm font-semibold text-gray-900">Desk lamp</p>
            <p class="mt-0.5 text-xs text-gray-500">Adjustable warm light</p>
            <p class="mt-1.5 text-sm font-bold text-gray-900">$34.00</p>
          </div>
        </div>

        <div class="w-[72%] shrink-0 snap-start rounded-xl border border-gray-200 bg-white shadow-sm">
          <div class="h-28 w-full rounded-t-xl bg-gradient-to-br from-emerald-200 to-emerald-400"></div>
          <div class="p-3">
            <p class="text-sm font-semibold text-gray-900">Ceramic mug set</p>
            <p class="mt-0.5 text-xs text-gray-500">Set of 4, dishwasher safe</p>
            <p class="mt-1.5 text-sm font-bold text-gray-900">$28.00</p>
          </div>
        </div>

        <div class="w-[72%] shrink-0 snap-start rounded-xl border border-gray-200 bg-white shadow-sm">
          <div class="h-28 w-full rounded-t-xl bg-gradient-to-br from-rose-200 to-rose-400"></div>
          <div class="p-3">
            <p class="text-sm font-semibold text-gray-900">Travel backpack</p>
            <p class="mt-0.5 text-xs text-gray-500">Water-resistant, 24L</p>
            <p class="mt-1.5 text-sm font-bold text-gray-900">$64.00</p>
          </div>
        </div>
      </div>

      <div class="mt-1 flex items-center justify-center gap-1.5">
        <span class="h-1.5 w-4 rounded-full bg-gray-900"></span>
        <span class="size-1.5 rounded-full bg-gray-300"></span>
        <span class="size-1.5 rounded-full bg-gray-300"></span>
        <span class="size-1.5 rounded-full bg-gray-300"></span>
      </div>
    </div>
  </body>
</html>
