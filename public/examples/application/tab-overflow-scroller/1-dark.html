<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-md items-center border-b border-gray-800">
      <button
        type="button"
        aria-label="Scroll tabs left"
        class="flex size-9 shrink-0 items-center justify-center text-gray-600 hover:text-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <div role="tablist" aria-label="Repository sections" class="flex flex-1 gap-1 overflow-x-auto">
        <button type="button" role="tab" aria-selected="true" class="relative shrink-0 px-3 py-2.5 text-sm font-medium text-white">
          Code
          <span class="absolute inset-x-0 -bottom-px h-0.5 rounded-full bg-white" aria-hidden="true"></span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Issues</button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Pull requests</button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Actions</button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Projects</button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Wiki</button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Security</button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Insights</button>
        <button type="button" role="tab" aria-selected="false" class="shrink-0 px-3 py-2.5 text-sm font-medium text-gray-400 hover:text-white">Settings</button>
      </div>

      <button
        type="button"
        aria-label="Scroll tabs right"
        class="flex size-9 shrink-0 items-center justify-center text-gray-300 hover:text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </body>
</html>
