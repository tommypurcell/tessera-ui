<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white">
      <table class="w-full text-left text-sm">
        <thead>
          <tr class="border-b border-gray-100 text-xs font-medium uppercase tracking-wide text-gray-400">
            <th scope="col" class="px-4 py-2.5">Name</th>
            <th scope="col" class="px-4 py-2.5">Status</th>
            <th scope="col" class="px-4 py-2.5">Updated</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr>
            <td class="px-4 py-3 font-medium text-gray-900">Marketing site</td>
            <td class="px-4 py-3 text-gray-500">Active</td>
            <td class="px-4 py-3 text-gray-500">2 hours ago</td>
          </tr>
          <tr>
            <td class="px-4 py-3 font-medium text-gray-900">Docs portal</td>
            <td class="px-4 py-3 text-gray-500">Active</td>
            <td class="px-4 py-3 text-gray-500">Yesterday</td>
          </tr>
          <tr>
            <td colspan="3" class="px-4 py-8">
              <div class="flex flex-col items-center gap-2 text-center">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-rose-500">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                </svg>
                <p class="text-sm font-medium text-gray-900">Couldn't load remaining rows</p>
                <p class="text-xs text-gray-500">The request timed out. Check your connection and try again.</p>
                <button type="button" class="mt-1 rounded-md border border-gray-300 px-3 py-1.5 text-xs font-semibold text-gray-700 hover:bg-gray-50">
                  Retry
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
