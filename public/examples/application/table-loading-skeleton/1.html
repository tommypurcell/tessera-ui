<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="overflow-hidden rounded-xl border border-gray-200">
      <table class="min-w-full divide-y divide-gray-200" role="status" aria-label="Loading table data">
        <thead class="ltr:text-left rtl:text-right">
          <tr class="*:px-4 *:py-2.5 *:text-xs *:font-medium *:text-gray-500">
            <th>Name</th>
            <th>Owner</th>
            <th>Status</th>
            <th>Last updated</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr>
            <td class="px-4 py-3"><div class="h-3.5 w-28 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-20 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-5 w-16 animate-pulse rounded-full bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-24 animate-pulse rounded bg-gray-200"></div></td>
          </tr>
          <tr>
            <td class="px-4 py-3"><div class="h-3.5 w-36 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-16 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-5 w-16 animate-pulse rounded-full bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-20 animate-pulse rounded bg-gray-200"></div></td>
          </tr>
          <tr>
            <td class="px-4 py-3"><div class="h-3.5 w-24 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-24 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-5 w-16 animate-pulse rounded-full bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-28 animate-pulse rounded bg-gray-200"></div></td>
          </tr>
          <tr>
            <td class="px-4 py-3"><div class="h-3.5 w-32 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-20 animate-pulse rounded bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-5 w-16 animate-pulse rounded-full bg-gray-200"></div></td>
            <td class="px-4 py-3"><div class="h-3.5 w-24 animate-pulse rounded bg-gray-200"></div></td>
          </tr>
        </tbody>
      </table>
      <span class="sr-only">Loading table content&hellip;</span>
    </div>
  </body>
</html>
