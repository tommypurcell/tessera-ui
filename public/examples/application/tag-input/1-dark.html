<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-md p-6">
    <label for="tagInput" class="mb-1.5 block text-sm font-medium text-gray-300">Labels</label>

    <div
      data-tag-field
      class="flex flex-wrap items-center gap-1.5 rounded-md border border-gray-700 bg-gray-900 p-2 focus-within:border-indigo-400 focus-within:ring-1 focus-within:ring-indigo-400"
    >
      <span data-tag-list class="contents">
        <span class="inline-flex items-center gap-1 rounded-full bg-indigo-500/10 py-0.5 pr-1 pl-2.5 text-sm text-indigo-300">
          bug
          <button type="button" data-tag-remove aria-label="Remove bug" class="rounded-full p-0.5 hover:bg-indigo-500/20">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </span>
        <span class="inline-flex items-center gap-1 rounded-full bg-indigo-500/10 py-0.5 pr-1 pl-2.5 text-sm text-indigo-300">
          design
          <button type="button" data-tag-remove aria-label="Remove design" class="rounded-full p-0.5 hover:bg-indigo-500/20">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </span>
      </span>

      <input
        id="tagInput"
        type="text"
        placeholder="Add a label…"
        aria-describedby="tagInputHelp"
        class="min-w-24 flex-1 border-0 bg-transparent p-1 text-sm text-gray-100 placeholder:text-gray-500 focus:ring-0 focus:outline-none"
      />
    </div>

    <p id="tagInputHelp" class="mt-1.5 text-xs text-gray-400">Press Enter to add a label, Backspace to remove the last one.</p>

    <script>
      const fieldEl = document.querySelector('[data-tag-field]')
      const listEl = document.querySelector('[data-tag-list]')
      const inputEl = document.getElementById('tagInput')

      function addTag(value) {
        const trimmed = value.trim()
        if (!trimmed) return
        const tagEl = document.createElement('span')
        tagEl.className = 'inline-flex items-center gap-1 rounded-full bg-indigo-500/10 py-0.5 pr-1 pl-2.5 text-sm text-indigo-300'
        tagEl.innerHTML = `${trimmed}<button type="button" data-tag-remove aria-label="Remove ${trimmed}" class="rounded-full p-0.5 hover:bg-indigo-500/20"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>`
        listEl.appendChild(tagEl)
      }

      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault()
          addTag(inputEl.value)
          inputEl.value = ''
        } else if (event.key === 'Backspace' && inputEl.value === '') {
          listEl.lastElementChild?.remove()
        }
      })

      fieldEl.addEventListener('click', (event) => {
        if (event.target.closest('[data-tag-remove]')) {
          event.target.closest('span').remove()
        } else {
          inputEl.focus()
        }
      })
    </script>
  </body>
</html>
