<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-xl border border-gray-800 bg-gray-950 shadow-sm">
      <div class="flex items-center justify-between border-b border-gray-800 px-4 py-3">
        <h3 class="text-sm font-semibold text-white">Team members</h3>
        <button type="button" class="rounded-md bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-blue-500">
          Invite member
        </button>
      </div>

      <ul class="divide-y divide-gray-800">
        <li class="flex items-center gap-3 px-4 py-3">
          <img src="https://i.pravatar.cc/64?img=12" alt="" class="size-9 shrink-0 rounded-full" />

          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-white">Priya Shah</p>
            <p class="truncate text-xs text-gray-500">priya@tessera.dev</p>
          </div>

          <label class="sr-only" for="role-priya">Role for Priya Shah</label>
          <select id="role-priya" class="rounded-md border border-gray-700 bg-gray-900 py-1 pl-2 pr-7 text-xs font-medium text-gray-200 shadow-sm focus:border-gray-500 focus:outline-none">
            <option>Owner</option>
            <option>Admin</option>
            <option>Member</option>
          </select>

          <button type="button" aria-label="Remove Priya Shah" class="inline-flex size-7 items-center justify-center rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-200">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>

        <li class="flex items-center gap-3 px-4 py-3">
          <img src="https://i.pravatar.cc/64?img=33" alt="" class="size-9 shrink-0 rounded-full" />

          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-white">Marcus Lee</p>
            <p class="truncate text-xs text-gray-500">marcus@tessera.dev</p>
          </div>

          <label class="sr-only" for="role-marcus">Role for Marcus Lee</label>
          <select id="role-marcus" class="rounded-md border border-gray-700 bg-gray-900 py-1 pl-2 pr-7 text-xs font-medium text-gray-200 shadow-sm focus:border-gray-500 focus:outline-none">
            <option>Owner</option>
            <option selected>Admin</option>
            <option>Member</option>
          </select>

          <button type="button" aria-label="Remove Marcus Lee" class="inline-flex size-7 items-center justify-center rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-200">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>

        <li class="flex items-center gap-3 px-4 py-3">
          <div class="flex size-9 shrink-0 items-center justify-center rounded-full bg-gray-800 text-xs font-semibold text-gray-400">
            DO
          </div>

          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-white">Dana Osei</p>
            <p class="truncate text-xs text-gray-500">dana@tessera.dev</p>
          </div>

          <span class="rounded-full bg-amber-950 px-2 py-0.5 text-xs font-medium text-amber-400">
            Invite pending
          </span>

          <button type="button" aria-label="Cancel invite for Dana Osei" class="inline-flex size-7 items-center justify-center rounded-md text-gray-500 hover:bg-gray-800 hover:text-gray-200">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </body>
</html>
