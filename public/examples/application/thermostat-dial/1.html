<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs flex-col items-center gap-4 p-6">
    <div class="relative flex size-52 items-center justify-center">
      <svg class="size-52 -rotate-90" viewBox="0 0 180 180" role="img" aria-label="Current temperature 68 degrees, target 72 degrees">
        <circle cx="90" cy="90" r="80" fill="none" stroke="currentColor" stroke-width="10" class="text-gray-100" />
        <circle
          cx="90"
          cy="90"
          r="80"
          fill="none"
          stroke="currentColor"
          stroke-width="10"
          stroke-linecap="round"
          stroke-dasharray="502.7"
          stroke-dashoffset="261.4"
          class="text-orange-500"
        />
      </svg>

      <div class="absolute flex flex-col items-center">
        <p class="font-mono text-5xl font-semibold text-gray-900">68°</p>
        <p class="mt-1 text-xs font-medium text-gray-500">Target 72°</p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <button
        type="button"
        aria-label="Decrease target temperature"
        class="flex size-10 items-center justify-center rounded-full border border-gray-200 text-gray-600 transition hover:bg-gray-50"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" d="M5 12h14" />
        </svg>
      </button>

      <p class="text-sm font-medium text-gray-700">Heating to 72°</p>

      <button
        type="button"
        aria-label="Increase target temperature"
        class="flex size-10 items-center justify-center rounded-full border border-gray-200 text-gray-600 transition hover:bg-gray-50"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
  </body>
</html>
