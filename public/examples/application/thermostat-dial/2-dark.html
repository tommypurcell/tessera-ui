<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs flex-col gap-4 p-6">
    <div class="flex items-center gap-4 rounded-lg border border-gray-800 bg-gray-900 p-4">
      <div class="relative flex size-20 shrink-0 items-center justify-center">
        <svg class="size-20 -rotate-90" viewBox="0 0 90 90" role="img" aria-label="Current temperature 74 degrees, target 70 degrees">
          <circle cx="45" cy="45" r="40" fill="none" stroke="currentColor" stroke-width="7" class="text-gray-800" />
          <circle
            cx="45"
            cy="45"
            r="40"
            fill="none"
            stroke="currentColor"
            stroke-width="7"
            stroke-linecap="round"
            stroke-dasharray="251.3"
            stroke-dashoffset="163.4"
            class="text-blue-400"
          />
        </svg>
        <p class="absolute font-mono text-lg font-semibold text-white">74°</p>
      </div>

      <div class="min-w-0">
        <p class="text-sm font-semibold text-white">Bedroom</p>
        <p class="text-xs text-blue-400">Cooling to 70°</p>
      </div>
    </div>
  </body>
</html>
