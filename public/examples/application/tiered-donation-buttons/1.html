<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="w-full max-w-sm">
      <h2 class="text-sm font-semibold text-gray-900">Choose an amount</h2>
      <div role="radiogroup" aria-label="Donation amount" class="mt-3 grid grid-cols-3 gap-2">
        <button type="button" role="radio" aria-checked="false" class="rounded-lg border border-gray-200 px-3 py-3 text-center hover:border-gray-300">
          <span class="block text-sm font-semibold text-gray-900">$25</span>
          <span class="mt-0.5 block text-xs text-gray-500">1 meal kit</span>
        </button>
        <button type="button" role="radio" aria-checked="true" class="rounded-lg border-2 border-blue-600 bg-blue-50 px-3 py-3 text-center">
          <span class="block text-sm font-semibold text-blue-900">$50</span>
          <span class="mt-0.5 block text-xs text-blue-700">3 meal kits</span>
        </button>
        <button type="button" role="radio" aria-checked="false" class="rounded-lg border border-gray-200 px-3 py-3 text-center hover:border-gray-300">
          <span class="block text-sm font-semibold text-gray-900">$100</span>
          <span class="mt-0.5 block text-xs text-gray-500">7 meal kits</span>
        </button>
      </div>

      <div class="mt-3 flex flex-col gap-1.5">
        <label for="custom-amount" class="text-sm font-medium text-gray-700">Or enter a custom amount</label>
        <div class="flex items-center rounded-md border border-gray-300 px-3 py-2 shadow-sm focus-within:border-blue-500">
          <span class="text-sm text-gray-400">$</span>
          <input
            id="custom-amount"
            type="text"
            inputmode="numeric"
            placeholder="0.00"
            class="min-w-0 flex-1 border-0 p-0 pl-1 text-sm text-gray-900 focus:outline-none"
          />
        </div>
      </div>

      <button type="button" class="mt-4 w-full rounded-md bg-gray-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-gray-700">
        Donate $50
      </button>
    </div>
  </body>
</html>
