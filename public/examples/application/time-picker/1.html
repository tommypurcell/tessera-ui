<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
    <style>
      .tessera-time-col {
        scrollbar-width: thin;
        scrollbar-color: #d1d5db transparent;
      }
      .tessera-time-col::-webkit-scrollbar {
        width: 6px;
      }
      .tessera-time-col::-webkit-scrollbar-thumb {
        background-color: #d1d5db;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-xs rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-900">Meeting time</h3>

      <div class="relative mt-3 flex h-40 gap-2">
        <div class="tessera-time-col flex-1 overflow-y-auto rounded-md bg-gray-50 py-14 text-center">
          <div class="py-1.5 text-sm text-gray-400">08</div>
          <div class="py-1.5 text-sm text-gray-400">09</div>
          <div class="rounded-md bg-white py-1.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-200">10</div>
          <div class="py-1.5 text-sm text-gray-400">11</div>
          <div class="py-1.5 text-sm text-gray-400">12</div>
        </div>
        <div class="tessera-time-col flex-1 overflow-y-auto rounded-md bg-gray-50 py-14 text-center">
          <div class="py-1.5 text-sm text-gray-400">00</div>
          <div class="py-1.5 text-sm text-gray-400">15</div>
          <div class="rounded-md bg-white py-1.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-200">30</div>
          <div class="py-1.5 text-sm text-gray-400">45</div>
        </div>
        <div class="tessera-time-col flex-1 overflow-y-auto rounded-md bg-gray-50 py-14 text-center">
          <div class="rounded-md bg-white py-1.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-200">AM</div>
          <div class="py-1.5 text-sm text-gray-400">PM</div>
        </div>

        <div class="pointer-events-none absolute inset-x-0 top-1/2 h-8 -translate-y-1/2 rounded-md ring-1 ring-inset ring-gray-900/10"></div>
      </div>

      <div class="mt-3 flex items-center justify-between border-t border-gray-100 pt-3">
        <p class="text-sm text-gray-500">Selected: <span class="font-medium text-gray-900">10:30 AM</span></p>
        <button type="button" class="rounded-md bg-gray-900 px-3 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-gray-700">
          Set time
        </button>
      </div>
    </div>
  </body>
</html>
