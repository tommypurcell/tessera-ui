<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
    <style>
      .tessera-time-list {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 transparent;
      }
      .tessera-time-list::-webkit-scrollbar {
        width: 6px;
      }
      .tessera-time-list::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="flex min-h-64 items-start justify-center bg-gray-950 p-6">
    <div class="w-full max-w-xs">
      <label for="time-picker-trigger-dark" class="block text-sm font-medium text-gray-300">Reminder time</label>
      <div class="relative mt-1.5">
        <button
          id="time-picker-trigger-dark"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="true"
          class="flex w-full items-center justify-between rounded-md border border-gray-700 bg-gray-900 px-3 py-2 text-left text-sm text-gray-200 shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
        >
          <span class="inline-flex items-center gap-2">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 text-gray-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            2:45 PM
          </span>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 text-gray-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        <ul
          role="listbox"
          aria-label="Time"
          class="tessera-time-list absolute z-10 mt-1.5 max-h-48 w-full overflow-y-auto rounded-md border border-gray-700 bg-gray-900 py-1 shadow-lg shadow-black/40"
        >
          <li role="option" class="px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">1:45 PM</li>
          <li role="option" class="px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">2:00 PM</li>
          <li role="option" class="px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">2:15 PM</li>
          <li role="option" class="px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">2:30 PM</li>
          <li role="option" aria-selected="true" class="flex items-center justify-between rounded-md bg-white px-3 py-1.5 text-sm font-medium text-gray-900">
            2:45 PM
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </li>
          <li role="option" class="px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">3:00 PM</li>
          <li role="option" class="px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800">3:15 PM</li>
        </ul>
      </div>
    </div>
  </body>
</html>
