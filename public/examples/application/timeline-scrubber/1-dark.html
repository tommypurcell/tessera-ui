<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-md rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-sm">
      <div class="flex items-center justify-between text-xs font-medium text-gray-400">
        <span>Session recording</span>
        <span>12:04 / 28:41</span>
      </div>

      <div class="relative mt-3 h-1.5 w-full rounded-full bg-gray-700">
        <div class="absolute inset-y-0 left-0 w-1/3 rounded-full bg-gray-600"></div>
        <div class="absolute inset-y-0 left-0 w-[42%] rounded-full bg-white"></div>

        <span class="absolute inset-y-0 left-[8%] w-px bg-gray-900/70" aria-hidden="true"></span>
        <span class="absolute inset-y-0 left-[22%] w-px bg-gray-900/70" aria-hidden="true"></span>
        <span class="absolute inset-y-0 left-[64%] w-px bg-gray-900/70" aria-hidden="true"></span>

        <div
          role="slider"
          tabindex="0"
          aria-label="Playback position"
          aria-valuemin="0"
          aria-valuemax="1721"
          aria-valuenow="724"
          aria-valuetext="12 minutes, 4 seconds"
          class="absolute top-1/2 left-[42%] size-3.5 -translate-x-1/2 -translate-y-1/2 cursor-grab rounded-full border-2 border-gray-900 bg-white shadow ring-1 ring-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-gray-900"
        ></div>
      </div>

      <div class="mt-3 flex items-center gap-3">
        <button
          type="button"
          aria-label="Play"
          class="inline-flex size-8 items-center justify-center rounded-full bg-white text-gray-900 transition-colors hover:bg-gray-200"
        >
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z" />
          </svg>
        </button>
        <p class="text-xs text-gray-400">3 flagged events on this timeline</p>
      </div>
    </div>
  </body>
</html>
