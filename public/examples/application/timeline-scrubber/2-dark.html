<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-md rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-sm">
      <div class="flex items-center justify-between text-xs font-medium text-gray-400">
        <span>Log range</span>
        <span>09:15 – 14:40</span>
      </div>

      <div class="relative mt-4 h-8 w-full">
        <div class="absolute inset-x-0 top-1/2 flex h-6 -translate-y-1/2 items-end gap-px">
          <span class="h-2 w-full rounded-sm bg-gray-700"></span>
          <span class="h-3 w-full rounded-sm bg-gray-700"></span>
          <span class="h-5 w-full rounded-sm bg-gray-700"></span>
          <span class="h-4 w-full rounded-sm bg-indigo-500/70"></span>
          <span class="h-6 w-full rounded-sm bg-indigo-400"></span>
          <span class="h-3 w-full rounded-sm bg-indigo-400"></span>
          <span class="h-5 w-full rounded-sm bg-indigo-500/70"></span>
          <span class="h-2 w-full rounded-sm bg-gray-700"></span>
          <span class="h-4 w-full rounded-sm bg-gray-700"></span>
          <span class="h-3 w-full rounded-sm bg-gray-700"></span>
        </div>

        <div class="absolute inset-y-0 left-[30%] right-[15%] rounded bg-indigo-400/10 ring-1 ring-inset ring-indigo-400/40"></div>

        <div
          role="slider"
          tabindex="0"
          aria-label="Range start"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="30"
          class="absolute top-1/2 left-[30%] flex h-8 w-2.5 -translate-x-1/2 -translate-y-1/2 cursor-ew-resize items-center justify-center rounded-full bg-indigo-400 shadow ring-2 ring-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
        ></div>
        <div
          role="slider"
          tabindex="0"
          aria-label="Range end"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="85"
          class="absolute top-1/2 left-[85%] flex h-8 w-2.5 -translate-x-1/2 -translate-y-1/2 cursor-ew-resize items-center justify-center rounded-full bg-indigo-400 shadow ring-2 ring-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
        ></div>
      </div>

      <div class="mt-1 flex justify-between text-[11px] text-gray-500">
        <span>00:00</span>
        <span>24:00</span>
      </div>
    </div>
  </body>
</html>
