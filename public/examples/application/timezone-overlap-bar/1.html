<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-lg border border-gray-200 p-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-gray-900">Working hours overlap</h3>
        <p class="text-xs font-medium text-indigo-600">4h overlap</p>
      </div>

      <div class="mt-4 flex flex-col gap-3">
        <div class="flex items-center gap-3">
          <span class="w-24 shrink-0 text-xs font-medium text-gray-600">San Francisco</span>
          <div class="relative h-6 flex-1 rounded-md bg-gray-100">
            <div class="absolute inset-y-0 rounded-md bg-indigo-200" style="left: 37.5%; width: 33.3%"></div>
            <div class="absolute inset-y-0 rounded-md bg-indigo-500" style="left: 41.6%; width: 16.6%"></div>
          </div>
          <span class="w-16 shrink-0 text-right text-xs text-gray-500">9am&ndash;5pm</span>
        </div>

        <div class="flex items-center gap-3">
          <span class="w-24 shrink-0 text-xs font-medium text-gray-600">London</span>
          <div class="relative h-6 flex-1 rounded-md bg-gray-100">
            <div class="absolute inset-y-0 rounded-md bg-indigo-200" style="left: 41.6%; width: 33.3%"></div>
            <div class="absolute inset-y-0 rounded-md bg-indigo-500" style="left: 41.6%; width: 16.6%"></div>
          </div>
          <span class="w-16 shrink-0 text-right text-xs text-gray-500">5pm&ndash;1am</span>
        </div>

        <div class="ml-[108px] flex justify-between text-[10px] text-gray-400">
          <span>12am</span>
          <span>6am</span>
          <span>12pm</span>
          <span>6pm</span>
          <span>12am</span>
        </div>
      </div>

      <div class="mt-4 flex items-center gap-4 border-t border-gray-100 pt-3 text-xs text-gray-500">
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-sm bg-indigo-200"></span>
          Working hours
        </span>
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-sm bg-indigo-500"></span>
          Overlap (1&ndash;5pm SF)
        </span>
      </div>
    </div>
  </body>
</html>
