<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-lg border border-gray-200 p-4">
      <h3 class="text-sm font-semibold text-gray-900">Team availability</h3>

      <div class="mt-4 flex flex-col gap-3">
        <div class="flex items-center gap-3">
          <span class="w-20 shrink-0 text-xs font-medium text-gray-600">Austin</span>
          <div class="relative h-5 flex-1 rounded-md bg-gray-100">
            <div class="absolute inset-y-0 rounded-md bg-emerald-400" style="left: 33.3%; width: 33.3%"></div>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <span class="w-20 shrink-0 text-xs font-medium text-gray-600">Berlin</span>
          <div class="relative h-5 flex-1 rounded-md bg-gray-100">
            <div class="absolute inset-y-0 rounded-md bg-emerald-400" style="left: 37.5%; width: 33.3%"></div>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <span class="w-20 shrink-0 text-xs font-medium text-gray-600">Singapore</span>
          <div class="relative h-5 flex-1 rounded-md bg-gray-100">
            <div class="absolute inset-y-0 rounded-md bg-emerald-400" style="left: 4.1%; width: 33.3%"></div>
          </div>
        </div>

        <div class="relative h-6">
          <div class="absolute inset-y-0 rounded-md bg-amber-400/70" style="left: 37.5%; width: 4%"></div>
        </div>

        <div class="ml-[92px] flex justify-between text-[10px] text-gray-400">
          <span>12am</span>
          <span>6am</span>
          <span>12pm</span>
          <span>6pm</span>
          <span>12am</span>
        </div>
      </div>

      <p class="mt-3 border-t border-gray-100 pt-3 text-xs text-gray-500">
        <span class="font-medium text-amber-600">1 hour</span> when all three teams overlap
      </p>
    </div>
  </body>
</html>
