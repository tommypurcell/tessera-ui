<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-50 p-6">
    <div class="flex w-full max-w-sm flex-col gap-4 rounded-lg border border-gray-200 bg-white p-5">
      <div class="flex items-center justify-between text-sm">
        <span class="text-gray-500">Bill</span>
        <span class="font-medium text-gray-900">$84.50</span>
      </div>

      <div class="flex gap-2" role="group" aria-label="Tip percentage">
        <button type="button" aria-pressed="false" class="flex-1 rounded-md bg-gray-100 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200">15%</button>
        <button type="button" aria-pressed="true" class="flex-1 rounded-md bg-gray-900 py-2 text-sm font-semibold text-white">20%</button>
        <button type="button" aria-pressed="false" class="flex-1 rounded-md bg-gray-100 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200">25%</button>
      </div>

      <div class="flex flex-col gap-1.5 border-t border-gray-100 pt-3 text-sm">
        <div class="flex items-center justify-between">
          <span class="text-gray-500">Tip (20%)</span>
          <span class="text-gray-900">$16.90</span>
        </div>
        <div class="flex items-center justify-between font-semibold text-gray-900">
          <span>Total</span>
          <span>$101.40</span>
        </div>
        <div class="flex items-center justify-between text-gray-500">
          <span>Per person (3)</span>
          <span>$33.80</span>
        </div>
      </div>
    </div>
  </body>
</html>
