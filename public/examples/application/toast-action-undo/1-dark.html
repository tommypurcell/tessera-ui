<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="relative flex min-h-64 max-w-sm items-end bg-gray-950 p-6">
    <div
      role="status"
      aria-live="polite"
      class="flex w-full items-center gap-3 rounded-lg border border-gray-700 bg-gray-800 py-3 pr-3 pl-4 text-white shadow-lg"
    >
      <div class="relative flex size-8 shrink-0 items-center justify-center">
        <svg class="size-8 -rotate-90" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5" class="text-gray-600" />
          <circle
            cx="16"
            cy="16"
            r="13"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-dasharray="81.7"
            stroke-dashoffset="24.5"
            class="text-white"
          />
        </svg>
        <span class="absolute text-[10px] font-semibold tabular-nums">4</span>
      </div>

      <p class="min-w-0 flex-1 text-sm">
        <span class="font-medium">Email archived.</span>
      </p>

      <button
        type="button"
        class="shrink-0 rounded-md px-2.5 py-1 text-sm font-semibold text-blue-400 transition hover:bg-white/10 hover:text-blue-300"
      >
        Undo
      </button>

      <button
        type="button"
        aria-label="Dismiss"
        class="shrink-0 rounded-md p-1 text-gray-400 transition hover:bg-white/10 hover:text-gray-200"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </body>
</html>
