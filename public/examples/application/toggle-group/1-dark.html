<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div
      role="group"
      aria-label="Text alignment"
      class="inline-flex rounded-md border border-gray-800 bg-gray-900 p-1"
    >
      <button
        type="button"
        aria-pressed="true"
        aria-label="Align left"
        class="inline-flex size-9 items-center justify-center rounded-sm bg-gray-800 text-white shadow-sm ring-1 ring-gray-700 transition-colors focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h13" />
        </svg>
      </button>

      <button
        type="button"
        aria-pressed="false"
        aria-label="Align center"
        class="inline-flex size-9 items-center justify-center rounded-sm text-gray-400 transition-colors hover:text-white focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M7 12h10M5 18h14" />
        </svg>
      </button>

      <button
        type="button"
        aria-pressed="false"
        aria-label="Align right"
        class="inline-flex size-9 items-center justify-center rounded-sm text-gray-400 transition-colors hover:text-white focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M10 12h10M7 18h13" />
        </svg>
      </button>

      <button
        type="button"
        aria-pressed="false"
        aria-label="Justify"
        class="inline-flex size-9 items-center justify-center rounded-sm text-gray-400 transition-colors hover:text-white focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </body>
</html>
