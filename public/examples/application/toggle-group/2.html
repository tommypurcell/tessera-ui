<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div role="group" aria-label="Text formatting" class="inline-flex">
      <button
        type="button"
        aria-pressed="true"
        aria-label="Bold"
        class="inline-flex size-9 items-center justify-center rounded-s-md border border-gray-200 bg-blue-50 font-bold text-blue-700 transition-colors focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        B
      </button>

      <button
        type="button"
        aria-pressed="true"
        aria-label="Italic"
        class="-ms-px inline-flex size-9 items-center justify-center border border-gray-200 bg-blue-50 font-serif text-blue-700 italic transition-colors focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        I
      </button>

      <button
        type="button"
        aria-pressed="false"
        aria-label="Underline"
        class="-ms-px inline-flex size-9 items-center justify-center rounded-e-md border border-gray-200 bg-white text-gray-700 underline transition-colors hover:bg-gray-50 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        U
      </button>
    </div>
  </body>
</html>
