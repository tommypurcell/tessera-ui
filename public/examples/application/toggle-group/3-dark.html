<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div
      role="group"
      aria-label="Calendar view"
      class="inline-flex gap-1 rounded-full border border-gray-800 bg-gray-900 p-1 text-sm font-medium"
    >
      <button
        type="button"
        aria-pressed="false"
        class="rounded-full px-4 py-1.5 text-gray-400 transition-colors hover:text-white focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        Day
      </button>

      <button
        type="button"
        aria-pressed="true"
        class="rounded-full bg-gray-700 px-4 py-1.5 text-white shadow-sm transition-colors focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        Week
      </button>

      <button
        type="button"
        aria-pressed="false"
        class="rounded-full px-4 py-1.5 text-gray-400 transition-colors hover:text-white focus:z-10 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        Month
      </button>
    </div>
  </body>
</html>
