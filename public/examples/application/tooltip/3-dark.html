<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex h-40 items-center justify-center bg-gray-950 p-6">
    <div class="group relative inline-block">
      <button
        type="button"
        aria-label="More information about two-factor authentication"
        aria-describedby="tooltip-3-dark"
        class="inline-flex size-5 items-center justify-center rounded-full text-gray-500 hover:text-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
        </svg>
      </button>
      <div
        id="tooltip-3-dark"
        role="tooltip"
        class="pointer-events-none absolute top-1/2 left-full z-10 ml-2 w-56 -translate-y-1/2 rounded-md bg-gray-100 p-3 text-left opacity-0 shadow-lg transition-opacity group-hover:opacity-100 group-focus-within:opacity-100"
      >
        <p class="text-xs font-semibold text-gray-900">Two-factor authentication</p>
        <p class="mt-1 text-xs text-gray-600">Adds a second verification step when signing in from a new device.</p>
        <span
          class="absolute top-1/2 right-full -translate-y-1/2 border-4 border-transparent border-r-gray-100"
          aria-hidden="true"
        ></span>
      </div>
    </div>
  </body>
</html>
