<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <form class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-6">
      <h2 class="text-base font-semibold text-gray-900">Transfer money</h2>

      <div class="mt-4 flex flex-col gap-1.5">
        <label for="transfer-from" class="text-sm font-medium text-gray-700">From</label>
        <select id="transfer-from" class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none">
          <option>Everyday Checking •••• 4821 — $8,412.63</option>
          <option>High-Yield Savings •••• 2093 — $24,150.00</option>
        </select>
      </div>

      <div class="mt-4 flex flex-col gap-1.5">
        <label for="transfer-to" class="text-sm font-medium text-gray-700">To</label>
        <select id="transfer-to" class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none">
          <option>High-Yield Savings •••• 2093</option>
          <option>Everyday Checking •••• 4821</option>
          <option>Jordan Reyes •••• 7710 (external)</option>
        </select>
      </div>

      <div class="mt-4 flex flex-col gap-1.5">
        <label for="transfer-amount" class="text-sm font-medium text-gray-700">Amount</label>
        <div class="relative">
          <span class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-sm text-gray-500">$</span>
          <input
            id="transfer-amount"
            type="text"
            inputmode="decimal"
            value="250.00"
            class="w-full rounded-md border border-gray-300 py-2 pr-3 pl-6 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
          />
        </div>
      </div>

      <fieldset class="mt-4">
        <legend class="text-sm font-medium text-gray-700">When</legend>
        <div class="mt-1.5 grid grid-cols-2 gap-2">
          <label class="flex cursor-pointer items-center justify-center rounded-md border border-gray-900 bg-gray-900 px-3 py-2 text-sm font-medium text-white has-[:checked]:border-gray-900 has-[:checked]:bg-gray-900 has-[:checked]:text-white">
            <input type="radio" name="transfer-when" value="now" checked class="sr-only" />
            Now
          </label>
          <label class="flex cursor-pointer items-center justify-center rounded-md border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 has-[:checked]:border-gray-900 has-[:checked]:bg-gray-900 has-[:checked]:text-white">
            <input type="radio" name="transfer-when" value="schedule" class="sr-only" />
            Schedule
          </label>
        </div>
      </fieldset>

      <div class="mt-4 flex flex-col gap-1.5">
        <label for="transfer-date" class="text-sm font-medium text-gray-700">Date</label>
        <input
          id="transfer-date"
          type="date"
          value="2026-08-08"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none"
        />
      </div>

      <button type="submit" class="mt-5 w-full rounded-md bg-gray-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-gray-700">
        Review transfer
      </button>
    </form>
  </body>
</html>
