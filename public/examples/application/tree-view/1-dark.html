<!doctype html>
<html lang="en" class="font-sans antialiased dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-sm bg-gray-950 p-6">
    <div role="tree" aria-label="Permissions" class="rounded-xl border border-gray-800 bg-gray-900 p-2 text-sm">
      <div role="treeitem" aria-expanded="true" class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-gray-800">
        <button type="button" aria-label="Collapse Engineering" class="flex size-4 shrink-0 items-center justify-center text-gray-500">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
        <input type="checkbox" checked class="size-3.5 shrink-0 rounded border-gray-600 bg-gray-800 text-white focus:ring-gray-500" aria-label="Select Engineering and all children" />
        <span class="grow font-medium text-white">Engineering</span>
        <span class="text-xs text-gray-500">12</span>
      </div>

      <div role="group" class="ml-4 border-l border-gray-800 pl-2">
        <div role="treeitem" aria-expanded="true" class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-gray-800">
          <button type="button" aria-label="Collapse Frontend" class="flex size-4 shrink-0 items-center justify-center text-gray-500">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
          <input type="checkbox" checked class="size-3.5 shrink-0 rounded border-gray-600 bg-gray-800 text-white focus:ring-gray-500" aria-label="Select Frontend and all children" />
          <span class="grow text-gray-300">Frontend</span>
          <span class="text-xs text-gray-500">5</span>
        </div>

        <div role="group" class="ml-4 border-l border-gray-800 pl-2">
          <div role="treeitem" class="flex items-center gap-2 rounded-md px-2 py-1.5 pl-6 hover:bg-gray-800">
            <input type="checkbox" checked class="size-3.5 shrink-0 rounded border-gray-600 bg-gray-800 text-white focus:ring-gray-500" aria-label="Select Nandor" />
            <span class="text-gray-400">Nandor the Relentless</span>
          </div>
          <div role="treeitem" aria-selected="true" class="flex items-center gap-2 rounded-md bg-gray-800 px-2 py-1.5 pl-6">
            <input type="checkbox" checked class="size-3.5 shrink-0 rounded border-gray-600 bg-gray-800 text-white focus:ring-gray-500" aria-label="Select Nadja" />
            <span class="font-medium text-white">Nadja</span>
          </div>
        </div>

        <div role="treeitem" aria-expanded="false" class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-gray-800">
          <button type="button" aria-label="Expand Backend" class="flex size-4 shrink-0 items-center justify-center text-gray-500">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </button>
          <input type="checkbox" class="size-3.5 shrink-0 rounded border-gray-600 bg-gray-800 text-white focus:ring-gray-500" aria-label="Select Backend and all children" data-indeterminate="true" />
          <span class="grow text-gray-300">Backend</span>
          <span class="text-xs text-gray-500">4</span>
        </div>

        <div role="treeitem" class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-gray-800">
          <input type="checkbox" checked class="size-3.5 shrink-0 rounded border-gray-600 bg-gray-800 text-white focus:ring-gray-500" aria-label="Select Colin Robinson" />
          <span class="text-gray-400">Colin Robinson</span>
        </div>
      </div>

      <div role="treeitem" aria-expanded="false" class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-gray-800">
        <button type="button" aria-label="Expand Design" class="flex size-4 shrink-0 items-center justify-center text-gray-500">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>
        <input type="checkbox" class="size-3.5 shrink-0 rounded border-gray-600 bg-gray-800 text-white focus:ring-gray-500" aria-label="Select Design and all children" />
        <span class="grow font-medium text-white">Design</span>
        <span class="text-xs text-gray-500">3</span>
      </div>
    </div>
  </body>
</html>
