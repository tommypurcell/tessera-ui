<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-lg rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-900">Storage by file type</h3>
      <div class="mt-3 grid h-56 grid-cols-6 grid-rows-4 gap-1">
        <div class="col-span-3 row-span-3 flex flex-col justify-between rounded-md bg-indigo-600 p-3">
          <span class="text-sm font-semibold text-white">Videos</span>
          <span class="text-xs text-indigo-100">18.4 GB</span>
        </div>
        <div class="col-span-3 row-span-2 flex flex-col justify-between rounded-md bg-indigo-400 p-3">
          <span class="text-sm font-semibold text-white">Images</span>
          <span class="text-xs text-indigo-50">9.1 GB</span>
        </div>
        <div class="col-span-2 row-span-1 flex flex-col justify-between rounded-md bg-indigo-300 p-2.5">
          <span class="text-xs font-semibold text-white">Documents</span>
          <span class="text-[11px] text-indigo-50">3.2 GB</span>
        </div>
        <div class="col-span-1 row-span-1 flex items-center justify-center rounded-md bg-indigo-200 p-1.5">
          <span class="text-[10px] font-medium text-indigo-900">Audio</span>
        </div>
        <div class="col-span-2 row-span-1 flex items-center gap-2 rounded-md bg-indigo-100 p-2">
          <span class="text-xs font-medium text-indigo-900">Other</span>
          <span class="text-[10px] text-indigo-700">1.4 GB</span>
        </div>
      </div>
    </div>
  </body>
</html>
