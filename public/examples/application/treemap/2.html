<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-lg rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-900">Revenue by segment</h3>
      <div class="mt-3 grid h-48 grid-cols-5 grid-rows-3 gap-1">
        <div class="col-span-3 row-span-2 flex flex-col justify-between rounded-md bg-emerald-500 p-3">
          <span class="text-sm font-semibold text-white">Enterprise</span>
          <span class="text-xs text-emerald-50">$4.2M</span>
        </div>
        <div class="col-span-2 row-span-1 flex flex-col justify-between rounded-md bg-sky-500 p-2.5">
          <span class="text-xs font-semibold text-white">Mid-market</span>
          <span class="text-[11px] text-sky-50">$1.8M</span>
        </div>
        <div class="col-span-2 row-span-1 flex flex-col justify-between rounded-md bg-amber-500 p-2.5">
          <span class="text-xs font-semibold text-white">SMB</span>
          <span class="text-[11px] text-amber-50">$980K</span>
        </div>
        <div class="col-span-3 row-span-1 flex items-center gap-3 rounded-md bg-fuchsia-500 p-2.5">
          <span class="text-xs font-semibold text-white">Self-serve</span>
          <span class="text-[11px] text-fuchsia-50">$620K</span>
        </div>
      </div>
      <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1.5 border-t border-gray-100 pt-3">
        <span class="inline-flex items-center gap-1.5 text-xs text-gray-600"><span class="size-2 rounded-full bg-emerald-500"></span>Enterprise</span>
        <span class="inline-flex items-center gap-1.5 text-xs text-gray-600"><span class="size-2 rounded-full bg-sky-500"></span>Mid-market</span>
        <span class="inline-flex items-center gap-1.5 text-xs text-gray-600"><span class="size-2 rounded-full bg-amber-500"></span>SMB</span>
        <span class="inline-flex items-center gap-1.5 text-xs text-gray-600"><span class="size-2 rounded-full bg-fuchsia-500"></span>Self-serve</span>
      </div>
    </div>
  </body>
</html>
