<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-2xl p-6">
    <div class="overflow-hidden rounded-xl border border-gray-200">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Product</th>
            <th scope="col" class="px-4 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-gray-500">7-day trend</th>
            <th scope="col" class="px-4 py-2.5 text-right text-xs font-medium uppercase tracking-wide text-gray-500">Units sold</th>
            <th scope="col" class="px-4 py-2.5 text-right text-xs font-medium uppercase tracking-wide text-gray-500">Change</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 bg-white">
          <tr>
            <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-gray-900">Wireless Keyboard</td>
            <td class="whitespace-nowrap px-4 py-3">
              <div class="flex items-end gap-0.5" aria-hidden="true">
                <span class="w-1.5 rounded-sm bg-green-400" style="height: 6px"></span>
                <span class="w-1.5 rounded-sm bg-green-400" style="height: 10px"></span>
                <span class="w-1.5 rounded-sm bg-green-400" style="height: 8px"></span>
                <span class="w-1.5 rounded-sm bg-green-400" style="height: 14px"></span>
                <span class="w-1.5 rounded-sm bg-green-400" style="height: 12px"></span>
                <span class="w-1.5 rounded-sm bg-green-400" style="height: 18px"></span>
                <span class="w-1.5 rounded-sm bg-green-500" style="height: 22px"></span>
              </div>
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-right text-sm text-gray-600">1,204</td>
            <td class="whitespace-nowrap px-4 py-3 text-right text-sm font-medium text-green-600">+18.2%</td>
          </tr>

          <tr>
            <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-gray-900">Ergonomic Mouse</td>
            <td class="whitespace-nowrap px-4 py-3">
              <div class="flex items-end gap-0.5" aria-hidden="true">
                <span class="w-1.5 rounded-sm bg-gray-300" style="height: 16px"></span>
                <span class="w-1.5 rounded-sm bg-gray-300" style="height: 14px"></span>
                <span class="w-1.5 rounded-sm bg-gray-300" style="height: 15px"></span>
                <span class="w-1.5 rounded-sm bg-gray-300" style="height: 13px"></span>
                <span class="w-1.5 rounded-sm bg-gray-300" style="height: 14px"></span>
                <span class="w-1.5 rounded-sm bg-gray-300" style="height: 15px"></span>
                <span class="w-1.5 rounded-sm bg-gray-400" style="height: 14px"></span>
              </div>
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-right text-sm text-gray-600">842</td>
            <td class="whitespace-nowrap px-4 py-3 text-right text-sm font-medium text-gray-500">+0.4%</td>
          </tr>

          <tr>
            <td class="whitespace-nowrap px-4 py-3 text-sm font-medium text-gray-900">USB-C Hub</td>
            <td class="whitespace-nowrap px-4 py-3">
              <div class="flex items-end gap-0.5" aria-hidden="true">
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 20px"></span>
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 18px"></span>
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 15px"></span>
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 12px"></span>
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 10px"></span>
                <span class="w-1.5 rounded-sm bg-red-400" style="height: 8px"></span>
                <span class="w-1.5 rounded-sm bg-red-500" style="height: 6px"></span>
              </div>
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-right text-sm text-gray-600">396</td>
            <td class="whitespace-nowrap px-4 py-3 text-right text-sm font-medium text-red-600">-24.7%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
