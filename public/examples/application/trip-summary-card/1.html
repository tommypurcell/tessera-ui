<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-56 items-center justify-center p-6">
    <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-4">
      <div class="flex items-center justify-between gap-2">
        <p class="text-sm font-semibold text-gray-900">Morning commute</p>
        <p class="text-xs text-gray-500">Today, 8:14 AM</p>
      </div>
      <p class="mt-0.5 text-xs text-gray-500">Oak Street &rarr; Riverside Tech Campus</p>

      <div class="mt-4 grid grid-cols-2 gap-3">
        <div class="rounded-lg bg-gray-50 p-3">
          <p class="text-lg font-semibold text-gray-900">18.4 <span class="text-xs font-normal text-gray-500">mi</span></p>
          <p class="text-xs text-gray-500">Distance</p>
        </div>
        <div class="rounded-lg bg-gray-50 p-3">
          <p class="text-lg font-semibold text-gray-900">27 <span class="text-xs font-normal text-gray-500">min</span></p>
          <p class="text-xs text-gray-500">Duration</p>
        </div>
        <div class="rounded-lg bg-gray-50 p-3">
          <p class="text-lg font-semibold text-gray-900">40.9 <span class="text-xs font-normal text-gray-500">mph</span></p>
          <p class="text-xs text-gray-500">Avg speed</p>
        </div>
        <div class="rounded-lg bg-gray-50 p-3">
          <p class="text-lg font-semibold text-gray-900">4.1 <span class="text-xs font-normal text-gray-500">mi/kWh</span></p>
          <p class="text-xs text-gray-500">Efficiency</p>
        </div>
      </div>
    </div>
  </body>
</html>
