<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-xs p-6">
    <div class="flex flex-col gap-5">
      <div>
        <p class="text-sm font-medium text-white">Color: <span class="font-normal text-gray-400">Matte Black</span></p>

        <div role="radiogroup" aria-label="Color" class="mt-2 flex items-center gap-2">
          <button type="button" role="radio" aria-checked="true" aria-label="Matte Black" class="relative flex size-8 items-center justify-center rounded-full ring-2 ring-offset-2 ring-offset-gray-950 ring-white">
            <span class="size-6 rounded-full border border-gray-600 bg-gray-900"></span>
          </button>
          <button type="button" role="radio" aria-checked="false" aria-label="Cloud White" class="relative flex size-8 items-center justify-center rounded-full ring-1 ring-inset ring-gray-700 hover:ring-gray-500">
            <span class="size-6 rounded-full border border-gray-700 bg-white"></span>
          </button>
          <button type="button" role="radio" aria-checked="false" aria-label="Ocean Blue" class="relative flex size-8 items-center justify-center rounded-full ring-1 ring-inset ring-gray-700 hover:ring-gray-500">
            <span class="size-6 rounded-full bg-blue-500"></span>
          </button>
          <button type="button" role="radio" aria-checked="false" aria-disabled="true" aria-label="Sunset Red, out of stock" class="relative flex size-8 cursor-not-allowed items-center justify-center rounded-full ring-1 ring-inset ring-gray-700 opacity-40">
            <span class="size-6 rounded-full bg-rose-500"></span>
            <span aria-hidden="true" class="absolute inset-0 rounded-full border border-gray-500" style="background: linear-gradient(to top right, transparent calc(50% - 1px), #6b7280, transparent calc(50% + 1px))"></span>
          </button>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <p class="text-sm font-medium text-white">Size: <span class="font-normal text-gray-400">M</span></p>
          <button type="button" class="text-xs font-medium text-blue-400 hover:text-blue-300">Size guide</button>
        </div>

        <div role="radiogroup" aria-label="Size" class="mt-2 grid grid-cols-5 gap-2">
          <button type="button" role="radio" aria-checked="false" class="rounded-md border border-gray-700 py-1.5 text-sm text-gray-300 hover:border-gray-500">
            XS
          </button>
          <button type="button" role="radio" aria-checked="false" class="rounded-md border border-gray-700 py-1.5 text-sm text-gray-300 hover:border-gray-500">
            S
          </button>
          <button type="button" role="radio" aria-checked="true" class="rounded-md border-2 border-white py-1.5 text-sm font-semibold text-white">
            M
          </button>
          <button type="button" role="radio" aria-checked="false" class="rounded-md border border-gray-700 py-1.5 text-sm text-gray-300 hover:border-gray-500">
            L
          </button>
          <button type="button" role="radio" aria-checked="false" aria-disabled="true" class="relative cursor-not-allowed rounded-md border border-gray-800 py-1.5 text-sm text-gray-600">
            XL
            <span aria-hidden="true" class="absolute inset-x-2 top-1/2 h-px -translate-y-1/2 bg-gray-700"></span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
