<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-96 items-stretch justify-center bg-gray-50 p-6">
    <div class="flex w-full max-w-2xl overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
      <div role="tablist" aria-label="Settings sections" aria-orientation="vertical" class="w-52 shrink-0 border-r border-gray-200 bg-gray-50 p-3">
        <button type="button" role="tab" aria-selected="true" class="flex w-full items-center gap-3 rounded-md bg-white px-3 py-2.5 text-left text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-200">
          <span class="flex size-6 shrink-0 items-center justify-center rounded-full bg-gray-900 text-xs font-semibold text-white">1</span>
          Profile
        </button>
        <button type="button" role="tab" aria-selected="false" class="mt-1 flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-left text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span class="flex size-6 shrink-0 items-center justify-center rounded-full border border-gray-300 text-xs font-semibold text-gray-500">2</span>
          Security
        </button>
        <button type="button" role="tab" aria-selected="false" class="mt-1 flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-left text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span class="flex size-6 shrink-0 items-center justify-center rounded-full border border-gray-300 text-xs font-semibold text-gray-500">3</span>
          Notifications
        </button>
        <button type="button" role="tab" aria-selected="false" class="mt-1 flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-left text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span class="flex size-6 shrink-0 items-center justify-center rounded-full border border-gray-300 text-xs font-semibold text-gray-500">4</span>
          Billing
        </button>
      </div>

      <div role="tabpanel" class="flex-1 p-6">
        <h3 class="text-base font-semibold text-gray-900">Profile</h3>
        <p class="mt-1.5 text-sm text-gray-500">Update your name, photo, and public details.</p>

        <div class="mt-5 flex items-center gap-4">
          <img src="https://i.pravatar.cc/80?img=15" alt="" class="size-14 rounded-full" />
          <button type="button" class="rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50">Change photo</button>
        </div>

        <div class="mt-5 flex flex-col gap-1.5">
          <label for="vst-name" class="text-sm font-medium text-gray-700">Display name</label>
          <input id="vst-name" type="text" value="Jordan Reyes" class="w-full max-w-xs rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none" />
        </div>
      </div>
    </div>
  </body>
</html>
