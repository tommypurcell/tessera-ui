<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-950 p-6">
    <div class="w-full max-w-xs rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="relative flex size-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex size-2 rounded-full bg-emerald-400"></span>
        </span>
        <h3 class="text-sm font-semibold text-white">342 people online</h3>
      </div>

      <ul class="mt-3 space-y-2">
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-400">United States</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-800">
            <span class="block h-full w-[68%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-white">142</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-400">Germany</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-800">
            <span class="block h-full w-[40%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-white">84</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-400">Japan</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-800">
            <span class="block h-full w-[28%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-white">58</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-400">Brazil</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-800">
            <span class="block h-full w-[18%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-white">38</span>
        </li>
      </ul>
    </div>
  </body>
</html>
