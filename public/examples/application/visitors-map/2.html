<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex min-h-64 items-center justify-center bg-gray-50 p-6">
    <div class="w-full max-w-xs rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="relative flex size-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex size-2 rounded-full bg-emerald-500"></span>
        </span>
        <h3 class="text-sm font-semibold text-gray-900">342 people online</h3>
      </div>

      <ul class="mt-3 space-y-2">
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-600">United States</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-100">
            <span class="block h-full w-[68%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-gray-900">142</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-600">Germany</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-100">
            <span class="block h-full w-[40%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-gray-900">84</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-600">Japan</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-100">
            <span class="block h-full w-[28%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-gray-900">58</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="w-24 shrink-0 text-xs text-gray-600">Brazil</span>
          <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-100">
            <span class="block h-full w-[18%] rounded-full bg-emerald-500"></span>
          </span>
          <span class="w-8 shrink-0 text-right text-xs font-medium text-gray-900">38</span>
        </li>
      </ul>
    </div>
  </body>
</html>
