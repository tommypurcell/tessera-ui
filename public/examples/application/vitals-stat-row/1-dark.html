<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-2xl flex-wrap gap-4 rounded-lg border border-gray-800 bg-gray-900 p-6">
      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-400">Heart rate</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-red-400">118</span>
          <span class="text-xs text-gray-500">bpm</span>
        </div>
        <span class="text-xs font-medium text-red-400">Out of range</span>
      </div>

      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-400">Blood pressure</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-gray-100">118/76</span>
          <span class="text-xs text-gray-500">mmHg</span>
        </div>
        <span class="text-xs font-medium text-green-400">Normal</span>
      </div>

      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-400">SpO2</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-gray-100">98</span>
          <span class="text-xs text-gray-500">%</span>
        </div>
        <span class="text-xs font-medium text-green-400">Normal</span>
      </div>

      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-400">Temperature</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-gray-100">98.4</span>
          <span class="text-xs text-gray-500">°F</span>
        </div>
        <span class="text-xs font-medium text-green-400">Normal</span>
      </div>
    </div>
  </body>
</html>
