<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="flex w-full max-w-2xl flex-wrap gap-4 rounded-lg border border-gray-200 bg-white p-6">
      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-500">Heart rate</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-red-600">118</span>
          <span class="text-xs text-gray-400">bpm</span>
        </div>
        <span class="text-xs font-medium text-red-600">Out of range</span>
      </div>

      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-500">Blood pressure</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-gray-900">118/76</span>
          <span class="text-xs text-gray-400">mmHg</span>
        </div>
        <span class="text-xs font-medium text-green-600">Normal</span>
      </div>

      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-500">SpO2</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-gray-900">98</span>
          <span class="text-xs text-gray-400">%</span>
        </div>
        <span class="text-xs font-medium text-green-600">Normal</span>
      </div>

      <div class="flex min-w-24 flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-gray-500">Temperature</span>
        <div class="flex items-baseline gap-1">
          <span class="text-xl font-semibold text-gray-900">98.4</span>
          <span class="text-xs text-gray-400">°F</span>
        </div>
        <span class="text-xs font-medium text-green-600">Normal</span>
      </div>
    </div>
  </body>
</html>
