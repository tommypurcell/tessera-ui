<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center bg-gray-950 p-6">
    <div class="flex w-full max-w-2xl flex-col gap-4 rounded-lg border border-gray-800 bg-gray-900 p-6">
      <h2 class="text-sm font-medium text-gray-100">Q3 revenue bridge</h2>

      <div class="flex gap-3">
        <div class="flex flex-1 flex-col items-center gap-1.5">
          <div class="flex w-full flex-col justify-end" style="height: 160px">
            <div class="w-full rounded-sm bg-gray-500" style="height: 60.6%; margin-bottom: 0%" role="img" aria-label="Starting revenue: 100"></div>
          </div>
          <span class="text-xs font-medium text-gray-100">100</span>
          <span class="text-center text-xs text-gray-500">Starting revenue</span>
        </div>

        <div class="flex flex-1 flex-col items-center gap-1.5">
          <div class="flex w-full flex-col justify-end" style="height: 160px">
            <div class="w-full rounded-sm bg-green-400" style="height: 27.3%; margin-bottom: 60.6%" role="img" aria-label="New sales: +45"></div>
          </div>
          <span class="text-xs font-medium text-gray-100">+45</span>
          <span class="text-center text-xs text-gray-500">New sales</span>
        </div>

        <div class="flex flex-1 flex-col items-center gap-1.5">
          <div class="flex w-full flex-col justify-end" style="height: 160px">
            <div class="w-full rounded-sm bg-green-400" style="height: 12.1%; margin-bottom: 87.9%" role="img" aria-label="Upsells: +20"></div>
          </div>
          <span class="text-xs font-medium text-gray-100">+20</span>
          <span class="text-center text-xs text-gray-500">Upsells</span>
        </div>

        <div class="flex flex-1 flex-col items-center gap-1.5">
          <div class="flex w-full flex-col justify-end" style="height: 160px">
            <div class="w-full rounded-sm bg-red-400" style="height: 18.2%; margin-bottom: 81.8%" role="img" aria-label="Churn: -30"></div>
          </div>
          <span class="text-xs font-medium text-gray-100">-30</span>
          <span class="text-center text-xs text-gray-500">Churn</span>
        </div>

        <div class="flex flex-1 flex-col items-center gap-1.5">
          <div class="flex w-full flex-col justify-end" style="height: 160px">
            <div class="w-full rounded-sm bg-red-400" style="height: 9.1%; margin-bottom: 72.7%" role="img" aria-label="Refunds: -15"></div>
          </div>
          <span class="text-xs font-medium text-gray-100">-15</span>
          <span class="text-center text-xs text-gray-500">Refunds</span>
        </div>

        <div class="flex flex-1 flex-col items-center gap-1.5">
          <div class="flex w-full flex-col justify-end" style="height: 160px">
            <div class="w-full rounded-sm bg-gray-500" style="height: 72.7%; margin-bottom: 0%" role="img" aria-label="Ending revenue: 120"></div>
          </div>
          <span class="text-xs font-medium text-gray-100">120</span>
          <span class="text-center text-xs text-gray-500">Ending revenue</span>
        </div>
      </div>
    </div>
  </body>
</html>
