<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-xs items-center justify-center gap-8 p-6">
    <div class="flex flex-col items-center gap-2">
      <input type="checkbox" id="wish-off-dark" class="peer sr-only" />
      <label
        for="wish-off-dark"
        class="flex size-11 cursor-pointer items-center justify-center rounded-full border border-gray-700 bg-gray-900 text-gray-500 shadow-sm transition hover:text-red-400 hover:shadow-md"
      >
        <span class="sr-only">Add to wishlist</span>
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </label>
      <p class="text-xs text-gray-400">Save</p>
    </div>

    <div class="flex flex-col items-center gap-2">
      <input type="checkbox" id="wish-on-dark" class="peer sr-only" checked />
      <label
        for="wish-on-dark"
        class="relative flex size-11 cursor-pointer items-center justify-center rounded-full border border-red-500/30 bg-red-500/10 text-red-400 shadow-sm transition hover:shadow-md"
      >
        <span class="sr-only">Remove from wishlist</span>
        <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
        <span class="absolute -top-1.5 -right-1.5 flex min-w-4.5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-semibold text-white ring-2 ring-gray-900">
          128
        </span>
      </label>
      <p class="text-xs text-gray-400">Saved</p>
    </div>
  </body>
</html>
