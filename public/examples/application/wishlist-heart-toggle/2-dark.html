<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto flex max-w-52 flex-col gap-4 p-6">
    <div class="overflow-hidden rounded-lg border border-gray-800 bg-gray-900 shadow-sm">
      <div class="relative aspect-square bg-gray-800">
        <img
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=320&h=320&fit=crop"
          alt="White low-top sneaker"
          class="size-full object-cover"
        />

        <input type="checkbox" id="wish-card-dark" class="peer sr-only" checked />
        <label
          for="wish-card-dark"
          class="absolute top-2 right-2 flex size-8 cursor-pointer items-center justify-center rounded-full bg-gray-900/80 text-gray-400 shadow-sm backdrop-blur transition hover:scale-105 peer-checked:text-red-400"
        >
          <span class="sr-only">Toggle wishlist</span>
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
          </svg>
        </label>
      </div>

      <div class="p-3">
        <p class="text-sm font-medium text-white">Court sneaker</p>
        <p class="mt-0.5 text-sm text-gray-400">$88.00</p>
      </div>
    </div>
  </body>
</html>
