<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Order Card</title>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body class="bg-white p-6">
    <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs font-medium text-gray-500">WO-4821</p>
          <h2 class="mt-0.5 text-sm font-semibold text-gray-900">Replace hydraulic seal kit</h2>
        </div>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-700">
          <span class="size-1.5 rounded-full bg-amber-500"></span>
          In progress
        </span>
      </div>

      <dl class="mt-4 grid grid-cols-2 gap-3 border-t border-gray-100 pt-4 text-sm">
        <div>
          <dt class="text-xs text-gray-500">Part</dt>
          <dd class="mt-0.5 font-medium text-gray-900">HYD-SK-2200</dd>
        </div>
        <div>
          <dt class="text-xs text-gray-500">Quantity</dt>
          <dd class="mt-0.5 font-medium text-gray-900">3 units</dd>
        </div>
        <div>
          <dt class="text-xs text-gray-500">Due date</dt>
          <dd class="mt-0.5 font-medium text-gray-900">Aug 14, 2026</dd>
        </div>
        <div>
          <dt class="text-xs text-gray-500">Assigned to</dt>
          <dd class="mt-0.5 font-medium text-gray-900">Marcus Ibe</dd>
        </div>
      </dl>

      <div class="mt-4 border-t border-gray-100 pt-4">
        <div class="flex items-center justify-between text-xs text-gray-500">
          <span>Stage</span>
          <span>Machining &middot; 2 of 4</span>
        </div>
        <ol class="mt-2 flex items-center gap-1.5">
          <li class="h-1.5 flex-1 rounded-full bg-blue-600" aria-current="false"><span class="sr-only">Received — complete</span></li>
          <li class="h-1.5 flex-1 rounded-full bg-blue-600" aria-current="step"><span class="sr-only">Machining — current</span></li>
          <li class="h-1.5 flex-1 rounded-full bg-gray-200"><span class="sr-only">Quality check — pending</span></li>
          <li class="h-1.5 flex-1 rounded-full bg-gray-200"><span class="sr-only">Complete — pending</span></li>
        </ol>
      </div>
    </div>
  </body>
</html>
