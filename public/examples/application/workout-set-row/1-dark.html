<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-lg border border-gray-800 p-4">
      <h3 class="text-sm font-semibold text-white">Barbell Bench Press</h3>

      <div class="mt-3 grid grid-cols-[2rem_1fr_1fr_2.5rem] items-center gap-x-3 gap-y-2">
        <span class="text-xs font-medium text-gray-500">Set</span>
        <span class="text-xs font-medium text-gray-500">Reps</span>
        <span class="text-xs font-medium text-gray-500">Weight</span>
        <span class="text-xs font-medium text-gray-500">Done</span>

        <span class="text-sm font-medium text-gray-300">1</span>
        <input
          type="text"
          value="10"
          class="w-full rounded-md border border-gray-700 bg-transparent px-2 py-1 text-sm text-gray-100 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none"
        />
        <input
          type="text"
          value="135 lb"
          class="w-full rounded-md border border-gray-700 bg-transparent px-2 py-1 text-sm text-gray-100 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none"
        />
        <input type="checkbox" checked class="size-5 rounded border-gray-700 bg-gray-900 text-indigo-500 focus:ring-indigo-400" aria-label="Set 1 done" />

        <span class="text-sm font-medium text-gray-300">2</span>
        <input
          type="text"
          value="10"
          class="w-full rounded-md border border-gray-700 bg-transparent px-2 py-1 text-sm text-gray-100 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none"
        />
        <input
          type="text"
          value="135 lb"
          class="w-full rounded-md border border-gray-700 bg-transparent px-2 py-1 text-sm text-gray-100 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none"
        />
        <input type="checkbox" checked class="size-5 rounded border-gray-700 bg-gray-900 text-indigo-500 focus:ring-indigo-400" aria-label="Set 2 done" />

        <span class="text-sm font-medium text-gray-300">3</span>
        <input
          type="text"
          value="8"
          class="w-full rounded-md border border-gray-700 bg-transparent px-2 py-1 text-sm text-gray-100 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none"
        />
        <input
          type="text"
          value="140 lb"
          class="w-full rounded-md border border-gray-700 bg-transparent px-2 py-1 text-sm text-gray-100 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none"
        />
        <input type="checkbox" class="size-5 rounded border-gray-700 bg-gray-900 text-indigo-500 focus:ring-indigo-400" aria-label="Set 3 done" />
      </div>
    </div>
  </body>
</html>
