<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <div class="rounded-lg border border-gray-200 p-4">
      <h3 class="text-sm font-semibold text-gray-900">Barbell Bench Press</h3>

      <div class="mt-3 grid grid-cols-[2rem_1fr_1fr_2.5rem] items-center gap-x-3 gap-y-2">
        <span class="text-xs font-medium text-gray-400">Set</span>
        <span class="text-xs font-medium text-gray-400">Reps</span>
        <span class="text-xs font-medium text-gray-400">Weight</span>
        <span class="text-xs font-medium text-gray-400">Done</span>

        <span class="text-sm font-medium text-gray-700">1</span>
        <input type="text" value="10" class="w-full rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-900 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none" />
        <input type="text" value="135 lb" class="w-full rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-900 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none" />
        <input type="checkbox" checked class="size-5 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600" aria-label="Set 1 done" />

        <span class="text-sm font-medium text-gray-700">2</span>
        <input type="text" value="10" class="w-full rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-900 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none" />
        <input type="text" value="135 lb" class="w-full rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-900 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none" />
        <input type="checkbox" checked class="size-5 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600" aria-label="Set 2 done" />

        <span class="text-sm font-medium text-gray-700">3</span>
        <input type="text" value="8" class="w-full rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-900 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none" />
        <input type="text" value="140 lb" class="w-full rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-900 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none" />
        <input type="checkbox" class="size-5 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600" aria-label="Set 3 done" />
      </div>
    </div>
  </body>
</html>
