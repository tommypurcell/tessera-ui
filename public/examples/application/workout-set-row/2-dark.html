<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="mx-auto max-w-lg p-6">
    <ul class="flex flex-col divide-y divide-gray-800 rounded-lg border border-gray-800">
      <li class="flex items-center justify-between gap-3 p-3">
        <div>
          <p class="text-sm font-medium text-white">Barbell Bench Press</p>
          <p class="text-xs text-gray-500">3 sets &middot; 135&ndash;140 lb &middot; 8&ndash;10 reps</p>
        </div>
        <span class="inline-flex items-center gap-1 rounded-full bg-green-900/40 px-2 py-0.5 text-xs font-medium text-green-300">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
          Complete
        </span>
      </li>

      <li class="flex items-center justify-between gap-3 p-3">
        <div>
          <p class="text-sm font-medium text-white">Incline Dumbbell Press</p>
          <p class="text-xs text-gray-500">2 of 3 sets &middot; 50 lb &middot; 12 reps</p>
        </div>
        <span class="inline-flex items-center gap-1 rounded-full bg-gray-800 px-2 py-0.5 text-xs font-medium text-gray-300">In progress</span>
      </li>

      <li class="flex items-center justify-between gap-3 p-3">
        <div>
          <p class="text-sm font-medium text-white">Cable Fly</p>
          <p class="text-xs text-gray-500">3 sets &middot; not started</p>
        </div>
        <span class="inline-flex items-center gap-1 rounded-full bg-gray-800 px-2 py-0.5 text-xs font-medium text-gray-500">Not started</span>
      </li>
    </ul>
  </body>
</html>
