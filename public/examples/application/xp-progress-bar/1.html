<!doctype html>
<html lang="en" class="font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
  </head>
  <body class="flex justify-center p-6">
    <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-4">
      <div class="flex items-center gap-3">
        <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-purple-100 text-sm font-bold text-purple-700">12</span>
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline justify-between">
            <p class="text-sm font-semibold text-gray-900">Level 12</p>
            <p class="text-xs text-gray-500">2,340 / 3,000 XP</p>
          </div>
          <div
            role="progressbar"
            aria-label="Progress to level 13"
            aria-valuenow="2340"
            aria-valuemin="0"
            aria-valuemax="3000"
            class="mt-1.5 h-2.5 w-full overflow-hidden rounded-full bg-gray-100"
          >
            <div class="h-full rounded-full bg-gradient-to-r from-purple-500 to-purple-400" style="width: 78%"></div>
          </div>
        </div>
      </div>
      <p class="mt-2 text-xs text-gray-500">660 XP to level 13</p>
    </div>
  </body>
</html>
