<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 256px; display: grid; place-items: center; padding: 32px; background: #f8fafc; font-family: Arial, Helvetica, sans-serif; }
      button { min-height: 44px; border: 1px solid #cbd5e1; border-radius: 9px; padding: 0 17px; background: #fff; color: #334155; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: border-color 150ms ease, background 150ms ease, color 150ms ease; }
      button:hover { border-color: #94a3b8; background: #f8fafc; color: #0f172a; }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
  </head>
  <body><button type="button">Save as draft</button></body>
</html>
