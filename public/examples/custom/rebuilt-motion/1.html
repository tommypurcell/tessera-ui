<!doctype html>

  <head>

    <link rel="stylesheet" href="/component.css" />
    <style>

        to {

        </div>
      </div>

        <div class="rounded-2xl bg-blue-50 p-4 text-blue-900">Compose</div>
        <div class="rounded-2xl border border-slate-200 p-4">Ship</div>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-3xl font-semibold tabular-nums">48,240</span
