<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
    <style>
      .cycle-gallery { position: relative; aspect-ratio: 1 / 1; overflow: hidden; }
      .cycle-gallery img { position: absolute; inset: 0; height: 100%; width: 100%; object-fit: cover; opacity: 0; }
      .cycle-gallery img:first-child { opacity: 1; }
      .cycle-gallery:hover img { animation: cycle-fade 3s steps(1, end) infinite; }
      .cycle-gallery:hover img:nth-child(1) { animation-delay: 0s; }
      .cycle-gallery:hover img:nth-child(2) { animation-delay: 1s; }
      .cycle-gallery:hover img:nth-child(3) { animation-delay: 2s; }
      @keyframes cycle-fade {
        0%, 32% { opacity: 1; }
        33%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cycle-gallery:hover img { animation: none; }
      }
    </style>
  </head>
  <body class="mx-auto max-w-60 p-6">
    <figure class="cycle-gallery rounded-xl border border-gray-200">
      <img alt="Sage green t-shirt, worn" src="https://images.unsplash.com/photo-1523381140794-a1eef18a37c7?auto=format&fit=crop&q=80&w=400" />
      <img alt="Sage green t-shirts on a rack" src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&q=80&w=400" />
      <img alt="Plain white t-shirt, worn" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&q=80&w=400" />
    </figure>
  </body>
</html>
