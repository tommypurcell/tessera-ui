<!doctype html>
<html lang="en" class="dark font-sans antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/component.css" rel="stylesheet" />
    <script src="/component.js" defer></script>
    <style>
      .cycle-gallery { position: relative; aspect-ratio: 1 / 1; overflow: hidden; }
      .cycle-gallery img { position: absolute; inset: 0; height: 100%; width: 100%; object-fit: cover; opacity: 0; }
      .cycle-gallery img:first-child { opacity: 1; }
      .cycle-gallery:hover img { animation: cycle-fade 3s steps(1, end) infinite; }
      .cycle-gallery:hover img:nth-child(1) { animation-delay: 0s; }
      .cycle-gallery:hover img:nth-child(2) { animation-delay: 1s; }
      @keyframes cycle-fade {
        0%, 48% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cycle-gallery:hover img { animation: none; }
      }
    </style>
  </head>
  <body class="mx-auto max-w-60 p-6">
    <div class="max-w-60 overflow-hidden rounded-xl border border-gray-200 shadow-sm">
      <figure class="cycle-gallery">
        <img alt="Sage green t-shirt, worn" src="https://images.unsplash.com/photo-1523381140794-a1eef18a37c7?auto=format&fit=crop&q=80&w=400" />
        <img alt="Plain white t-shirt, worn" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&q=80&w=400" />
      </figure>
      <div class="p-4">
        <h2 class="text-sm font-semibold text-gray-950">Sage Cotton Tee</h2>
        <div class="mt-1 flex items-center gap-1 text-amber-500">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3.5"><path d="M10 1.5l2.6 5.27 5.82.85-4.21 4.1.99 5.8L10 14.9l-5.2 2.73.99-5.8-4.21-4.1 5.82-.85z" /></svg>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3.5"><path d="M10 1.5l2.6 5.27 5.82.85-4.21 4.1.99 5.8L10 14.9l-5.2 2.73.99-5.8-4.21-4.1 5.82-.85z" /></svg>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3.5"><path d="M10 1.5l2.6 5.27 5.82.85-4.21 4.1.99 5.8L10 14.9l-5.2 2.73.99-5.8-4.21-4.1 5.82-.85z" /></svg>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3.5"><path d="M10 1.5l2.6 5.27 5.82.85-4.21 4.1.99 5.8L10 14.9l-5.2 2.73.99-5.8-4.21-4.1 5.82-.85z" /></svg>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" class="size-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 1.5l2.6 5.27 5.82.85-4.21 4.1.99 5.8L10 14.9l-5.2 2.73.99-5.8-4.21-4.1 5.82-.85z" /></svg>
          <span class="ml-1 text-xs text-gray-500">(128)</span>
        </div>
        <div class="mt-2 flex items-baseline justify-between gap-2">
          <span class="text-sm font-medium text-gray-600">$28</span>
          <button type="button" class="rounded-md bg-gray-950 px-2.5 py-1 text-xs font-medium text-white">Add to bag</button>
        </div>
      </div>
    </div>
  </body>
</html>
