<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div class="grid w-full max-w-2xl gap-4">
      <header
        class="flex items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3"
      >
        <strong>Tessera</strong>
        <nav class="hidden gap-5 text-sm text-slate-600 sm:flex">
          <a>Product</a><a>Resources</a><a>Company</a>
        </nav>
        <a class="rounded-lg bg-slate-900 px-3 py-2 text-xs font-semibold text-white"
          >Get started</a
        >
      </header>
      <section class="grid gap-3 sm:grid-cols-3">
        <article class="rounded-2xl border border-slate-200 bg-white p-5">
          <h2 class="font-semibold">Starter</h2>
          <p class="mt-3 text-2xl font-semibold">$12</p>
          <button class="mt-5 h-10 w-full rounded-lg border border-slate-300 text-sm font-semibold">
            Choose
          </button>
        </article>
        <article class="rounded-2xl border border-blue-500 bg-blue-50 p-5 shadow-md">
          <h2 class="font-semibold">Team</h2>
          <p class="mt-3 text-2xl font-semibold">$32</p>
          <button class="mt-5 h-10 w-full rounded-lg bg-blue-600 text-sm font-semibold text-white">
            Choose
          </button>
        </article>
        <article class="rounded-2xl border border-slate-200 bg-white p-5">
          <h2 class="font-semibold">Scale</h2>
          <p class="mt-3 text-2xl font-semibold">$80</p>
          <button class="mt-5 h-10 w-full rounded-lg border border-slate-300 text-sm font-semibold">
            Choose
          </button>
        </article>
      </section>
    </div>
  </body>
</html>
