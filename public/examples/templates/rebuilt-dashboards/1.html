<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/component.css" />
  </head>
  <body>
    <div
      class="grid min-h-64 w-full max-w-2xl grid-cols-[9rem_1fr] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
    >
      <nav
        aria-label="Primary"
        class="hidden border-r border-slate-200 p-3 sm:grid sm:content-start sm:gap-1"
      >
        <strong class="mb-3 px-2 text-sm">Tessera</strong
        ><a class="rounded-md bg-blue-50 px-2 py-2 text-xs font-semibold text-blue-700">Overview</a
        ><a class="rounded-md px-2 py-2 text-xs text-slate-500">Projects</a
        ><a class="rounded-md px-2 py-2 text-xs text-slate-500">Settings</a>
      </nav>
      <main class="grid content-start gap-4 p-5">
        <div>
          <p class="text-xs text-slate-500">Overview</p>
          <h1 class="text-xl font-semibold">Good morning, Alex</h1>
        </div>
        <div class="grid gap-3 sm:grid-cols-3">
          <div class="rounded-xl bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Active projects</p>
            <strong class="text-xl">12</strong>
          </div>
          <div class="rounded-xl bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Usage</p>
            <strong class="text-xl">68%</strong>
          </div>
          <div class="rounded-xl bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Uptime</p>
            <strong class="text-xl">99.9%</strong>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
